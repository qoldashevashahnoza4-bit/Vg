<style>
:root{--bg:#f2f7fc;--card:#fff;--ink:#283444;--mut:#63748a;--navy:#182a4c;--blue:#3174be;--line:#dce5ef;--sel:#eaf2fb}
@media(prefers-color-scheme:dark){:root{--bg:#111a2a;--card:#1a2638;--ink:#e6edf6;--mut:#9fb0c6;--navy:#cfe0f5;--blue:#5b9be0;--line:#2a3a52;--sel:#223350}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line)}
header h1{font-size:1.05rem;margin:0;color:var(--navy);flex:1}
button{font:inherit;border:1px solid var(--line);background:var(--sel);color:var(--navy);border-radius:9px;padding:7px 12px;cursor:pointer}
.wrap{flex:1;display:flex;min-height:0;position:relative}
nav{width:340px;max-width:100%;overflow:auto;padding:12px;background:var(--bg);border-right:1px solid var(--line)}
nav input{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:10px}
.g{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:14px 4px 6px}
.item{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:6px}
.item.on{background:var(--sel);border-color:var(--blue)}
.num{min-width:30px;height:30px;border-radius:8px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.85rem}
.item b{display:block;font-size:.93rem;color:var(--navy)}.item small{color:var(--mut);line-height:1.35}
main{flex:1;min-width:0;display:flex;flex-direction:column}
iframe{flex:1;width:100%;border:0;background:#fff}
.home{padding:24px;overflow:auto}.home h2{color:var(--navy);margin-top:0}.home p{color:var(--mut);line-height:1.6}
.bar{display:none;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--card);align-items:center}
.bar span{flex:1;font-weight:600;color:var(--navy);font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:800px){
 nav{position:absolute;inset:0;z-index:5;width:100%;border:0}
 body.reading nav{display:none}
 body.reading .bar{display:flex}
 header .menu{display:none}
}
</style></head><body>

<div class="home" id="homeBox"><h2>Xush kelibsiz</h2><p>Chap tomondagi ro‘yxatdan mavzuni tanlang. Barcha 14 ta mavzu va loyiha ishi shu bitta faylda jamlangan, internet kerak emas (agar sahifalar tashqi kutubxona ishlatmasa).</p></div>

<script>
const DATA=[{"id": "1-mavzu", "n": "1", "t": "Kuchlarni qo‘shish", "d": "Interaktiv simulyatsiya: kuch vektorlari va teng ta’sir etuvchi", "k": "Dars", "html": "<!doctype html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Kuchlarni qo‘shish — interaktiv simulyatsiya<\/title>\n<style>\n:root{--navy:#182a4c;--blue:#3174be;--cyan:#3ebed2;--orange:#f59d42;--green:#42a073;--bg:#f2f7fc;--ink:#283444}\n*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}\nheader{background:linear-gradient(120deg,var(--navy),#245b8e);color:white;padding:28px 20px}\nheader h1{margin:0 0 8px;font-size:clamp(1.6rem,4vw,2.4rem)}header p{margin:0;color:#d9f7ff}\nmain{max-width:1100px;margin:22px auto;padding:0 14px 40px;display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:18px}\n.card{background:white;border:1px solid #dce5ef;border-radius:16px;padding:18px;box-shadow:0 6px 20px #182a4c0b}\nh2{font-size:1.2rem;color:var(--navy);margin:0 0 14px}\nlabel{display:block;font-weight:650;margin:16px 0 6px}\ninput[type=range]{width:100%;accent-color:var(--blue)}\nselect,button{font:inherit;border-radius:9px;border:1px solid #cbd7e5;padding:10px;background:white}\nbutton{cursor:pointer;background:var(--blue);color:white;border:0;font-weight:650}\nbutton.secondary{background:#eaf2fb;color:var(--navy);border:1px solid #d3e0ef}\n.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}\nsmall,.hint{color:#63748a;line-height:1.5}\n.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}\n.stat div{background:#f2f7fc;padding:12px;border-radius:10px}\n.stat strong{display:block;font-size:1.2rem;color:var(--navy)}\ncanvas{width:100%;height:390px;display:block;border:1px solid #dce5ef;border-radius:12px;background:#fbfdff}\n.formula{font-size:1.1rem;font-weight:700;color:var(--navy);background:#eef7fb;border-radius:10px;padding:12px;margin-top:12px}\n#explain{line-height:1.6;margin-top:10px}\nfooter{max-width:1100px;margin:0 auto;padding:0 14px 30px;color:#63748a}\n@media(max-width:800px){main{grid-template-columns:1fr}canvas{height:320px}.stat{grid-template-columns:1fr 1fr}}\n<\/style>\n<\/head>\n<body>\n<header><h1>Kuchlarni qo‘shish<\/h1><p>Interaktiv fizika simulyatsiyasi · Kuchlarni o‘zgartiring va natijani kuzating<\/p><\/header>\n<main>\n<section class=\"card\">\n<h2>Boshqaruv paneli<\/h2>\n<label for=\"f1\">Birinchi kuch F₁: <span id=\"v1\">4<\/span> N<\/label>\n<input id=\"f1\" type=\"range\" min=\"0\" max=\"10\" step=\"0.5\" value=\"4\">\n<label for=\"f2\">Ikkinchi kuch F₂: <span id=\"v2\">3<\/span> N<\/label>\n<input id=\"f2\" type=\"range\" min=\"0\" max=\"10\" step=\"0.5\" value=\"3\">\n<label for=\"angle\">F₂ kuchining burchagi: <span id=\"va\">0<\/span>°<\/label>\n<input id=\"angle\" type=\"range\" min=\"0\" max=\"180\" step=\"5\" value=\"0\">\n<label for=\"direction\">F₁ yo‘nalishi<\/label>\n<select id=\"direction\"><option value=\"0\">O‘ngga (0°)<\/option><option value=\"180\">Chapga (180°)<\/option><\/select>\n<div class=\"controls\">\n<button id=\"animate\">Vektorlarni ko‘rsatish<\/button>\n<button id=\"reset\" class=\"secondary\">Qayta boshlash<\/button>\n<\/div>\n<p class=\"hint\">Maslahat: avval burchakni 0°, keyin 180° va 90° qilib ko‘ring. Har bir holatda natijaviy kuch qanday o‘zgarishini kuzating.<\/p>\n<div class=\"formula\" id=\"formula\">R = 7.00 N<\/div>\n<div id=\"explain\"><\/div>\n<\/section>\n<section class=\"card\">\n<h2>Vektorlar chizmasi<\/h2>\n<canvas id=\"plot\" width=\"760\" height=\"460\" aria-label=\"Kuch vektorlari va natijaviy vektor chizmasi\"><\/canvas>\n<div class=\"stat\">\n<div><small>Gorizontal tarkibiy qism<\/small><strong id=\"rx\">7.00 N<\/strong><\/div>\n<div><small>Vertikal tarkibiy qism<\/small><strong id=\"ry\">0.00 N<\/strong><\/div>\n<div><small>Natijaviy yo‘nalish<\/small><strong id=\"theta\">0°<\/strong><\/div>\n<\/div>\n<p class=\"hint\">Ko‘k — F₁, to‘q sariq — F₂, yashil — natijaviy kuch R. Chizmada strelkalar kuchlarning yo‘nalishini bildiradi.<\/p>\n<\/section>\n<section class=\"card\">\n<h2>Qisqa nazariya<\/h2>\n<p><b>Kuch<\/b> — jismlarning o‘zaro ta’sirini ifodalovchi vektor kattalik. Uning SI birligi nyuton (N).<\/p>\n<p><b>Bir yo‘nalishda:<\/b> R = F₁ + F₂.<\/p>\n<p><b>Qarama-qarshi yo‘nalishda:<\/b> R = |F₁ − F₂|, yo‘nalish esa kattaroq kuch tomonga bo‘ladi.<\/p>\n<p><b>Burchak ostida:<\/b> R = √(F₁² + F₂² + 2F₁F₂ cos α), bunda α — kuchlar orasidagi burchak.<\/p>\n<p><b>Muvozanat:<\/b> R = 0 bo‘lsa, kuchlar muvozanatlashgan. Jism tinch turishi yoki tekis to‘g‘ri chiziqli harakatini saqlashi mumkin.<\/p>\n<\/section>\n<section class=\"card\">\n<h2>Sinab ko‘ring<\/h2>\n<ol>\n<li>F₁ = 4 N, F₂ = 3 N va burchak 0° bo‘lsin. R ni yozing.<\/li>\n<li>F₁ = 8 N, F₂ = 3 N; F₂ burchagini 180° qiling. R ning yo‘nalishi qanday?<\/li>\n<li>F₁ = 3 N, F₂ = 4 N va burchak 90° bo‘lsin. Natijaviy kuchni toping.<\/li>\n<\/ol>\n<details><summary><b>Javoblarni ko‘rish<\/b><\/summary><p>1) 7 N. 2) 5 N, F₁ yo‘nalishi bo‘yicha. 3) 5 N.<\/p><\/details>\n<\/section>\n<\/main>\n<footer>O‘quv maqsadida tayyorlangan interaktiv model. Faylni saqlab, brauzerda ochish orqali internetsiz ham ishlatish mumkin.<\/footer>\n<script>\nconst f1=document.getElementById('f1'),f2=document.getElementById('f2'),angle=document.getElementById('angle'),direction=document.getElementById('direction');\nconst canvas=document.getElementById('plot'),ctx=canvas.getContext('2d');\nlet animating=false,progress=1;\nfunction arrow(x1,y1,x2,y2,color,width=4){\n const dx=x2-x1,dy=y2-y1,a=Math.atan2(dy,dx),head=12;\n ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=width;ctx.lineCap='round';\n ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();\n ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-head*Math.cos(a-Math.PI/6),y2-head*Math.sin(a-Math.PI/6));\n ctx.lineTo(x2-head*Math.cos(a+Math.PI/6),y2-head*Math.sin(a+Math.PI/6));ctx.closePath();ctx.fill();\n}\nfunction draw(){\n const a=Number(f1.value),b=Number(f2.value),alpha=Number(angle.value)*Math.PI/180,dir=Number(direction.value)*Math.PI/180;\n const x1=a*Math.cos(dir),y1=-a*Math.sin(dir);\n const x2=b*Math.cos(dir+alpha),y2=-b*Math.sin(dir+alpha);\n const rx=x1+x2,ry=y1+y2,R=Math.hypot(rx,ry),theta=(Math.atan2(-ry,rx)*180/Math.PI+360)%360;\n document.getElementById('v1').textContent=a;document.getElementById('v2').textContent=b;document.getElementById('va').textContent=angle.value;\n document.getElementById('rx').textContent=rx.toFixed(2)+' N';document.getElementById('ry').textContent=(-ry).toFixed(2)+' N';\n document.getElementById('theta').textContent=R<0.001?'Aniqlanmagan':theta.toFixed(1)+'°';\n document.getElementById('formula').textContent='R = '+R.toFixed(2)+' N';\n let desc='';\n if(R<0.001)desc='Natijaviy kuch nolga teng: kuchlar muvozanatlashgan.';\n else if(Number(angle.value)===0 && Number(direction.value)===0)desc='Kuchlar bir yo‘nalishda: R = F₁ + F₂ = '+R.toFixed(2)+' N.';\n else if(Number(angle.value)===180)desc='Kuchlar qarama-qarshi yo‘nalgan: natija kattaroq kuch yo‘nalishida.';\n else desc='Kuchlar burchak ostida ta’sir qilmoqda. Natijaviy kuch vektorlar yig‘indisiga teng.';\n document.getElementById('explain').textContent=desc;\n const w=canvas.width,h=canvas.height,cx=w/2,cy=h/2,scale=19;\n ctx.clearRect(0,0,w,h);ctx.fillStyle='#fbfdff';ctx.fillRect(0,0,w,h);\n ctx.strokeStyle='#e5edf5';ctx.lineWidth=1;\n for(let x=30;x<w;x+=30){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}\n for(let y=10;y<h;y+=30){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}\n ctx.strokeStyle='#93a4b8';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(20,cy);ctx.lineTo(w-20,cy);ctx.moveTo(cx,20);ctx.lineTo(cx,h-20);ctx.stroke();\n ctx.fillStyle='#63748a';ctx.font='14px system-ui';ctx.fillText('0',cx+5,cy-6);\n const end1x=cx+x1*scale,end1y=cy+y1*scale;\n const end2x=cx+x2*scale,end2y=cy+y2*scale;\n const endRx=cx+rx*scale,endRy=cy+ry*scale;\n arrow(cx,cy,end1x, end1y,'#3174be',4);\n arrow(cx,cy,end2x,end2y,'#f59d42',4);\n arrow(cx,cy,endRx,endRy,'#42a073',5);\n ctx.font='bold 16px system-ui';ctx.fillStyle='#3174be';ctx.fillText('F₁',end1x+7,end1y-8);\n ctx.fillStyle='#b96a15';ctx.fillText('F₂',end2x+7,end2y-8);\n ctx.fillStyle='#287b55';ctx.fillText('R',endRx+7,endRy-8);\n}\n[f1,f2,angle,direction].forEach(el=>el.addEventListener('input',draw));\ndocument.getElementById('reset').addEventListener('click',()=>{f1.value=4;f2.value=3;angle.value=0;direction.value=0;draw()});\ndocument.getElementById('animate').addEventListener('click',()=>{\n const btn=document.getElementById('animate');\n btn.textContent='Vektorlar tayyor';draw();\n setTimeout(()=>{btn.textContent='Vektorlarni ko‘rsatish'},900);\n});\ndraw();\n<\/script>\n<\/body>\n<\/html>"}, {"id": "2-mavzu", "n": "2", "t": "Markazga intilma kuch", "d": "Aylana bo‘ylab harakat va animatsiya", "k": "Dars", "html": "<!DOCTYPE html>\n<html lang=\"uz\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>2-mavzu Markazga intilma kuch<\/title>\n<style>\n:root{--navy:#142747;--blue:#2f75c5;--orange:#f09a38;--green:#23976b;--bg:#f3f7fb;--ink:#233247;--line:#dbe5ef}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,Arial,sans-serif;line-height:1.5}\nheader{background:linear-gradient(120deg,#142747,#245f96);color:white;padding:28px max(24px,calc((100% - 1100px)/2))}header h1{margin:0 0 8px;font-size:clamp(1.7rem,4vw,2.5rem)}header p{margin:0;color:#d9f4ff}\nmain{width:calc(100% - 32px);max-width:1100px;margin:22px auto;padding:0 8px 35px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tabs button{border:1px solid var(--line);background:white;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:700}.tabs button.active,.primary{background:var(--blue);color:white;border-color:var(--blue)}\n.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:15px}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:17px;margin-bottom:15px;box-shadow:0 5px 18px #1427470b}\nh2{margin:0 0 10px;color:var(--navy);font-size:1.25rem}h3{margin:12px 0 5px;color:var(--navy)}label{display:block;font-weight:650;margin:13px 0 5px}input[type=range]{width:100%;accent-color:var(--blue)}button,select{font:inherit;border:1px solid #c8d6e5;border-radius:8px;padding:9px 11px;background:white;color:var(--ink)}button{cursor:pointer;font-weight:650}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.value{font-weight:800;color:var(--blue)}canvas{width:100%;height:330px;display:block;border:1px solid var(--line);border-radius:10px;background:#fbfdff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.stat{background:#f1f6fb;padding:10px;border-radius:9px}.stat small{display:block;color:#64748b;font-size:.78rem}.stat strong{color:var(--navy);font-size:1.05rem}.note{background:#eef8fb;border-left:4px solid #35b9cc;padding:11px 13px;border-radius:7px;margin:12px 0}.formula{font-size:1.15rem;font-weight:800;background:#f1f6fb;padding:12px;border-radius:9px;color:var(--navy)}.muted{color:#64748b;font-size:.9rem}details{background:#f7fafc;padding:9px;border-radius:7px}footer{max-width:1100px;margin:0 auto;padding:0 24px 24px;color:#64748b}canvas{max-width:100%}\n@media(max-width:480px){main{width:100%;padding:0 14px 28px}.card{padding:14px}.tabs button{padding:9px 10px;font-size:.9rem}header{padding:24px 20px}}\n@media(max-width:800px){.grid{grid-template-columns:1fr}canvas{height:290px}.stats{grid-template-columns:1fr 1fr}header{padding:24px 18px}}\n<\/style><\/head><body>\n<header><h1>Markazga intilma kuch<\/h1><p>10-sinf fizika · Interaktiv simulyatsiyalar, animatsiyalar va virtual tajribalar<\/p><\/header>\n<main>\n<div class=\"tabs\"><button class=\"active\" data-tab=\"one\">1. Kuch tushunchasi<\/button><button data-tab=\"two\">2. Formula va bog‘liqlik<\/button><button data-tab=\"three\">3. Hayotiy misollar<\/button><button data-tab=\"quiz\">Masalalar va test<\/button><\/div>\n<section id=\"one\" class=\"panel active\">\n<div class=\"card\"><h2>1-reja. Markazga intilma kuch nima?<\/h2><p>Jism aylana bo‘ylab harakatlanganda uning tezlik yo‘nalishi uzluksiz o‘zgaradi. Buning uchun aylana markaziga yo‘nalgan natijaviy kuch kerak. Bu <b>markazga intilma kuch<\/b> deyiladi.<\/p><div class=\"note\"><b>Eslab qoling:<\/b> tezlik vektori urinma bo‘ylab, markazga intilma tezlanish va natijaviy kuch markaz tomon yo‘naladi. Bu alohida yangi kuch emas, balki natijaviy kuchning yo‘nalishidir.<\/div><\/div>\n<div class=\"grid\"><div class=\"card\"><h2>Aylana bo‘ylab harakat<\/h2><label>Tezlik: <span class=\"value\" id=\"s1v\">5<\/span> m/s<\/label><input id=\"s1\" type=\"range\" min=\"1\" max=\"10\" step=\".5\" value=\"5\"><label>Radius: <span class=\"value\" id=\"r1v\">3<\/span> m<\/label><input id=\"r1\" type=\"range\" min=\"1\" max=\"5\" step=\".5\" value=\"3\"><label><input id=\"showv\" type=\"checkbox\" checked> Tezlik vektorini ko‘rsatish<\/label><label><input id=\"showa\" type=\"checkbox\" checked> Markazga yo‘nalgan vektorni ko‘rsatish<\/label><div class=\"controls\"><button class=\"primary\" id=\"play1\">▶ Harakatni boshlash<\/button><button id=\"reset1\">Qayta boshlash<\/button><\/div><p class=\"muted\">Vektorlarni kuzating: ko‘k — tezlik, to‘q sariq — markazga intilma tezlanish.<\/p><\/div>\n<div class=\"card\"><h2>Aylana animatsiyasi<\/h2><canvas id=\"orbit\" width=\"700\" height=\"390\"><\/canvas><div class=\"stats\"><div class=\"stat\"><small>Tezlik<\/small><strong id=\"sout\">5 m/s<\/strong><\/div><div class=\"stat\"><small>Radius<\/small><strong id=\"rout\">3 m<\/strong><\/div><div class=\"stat\"><small>Tezlanish<\/small><strong id=\"aout\">8.33 m/s²<\/strong><\/div><\/div><\/div><\/div>\n<div class=\"card\"><h3>Agar ip uzilsa nima bo‘ladi?<\/h3><p>Markazga yo‘nalgan kuch yo‘qolsa, jism shu ondagi tezlik yo‘nalishi bo‘yicha — aylana trayektoriyasiga urinma bo‘ylab harakatni davom ettiradi. Bu “tashqariga itarilish” emas, balki inertsiya tufayli tezlik yo‘nalishining saqlanishidir.<\/p><\/div>\n<\/section>\n<section id=\"two\" class=\"panel\">\n<div class=\"card\"><h2>2-reja. Formula va fizik kattaliklarga bog‘liqlik<\/h2><div class=\"formula\">F = mv²/r &nbsp; va &nbsp; a = v²/r<\/div><p><b>F<\/b> — markazga intilma natijaviy kuch (N), <b>m<\/b> — massa (kg), <b>v<\/b> — tezlik (m/s), <b>r<\/b> — radius (m). Formula Nyutonning ikkinchi qonuni F = ma va markazga intilma tezlanish a = v²/r dan kelib chiqadi.<\/p><\/div>\n<div class=\"grid\"><div class=\"card\"><h2>Virtual laboratoriya<\/h2><label>Massa m: <span class=\"value\" id=\"mv\">2<\/span> kg<\/label><input id=\"m\" type=\"range\" min=\".5\" max=\"10\" step=\".5\" value=\"2\"><label>Tezlik v: <span class=\"value\" id=\"vv\">5<\/span> m/s<\/label><input id=\"v\" type=\"range\" min=\"1\" max=\"20\" step=\".5\" value=\"5\"><label>Radius r: <span class=\"value\" id=\"rv\">3<\/span> m<\/label><input id=\"r\" type=\"range\" min=\".5\" max=\"10\" step=\".5\" value=\"3\"><div class=\"controls\"><button class=\"primary\" id=\"calc\">Hisoblash<\/button><button id=\"resetlab\">Qiymatlarni tiklash<\/button><\/div><div class=\"note\" id=\"explain\">Qiymatlarni o‘zgartiring va natijani kuzating.<\/div><\/div>\n<div class=\"card\"><h2>Hisoblangan natija<\/h2><canvas id=\"force\" width=\"700\" height=\"330\"><\/canvas><div class=\"stats\"><div class=\"stat\"><small>Markazga intilma kuch<\/small><strong id=\"fo\">16.67 N<\/strong><\/div><div class=\"stat\"><small>Tezlanish<\/small><strong id=\"ao\">8.33 m/s²<\/strong><\/div><div class=\"stat\"><small>Bog‘liqlik<\/small><strong>F ∝ mv²/r<\/strong><\/div><\/div><\/div><\/div>\n<div class=\"card\"><h3>Virtual tajribalar<\/h3><ol><li>Tezlikni ikki marta oshiring. Kuch necha marta oshdi?<\/li><li>Radiusni ikki marta oshiring. Kuch qanday o‘zgaradi?<\/li><li>Massani ikki marta oshiring. Kuch qanday o‘zgaradi?<\/li><\/ol><details><summary><b>Javoblarni ko‘rish<\/b><\/summary><p>Tezlik ikki marta oshsa kuch 4 marta oshadi. Radius ikki marta oshsa kuch 2 marta kamayadi. Massa ikki marta oshsa kuch ham 2 marta oshadi.<\/p><\/details><\/div>\n<\/section>\n<section id=\"three\" class=\"panel\">\n<div class=\"card\"><h2>3-reja. Markazga intilma kuch hayotda<\/h2><p>Markazga intilma kuch vazifasini turli vaziyatlarda turli kuchlar bajaradi. U alohida yangi turdagi kuch emas — markazga yo‘nalgan natijaviy kuchdir.<\/p><\/div>\n<div class=\"grid\"><div class=\"card\"><h2>Vaziyatni tanlang<\/h2><label>Misol<\/label><select id=\"scene\"><option value=\"car\">Avtomobil burilishda<\/option><option value=\"ball\">Ipga bog‘langan shar<\/option><option value=\"sat\">Yer atrofidagi sun’iy yo‘ldosh<\/option><option value=\"planet\">Sayyora Quyosh atrofida<\/option><\/select><label>Tezlik (model): <span class=\"value\" id=\"v3v\">6<\/span> m/s<\/label><input id=\"v3\" type=\"range\" min=\"2\" max=\"12\" step=\".5\" value=\"6\"><label>Radius (model): <span class=\"value\" id=\"r3v\">4<\/span> m<\/label><input id=\"r3\" type=\"range\" min=\"2\" max=\"8\" step=\".5\" value=\"4\"><div class=\"controls\"><button class=\"primary\" id=\"play3\">▶ Animatsiya<\/button><button id=\"reset3\">Qayta boshlash<\/button><\/div><div class=\"note\" id=\"desc\">Avtomobil burilganda shina va yo‘l orasidagi ishqalanish markazga yo‘nalgan natijaviy kuchni ta’minlaydi.<\/div><\/div>\n<div class=\"card\"><h2>Hayotiy vaziyat animatsiyasi<\/h2><canvas id=\"sceneCanvas\" width=\"700\" height=\"390\"><\/canvas><p class=\"muted\">Ko‘k — tezlik, to‘q sariq — markazga yo‘nalgan kuch. Sxema tushuntirish uchun soddalashtirilgan.<\/p><\/div><\/div>\n<div class=\"card\"><h3>Qaysi kuch markazga intilma kuch vazifasini bajaradi?<\/h3><ul><li><b>Avtomobil burilishda:<\/b> odatda shina va yo‘l orasidagi ishqalanish.<\/li><li><b>Ipga bog‘langan shar:<\/b> ip tarangligi (boshqa kuchlar ham bo‘lsa, natijaviy kuch hisoblanadi).<\/li><li><b>Sun’iy yo‘ldosh va sayyoralar:<\/b> gravitatsiya kuchi.<\/li><\/ul><div class=\"note\">Markazdan qochma kuchni inertsiya sanoq sistemasidagi markazga intilma kuch bilan chalkashtirmang. Markazga intilma kuch markaz tomon yo‘naladi.<\/div><\/div>\n<\/section>\n<section id=\"quiz\" class=\"panel\">\n<div class=\"card\"><h2>Masalalar va yechimlar<\/h2><div class=\"grid\">\n<div><h3>1-masala<\/h3><p>m = 2 kg, v = 6 m/s, r = 4 m. F ni toping.<\/p><details><summary>Yechim<\/summary><p>F = mv²/r = 2 × 36 / 4 = <b>18 N<\/b>.<\/p><\/details><\/div>\n<div><h3>2-masala<\/h3><p>m = 0,5 kg, v = 8 m/s, r = 2 m. F ni toping.<\/p><details><summary>Yechim<\/summary><p>F = 0,5 × 64 / 2 = <b>16 N<\/b>.<\/p><\/details><\/div>\n<div><h3>3-masala<\/h3><p>Tezlik 3 marta oshdi. Kuch qanday o‘zgaradi?<\/p><details><summary>Yechim<\/summary><p>Tezlik kvadratga bog‘liq: kuch <b>9 marta oshadi<\/b>.<\/p><\/details><\/div>\n<div><h3>4-masala<\/h3><p>m = 3 kg, v = 5 m/s, r = 2,5 m. Tezlanish va kuchni toping.<\/p><details><summary>Yechim<\/summary><p>a = 25/2,5 = 10 m/s²; F = 3 × 10 = <b>30 N<\/b>.<\/p><\/details><\/div>\n<div><h3>5-masala<\/h3><p>Radius 2 m dan 8 m ga oshdi. Kuch qanday o‘zgaradi?<\/p><details><summary>Yechim<\/summary><p>Radius 4 marta oshdi, demak kuch <b>4 marta kamayadi<\/b>.<\/p><\/details><\/div>\n<div><h3>6-masala<\/h3><p>m = 1,5 kg, v = 12 m/s, r = 3 m. F ni toping.<\/p><details><summary>Yechim<\/summary><p>F = 1,5 × 144 / 3 = <b>72 N<\/b>.<\/p><\/details><\/div><\/div><\/div>\n<div class=\"card\"><h2>Interaktiv test<\/h2><form id=\"quizform\">\n<p><b>1.<\/b> Markazga intilma kuch qaysi tomonga yo‘naladi?<\/p><label><input type=\"radio\" name=\"q1\" value=\"a\"> Harakat bo‘ylab<\/label><label><input type=\"radio\" name=\"q1\" value=\"b\"> Aylana markaziga<\/label><label><input type=\"radio\" name=\"q1\" value=\"c\"> Markazdan tashqariga<\/label>\n<p><b>2.<\/b> Formula qaysi?<\/p><label><input type=\"radio\" name=\"q2\" value=\"a\"> F = mv/r<\/label><label><input type=\"radio\" name=\"q2\" value=\"b\"> F = mr/v²<\/label><label><input type=\"radio\" name=\"q2\" value=\"c\"> F = mv²/r<\/label>\n<p><b>3.<\/b> Tezlik 3 marta oshsa, kuch necha marta oshadi?<\/p><label><input type=\"radio\" name=\"q3\" value=\"a\"> 3 marta<\/label><label><input type=\"radio\" name=\"q3\" value=\"b\"> 6 marta<\/label><label><input type=\"radio\" name=\"q3\" value=\"c\"> 9 marta<\/label>\n<p><b>4.<\/b> Sun’iy yo‘ldosh orbitasida markazga intilma kuchni nima ta’minlaydi?<\/p><label><input type=\"radio\" name=\"q4\" value=\"a\"> Gravitatsiya<\/label><label><input type=\"radio\" name=\"q4\" value=\"b\"> Har doim ishqalanish<\/label><label><input type=\"radio\" name=\"q4\" value=\"c\"> Havo qarshiligi<\/label>\n<p><b>5.<\/b> Tezlik vektori aylana trayektoriyasiga qanday yo‘nalgan?<\/p><label><input type=\"radio\" name=\"q5\" value=\"a\"> Markazga<\/label><label><input type=\"radio\" name=\"q5\" value=\"b\"> Urinma bo‘ylab<\/label><label><input type=\"radio\" name=\"q5\" value=\"c\"> Har doim yuqoriga<\/label>\n<div class=\"controls\"><button class=\"primary\" type=\"submit\">Javoblarni tekshirish<\/button><button type=\"reset\" id=\"clear\">Tozalash<\/button><\/div><\/form><div class=\"note\" id=\"result\">Javoblarni belgilang va tekshiring.<\/div><\/div>\n<div class=\"card\"><h2>Xulosa va uyga vazifa<\/h2><ul><li>F = mv²/r va a = v²/r.<\/li><li>Tezlik oshishi kuchni kvadrat qonun bo‘yicha oshiradi.<\/li><li>Kuchning manbai vaziyatga qarab ishqalanish, taranglik yoki gravitatsiya bo‘lishi mumkin.<\/li><\/ul><p><b>Uyga vazifa:<\/b> m = 4 kg, r = 5 m, v = 10 m/s. Hisoblang: markazga intilma tezlanish va kuch. Kundalik hayotdan 2 ta misol yozing.<\/p><\/div>\n<\/section>\n<\/main><footer>HTML5 o‘quv materiali. Faylni Chrome yoki boshqa brauzerda oching; internet talab qilinmaydi.<\/footer>\n<script>\nconst $=id=>document.getElementById(id);\ndocument.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===b.dataset.tab));});\nfunction arrow(c,x,y,X,Y,color,w=4){let a=Math.atan2(Y-y,X-x),h=12;c.strokeStyle=color;c.fillStyle=color;c.lineWidth=w;c.lineCap='round';c.beginPath();c.moveTo(x,y);c.lineTo(X,Y);c.stroke();c.beginPath();c.moveTo(X,Y);c.lineTo(X-h*Math.cos(a-.5),Y-h*Math.sin(a-.5));c.lineTo(X-h*Math.cos(a+.5),Y-h*Math.sin(a+.5));c.closePath();c.fill()}\nfunction grid(c,w,h){c.clearRect(0,0,w,h);c.fillStyle='#fbfdff';c.fillRect(0,0,w,h);c.strokeStyle='#e8eff6';c.lineWidth=1;for(let x=20;x<w;x+=30){c.beginPath();c.moveTo(x,0);c.lineTo(x,h);c.stroke()}for(let y=20;y<h;y+=30){c.beginPath();c.moveTo(0,y);c.lineTo(w,y);c.stroke()}}\nlet ang=0,run1=false,ang3=0,run3=false;\nfunction orbit(){let c=$('orbit').getContext('2d'),w=700,h=390;grid(c,w,h);let cx=w/2,cy=h/2,r=+$('r1').value*31,v=+$('s1').value;c.strokeStyle='#23976b';c.lineWidth=3;c.beginPath();c.arc(cx,cy,r,0,7);c.stroke();c.fillStyle='#142747';c.beginPath();c.arc(cx,cy,5,0,7);c.fill();let x=cx+r*Math.cos(ang),y=cy+r*Math.sin(ang);c.fillStyle='#2f75c5';c.beginPath();c.arc(x,y,10,0,7);c.fill();if($('showv').checked)arrow(c,x,y,x-Math.sin(ang)*v*8,y+Math.cos(ang)*v*8,'#2f75c5');if($('showa').checked)arrow(c,x,y,x+(cx-x)*.38,y+(cy-y)*.38,'#f09a38');$('s1v').textContent=v;$('r1v').textContent=$('r1').value;$('sout').textContent=v.toFixed(1)+' m/s';$('rout').textContent=(+$('r1').value).toFixed(1)+' m';$('aout').textContent=(v*v/(+$('r1').value)).toFixed(2)+' m/s²'}\nfunction force(){let c=$('force').getContext('2d'),w=700,h=330;grid(c,w,h);let m=+$('m').value,v=+$('v').value,r=+$('r').value,a=v*v/r,F=m*a,cx=w/2,cy=h/2,rad=Math.min(100,r*14),x=cx+rad;c.strokeStyle='#23976b';c.lineWidth=3;c.beginPath();c.arc(cx,cy,rad,0,7);c.stroke();c.fillStyle='#2f75c5';c.beginPath();c.arc(x,cy,10,0,7);c.fill();arrow(c,x,cy,cx+rad*.3,cy,'#f09a38',Math.min(9,2+F/30));$('mv').textContent=m;$('vv').textContent=v;$('rv').textContent=r;$('fo').textContent=F.toFixed(2)+' N';$('ao').textContent=a.toFixed(2)+' m/s²';$('explain').textContent=`a = v²/r = ${v}²/${r} = ${a.toFixed(2)} m/s²; F = ma = ${m} × ${a.toFixed(2)} = ${F.toFixed(2)} N.`}\nfunction scene(){let c=$('sceneCanvas').getContext('2d'),w=700,h=390;grid(c,w,h);let kind=$('scene').value,v=+$('v3').value,r=+$('r3').value,cx=350,cy=205,rad=65+r*10; $('v3v').textContent=v;$('r3v').textContent=r;let text='';if(kind==='car'){text='Avtomobil burilganda ishqalanish markazga yo‘nalgan natijaviy kuchni ta’minlaydi.';c.strokeStyle='#64748b';c.lineWidth=24;c.beginPath();c.arc(cx,cy,rad,Math.PI*.8,Math.PI*1.8);c.stroke();let t=ang3%(Math.PI);let a=Math.PI*.8+t,x=cx+rad*Math.cos(a),y=cy+rad*Math.sin(a);c.save();c.translate(x,y);c.rotate(a+Math.PI/2);c.fillStyle='#2f75c5';c.fillRect(-20,-11,40,22);c.restore();arrow(c,x,y,x-Math.sin(a)*v*5,y+Math.cos(a)*v*5,'#2f75c5');arrow(c,x,y,x+(cx-x)*.35,y+(cy-y)*.35,'#f09a38')}else{c.strokeStyle='#23976b';c.lineWidth=3;c.beginPath();c.arc(cx,cy,rad,0,7);c.stroke();let x=cx+rad*Math.cos(ang3),y=cy+rad*Math.sin(ang3);if(kind==='ball'){text='Ip tarangligi sharni markaz tomon tortadi. Ip uzilsa, shar urinma bo‘ylab harakatlanadi.';c.strokeStyle='#64748b';c.beginPath();c.moveTo(cx,cy);c.lineTo(x,y);c.stroke();c.fillStyle='#f09a38';c.beginPath();c.arc(x,y,12,0,7);c.fill()}else{let sat=kind==='sat';text=sat?'Yer gravitatsiyasi sun’iy yo‘ldoshga markazga yo‘nalgan kuch beradi.':'Quyosh gravitatsiyasi sayyoraning orbital harakatini ta’minlaydi.';c.fillStyle=sat?'#23976b':'#f09a38';c.beginPath();c.arc(cx,cy,sat?28:22,0,7);c.fill();c.fillStyle='#f09a38';c.beginPath();c.arc(x,y,10,0,7);c.fill();c.fillStyle='#142747';c.font='bold 14px sans-serif';c.fillText(sat?'Yer':'Quyosh',cx-20,cy+rad*.45)}arrow(c,x,y,x+(cx-x)*.38,y+(cy-y)*.38,'#f09a38');arrow(c,x,y,x-Math.sin(ang3)*v*4,y+Math.cos(ang3)*v*4,'#2f75c5')}$('desc').textContent=text;c.fillStyle='#142747';c.font='bold 15px sans-serif';c.fillText(kind==='car'?'Avtomobil':kind==='ball'?'Ipga bog‘langan shar':kind==='sat'?'Sun’iy yo‘ldosh':'Sayyora',16,25)}\n['s1','r1','showv','showa'].forEach(id=>$(id).addEventListener('input',orbit));['m','v','r'].forEach(id=>$(id).addEventListener('input',force));$('calc').onclick=force;$('resetlab').onclick=()=>{$('m').value=2;$('v').value=5;$('r').value=3;force()};$('play1').onclick=()=>{run1=!run1;$('play1').textContent=run1?'Ⅱ To‘xtatish':'▶ Harakatni boshlash'};$('reset1').onclick=()=>{ang=0;run1=false;$('play1').textContent='▶ Harakatni boshlash';orbit()};['scene','v3','r3'].forEach(id=>$(id).addEventListener('input',scene));$('play3').onclick=()=>{run3=!run3;$('play3').textContent=run3?'Ⅱ To‘xtatish':'▶ Animatsiya'};$('reset3').onclick=()=>{ang3=0;run3=false;$('play3').textContent='▶ Animatsiya';scene()};\n$('quizform').onsubmit=e=>{e.preventDefault();let ans={q1:'b',q2:'c',q3:'c',q4:'a',q5:'b'},n=0;for(let q in ans){let x=document.querySelector(`input[name=\"${q}\"]:checked`);if(x&&x.value===ans[q])n++}$('result').textContent=`Natija: ${n}/5. `+(n===5?'Ajoyib! Barcha javoblar to‘g‘ri.':n>=3?'Yaxshi! Xato javoblarni qayta ko‘rib chiqing.':'Mavzuni o‘qib, simulyatsiyalarni yana sinab ko‘ring.')};$('clear').onclick=()=>{$('result').textContent='Javoblarni belgilang va tekshiring.'};\nfunction tick(){if(run1)ang+=.025*(+$('s1').value)/5;if(run3)ang3+=.02*(+$('v3').value)/6;orbit();scene();requestAnimationFrame(tick)}orbit();force();scene();requestAnimationFrame(tick);\n<\/script><\/body><\/html>"}, {"id": "3-mavzu", "n": "3", "t": "Gravitatsiya maydonidagi harakat", "d": "Gravitatsiya qonunlari va orbital harakat", "k": "Dars", "html": "<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>3-mavzu: Gravitatsiya maydonidagi harakat<\/title>\n<style>\n:root{--bg:#071426;--panel:#10243c;--line:#29435f;--text:#edf5ff;--muted:#a9bed8;--cyan:#52d7f5;--gold:#ffd166;--green:#79e2a7}\n*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#163557,#071426 60%);color:var(--text);font:16px/1.5 system-ui,Segoe UI,sans-serif}header{text-align:center;padding:26px 16px 20px;border-bottom:1px solid var(--line)}header small{color:var(--cyan);letter-spacing:.12em;font-weight:800}h1{font-size:clamp(1.6rem,4vw,2.5rem);line-height:1.15;margin:8px auto}header p{max-width:850px;color:var(--muted);margin:10px auto}main{max-width:1180px;margin:auto;padding:16px;display:grid;gap:16px}.tabs{display:flex;flex-wrap:wrap;gap:8px}.tab,.btn{border:1px solid #42617f;border-radius:10px;padding:10px 13px;font-weight:750;cursor:pointer}.tab{background:#0d2036;color:var(--text)}.tab.active,.btn{background:var(--cyan);color:#052033;border-color:var(--cyan)}.btn.secondary{background:#203b59;color:var(--text);border-color:#42617f}.btn.gold{background:var(--gold);color:#2b2100;border-color:var(--gold)}.section{display:none}.section.active{display:block}.card{background:linear-gradient(145deg,#10243c,#0b1a2e);border:1px solid var(--line);border-radius:18px;padding:18px}.card h2{margin:0 0 5px}.lead,.note{color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(270px,1fr);gap:16px}.canvasWrap{position:relative;background:#061120;border:1px solid var(--line);border-radius:14px;overflow:hidden}canvas{display:block;width:100%;height:340px}.canvasLabel{position:absolute;left:10px;top:10px;background:#071426dc;border:1px solid #355474;padding:4px 8px;border-radius:7px;color:var(--muted);font-size:.8rem}.controls{display:grid;gap:12px}.control{background:#0a192b;border:1px solid #263f5c;padding:12px;border-radius:12px}.control label{display:flex;justify-content:space-between;gap:8px;font-weight:650;font-size:.92rem}.control output{color:var(--cyan);white-space:nowrap}input[type=range]{width:100%;accent-color:var(--cyan);margin-top:9px}.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:10px}.metric{padding:10px;background:#08182a;border:1px solid #243c57;border-radius:10px}.metric span{display:block;color:var(--muted);font-size:.8rem}.metric strong{color:var(--green);font-size:1.08rem;font-variant-numeric:tabular-nums}.formula{font-family:ui-monospace,Consolas,monospace;background:#071426;border-left:3px solid var(--gold);padding:10px 12px;border-radius:5px;overflow-wrap:anywhere}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.quiz{display:grid;gap:12px}.question{background:#0a192b;padding:14px;border:1px solid #263f5c;border-radius:12px}.question p{margin:0 0 8px;font-weight:750}.question label{display:block;margin:6px 0}.result{font-weight:800;color:var(--green)}footer{text-align:center;color:var(--muted);padding:10px 16px 26px}\n@media(max-width:780px){.layout{grid-template-columns:1fr}.card{padding:13px}canvas{height:300px}main{padding:10px}.tab{flex:1 1 45%}}@media(max-width:420px){.tab{flex-basis:100%}}\n<\/style>\n<\/head>\n<body>\n<header><small>10-SINF FIZIKA · VIRTUAL LABORATORIYA<\/small><h1>3-mavzu: Gravitatsiya maydonidagi harakat<\/h1><p>Gravitatsion kuch, erkin tushish, otilgan jismlar va sun’iy yo‘ldoshlar harakatini interaktiv simulyatsiyalar yordamida o‘rganing.<\/p><\/header>\n<main>\n<nav class=\"tabs\">\n<button class=\"tab active\" data-target=\"field\">1. Gravitatsiya maydoni<\/button>\n<button class=\"tab\" data-target=\"motion\">2. Jismlarning harakati<\/button>\n<button class=\"tab\" data-target=\"orbit\">3. Orbital harakat<\/button>\n<button class=\"tab\" data-target=\"quiz\">Bilimni tekshirish<\/button>\n<\/nav>\n<section id=\"field\" class=\"section active\"><div class=\"card\">\n<h2>1-reja. Gravitatsiya maydoni va uning xususiyatlari<\/h2><p class=\"lead\">Massalar bir-birini tortadi. Masofa oshgani sari gravitatsion kuch kamayadi.<\/p>\n<div class=\"layout\"><div><div class=\"canvasWrap\"><canvas id=\"fieldCanvas\"><\/canvas><span class=\"canvasLabel\">Kuch vektorlari va jismlar<\/span><\/div><div class=\"metrics\"><div class=\"metric\"><span>Gravitatsion kuch F<\/span><strong id=\"forceMetric\">—<\/strong><\/div><div class=\"metric\"><span>Maydon tezlanishi (m₂ joyida)<\/span><strong id=\"gMetric\">—<\/strong><\/div><div class=\"metric\"><span>Markazlar oralig‘i r<\/span><strong id=\"rMetric\">—<\/strong><\/div><div class=\"metric\"><span>Yer sirtidagi g<\/span><strong>9,81 m/s²<\/strong><\/div><\/div><\/div>\n<div class=\"controls\">\n<div class=\"control\"><label for=\"massA\">1-jism massasi <output id=\"massAOut\">5 kg<\/output><\/label><input id=\"massA\" type=\"range\" min=\"1\" max=\"20\" value=\"5\"><\/div>\n<div class=\"control\"><label for=\"massB\">2-jism massasi <output id=\"massBOut\">10 kg<\/output><\/label><input id=\"massB\" type=\"range\" min=\"1\" max=\"30\" value=\"10\"><\/div>\n<div class=\"control\"><label for=\"distance\">Masofa r <output id=\"distanceOut\">2 m<\/output><\/label><input id=\"distance\" type=\"range\" min=\"1\" max=\"10\" step=\".5\" value=\"2\"><\/div>\n<div class=\"formula\">F = Gm₁m₂/r²<br>g = Gm₁/r²<\/div><p class=\"note\">G = 6,6743 × 10⁻¹¹ N·m²/kg². Kichik jismlar orasidagi kuch nihoyatda kichik bo‘ladi. Chizmada kuch vektorlari tushunishni osonlashtirish uchun kattalashtirilgan.<\/p>\n<\/div><\/div><\/div><\/section>\n\n<section id=\"motion\" class=\"section\"><div class=\"card\">\n<h2>2-reja. Gravitatsiya maydonida jismlarning harakati<\/h2><p class=\"lead\">Harakat turini tanlang, boshlang‘ich parametrlarni o‘zgartiring va traektoriyani kuzating.<\/p>\n<div class=\"layout\"><div><div class=\"canvasWrap\"><canvas id=\"motionCanvas\"><\/canvas><span class=\"canvasLabel\" id=\"motionLabel\">Erkin tushish<\/span><\/div>\n<div class=\"metrics\"><div class=\"metric\"><span>Vaqt t<\/span><strong id=\"timeMetric\">0,00 s<\/strong><\/div><div class=\"metric\"><span>Tezlik moduli<\/span><strong id=\"speedMetric\">0,00 m/s<\/strong><\/div><div class=\"metric\"><span>Balandlik y<\/span><strong id=\"heightMetric\">80,0 m<\/strong><\/div><div class=\"metric\"><span>Gorizontal masofa x<\/span><strong id=\"xMetric\">0,0 m<\/strong><\/div><\/div>\n<div class=\"btns\"><button class=\"btn\" id=\"startMotion\">▶ Boshlash<\/button><button class=\"btn secondary\" id=\"pauseMotion\">Ⅱ Pauza<\/button><button class=\"btn gold\" id=\"resetMotion\">↺ Qayta boshlash<\/button><\/div><\/div>\n<div class=\"controls\">\n<div class=\"control\"><label for=\"motionType\">Harakat turi<\/label><select id=\"motionType\" style=\"width:100%;margin-top:8px;background:#10243c;color:#edf5ff;border:1px solid #42617f;border-radius:8px;padding:10px\"><option value=\"fall\">Erkin tushish<\/option><option value=\"vertical\">Vertikal yuqoriga otilish<\/option><option value=\"projectile\">Burchak ostida otilish<\/option><\/select><\/div>\n<div class=\"control\"><label for=\"initialHeight\">Boshlang‘ich balandlik <output id=\"initialHeightOut\">80 m<\/output><\/label><input id=\"initialHeight\" type=\"range\" min=\"20\" max=\"150\" value=\"80\"><\/div>\n<div class=\"control\"><label for=\"initialSpeed\">Boshlang‘ich tezlik <output id=\"initialSpeedOut\">20 m/s<\/output><\/label><input id=\"initialSpeed\" type=\"range\" min=\"5\" max=\"40\" value=\"20\"><\/div>\n<div class=\"control\"><label for=\"angle\">Otilish burchagi α <output id=\"angleOut\">45°<\/output><\/label><input id=\"angle\" type=\"range\" min=\"10\" max=\"80\" value=\"45\"><\/div>\n<div class=\"formula\">Erkin tushish: h = gt²/2<br>Vertikal: y = y₀ + v₀t − gt²/2<br>Gorizontal: x = v₀cosα · t<\/div><p class=\"note\">Ideal modelda havoning qarshiligi hisobga olinmaydi, g = 9,81 m/s². Ko‘rsatkichlar fizik formulalar asosida hisoblanadi.<\/p>\n<\/div><\/div><\/div><\/section>\n\n<section id=\"orbit\" class=\"section\"><div class=\"card\">\n<h2>3-reja. Gravitatsiya qonunlari va orbital harakat<\/h2><p class=\"lead\">Sun’iy yo‘ldosh Yer atrofida doiraviy orbitada harakatlanadi.<\/p>\n<div class=\"layout\"><div><div class=\"canvasWrap\"><canvas id=\"orbitCanvas\"><\/canvas><span class=\"canvasLabel\">Yer atrofidagi sun’iy yo‘ldosh<\/span><\/div>\n<div class=\"metrics\"><div class=\"metric\"><span>Orbital tezlik<\/span><strong id=\"orbSpeed\">—<\/strong><\/div><div class=\"metric\"><span>Aylanish davri<\/span><strong id=\"orbPeriod\">—<\/strong><\/div><div class=\"metric\"><span>Gravitatsion tezlanish<\/span><strong id=\"orbG\">—<\/strong><\/div><div class=\"metric\"><span>Orbital radius r<\/span><strong id=\"orbRadius\">—<\/strong><\/div><\/div>\n<div class=\"btns\"><button class=\"btn\" id=\"startOrbit\">▶ Harakat<\/button><button class=\"btn secondary\" id=\"pauseOrbit\">Ⅱ Pauza<\/button><button class=\"btn gold\" id=\"resetOrbit\">↺ Qayta<\/button><\/div><\/div>\n<div class=\"controls\"><div class=\"control\"><label for=\"orbitAltitude\">Balandlik h <output id=\"orbitAltitudeOut\">400 km<\/output><\/label><input id=\"orbitAltitude\" type=\"range\" min=\"200\" max=\"2000\" step=\"50\" value=\"400\"><\/div>\n<div class=\"control\"><label for=\"satMass\">Yo‘ldosh massasi <output id=\"satMassOut\">500 kg<\/output><\/label><input id=\"satMass\" type=\"range\" min=\"100\" max=\"2000\" step=\"100\" value=\"500\"><\/div>\n<div class=\"formula\">v = √(GM/r)<br>T = 2π√(r³/GM)<br>g = GM/r²<\/div><p class=\"note\">Yer massasi M = 5,972 × 10²⁴ kg; Yer radiusi R = 6371 km; G = 6,6743 × 10⁻¹¹ SI. Orbital radius r = R + h.<\/p><div class=\"control\"><strong>Esda tuting<\/strong><p class=\"note\">Ideal doiraviy orbitada yo‘ldosh massasi orbital tezlik va davrga ta’sir qilmaydi. Balandlik ortganda orbital tezlik kamayadi, aylanish davri ortadi.<\/p><\/div><\/div><\/div><\/div><\/section>\n\n<section id=\"quiz\" class=\"section\"><div class=\"card\"><h2>Bilimingizni tekshiring<\/h2><p class=\"lead\">Har bir savol uchun bitta javobni tanlang.<\/p><form id=\"quizForm\" class=\"quiz\">\n<div class=\"question\"><p>1. Gravitatsion kuch masofaga qanday bog‘liq?<\/p><label><input type=\"radio\" name=\"q1\" value=\"a\"> Masofaga to‘g‘ri proporsional<\/label><label><input type=\"radio\" name=\"q1\" value=\"b\"> Masofa kvadratiga teskari proporsional<\/label><label><input type=\"radio\" name=\"q1\" value=\"c\"> Masofaga bog‘liq emas<\/label><\/div>\n<div class=\"question\"><p>2. Yer sirtiga yaqin erkin tushish tezlanishi qancha?<\/p><label><input type=\"radio\" name=\"q2\" value=\"a\"> 3,0 m/s²<\/label><label><input type=\"radio\" name=\"q2\" value=\"b\"> 9,81 m/s²<\/label><label><input type=\"radio\" name=\"q2\" value=\"c\"> 100 m/s²<\/label><\/div>\n<div class=\"question\"><p>3. Havoning qarshiligi bo‘lmasa, tushish tezlanishi nimaga bog‘liq?<\/p><label><input type=\"radio\" name=\"q3\" value=\"a\"> Jism massasiga<\/label><label><input type=\"radio\" name=\"q3\" value=\"b\"> Jism rangiga<\/label><label><input type=\"radio\" name=\"q3\" value=\"c\"> Gravitatsion maydonga<\/label><\/div>\n<div class=\"question\"><p>4. Doiraviy orbitada balandlik ortsa, orbital tezlik qanday o‘zgaradi?<\/p><label><input type=\"radio\" name=\"q4\" value=\"a\"> Kamayadi<\/label><label><input type=\"radio\" name=\"q4\" value=\"b\"> Ortadi<\/label><label><input type=\"radio\" name=\"q4\" value=\"c\"> O‘zgarmaydi<\/label><\/div>\n<div class=\"question\"><p>5. Gorizontga burchak ostida otilgan jismning ideal traektoriyasi qanday?<\/p><label><input type=\"radio\" name=\"q5\" value=\"a\"> To‘g‘ri chiziq<\/label><label><input type=\"radio\" name=\"q5\" value=\"b\"> Parabola<\/label><label><input type=\"radio\" name=\"q5\" value=\"c\"> Aylana<\/label><\/div>\n<button class=\"btn\" type=\"submit\">Javoblarni tekshirish<\/button><div id=\"quizResult\" class=\"result\" aria-live=\"polite\"><\/div><\/form><\/div><\/section>\n<\/main><footer>Virtual laboratoriya · Parametrlarni o‘zgartiring, kuzating va xulosa chiqaring.<\/footer>\n\n<script>\n'use strict';\nconst $=id=>document.getElementById(id),G=6.6743e-11,ME=5.972e24,RE=6.371e6,g0=9.81;\nconst fmt=(n,d=2)=>Number.isFinite(n)?n.toLocaleString('uz-UZ',{maximumFractionDigits:d,minimumFractionDigits:d}):'—';\nconst cvs={};let motionT=0,motionRunning=false,orbitAngle=0,orbitRunning=true,lastStamp=0;\nfunction setup(id){const c=$(id),ctx=c.getContext('2d');cvs[id]={c,ctx};function size(){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;c.width=Math.max(1,Math.round(r.width*d));c.height=Math.max(1,Math.round(r.height*d));ctx.setTransform(d,0,0,d,0,0);drawAll()}new ResizeObserver(size).observe(c);size()}\nfunction clear(id){const {c,ctx}=cvs[id];ctx.clearRect(0,0,c.clientWidth,c.clientHeight);return {ctx,w:c.clientWidth,h:c.clientHeight}}\nfunction stars(ctx,w,h,n=55){for(let i=0;i<n;i++){ctx.fillStyle=`rgba(180,220,255,${.15+(i%5)*.12})`;ctx.beginPath();ctx.arc((i*97+31)%Math.max(1,w),(i*53+17)%Math.max(1,h),i%7===0?1.5:.7,0,7);ctx.fill()}}\nfunction arrow(ctx,x1,y1,x2,y2,color,width=2){const a=Math.atan2(y2-y1,x2-x1);ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-8*Math.cos(a-.45),y2-8*Math.sin(a-.45));ctx.lineTo(x2-8*Math.cos(a+.45),y2-8*Math.sin(a+.45));ctx.closePath();ctx.fill()}\nfunction drawField(){const {ctx,w,h}=clear('fieldCanvas');stars(ctx,w,h,35);const m1=+$('massA').value,m2=+$('massB').value,r=+$('distance').value,cx=w/2,cy=h/2,sep=Math.min(w*.31,60+r*6),r1=13+Math.sqrt(m1)*2,r2=13+Math.sqrt(m2)*2;\nctx.strokeStyle='#52d7f544';for(let i=0;i<15;i++){const a=i*Math.PI/7.5;ctx.beginPath();ctx.moveTo(cx-sep,cy);ctx.quadraticCurveTo(cx,cy+Math.sin(a)*h*.38,cx+sep,cy);ctx.stroke()}\nctx.setLineDash([4,5]);ctx.strokeStyle='#a9bed8';ctx.beginPath();ctx.moveTo(cx-sep,cy);ctx.lineTo(cx+sep,cy);ctx.stroke();ctx.setLineDash([]);\n[[cx-sep,r1,'#52d7f5','m₁'],[cx+sep,r2,'#ffd166','m₂']].forEach(([x,rad,col,label])=>{const g=ctx.createRadialGradient(x-rad*.3,cy-rad*.3,1,x,cy,rad*1.5);g.addColorStop(0,'#fff');g.addColorStop(.3,col);g.addColorStop(1,'#12304d');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,cy,rad,0,7);ctx.fill();ctx.fillStyle='#edf5ff';ctx.textAlign='center';ctx.font='bold 13px system-ui';ctx.fillText(label,x,cy+rad+18)});\narrow(ctx,cx-sep+r1,cy-26,cx-sep+r1+35,cy-26,'#52d7f5');arrow(ctx,cx+sep-r2,cy+26,cx+sep-r2-35,cy+26,'#ffd166');\nctx.fillStyle='#a9bed8';ctx.textAlign='center';ctx.font='12px system-ui';ctx.fillText(`r = ${r.toFixed(1)} m`,cx,cy-13);\nconst F=G*m1*m2/(r*r),field=G*m1/(r*r);$('forceMetric').textContent=F.toExponential(3)+' N';$('gMetric').textContent=field.toExponential(3)+' m/s²';$('rMetric').textContent=fmt(r,1)+' m';\n}\nfunction motionValues(t){const type=$('motionType').value,y0=+$('initialHeight').value,v0=+$('initialSpeed').value,a=+$('angle').value*Math.PI/180;let x=0,y=0,vx=0,vy=0;\nif(type==='fall'){y=y0-.5*g0*t*t;vy=-g0*t}\nelse if(type==='vertical'){y=y0+v0*t-.5*g0*t*t;vy=v0-g0*t}\nelse{x=v0*Math.cos(a)*t;y=y0+v0*Math.sin(a)*t-.5*g0*t*t;vx=v0*Math.cos(a);vy=v0*Math.sin(a)-g0*t}\nreturn {x,y,vx,vy,speed:Math.hypot(vx,vy)}}\nfunction motionEnd(){const type=$('motionType').value,y0=+$('initialHeight').value,v=+$('initialSpeed').value,a=+$('angle').value*Math.PI/180;if(type==='fall')return Math.sqrt(2*y0/g0);if(type==='vertical')return (v+Math.sqrt(v*v+2*g0*y0))/g0;const vy=v*Math.sin(a);return (vy+Math.sqrt(vy*vy+2*g0*y0))/g0}\nfunction drawMotion(){const {ctx,w,h}=clear('motionCanvas');stars(ctx,w,h,25);const type=$('motionType').value,y0=+$('initialHeight').value,v0=+$('initialSpeed').value,a=+$('angle').value*Math.PI/180,T=motionEnd(),t=Math.min(motionT,T),p=motionValues(t);\n$('motionLabel').textContent=type==='fall'?'Erkin tushish':type==='vertical'?'Vertikal yuqoriga otilish':'Burchak ostida otilish';\nconst ground=h-35;ctx.strokeStyle='#79e2a7';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(15,ground);ctx.lineTo(w-15,ground);ctx.stroke();ctx.fillStyle='#a9bed8';ctx.font='12px system-ui';ctx.fillText('Yer sathi',18,ground+19);\nlet maxX=Math.max(40,type==='projectile'?v0*Math.cos(a)*T:10),maxY=Math.max(y0,type==='vertical'?y0+v0*v0/(2*g0):y0+25);const scaleX=(w-50)/Math.max(maxX,1),scaleY=(ground-35)/Math.max(maxY,1),sx=20,sy=ground;\nctx.strokeStyle='#52d7f5';ctx.lineWidth=2;ctx.beginPath();let started=false;for(let i=0;i<=100;i++){const q=motionValues(T*i/100),px=sx+q.x*scaleX,py=sy-q.y*scaleY;if(!started){ctx.moveTo(px,py);started=true}else ctx.lineTo(px,py)}ctx.stroke();\nconst bx=sx+p.x*scaleX,by=sy-p.y*scaleY;const grd=ctx.createRadialGradient(bx-3,by-4,1,bx,by,12);grd.addColorStop(0,'#fff');grd.addColorStop(.4,'#ffd166');grd.addColorStop(1,'#b96d16');ctx.fillStyle=grd;ctx.beginPath();ctx.arc(bx,by,9,0,7);ctx.fill();arrow(ctx,bx,by,bx+p.vx*1.5,by-p.vy*1.5,'#79e2a7',2);\n$('timeMetric').textContent=fmt(t)+' s';$('speedMetric').textContent=fmt(p.speed)+' m/s';$('heightMetric').textContent=fmt(Math.max(0,p.y))+' m';$('xMetric').textContent=fmt(p.x)+' m';\nif(t>=T){motionRunning=false;motionT=T}\n}\nfunction drawOrbit(){const {ctx,w,h}=clear('orbitCanvas');stars(ctx,w,h,65);const alt=+$('orbitAltitude').value*1000,r=RE+alt,v=Math.sqrt(G*ME/r),T=2*Math.PI*Math.sqrt(r**3/(G*ME)),gg=G*ME/(r*r),cx=w/2,cy=h/2,rad=Math.min(w,h)*(.22+($('orbitAltitude').value-200)/1800*.13),earth=Math.min(w,h)*.14;\nctx.strokeStyle='#52d7f566';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cx,cy,rad,0,7);ctx.stroke();\nconst eg=ctx.createRadialGradient(cx-earth*.35,cy-earth*.4,1,cx,cy,earth*1.35);eg.addColorStop(0,'#a7efff');eg.addColorStop(.35,'#238bd1');eg.addColorStop(.7,'#14528c');eg.addColorStop(1,'#071426');ctx.fillStyle=eg;ctx.beginPath();ctx.arc(cx,cy,earth,0,7);ctx.fill();\nctx.strokeStyle='#79e2a755';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx-earth*.18,cy-earth*.05,earth*.75,-.9,.7);ctx.stroke();ctx.beginPath();ctx.arc(cx+earth*.15,cy+earth*.15,earth*.35,2,4.8);ctx.stroke();\nconst sx=cx+rad*Math.cos(orbitAngle),sy=cy+rad*Math.sin(orbitAngle);ctx.fillStyle='#ffd166';ctx.beginPath();ctx.arc(sx,sy,7,0,7);ctx.fill();ctx.fillStyle='#52d7f5';ctx.fillRect(sx-14,sy-3,8,6);ctx.fillRect(sx+6,sy-3,8,6);arrow(ctx,sx,sy,sx-16*Math.sin(orbitAngle),sy+16*Math.cos(orbitAngle),'#79e2a7',2);\n$('orbSpeed').textContent=fmt(v/1000,3)+' km/s';$('orbPeriod').textContent=fmt(T/60,1)+' min';$('orbG').textContent=fmt(gg,2)+' m/s²';$('orbRadius').textContent=fmt(r/1000,0)+' km';\n}\nfunction drawAll(){if(cvs.fieldCanvas)drawField();if(cvs.motionCanvas)drawMotion();if(cvs.orbitCanvas)drawOrbit()}\ndocument.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id===b.dataset.target));drawAll()}));\n['massA','massB','distance'].forEach(id=>$(id).addEventListener('input',()=>{$(id+'Out').textContent=$(id).value+(id==='distance'?' m':' kg');drawField()}));\n['initialHeight','initialSpeed','angle'].forEach(id=>$(id).addEventListener('input',()=>{$(id+'Out').textContent=$(id).value+(id==='angle'?'°':id==='initialHeight'?' m':' m/s');motionT=0;drawMotion()}));\n$('motionType').addEventListener('change',()=>{motionT=0;motionRunning=false;drawMotion()});\n$('startMotion').addEventListener('click',()=>{if(motionT>=motionEnd())motionT=0;motionRunning=true});$('pauseMotion').addEventListener('click',()=>motionRunning=false);$('resetMotion').addEventListener('click',()=>{motionRunning=false;motionT=0;drawMotion()});\n['orbitAltitude','satMass'].forEach(id=>$(id).addEventListener('input',()=>{$(id+'Out').textContent=$(id).value+(id==='orbitAltitude'?' km':' kg');drawOrbit()}));\n$('startOrbit').addEventListener('click',()=>orbitRunning=true);$('pauseOrbit').addEventListener('click',()=>orbitRunning=false);$('resetOrbit').addEventListener('click',()=>{orbitAngle=0;drawOrbit()});\n$('quizForm').addEventListener('submit',e=>{e.preventDefault();const ans={q1:'b',q2:'b',q3:'c',q4:'a',q5:'b'};let score=0;for(const [q,a] of Object.entries(ans)){if(document.querySelector(`input[name=\"${q}\"]:checked`)?.value===a)score++}$('quizResult').textContent=`Natija: ${score}/5 ta to‘g‘ri javob.`+(score===5?' A’lo!':score>=3?' Yaxshi! Mavzuni yana bir bor takrorlang.':' Mavzuni takrorlab, qayta urinib ko‘ring.');});\nfunction animate(stamp){if(!lastStamp)lastStamp=stamp;const dt=Math.min((stamp-lastStamp)/1000,.05);lastStamp=stamp;if(motionRunning){motionT+=dt;if(motionT>=motionEnd()){motionT=motionEnd();motionRunning=false}drawMotion()}if(orbitRunning){orbitAngle+=dt*.65;if(orbitAngle>Math.PI*2)orbitAngle-=Math.PI*2;drawOrbit()}requestAnimationFrame(animate)}\nsetup('fieldCanvas');setup('motionCanvas');setup('orbitCanvas');drawAll();requestAnimationFrame(animate);\n<\/script>\n<\/body><\/html>"}, {"id": "4-mavzu", "n": "4", "t": "Masalalar yechish", "d": "Markazga intilma kuch va gravitatsiya masalalari", "k": "Masala", "html": "<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>4-mavzu: Masalalar yechish<\/title>\n<style>\n:root{--bg:#f3f6fb;--card:#fff;--ink:#18243a;--muted:#60708a;--blue:#225bd6;--cyan:#12a6bd;--orange:#f59e0b;--line:#dce5f1;--green:#138a58;--red:#c24141}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}\nheader{background:linear-gradient(120deg,#123a83,#176fba 60%,#16a6b7);color:white;padding:28px 18px 32px}\n.wrap{max-width:1120px;margin:auto;padding:0 16px}header h1{margin:0 0 8px;font-size:clamp(1.65rem,4vw,2.55rem);line-height:1.15}header p{margin:0;max-width:800px;color:#eaf7ff}\nnav{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 3px 14px #18243a0a}\n.navin{display:flex;gap:8px;overflow:auto;padding:10px 16px;max-width:1120px;margin:auto}\nnav a{white-space:nowrap;text-decoration:none;color:var(--ink);padding:8px 12px;border-radius:9px;font-size:.92rem}nav a:hover{background:#eaf1ff;color:var(--blue)}\nmain{max-width:1120px;margin:22px auto;padding:0 16px 42px}\nsection{scroll-margin-top:78px;margin:20px 0 28px}\nh2{font-size:1.45rem;margin:0 0 14px}h3{margin:0 0 10px;font-size:1.08rem}\n.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 5px 18px #1b35500a}\n.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid .card{margin:0}\n.formula{background:#edf4ff;border:1px solid #d5e5ff;padding:12px 14px;border-radius:10px;font-weight:700;color:#17479c;display:inline-block;margin:4px 0}\n.small{color:var(--muted);font-size:.92rem}.tag{display:inline-block;background:#e7f8f8;color:#087887;border-radius:999px;padding:3px 9px;font-size:.78rem;font-weight:700}\nbutton{border:0;border-radius:10px;padding:10px 14px;background:var(--blue);color:white;font:inherit;font-weight:650;cursor:pointer;margin:4px 4px 4px 0}\nbutton.secondary{background:#eaf0fa;color:#1f3d6e}button.orange{background:#d97706}button:hover{filter:brightness(.96)}\ninput[type=number],select{width:100%;padding:10px;border:1px solid #cbd7e7;border-radius:9px;background:white;color:var(--ink);font:inherit}\nlabel{display:block;font-size:.9rem;font-weight:650;margin:8px 0 4px}\n.controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}\ncanvas{display:block;width:100%;height:300px;border-radius:12px;background:linear-gradient(#f8fbff,#edf5ff);border:1px solid var(--line)}\n.result{background:#f0faf5;border:1px solid #c6edda;border-radius:10px;padding:12px;margin-top:10px}\n.problem{border-left:4px solid var(--cyan);padding:10px 14px;background:#f7fcfd;border-radius:0 10px 10px 0;margin:12px 0}\n.solution{display:none;padding:12px 14px;background:#f5f8fd;border-radius:10px;margin-top:8px}.solution.show{display:block}\ntable{border-collapse:collapse;width:100%;margin:8px 0}td,th{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}th{background:#f0f5fb}\n.quizq{padding:14px 0;border-bottom:1px solid var(--line)}.quizq label{font-weight:400;display:flex;gap:8px;align-items:flex-start;margin:8px 0}.quizq input{margin-top:5px}\nfooter{text-align:center;color:var(--muted);padding:24px}\n@media(max-width:720px){.grid{grid-template-columns:1fr}.controls{grid-template-columns:1fr 1fr}canvas{height:250px}.card{padding:14px}}\n@media(max-width:430px){.controls{grid-template-columns:1fr}nav a{font-size:.85rem;padding:7px 9px}}\n@media print{nav,button,.controls{display:none!important}body{background:#fff}.card{box-shadow:none;break-inside:avoid}header{background:#fff;color:#111;border-bottom:2px solid #333}header p{color:#333}}\n<\/style>\n<\/head>\n<body>\n<header><div class=\"wrap\">\n<span class=\"tag\">10-sinf fizika<\/span>\n<h1>4-mavzu: Masalalar yechish<\/h1>\n<p>Markazga intilma kuch va gravitatsiya maydonidagi harakat. Formulalar, bosqichma-bosqich yechimlar, interaktiv simulyatsiyalar va bilimni tekshirish testi.<\/p>\n<\/div><\/header>\n<nav><div class=\"navin\">\n<a href=\"#formulalar\">Formulalar<\/a><a href=\"#markaz\">1. Markazga intilma kuch<\/a><a href=\"#gravitatsiya\">2. Gravitatsiya<\/a><a href=\"#aralash\">3. Aralash masalalar<\/a><a href=\"#test\">Test<\/a>\n<\/div><\/nav>\n<main>\n<section id=\"kirish\">\n<div class=\"card\"><h2>Dars maqsadi<\/h2>\n<p>Aylana bo‘ylab harakat, gravitatsion tortishish, erkin tushish va orbital harakatga doir masalalarni fizik formulalar yordamida yechish.<\/p>\n<div class=\"grid\">\n<div><h3>Masala yechish algoritmi<\/h3><ol><li>Berilganlarni yozing.<\/li><li>Topilishi kerak bo‘lgan kattalikni aniqlang.<\/li><li>Mos formulani tanlang.<\/li><li>Qiymatlarni SI birliklariga o‘tkazing.<\/li><li>Hisoblang va javobni birlik bilan yozing.<\/li><\/ol><\/div>\n<div><h3>Doimiy kattaliklar<\/h3><p><b>G<\/b> = 6,67 × 10⁻¹¹ N·m²/kg²<\/p><p><b>g<\/b> ≈ 9,8 m/s² (Yer sirtiga yaqin)<\/p><p><b>Yer radiusi<\/b> R ≈ 6,37 × 10⁶ m<\/p><p><b>Yer massasi<\/b> M ≈ 5,97 × 10²⁴ kg<\/p><\/div>\n<\/div><\/div>\n<\/section>\n<section id=\"formulalar\">\n<h2>Asosiy formulalar jadvali<\/h2><div class=\"card\"><table><thead><tr><th>Kattalik<\/th><th>Formula<\/th><th>Izoh<\/th><\/tr><\/thead><tbody>\n<tr><td>Markazga intilma tezlanish<\/td><td>a = v²/r<\/td><td>v — tezlik, r — radius<\/td><\/tr>\n<tr><td>Markazga intilma kuch<\/td><td>F = mv²/r<\/td><td>Kuch markazga yo‘nalgan<\/td><\/tr>\n<tr><td>Chiziqli va burchak tezlik<\/td><td>v = ωr<\/td><td>ω — burchak tezlik<\/td><\/tr>\n<tr><td>Aylanish davri<\/td><td>v = 2πr/T<\/td><td>T — bir aylanish vaqti<\/td><\/tr>\n<tr><td>Butun olam tortishish qonuni<\/td><td>F = Gm₁m₂/r²<\/td><td>r — jismlar markazlari orasidagi masofa<\/td><\/tr>\n<tr><td>Gravitatsion tezlanish<\/td><td>g = GM/r²<\/td><td>Markazdan r masofada<\/td><\/tr>\n<tr><td>Erkin tushish<\/td><td>v = v₀ + gt; h = v₀t + gt²/2<\/td><td>Pastga yo‘nalish musbat deb olindi<\/td><\/tr>\n<tr><td>Potensial energiya (Yer sirtiga yaqin)<\/td><td>Eₚ = mgh<\/td><td>h — tanlangan sathdan balandlik<\/td><\/tr>\n<tr><td>Birinchi kosmik tezlik<\/td><td>v₁ = √(GM/R) = √(gR)<\/td><td>Aylana orbitaga yaqinlashgan holda<\/td><\/tr>\n<tr><td>Ikkinchi kosmik tezlik<\/td><td>v₂ = √(2GM/R) = √(2gR)<\/td><td>Ideal holatda qochish tezligi<\/td><\/tr>\n<\/tbody><\/table><p class=\"small\">Eslatma: vektor kattaliklarning yo‘nalishi muhim. Erkin tushish formulalarida g pastga yo‘nalgan tezlanish modulidir.<\/p><\/div>\n<\/section>\n<section id=\"markaz\">\n<h2>1-reja. Markazga intilma kuch<\/h2>\n<div class=\"grid\">\n<div class=\"card\"><h3>Namuna masala 1<\/h3><p>Massasi 2 kg jism radiusi 4 m aylana bo‘ylab 6 m/s tezlikda harakatlanmoqda. Markazga intilma kuchni toping.<\/p>\n<div class=\"formula\">F = mv²/r<\/div>\n<p><b>Berilgan:<\/b> m = 2 kg; v = 6 m/s; r = 4 m.<\/p><p><b>Yechish:<\/b> F = 2 × 6² / 4 = 72 / 4 = 18 N.<\/p><p><b>Javob:<\/b> 18 N.<\/p><\/div>\n<div class=\"card\"><h3>Namuna masala 2<\/h3><p>Avtomobil 10 m radiusli burilishdan 5 m/s tezlikda o‘tmoqda. Markazga intilma tezlanishni toping.<\/p><div class=\"formula\">a = v²/r<\/div><p><b>Yechish:<\/b> a = 5² / 10 = 25 / 10 = 2,5 m/s².<\/p><p><b>Javob:<\/b> 2,5 m/s².<\/p><\/div>\n<\/div>\n<div class=\"card\"><h3>Simulyatsiya: aylana bo‘ylab harakat<\/h3><p class=\"small\">Massa, tezlik va radiusni o‘zgartiring. Jismning harakati, tezlik vektori va markazga intilma kuch vektori yangilanadi.<\/p>\n<div class=\"controls\">\n<div><label for=\"mass\">Massa m (kg)<\/label><input id=\"mass\" type=\"number\" min=\"0.1\" max=\"20\" step=\"0.1\" value=\"2\"><\/div>\n<div><label for=\"speed\">Tezlik v (m/s)<\/label><input id=\"speed\" type=\"number\" min=\"0.1\" max=\"30\" step=\"0.1\" value=\"6\"><\/div>\n<div><label for=\"radius\">Radius r (m)<\/label><input id=\"radius\" type=\"number\" min=\"0.5\" max=\"15\" step=\"0.5\" value=\"4\"><\/div>\n<\/div><canvas id=\"circleCanvas\" aria-label=\"Aylana bo‘ylab harakat animatsiyasi\"><\/canvas>\n<div class=\"result\" id=\"circleResult\">Markazga intilma kuch: 18 N<\/div>\n<button id=\"circleStart\">Boshlash<\/button><button class=\"secondary\" id=\"circlePause\">To‘xtatish<\/button><button class=\"secondary\" id=\"circleReset\">Qayta boshlash<\/button>\n<\/div>\n<div class=\"card\"><h3>Mustaqil masala<\/h3><p>Massasi 0,5 kg bo‘lgan jism 2 m radiusli aylana bo‘ylab 8 m/s tezlikda harakatlanadi. Markazga intilma kuchni toping.<\/p><button class=\"secondary\" onclick=\"toggleSolution('sol1')\">Yechimini ko‘rsatish<\/button><div id=\"sol1\" class=\"solution\">F = mv²/r = 0,5 × 8² / 2 = 0,5 × 64 / 2 = <b>16 N<\/b>.<\/div><\/div>\n<\/section>\n<section id=\"gravitatsiya\">\n<h2>2-reja. Gravitatsiya maydonidagi harakat<\/h2>\n<div class=\"grid\">\n<div class=\"card\"><h3>Namuna masala 3: erkin tushish<\/h3><p>Jism tinch holatdan 3 s davomida erkin tushdi. h va v ni toping. Havoning qarshiligini hisobga olmang.<\/p><div class=\"formula\">h = gt²/2; v = gt<\/div><p><b>Yechish:<\/b> h = 9,8 × 3² / 2 = 44,1 m.<\/p><p>v = 9,8 × 3 = 29,4 m/s.<\/p><p><b>Javob:<\/b> h = 44,1 m; v = 29,4 m/s pastga.<\/p><\/div>\n<div class=\"card\"><h3>Namuna masala 4: tortishish kuchi<\/h3><p>Massalari 5 kg va 10 kg bo‘lgan jismlar markazlari orasidagi masofa 2 m. Ular orasidagi tortishish kuchini hisoblang.<\/p><div class=\"formula\">F = Gm₁m₂/r²<\/div><p><b>Yechish:<\/b> F = 6,67×10⁻¹¹ × 5 × 10 / 2² ≈ 8,34×10⁻¹⁰ N.<\/p><p><b>Javob:<\/b> taxminan 8,34 × 10⁻¹⁰ N.<\/p><\/div>\n<\/div>\n<div class=\"card\"><h3>Simulyatsiya: erkin tushish<\/h3><p class=\"small\">Boshlang‘ich tezlik va vaqtni o‘zgartiring. Animatsiyada jismning tushishi, balandlik va tezlik ko‘rsatiladi. Model Yer sirtiga yaqin, g doimiy bo‘lgan holat uchun.<\/p>\n<div class=\"controls\">\n<div><label for=\"height\">Boshlang‘ich balandlik (m)<\/label><input id=\"height\" type=\"number\" min=\"1\" max=\"500\" step=\"1\" value=\"100\"><\/div>\n<div><label for=\"v0\">Boshlang‘ich tezlik pastga (m/s)<\/label><input id=\"v0\" type=\"number\" min=\"0\" max=\"40\" step=\"1\" value=\"0\"><\/div>\n<div><label for=\"fallTime\">Vaqt (s)<\/label><input id=\"fallTime\" type=\"number\" min=\"0.1\" max=\"10\" step=\"0.1\" value=\"3\"><\/div>\n<\/div><canvas id=\"fallCanvas\" aria-label=\"Erkin tushish animatsiyasi\"><\/canvas>\n<div class=\"result\" id=\"fallResult\"><\/div><button id=\"fallRun\">Animatsiyani boshlash<\/button><button class=\"secondary\" id=\"fallStop\">To‘xtatish<\/button><button class=\"secondary\" id=\"fallReset\">Qayta boshlash<\/button>\n<\/div>\n<div class=\"card\"><h3>Mustaqil masala<\/h3><p>Jism 20 m balandlikdan tinch holatdan tushmoqda. Havoning qarshiligini hisobga olmasdan, tushish vaqtini toping. g = 10 m/s² deb oling.<\/p><button class=\"secondary\" onclick=\"toggleSolution('sol2')\">Yechimini ko‘rsatish<\/button><div id=\"sol2\" class=\"solution\">h = gt²/2 → t = √(2h/g) = √(40/10) = √4 = <b>2 s<\/b>.<\/div><\/div>\n<\/section>\n<section id=\"aralash\">\n<h2>3-reja. Aralash masalalar va orbital harakat<\/h2>\n<div class=\"grid\">\n<div class=\"card\"><h3>Namuna masala 5: yo‘ldosh<\/h3><p>Sun’iy yo‘ldosh aylana orbitada harakatlanadi. Orbita radiusi r va markaziy jism massasi M ma’lum bo‘lsa, orbital tezlik qanday topiladi?<\/p><div class=\"formula\">v = √(GM/r)<\/div><p>Bu natija gravitatsion kuch markazga intilma kuch vazifasini bajarishidan kelib chiqadi: GMm/r² = mv²/r. Yo‘ldosh massasi qisqaradi.<\/p><\/div>\n<div class=\"card\"><h3>Namuna masala 6: orbital tezlanish<\/h3><p>Jism Yer markazidan r masofada aylanmoqda. Gravitatsion tezlanish:<\/p><div class=\"formula\">g(r) = GM/r²<\/div><p>Masofa 2 baravar ortsa, g yangi qiymati avvalgisining 1/4 qismiga teng bo‘ladi, chunki tezlanish masofaning kvadratiga teskari proporsional.<\/p><\/div>\n<\/div>\n<div class=\"card\"><h3>Simulyatsiya: gravitatsiya va orbital tezlik<\/h3><p class=\"small\">Yer massasi va radiusi uchun idealizatsiyalangan model. Orbita radiusi Yer markazidan o‘lchanadi; qiymat Yer radiusidan kichik bo‘lishi mumkin emas.<\/p>\n<div class=\"controls\">\n<div><label for=\"orbitAlt\">Yer sirtidan balandlik (km)<\/label><input id=\"orbitAlt\" type=\"number\" min=\"0\" max=\"100000\" step=\"100\" value=\"400\"><\/div>\n<div><label for=\"satMass\">Yo‘ldosh massasi (kg)<\/label><input id=\"satMass\" type=\"number\" min=\"1\" max=\"10000\" step=\"1\" value=\"1000\"><\/div>\n<div><label for=\"orbitSpeed\">Animatsiya tezligi<\/label><input id=\"orbitSpeed\" type=\"number\" min=\"0.2\" max=\"3\" step=\"0.1\" value=\"1\"><\/div>\n<\/div><canvas id=\"orbitCanvas\" aria-label=\"Yer atrofidagi sun’iy yo‘ldosh animatsiyasi\"><\/canvas>\n<div class=\"result\" id=\"orbitResult\"><\/div><button id=\"orbitStart\">Boshlash<\/button><button class=\"secondary\" id=\"orbitPause\">To‘xtatish<\/button><button class=\"secondary\" id=\"orbitReset\">Qayta boshlash<\/button>\n<\/div>\n<div class=\"card\"><h3>Mustaqil aralash masalalar<\/h3>\n<div class=\"problem\"><b>1.<\/b> 3 kg jism 6 m radiusli aylana bo‘ylab 4 m/s tezlikda harakatlanadi. Markazga intilma kuchni toping.<\/div><button class=\"secondary\" onclick=\"toggleSolution('sol3')\">Yechimini ko‘rsatish<\/button><div id=\"sol3\" class=\"solution\">F = mv²/r = 3 × 16 / 6 = <b>8 N<\/b>.<\/div>\n<div class=\"problem\"><b>2.<\/b> Yer sirtiga yaqin joyda 2 kg jismning og‘irlik kuchini g = 9,8 m/s² deb hisoblang.<\/div><button class=\"secondary\" onclick=\"toggleSolution('sol4')\">Yechimini ko‘rsatish<\/button><div id=\"sol4\" class=\"solution\">P = mg = 2 × 9,8 = <b>19,6 N<\/b>.<\/div>\n<div class=\"problem\"><b>3.<\/b> Aylana orbitada gravitatsion kuch 20 N, yo‘ldosh massasi 5 kg, orbital radius 10 m bo‘lsa, orbital tezlikni toping.<\/div><button class=\"secondary\" onclick=\"toggleSolution('sol5')\">Yechimini ko‘rsatish<\/button><div id=\"sol5\" class=\"solution\">F = mv²/r → v = √(Fr/m) = √(20 × 10 / 5) = √40 ≈ <b>6,32 m/s<\/b>.<\/div>\n<\/div>\n<\/section>\n<section id=\"test\">\n<h2>Bilimni tekshirish testi<\/h2><div class=\"card\"><p>10 ta savolga javob bering, so‘ng “Natijani tekshirish” tugmasini bosing.<\/p><form id=\"quizForm\">\n<div class=\"quizq\"><b>1. Markazga intilma kuch formulasi qaysi?<\/b><label><input type=\"radio\" name=\"q1\" value=\"a\"> F = mv/r<\/label><label><input type=\"radio\" name=\"q1\" value=\"b\"> F = mv²/r<\/label><label><input type=\"radio\" name=\"q1\" value=\"c\"> F = mr/v²<\/label><label><input type=\"radio\" name=\"q1\" value=\"d\"> F = mg/r<\/label><\/div>\n<div class=\"quizq\"><b>2. Tezlik 2 marta ortib, radius o‘zgarmasa, markazga intilma kuch qanday o‘zgaradi?<\/b><label><input type=\"radio\" name=\"q2\" value=\"a\"> 2 marta ortadi<\/label><label><input type=\"radio\" name=\"q2\" value=\"b\"> 4 marta ortadi<\/label><label><input type=\"radio\" name=\"q2\" value=\"c\"> 2 marta kamayadi<\/label><label><input type=\"radio\" name=\"q2\" value=\"d\"> O‘zgarmaydi<\/label><\/div>\n<div class=\"quizq\"><b>3. Markazga intilma kuch qaysi tomonga yo‘naladi?<\/b><label><input type=\"radio\" name=\"q3\" value=\"a\"> Harakat yo‘nalishida<\/label><label><input type=\"radio\" name=\"q3\" value=\"b\"> Markazdan tashqariga<\/label><label><input type=\"radio\" name=\"q3\" value=\"c\"> Aylana markaziga<\/label><label><input type=\"radio\" name=\"q3\" value=\"d\"> Doimo yuqoriga<\/label><\/div>\n<div class=\"quizq\"><b>4. Gravitatsion tortishish kuchi masofaga qanday bog‘liq?<\/b><label><input type=\"radio\" name=\"q4\" value=\"a\"> r ga to‘g‘ri proporsional<\/label><label><input type=\"radio\" name=\"q4\" value=\"b\"> r² ga to‘g‘ri proporsional<\/label><label><input type=\"radio\" name=\"q4\" value=\"c\"> r² ga teskari proporsional<\/label><label><input type=\"radio\" name=\"q4\" value=\"d\"> Masofaga bog‘liq emas<\/label><\/div>\n<div class=\"quizq\"><b>5. Yer sirtiga yaqin erkin tushish tezlanishi taxminan qancha?<\/b><label><input type=\"radio\" name=\"q5\" value=\"a\"> 1,6 m/s²<\/label><label><input type=\"radio\" name=\"q5\" value=\"b\"> 9,8 m/s²<\/label><label><input type=\"radio\" name=\"q5\" value=\"c\"> 98 m/s²<\/label><label><input type=\"radio\" name=\"q5\" value=\"d\"> 0 m/s²<\/label><\/div>\n<div class=\"quizq\"><b>6. Tinch holatdan erkin tushishda 2 s ichida qancha yo‘l bosiladi? g = 10 m/s².<\/b><label><input type=\"radio\" name=\"q6\" value=\"a\"> 10 m<\/label><label><input type=\"radio\" name=\"q6\" value=\"b\"> 20 m<\/label><label><input type=\"radio\" name=\"q6\" value=\"c\"> 40 m<\/label><label><input type=\"radio\" name=\"q6\" value=\"d\"> 5 m<\/label><\/div>\n<div class=\"quizq\"><b>7. Butun olam tortishish qonunida G nimani bildiradi?<\/b><label><input type=\"radio\" name=\"q7\" value=\"a\"> Erkin tushish tezlanishi<\/label><label><input type=\"radio\" name=\"q7\" value=\"b\"> Gravitatsion doimiy<\/label><label><input type=\"radio\" name=\"q7\" value=\"c\"> Jism og‘irligi<\/label><label><input type=\"radio\" name=\"q7\" value=\"d\"> Orbital radius<\/label><\/div>\n<div class=\"quizq\"><b>8. Agar aylana orbitada F = 8 N, m = 2 kg va r = 4 m bo‘lsa, tezlik qancha?<\/b><label><input type=\"radio\" name=\"q8\" value=\"a\"> 2 m/s<\/label><label><input type=\"radio\" name=\"q8\" value=\"b\"> 4 m/s<\/label><label><input type=\"radio\" name=\"q8\" value=\"c\"> 8 m/s<\/label><label><input type=\"radio\" name=\"q8\" value=\"d\"> 16 m/s<\/label><\/div>\n<div class=\"quizq\"><b>9. Yer sirtiga yaqin potensial energiya formulasi qaysi?<\/b><label><input type=\"radio\" name=\"q9\" value=\"a\"> Eₚ = mgh<\/label><label><input type=\"radio\" name=\"q9\" value=\"b\"> Eₚ = mv<\/label><label><input type=\"radio\" name=\"q9\" value=\"c\"> Eₚ = F/r<\/label><label><input type=\"radio\" name=\"q9\" value=\"d\"> Eₚ = gt<\/label><\/div>\n<div class=\"quizq\"><b>10. Orbital harakatda yo‘ldoshni orbitada ushlab turuvchi kuch qaysi?<\/b><label><input type=\"radio\" name=\"q10\" value=\"a\"> Ishqalanish kuchi<\/label><label><input type=\"radio\" name=\"q10\" value=\"b\"> Arximed kuchi<\/label><label><input type=\"radio\" name=\"q10\" value=\"c\"> Gravitatsion kuch<\/label><label><input type=\"radio\" name=\"q10\" value=\"d\"> Elektr kuchi<\/label><\/div>\n<button type=\"button\" id=\"checkQuiz\">Natijani tekshirish<\/button><button type=\"reset\" class=\"secondary\" id=\"resetQuiz\">Qayta ishlash<\/button>\n<\/form><div id=\"quizResult\" class=\"result\" style=\"display:none\"><\/div><\/div>\n<\/section>\n<section id=\"xulosa\"><div class=\"card\"><h2>Xulosa va eslatmalar<\/h2><ul><li>Markazga intilma kuch tezlikning kvadratiga to‘g‘ri, radiusga teskari proporsional.<\/li><li>Gravitatsion kuch jismlarni o‘zaro tortadi va masofa kvadratiga teskari proporsional.<\/li><li>Erkin tushish formulalarida h = v₀t + gt²/2 va v = v₀ + gt ishlatiladi (pastga yo‘nalish musbat).<\/li><li>Orbital harakatda gravitatsion kuch markazga intilma kuchni ta’minlaydi.<\/li><li>Har bir natijani SI birligi bilan yozing va mantiqiyligini tekshiring.<\/li><\/ul><button onclick=\"window.print()\" class=\"secondary\">Darsni chop etish<\/button><\/div><\/section>\n<\/main>\n<footer>4-mavzu · Fizika · Interaktiv HTML5 dars materiali<\/footer>\n<script>\nfunction toggleSolution(id){document.getElementById(id).classList.toggle('show')}\nconst G=6.67e-11, Mearth=5.97e24, Rearth=6.37e6, g0=9.8;\nfunction num(id, fallback){const x=parseFloat(document.getElementById(id).value);return Number.isFinite(x)?x:fallback}\nfunction fmt(x,d=2){return Number(x).toLocaleString('uz-UZ',{maximumFractionDigits:d})}\nfunction setupCanvas(c){const dpr=window.devicePixelRatio||1,rect=c.getBoundingClientRect();c.width=Math.max(1,Math.floor(rect.width*dpr));c.height=Math.max(1,Math.floor(rect.height*dpr));const ctx=c.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);return {ctx,w:rect.width,h:rect.height}}\nlet circleAngle=0,circleRunning=true,circleLast=0;\nconst cc=document.getElementById('circleCanvas');\nfunction drawArrow(ctx,x1,y1,x2,y2,color,label){ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();let a=Math.atan2(y2-y1,x2-x1);ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-9*Math.cos(a-.45),y2-9*Math.sin(a-.45));ctx.lineTo(x2-9*Math.cos(a+.45),y2-9*Math.sin(a+.45));ctx.closePath();ctx.fill();ctx.font='12px system-ui';ctx.fillText(label,x2+5,y2-5)}\nfunction drawCircle(ts=0){const {ctx,w,h}=setupCanvas(cc);ctx.clearRect(0,0,w,h);const cx=w*.5,cy=h*.52,r=Math.min(w*.29,h*.34);ctx.strokeStyle='#91a7c5';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#225bd6';ctx.beginPath();ctx.arc(cx,cy,5,0,7);ctx.fill();ctx.fillStyle='#60708a';ctx.font='12px system-ui';ctx.fillText('Markaz',cx+8,cy+16);\nconst x=cx+r*Math.cos(circleAngle),y=cy+r*Math.sin(circleAngle);ctx.fillStyle='#f59e0b';ctx.beginPath();ctx.arc(x,y,9,0,Math.PI*2);ctx.fill();drawArrow(ctx,x,y,x-35*Math.sin(circleAngle),y+35*Math.cos(circleAngle),'#138a58','v');drawArrow(ctx,x,y,x+(cx-x)*.42,y+(cy-y)*.42,'#c24141','F');\nconst m=num('mass',2),v=num('speed',6),rad=num('radius',4);document.getElementById('circleResult').innerHTML=`<b>Markazga intilma kuch:<\/b> F = mv²/r = ${fmt(m)} × ${fmt(v)}² / ${fmt(rad)} = <b>${fmt(m*v*v/r)} N<\/b><br><b>Tezlanish:<\/b> a = v²/r = ${fmt(v*v/r)} m/s²`;\nif(circleRunning){if(circleLast)circleAngle+=(ts-circleLast)/1000*Math.min(2,v/Math.max(rad,.5));circleLast=ts}else circleLast=0;requestAnimationFrame(drawCircle)}\ndocument.getElementById('circleStart').onclick=()=>{circleRunning=true};document.getElementById('circlePause').onclick=()=>{circleRunning=false};document.getElementById('circleReset').onclick=()=>{circleAngle=0;circleRunning=false};['mass','speed','radius'].forEach(id=>document.getElementById(id).addEventListener('input',()=>{}));\nlet fallProgress=0,fallRunning=false,fallLast=0;const fc=document.getElementById('fallCanvas');\nfunction fallValues(){let H=Math.max(1,num('height',100)),v0=Math.max(0,num('v0',0)),t=Math.max(.1,num('fallTime',3));return {H,v0,t,dist:v0*t+.5*g0*t*t,vel:v0+g0*t}}\nfunction drawFall(ts=0){const {ctx,w,h}=setupCanvas(fc);ctx.clearRect(0,0,w,h);let {H,v0,t,dist,vel}=fallValues();let total=Math.min(H,dist),progress=fallProgress;let ground=h-32,top=28,available=ground-top,yy=top+available*progress;\nctx.strokeStyle='#7b8ca6';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(22,ground);ctx.lineTo(w-22,ground);ctx.stroke();ctx.fillStyle='#225bd6';ctx.fillRect(w*.5-2,top,4,available);ctx.fillStyle='#f59e0b';ctx.beginPath();ctx.arc(w*.5,yy,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#263b5b';ctx.font='13px system-ui';ctx.fillText('Boshlang‘ich balandlik: '+fmt(H)+' m',12,18);\nlet actualT=t*progress,actualDist=v0*actualT+.5*g0*actualT*actualT,actualVel=v0+g0*actualT;\ndocument.getElementById('fallResult').innerHTML=`<b>Berilgan vaqt oxiridagi hisob:<\/b> h = ${fmt(dist)} m; v = ${fmt(vel)} m/s pastga.${dist>H?'<br><span style=\"color:#a33\">Jism berilgan balandlikdan oldin yerga yetadi; tushish balandligiga mos vaqtni hisobga oling.<\/span>':''}<br><b>Animatsiya holati:<\/b> t ≈ ${fmt(actualT)} s; bosib o‘tilgan yo‘l ≈ ${fmt(actualDist)} m; tezlik ≈ ${fmt(actualVel)} m/s`;\nif(fallRunning){fallProgress+=((ts-fallLast)||0)/1000/Math.max(.1,t);fallLast=ts;if(fallProgress>=1){fallProgress=1;fallRunning=false}}else fallLast=0;\nrequestAnimationFrame(drawFall)}\ndocument.getElementById('fallRun').onclick=()=>{fallProgress=0;fallRunning=true};document.getElementById('fallStop').onclick=()=>fallRunning=false;document.getElementById('fallReset').onclick=()=>{fallProgress=0;fallRunning=false};\n['height','v0','fallTime'].forEach(id=>document.getElementById(id).addEventListener('input',()=>{fallProgress=0}));\nlet orbitAngle=0,orbitRunning=true,orbitLast=0;const oc=document.getElementById('orbitCanvas');\nfunction drawOrbit(ts=0){const {ctx,w,h}=setupCanvas(oc);ctx.clearRect(0,0,w,h);let alt=Math.max(0,num('orbitAlt',400))*1000,ms=Math.max(1,num('satMass',1000)),speedAnim=Math.max(.2,num('orbitSpeed',1));let r=Rearth+alt,v=Math.sqrt(G*Mearth/r),period=2*Math.PI*r/v,grav=G*Mearth/r**2,F=ms*grav;\nlet cx=w*.5,cy=h*.52,orb=Math.min(w*.39,h*.39),earthR=Math.min(orb*.36,Math.min(w,h)*.18),scale=orb/(r/ Rearth);let drawR=Math.min(orb,earthR*(r/Rearth));drawR=Math.max(earthR,Math.min(orb,drawR));\nctx.strokeStyle='#91a7c5';ctx.setLineDash([5,5]);ctx.beginPath();ctx.arc(cx,cy,orb,0,2*Math.PI);ctx.stroke();ctx.setLineDash([]);\nconst grad=ctx.createRadialGradient(cx-earthR*.3,cy-earthR*.3,2,cx,cy,earthR);grad.addColorStop(0,'#69d6ee');grad.addColorStop(1,'#1760b5');ctx.fillStyle=grad;ctx.beginPath();ctx.arc(cx,cy,earthR,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillText('YER',cx,cy+4);ctx.textAlign='left';\nconst x=cx+orb*Math.cos(orbitAngle),y=cy+orb*Math.sin(orbitAngle);ctx.fillStyle='#f59e0b';ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);ctx.fill();drawArrow(ctx,x,y,x-30*Math.sin(orbitAngle),y+30*Math.cos(orbitAngle),'#138a58','v');drawArrow(ctx,x,y,x+(cx-x)*.25,y+(cy-y)*.25,'#c24141','F');\ndocument.getElementById('orbitResult').innerHTML=`<b>Orbita radiusi:<\/b> ${fmt(r/1000,0)} km<br><b>Orbital tezlik:<\/b> ${fmt(v/1000,3)} km/s<br><b>Aylanish davri:<\/b> ${(period/60).toLocaleString('uz-UZ',{maximumFractionDigits:1})} min<br><b>Gravitatsion tezlanish:<\/b> ${fmt(grav,3)} m/s²<br><b>Yo‘ldoshga ta’sir kuchi:<\/b> ${fmt(F,2)} N`;\nif(orbitRunning){if(orbitLast)orbitAngle+=(ts-orbitLast)/1000*.7*speedAnim;orbitLast=ts}else orbitLast=0;requestAnimationFrame(drawOrbit)}\ndocument.getElementById('orbitStart').onclick=()=>orbitRunning=true;document.getElementById('orbitPause').onclick=()=>orbitRunning=false;document.getElementById('orbitReset').onclick=()=>{orbitAngle=0;orbitRunning=false};['orbitAlt','satMass','orbitSpeed'].forEach(id=>document.getElementById(id).addEventListener('input',()=>{}));\nconst answers={q1:'b',q2:'b',q3:'c',q4:'c',q5:'b',q6:'b',q7:'b',q8:'a',q9:'a',q10:'c'};\ndocument.getElementById('checkQuiz').onclick=()=>{let score=0,unanswered=0;for(const [q,a] of Object.entries(answers)){let sel=document.querySelector(`input[name=\"${q}\"]:checked`);if(!sel)unanswered++;else if(sel.value===a)score++}let box=document.getElementById('quizResult');box.style.display='block';box.innerHTML=`<b>Natija: ${score}/10 (${score*10}%)<\/b><br>Javobsiz savollar: ${unanswered}.<br>${score>=9?'A’lo! Mavzularni juda yaxshi o‘zlashtirgansiz.':score>=7?'Yaxshi natija. Xato qilingan savollarni qayta ko‘rib chiqing.':score>=5?'Qoniqarli. Formulalarni takrorlab, masalalarni yana ishlang.':'Formulalar va yechish algoritmini qayta o‘rganib, testni takrorlang.'}`};\ndocument.getElementById('resetQuiz').onclick=()=>{const b=document.getElementById('quizResult');b.style.display='none';b.innerHTML=''};\nwindow.addEventListener('resize',()=>{});\nrequestAnimationFrame(drawCircle);requestAnimationFrame(drawFall);requestAnimationFrame(drawOrbit);\n<\/script>\n<\/body>\n<\/html>"}, {"id": "5-mavzu", "n": "5", "t": "Jism og‘irligining harakat turiga bog‘liqligi", "d": "Og‘irlik, yuklanish va vaznsizlik", "k": "Dars", "html": "<!DOCTYPE html>\n<html la
