\"inclineF\">40 N<\/strong><\/div>\n<div class=\"metric\"><span>Tik yo‘l<\/span><strong id=\"verticalA\">200 J<\/strong><\/div>\n<div class=\"metric\"><span>Qiya yo‘l ishi<\/span><strong id=\"inclineA\">200 J<\/strong><\/div>\n<\/div><p style=\"color:#dce5ff;font-size:14px;margin-top:18px\">Ko‘ring: qiya tekislikda kuch kamayadi, lekin bosib o‘tiladigan yo‘l ortadi. Ideal holatda bajarilgan ish bir xil.<\/p><\/div>\n<\/div><div class=\"footer\">06 / 16<\/div>\n<\/section>\n\n<section class=\"slide\">\n<div class=\"kicker\">Hisoblash<\/div><h2>Masala: yukni qiya tekislik bo‘ylab ko‘tarish<\/h2>\n<div class=\"grid2\">\n<div class=\"card dark\"><h3>Berilgan<\/h3><p style=\"font-size:24px;color:white\">m = 10 kg<br>h = 2 m<br>l = 5 m<br>g = 10 m/s²<\/p><p style=\"color:#dce5ff\">Ishqalanish yo‘q, harakat bir tekis.<\/p><\/div>\n<div class=\"card\"><h3>Yechish<\/h3><p><b>1. Tortish kuchi<\/b><\/p><div class=\"formula\">F = mgh/l = 40 N<\/div><p><b>2. Tortish kuchining ishi<\/b><\/p><div class=\"formula blue\">A = Fl = 200 J<\/div><p><b>3. Potensial energiya ortishi<\/b><\/p><div class=\"formula green\">ΔEₚ = mgh = 200 J<\/div><\/div>\n<\/div><div class=\"callout\">Ideal holatda sarflangan ish foydali ishga teng: A = ΔEp = 200 J.<\/div><div class=\"footer\">07 / 16<\/div>\n<\/section>\n\n<section class=\"slide\">\n<div class=\"kicker\">2-reja<\/div><h2>Qiya tekislikning foydali ish koeffitsiyenti (FIK)<\/h2>\n<div class=\"grid2\">\n<div class=\"card\"><h3>Umumiy formula<\/h3><div class=\"formula\">η = A<sub>foydali<\/sub> / A<sub>sarflangan<\/sub> × 100%<\/div><p>FIK — sarflangan ishning qaysi qismi foydali natijaga aylanganini bildiradi.<\/p><\/div>\n<div class=\"card\"><h3>Qiya tekislik uchun<\/h3><div class=\"formula blue\">η = mgh / Fl × 100%<\/div><ul><li><b>mgh<\/b> — potensial energiya ortishi.<\/li><li><b>Fl<\/b> — tortish kuchining ishi.<\/li><li>Ideal holatda η = 100%.<\/li><li>Ishqalanish bo‘lsa, odatda η &lt; 100%.<\/li><\/ul><\/div>\n<\/div><div class=\"footer\">08 / 16<\/div>\n<\/section>\n\n<section class=\"slide\">\n<div class=\"kicker\">Energiya balansi<\/div><h2>FIK animatsiyasi: energiya qayerga ketadi?<\/h2>\n<div class=\"grid2\">\n<div class=\"card\"><h3>Sarflangan ish<\/h3><div class=\"formula blue\">250 J<\/div><div style=\"height:28px;background:#e4e9f6;border-radius:8px;overflow:hidden\"><div style=\"height:100%;width:100%;background:#2d5dbe\"><\/div><\/div><p class=\"note\">Jami kiruvchi energiya<\/p><\/div>\n<div class=\"card\"><h3>Energiya taqsimoti<\/h3><p><b style=\"color:#2aa475\">200 J — foydali<\/b><\/p><div style=\"height:26px;background:#e4e9f6;border-radius:8px;overflow:hidden\"><div style=\"height:100%;width:80%;background:#2aa475\"><\/div><\/div><p style=\"margin-top:15px\"><b style=\"color:#f49d42\">50 J — yo‘qotish<\/b><\/p><div style=\"height:26px;background:#e4e9f6;border-radius:8px;overflow:hidden\"><div style=\"height:100%;width:20%;background:#f49d42\"><\/div><\/div><\/div>\n<\/div>\n<div class=\"callout\" style=\"margin-top:20px\">η = 200 / 250 × 100% = <b>80%<\/b>. Yo‘qotishlarning asosiy qismi ishqalanish tufayli issiqlikka aylanadi.<\/div><div class=\"footer\">09 / 16<\/div>\n<\/section>\n\n<section class=\"slide\">\n<div class=\"kicker\">Simulyatsiya 2<\/div><h2>FIK kalkulyatori<\/h2>\n<div class=\"grid2\">\n<div class=\"card\">\n<h3>Qiymatlarni kiriting<\/h3>\n<div class=\"grid2\">\n<div><label for=\"mcalc\">Massa m (kg)<\/label><input id=\"mcalc\" type=\"number\" min=\"0.1\" step=\"0.1\" value=\"10\" oninput=\"calcFik()\"><\/div>\n<div><label for=\"hcalc\">Balandlik h (m)<\/label><input id=\"hcalc\" type=\"number\" min=\"0.1\" step=\"0.1\" value=\"2\" oninput=\"calcFik()\"><\/div>\n<div><label for=\"lcalc\">Uzunlik l (m)<\/label><input id=\"lcalc\" type=\"number\" min=\"0.1\" step=\"0.1\" value=\"5\" oninput=\"calcFik()\"><\/div>\n<div><label for=\"fcalc\">Kuch F (N)<\/label><input id=\"fcalc\" type=\"number\" min=\"0.1\" step=\"0.1\" value=\"50\" oninput=\"calcFik()\"><\/div>\n<\/div><label for=\"gcalc\">g (m/s²)<\/label><input id=\"gcalc\" type=\"number\" min=\"1\" step=\"0.1\" value=\"10\" oninput=\"calcFik()\">\n<\/div>\n<div class=\"card dark\"><h3>Natija<\/h3><div class=\"metric\"><span>Foydali ish<\/span><strong id=\"usefulWork\">200 J<\/strong><\/div><div class=\"metric\" style=\"margin-top:10px\"><span>Sarflangan ish<\/span><strong id=\"inputWork\">250 J<\/strong><\/div><div class=\"metric\" style=\"margin-top:10px\"><span>FIK<\/span><strong id=\"efficiency\">80%<\/strong><\/div><p id=\"calcWarning\" style=\"color:#ffe1a8;font-size:14px;margin-top:14px\"><\/p><\/div>\n<\/div><p class=\"note\">Modelning to‘g‘ri ishlashi uchun barcha qiymatlar musbat bo‘lishi kerak. Ideal holatda F = mgh/l.<\/p><div class=\"footer\">10 / 16<\/div>\n<\/section>\n\n<section class=\"slide\">\n<div class=\"kicker\">3-reja<\/div><h2>Ishqalanish kuchining FIKga ta’siri<\/h2>\n<div class=\"grid2\">\n<div class=\"card\"><h3>Bir tekis yuqoriga harakat<\/h3><div class=\"formula\">F = mg sin α + μmg cos α<\/div><p>Bu formula qiya sirt bo‘ylab ishqalanish koeffitsiyenti bir xil bo‘lgan holat uchun.<\/p><ul><li>μ — ishqalanish koeffitsiyenti.<\/li><li>Ishqalanish harakatga qarshi yo‘naladi.<\/li><li>μ ortsa, kerakli tortish kuchi ortadi.<\/li><\/ul><\/div>\n<div class=\"card\"><h3>Taqqoslang<\/h3><div class=\"grid2\"><div class=\"metric\"><span>Silliq sirt<\/span><strong style=\"color:#2aa475\">Kam qarshilik<\/strong><\/div><div class=\"metric\"><span>G‘adir-budur sirt<\/span><strong style=\"color:#f49d42\">Ko‘p qarshilik<\/strong><\/div><\/div><p style=\"margin-top:20px\">Bir xil yukni g‘adir-budur sirt bo‘ylab tortish uchun ko‘proq kuch va ish talab etiladi.<\/p><div class=\"callout\">Odatda ishqalanish ortishi bilan FIK kamayadi.<\/div><\/div>\n<\/div><div class=\"footer\">11 / 16<\/div>\n<\/section>\n\n<section class=\"slide\">\n<div class=\"kicker\">Simulyatsiya 3<\/div><h2>Ishqalanishni o‘zgartirish<\/h2>\n<div class=\"grid2\">\n<div class=\"card\">\n<h3>Model parametrlari<\/h3>\n<label for=\"mu\">Ishqalanish koeffitsiyenti μ: <span id=\"muLabel\">0.20<\/span><\/label><input id=\"mu\" type=\"range\" min=\"0\" max=\"0.8\" step=\"0.05\" value=\"0.2\" oninput=\"updateFriction()\">\n<label for=\"angle\">Qiyalik burchagi α: <span id=\"angleLabel\">25<\/span>°<\/label><input id=\"angle\" type=\"range\" min=\"10\" max=\"45\" step=\"1\" value=\"25\" oninput=\"updateFriction()\">\n<div class=\"callout\">Namuna: m = 10 kg, g = 10 m/s², l = 5 m.<\/div>\n<\/div>\n<div class=\"card dark\"><h3>Hisoblangan qiymatlar<\/h3><div class=\"grid2\">\n<div class=\"metric\"><span>Tortish kuchi<\/span><strong id=\"fricForce\">60.5 N<\/strong><\/div>\n<div class=\"metric\"><span>Ishqalanish kuchi<\/span><strong id=\"fricForceOnly\">17.9 N<\/strong><\/div>\n<div class=\"metric\"><span>Sarflangan ish<\/span><strong id=\"fricWork\">302.5 J<\/strong><\/div>\n<div class=\"metric\"><span>FIK<\/span><strong id=\"fricEff\">65.9%<\/strong><\/div>\n<\/div><p style=\"color:#dce5ff;font-size:13px;margin-top:12px\">Soddalashtirilgan model: jism tekislik bo‘ylab bir tekis harakatlanadi.<\/p><\/div>\n<\/div><div class=\"footer\">12 / 16<\/div>\n<\/section>\n\n<section class=\"slide\">\n<div class=\"kicker\">Hayot bilan bog‘lash<\/div><h2>Qiya tekislikning amaliy ahamiyati<\/h2>\n<div class=\"grid2\">\n<div class=\"card\"><h3>♿ Pandus<\/h3><p>Aravachalar va yuk aravalarini balandlikka olib chiqishni qulaylashtiradi.<\/p><\/div>\n<div class=\"card\"><h3>🚚 Yuk rampasi<\/h3><p>Yukni mashinaga kamroq kuch bilan ko‘tarishga yordam beradi.<\/p><\/div>\n<div class=\"card\"><h3>⛰ Tog‘ yo‘li<\/h3><p>Yo‘l uzayadi, lekin qiyalik kamayadi va ko‘tarilish qulaylashadi.<\/p><\/div>\n<div class=\"card\"><h3>⚙ Konveyer<\/h3><p>Materiallarni balandlikka uzluksiz ko‘chirishda qo‘llanadi.<\/p><\/div>\n<\/div><div class=\"callout\" style=\"margin-top:18px\">Amaliy loyihalashda qiyalik, ishqalanish, mustahkamlik va xavfsizlik hisobga olinadi.<\/div><div class=\"footer\">13 / 16<\/div>\n<\/section>\n\n<section class=\"slide\">\n<div class=\"kicker\">Tajriba<\/div><h2>Virtual laboratoriya mashg‘uloti<\/h2>\n<div class=\"grid2\">\n<div class=\"card\"><h3>Ish tartibi<\/h3><ol><li>Yuk massasini aniqlang.<\/li><li>Qiya tekislikning h va l qiymatlarini o‘lchang.<\/li><li>Dinamometr bilan F ni o‘lchang.<\/li><li>A<sub>foydali<\/sub> = mgh ni hisoblang.<\/li><li>A<sub>sarflangan<\/sub> = Fl ni toping.<\/li><li>FIKni hisoblang va sirtlarni taqqoslang.<\/li><\/ol><\/div>\n<div class=\"card\"><h3>Natijalar jadvali<\/h3><table><thead><tr><th>№<\/th><th>m (kg)<\/th><th>h (m)<\/th><th>l (m)<\/th><th>F (N)<\/th><th>FIK (%)<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>—<\/td><\/tr><tr><td>2<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>—<\/td><\/tr><tr><td>3<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>—<\/td><\/tr><\/tbody><\/table><p class=\"note\" style=\"margin-top:15px\">Muhokama: o‘lchov xatolari va ishqalanish natijaga qanday ta’sir qiladi?<\/p><\/div>\n<\/div><div class=\"footer\">14 / 16<\/div>\n<\/section>\n\n<section class=\"slide\">\n<div class=\"kicker\">Mustahkamlash<\/div><h2>Test savollari<\/h2>\n<div class=\"grid2\">\n<div class=\"card\">\n<p><b>1.<\/b> Mexanik ishning SI birligi qaysi?<br>A) N  B) J  C) W  D) kg<\/p>\n<p><b>2.<\/b> Ideal qiya tekislikda qaysi tenglik to‘g‘ri?<br>A) Fl = mgh  B) F = mgh·l  C) Fl = mg/h  D) A = F/l<\/p>\n<p><b>3.<\/b> FIK qanday topiladi?<br>A) Sarflangan/foydali ×100%<br>B) F·s<br>C) Foydali/sarflangan ×100%<br>D) m/h<\/p>\n<\/div>\n<div class=\"card\">\n<p><b>4.<\/b> Ishqalanish ortsa, odatda FIK…<br>A) ortadi  B) kamayadi  C) o‘zgarmaydi  D) 100% bo‘ladi<\/p>\n<p><b>5.<\/b> Qaysi biri qiya tekislikka misol?<br>A) G‘ildirak  B) Richag  C) Blok  D) Pandus<\/p>\n<div class=\"callout\"><b>Javoblar kaliti:<\/b> 1—B, 2—A, 3—C, 4—B, 5—D.<\/div>\n<p><b>Fikrlash savoli:<\/b> Nega rampa uzunroq bo‘lsa ham yukni ko‘tarish qulayroq bo‘lishi mumkin?<\/p>\n<\/div>\n<\/div><div class=\"footer\">15 / 16<\/div>\n<\/section>\n\n<section class=\"slide cover\">\n<div class=\"kicker\" style=\"color:#6ce0ee\">Yakun<\/div><h2 style=\"color:white;font-size:40px\">Xulosa<\/h2>\n<div class=\"grid2\">\n<div class=\"card dark\"><h3>Asosiy formulalar<\/h3><div class=\"formula\" style=\"color:#6ce0ee\">Fl = mgh<\/div><div class=\"formula\" style=\"color:#6ce0ee\">η = Afoydali / Asarflangan × 100%<\/div><\/div>\n<div class=\"card dark\"><h3>Esda tuting<\/h3><p style=\"color:white\">Qiya tekislik kuchni kamaytiradi, lekin yo‘lni uzaytiradi.<\/p><p style=\"color:white\">Ishqalanish sarflangan ishni oshiradi va FIKni kamaytiradi.<\/p><\/div>\n<\/div>\n<p style=\"color:#dce5ff;margin-top:22px\">Foydalanilgan manbalar: maktab fizika darsligi; PhET Interactive Simulations — phet.colorado.edu; GeoGebra — geogebra.org.<\/p>\n<h3 style=\"color:#6ce0ee;font-size:25px\">E’tiboringiz uchun rahmat!<\/h3><div class=\"footer\" style=\"color:#cbd5ee\">16 / 16<\/div>\n<\/section>\n\n<div class=\"progress\"><span id=\"progressBar\"><\/span><\/div>\n<div class=\"controls\">\n<button class=\"secondary\" id=\"prev\" onclick=\"move(-1)\">← Oldingi<\/button>\n<span class=\"slide-num\" id=\"slideNum\">1 / 16<\/span>\n<button id=\"next\" onclick=\"move(1)\">Keyingi →<\/button>\n<button class=\"secondary\" onclick=\"window.print()\">PDF / Chop etish<\/button>\n<\/div>\n<\/div>\n<script>\nlet current=0;\nconst slides=[...document.querySelectorAll('.slide')];\nfunction showSlide(i){current=Math.max(0,Math.min(slides.length-1,i));slides.forEach((s,n)=>s.classList.toggle('active',n===current));document.getElementById('slideNum').textContent=(current+1)+' / '+slides.length;document.getElementById('progressBar').style.width=((current+1)/slides.length*100)+'%';document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===slides.length-1}\nfunction move(d){showSlide(current+d)}\ndocument.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){move(1)}else if(e.key==='ArrowLeft'){move(-1)}});\nfunction updateSim1(){let m=+document.getElementById('mass1').value,h=+document.getElementById('height1').value,l=+document.getElementById('length1').value;document.getElementById('massLabel').textContent=m;document.getElementById('heightLabel').textContent=h.toFixed(1);document.getElementById('lengthLabel').textContent=l.toFixed(1);document.getElementById('verticalF').textContent=(m*10).toFixed(1)+' N';document.getElementById('inclineF').textContent=(m*10*h/l).toFixed(1)+' N';document.getElementById('verticalA').textContent=(m*10*h).toFixed(1)+' J';document.getElementById('inclineA').textContent=(m*10*h).toFixed(1)+' J'}\nfunction calcFik(){let m=+document.getElementById('mcalc').value,h=+document.getElementById('hcalc').value,l=+document.getElementById('lcalc').value,F=+document.getElementById('fcalc').value,g=+document.getElementById('gcalc').value;let useful=m*g*h,input=F*l;document.getElementById('usefulWork').textContent=Number.isFinite(useful)?useful.toFixed(1)+' J':'—';document.getElementById('inputWork').textContent=Number.isFinite(input)?input.toFixed(1)+' J':'—';let eff=input>0?useful/input*100:NaN;document.getElementById('efficiency').textContent=Number.isFinite(eff)?eff.toFixed(1)+'%':'—';let warn='';if([m,h,l,F,g].some(v=>v<=0)||![m,h,l,F,g].every(Number.isFinite)){warn='Barcha qiymatlar musbat bo‘lishi kerak.'}else if(eff>100.01){warn='Ogohlantirish: natija 100% dan katta. Kiritilgan qiymatlarni yoki model shartlarini tekshiring.'}else if(F+1e-6<m*g*h/l){warn='Bu kuch ishqalanishsiz modelda ham bir tekis ko‘tarish uchun yetarli emas.'}document.getElementById('calcWarning').textContent=warn}\nfunction updateFriction(){let mu=+document.getElementById('mu').value,deg=+document.getElementById('angle').value,rad=deg*Math.PI/180,m=10,g=10,l=5,h=l*Math.sin(rad);let normal=m*g*Math.cos(rad),fric=mu*normal,F=m*g*Math.sin(rad)+fric,input=F*l,useful=m*g*h,eff=useful/input*100;document.getElementById('muLabel').textContent=mu.toFixed(2);document.getElementById('angleLabel').textContent=deg;document.getElementById('fricForce').textContent=F.toFixed(1)+' N';document.getElementById('fricForceOnly').textContent=fric.toFixed(1)+' N';document.getElementById('fricWork').textContent=input.toFixed(1)+' J';document.getElementById('fricEff').textContent=eff.toFixed(1)+'%'}\nshowSlide(0);updateSim1();calcFik();updateFriction();\n<\/script>\n<\/body>\n<\/html>"}, {"id": "10-mavzu", "n": "10", "t": "Masalalar: qiya tekislik, ish va FIK", "d": "3 ta simulyatsiya: harakat, FIK, ishqalanish", "k": "Masala", "html": "<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Masalalar yechish — Qiya tekislik, ish va FIK<\/title>\n<style>\n:root{--navy:#101a3a;--blue:#3156d9;--violet:#7656e8;--cyan:#32c5d2;--ink:#17213c;--muted:#68738c;--paper:#f4f6fc;--white:#fff;--line:#e1e6f2;--green:#159b72;--orange:#ed9a32;--red:#d94c63}\n*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",sans-serif;line-height:1.55}\nbutton,input{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 16px;font-weight:750;transition:.18s}button:hover{transform:translateY(-1px);filter:brightness(1.04)}button:focus-visible,input:focus-visible{outline:3px solid #8e9dff;outline-offset:2px}\n.topbar{position:sticky;top:0;z-index:20;background:rgba(16,26,58,.96);backdrop-filter:blur(12px);color:white;padding:10px 4vw;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{font-weight:850;letter-spacing:.2px}.brand span{color:#82e6eb}.topnav{display:flex;gap:7px;flex-wrap:wrap}.topnav button{background:transparent;color:#dce4ff;padding:8px 10px;font-size:.86rem}.topnav button.active,.topnav button:hover{background:#2b3865;color:white}\n.hero{background:radial-gradient(circle at 85% 20%,#755be7 0,transparent 32%),linear-gradient(120deg,#111a3a,#263f8d 72%,#2a7eaa);color:white;padding:55px 6vw 48px;position:relative;overflow:hidden}.hero:after{content:\"\";position:absolute;width:300px;height:300px;border:1px solid #ffffff25;border-radius:50%;right:5%;top:12%;box-shadow:0 0 0 35px #ffffff08,0 0 0 70px #ffffff05}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:.78rem;color:#b8f7f2;font-weight:850}.hero h1{font-size:clamp(2rem,4vw,3.5rem);line-height:1.1;max-width:900px;margin:12px 0}.hero p{max-width:760px;color:#e0e7ff;font-size:1.08rem}.hero-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}.hero-tags span{border:1px solid #ffffff45;background:#ffffff12;padding:7px 12px;border-radius:99px;font-size:.88rem}\nmain{max-width:1240px;margin:auto;padding:26px 22px 70px}.section{margin:30px 0 42px;scroll-margin-top:82px}.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:18px}.section-head h2{font-size:clamp(1.45rem,2.5vw,2rem);margin:0;color:var(--navy)}.section-head p{margin:5px 0 0;color:var(--muted)}.number{display:inline-grid;place-items:center;width:38px;height:38px;background:#e6eaff;color:var(--blue);border-radius:12px;margin-right:9px;font-weight:900}\n.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}.card{grid-column:span 12;background:var(--white);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 8px 26px #2034660a;min-width:0}.half{grid-column:span 6}.third{grid-column:span 4}.card h3{margin:0 0 12px;font-size:1.15rem;color:var(--navy)}.muted{color:var(--muted)}.formula{background:#f0f3ff;border:1px solid #dce3ff;border-radius:13px;padding:12px 15px;font-size:1.08rem;font-weight:800;color:#243a9b;margin:10px 0}.formula small{display:block;font-weight:500;color:#657098;font-size:.8rem;margin-top:3px}.pill{display:inline-block;padding:4px 9px;border-radius:99px;background:#e6faf5;color:#087c5c;font-size:.78rem;font-weight:800}.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.control{background:#f8f9ff;border:1px solid var(--line);padding:11px 12px;border-radius:13px}.control label{display:flex;justify-content:space-between;gap:8px;font-weight:750;font-size:.88rem;margin-bottom:7px}.control output{color:var(--blue);font-variant-numeric:tabular-nums}.control input[type=range]{width:100%;accent-color:var(--violet)}.control input[type=number]{width:100%;border:1px solid #cfd7ea;border-radius:8px;padding:8px;background:white}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}.primary{background:linear-gradient(110deg,var(--blue),var(--violet));color:white}.secondary{background:#e9edff;color:#2b3eaa}.darkbtn{background:var(--navy);color:white}.ghost{background:#f0f2f8;color:#3b4660}.visual{background:linear-gradient(150deg,#f7f9ff,#edf2ff);border:1px solid #e1e7fa;border-radius:16px;overflow:hidden;min-height:260px;position:relative}.visual canvas{display:block;width:100%;height:290px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:13px}.stat{border:1px solid var(--line);border-radius:13px;padding:12px;background:#fff}.stat span{display:block;color:var(--muted);font-size:.79rem}.stat strong{display:block;font-size:1.12rem;margin-top:3px;color:var(--navy);font-variant-numeric:tabular-nums}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:10px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}.steps{counter-reset:step;list-style:none;padding:0}.steps li{counter-increment:step;padding:10px 12px 10px 44px;position:relative;border-bottom:1px solid var(--line)}.steps li:before{content:counter(step);position:absolute;left:0;top:9px;background:#e7eaff;color:#2f49bd;border-radius:9px;width:29px;height:29px;display:grid;place-items:center;font-weight:850}.answer{background:#eafaf4;border:1px solid #c4f0df;padding:13px 15px;border-radius:12px;margin-top:12px}.warning{background:#fff6e8;border:1px solid #ffe0a7;color:#7d5314;padding:12px 14px;border-radius:12px;margin-top:12px}.problem{border:1px solid var(--line);border-radius:16px;padding:17px;margin:12px 0;background:#fff}.problem summary{cursor:pointer;font-weight:800;color:var(--navy)}.problem .content{padding-top:12px}.small{font-size:.88rem}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{text-align:left;border-bottom:1px solid var(--line);padding:10px 9px}th{background:#f5f7ff;color:#3b4770}.quiz-q{padding:17px 0;border-bottom:1px solid var(--line)}.quiz-q p{font-weight:800;margin:0 0 10px}.option{display:block;border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin:7px 0;cursor:pointer}.option:has(input:checked){background:#eef1ff;border-color:#9baaff}.feedback{font-size:.86rem;margin-top:7px}.correct{color:var(--green);font-weight:800}.incorrect{color:var(--red);font-weight:800}.barrow{display:grid;grid-template-columns:100px 1fr 60px;gap:9px;align-items:center;margin:10px 0;font-size:.87rem}.bar{height:14px;border-radius:20px;background:#edf0fa;overflow:hidden}.bar i{display:block;height:100%;border-radius:20px;transition:width .3s}.footer{text-align:center;padding:25px;color:#79839c;font-size:.85rem}.progress{height:4px;background:#ffffff25}.progress i{display:block;height:100%;width:0;background:#6fe5e7;transition:width .2s}.key{font-size:.78rem;background:#eef1f9;padding:2px 6px;border-radius:5px}\n@media(max-width:850px){.half,.third{grid-column:span 12}.topbar{align-items:flex-start;flex-direction:column}.topnav{width:100%}.hero{padding:38px 22px}.hero:after{right:-130px}.controls{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.section-head{align-items:flex-start;flex-direction:column}}\n@media(max-width:480px){main{padding:15px 12px 45px}.card{padding:15px;border-radius:16px}.hero h1{font-size:2rem}.topnav button{font-size:.78rem;padding:7px}.stats{grid-template-columns:1fr 1fr}.stat strong{font-size:1rem}.visual canvas{height:245px}}\n<\/style>\n<\/head>\n<body>\n<div class=\"progress\"><i id=\"scrollProgress\"><\/i><\/div>\n<header class=\"topbar\">\n  <div class=\"brand\">PHY<span>SIM<\/span> · Fizika laboratoriyasi<\/div>\n  <nav class=\"topnav\" aria-label=\"Bo‘limlar\">\n    <button class=\"active\" data-jump=\"nazariya\">Nazariya<\/button><button data-jump=\"sim1\">Simulyatsiya 1<\/button><button data-jump=\"sim2\">FIK laboratoriyasi<\/button><button data-jump=\"sim3\">Ishqalanish<\/button><button data-jump=\"masalalar\">Masalalar<\/button><button data-jump=\"test\">Test<\/button>\n  <\/nav>\n<\/header>\n<section class=\"hero\">\n  <div class=\"eyebrow\">Interaktiv o‘quv resursi · 9–10-sinf<\/div>\n  <h1>Qiya tekislik: harakat, ish va FIK<\/h1>\n  <p>Formulalarni takrorlang, kuchlar yo‘nalishini kuzating, virtual tajribalar o‘tkazing va masalalarni bosqichma-bosqich yeching.<\/p>\n  <div class=\"hero-tags\"><span>◈ 3 ta simulyatsiya<\/span><span>∑ Avtomatik hisoblash<\/span><span>✓ 8 ta test<\/span><span>▱ Mobilga mos<\/span><\/div>\n<\/section>\n<main>\n<section class=\"section\" id=\"nazariya\">\n <div class=\"section-head\"><div><h2><span class=\"number\">01<\/span>Nazariy formulalarni takrorlash<\/h2><p>Asosiy tushunchalar, belgilar va formulalar.<\/p><\/div><\/div>\n <div class=\"grid\">\n  <article class=\"card half\"><h3>Qiya tekislik geometriyasi<\/h3><p>Qiya tekislik yukni kichikroq kuch bilan ko‘tarishga yordam beradi, lekin bosib o‘tiladigan yo‘l uzayadi.<\/p>\n   <div class=\"formula\">sin α = h/s <small>h — balandlik (m), s — tekislik uzunligi (m)<\/small><\/div>\n   <div class=\"formula\">cos α = √(s² − h²) / s <small>Bu yerda s ≥ h bo‘lishi kerak.<\/small><\/div>\n   <div class=\"formula\">h = s · sin α<\/div>\n  <\/article>\n  <article class=\"card half\"><h3>Ish va foydali ish koeffitsiyenti<\/h3>\n   <div class=\"formula\">A = F · s · cos θ <small>θ — kuch bilan siljish orasidagi burchak.<\/small><\/div>\n   <div class=\"formula\">A<sub>f<\/sub> = mgh <small>Foydali ish; m (kg), g (N/kg), h (m).<\/small><\/div>\n   <div class=\"formula\">η = (A<sub>f<\/sub> / A<sub>t<\/sub>) · 100% <small>A<sub>t<\/sub> — to‘liq bajarilgan ish.<\/small><\/div>\n  <\/article>\n  <article class=\"card half\"><h3>Kuchlar va muvozanat<\/h3>\n   <div class=\"formula\">F = mg · sin α <small>Ishqalanishsiz, tekislik bo‘ylab bir tekis ko‘tarishda.<\/small><\/div>\n   <div class=\"formula\">N = mg · cos α<\/div>\n   <div class=\"formula\">F<sub>ishq<\/sub> = μN <small>μ — sirpanish ishqalanish koeffitsiyenti.<\/small><\/div>\n   <p class=\"small muted\">Ishqalanish bo‘lsa va yuk bir tekis yuqoriga harakatlansa: F = mg sin α + μmg cos α.<\/p>\n  <\/article>\n  <article class=\"card half\"><h3>Belgilar va o‘lchov birliklari<\/h3>\n   <div class=\"tablewrap\"><table><thead><tr><th>Belgi<\/th><th>Ma’nosi<\/th><th>Birlik<\/th><\/tr><\/thead><tbody>\n   <tr><td>m<\/td><td>massa<\/td><td>kg<\/td><\/tr><tr><td>F, N<\/td><td>kuch, tayanch reaksiya<\/td><td>N<\/td><\/tr><tr><td>s, h<\/td><td>yo‘l, balandlik<\/td><td>m<\/td><\/tr><tr><td>A<\/td><td>mexanik ish<\/td><td>J<\/td><\/tr><tr><td>μ, η<\/td><td>ishqalanish koeffitsiyenti, FIK<\/td><td>o‘lchovsiz, %<\/td><\/tr>\n   <\/tbody><\/table><\/div>\n   <p class=\"small muted\">Hisoblashlarda, agar boshqacha berilmagan bo‘lsa, g = 10 N/kg deb olinadi.<\/p>\n  <\/article>\n <\/div>\n<\/section>\n\n<section class=\"section\" id=\"sim1\">\n <div class=\"section-head\"><div><h2><span class=\"number\">02<\/span>Simulyatsiya 1 — Qiya tekislik bo‘ylab harakat<\/h2><p>Parametrlarni o‘zgartiring va jismga ta’sir etuvchi kuchlarni kuzating.<\/p><\/div><span class=\"pill\">Interaktiv model<\/span><\/div>\n <div class=\"grid\">\n  <article class=\"card half\"><h3>Parametrlar<\/h3><div class=\"controls\">\n   <div class=\"control\"><label for=\"m1\">Massa <output id=\"m1o\">10 kg<\/output><\/label><input id=\"m1\" type=\"range\" min=\"1\" max=\"50\" value=\"10\"><\/div>\n   <div class=\"control\"><label for=\"s1\">Tekislik uzunligi <output id=\"s1o\">5 m<\/output><\/label><input id=\"s1\" type=\"range\" min=\"2\" max=\"10\" step=\".5\" value=\"5\"><\/div>\n   <div class=\"control\"><label for=\"h1\">Balandlik <output id=\"h1o\">1 m<\/output><\/label><input id=\"h1\" type=\"range\" min=\".5\" max=\"4.5\" step=\".1\" value=\"1\"><\/div>\n   <div class=\"control\"><label for=\"mu1\">Ishqalanish μ <output id=\"mu1o\">0.00<\/output><\/label><input id=\"mu1\" type=\"range\" min=\"0\" max=\".5\" step=\".01\" value=\"0\"><\/div>\n  <\/div><div class=\"warning\" id=\"geomWarning\" hidden>Balandlik uzunlikdan katta bo‘la olmaydi. Qiymatlar avtomatik moslashtiriladi.<\/div>\n  <div class=\"actions\"><button class=\"primary\" id=\"start1\">▶ Boshlash<\/button><button class=\"secondary\" id=\"pause1\">Ⅱ Pauza<\/button><button class=\"ghost\" id=\"reset1\">↺ Qayta boshlash<\/button><\/div>\n  <div class=\"stats\"><div class=\"stat\"><span>Qiyalik burchagi<\/span><strong id=\"ang1\">11.5°<\/strong><\/div><div class=\"stat\"><span>Kerakli tortish kuchi<\/span><strong id=\"force1\">— N<\/strong><\/div><div class=\"stat\"><span>Jism balandligi<\/span><strong id=\"height1\">0.0 m<\/strong><\/div><\/div>\n  <\/article>\n  <article class=\"card half\"><h3>Harakat animatsiyasi<\/h3><div class=\"visual\"><canvas id=\"canvas1\" aria-label=\"Qiya tekislikda yuk va kuchlar tasviri\"><\/canvas><\/div><div class=\"legend\"><span><i class=\"dot\" style=\"background:#3156d9\"><\/i>Tortish kuchi<\/span><span><i class=\"dot\" style=\"background:#d94c63\"><\/i>Og‘irlik kuchi<\/span><span><i class=\"dot\" style=\"background:#159b72\"><\/i>Tayanch reaksiya<\/span><span><i class=\"dot\" style=\"background:#ed9a32\"><\/i>Ishqalanish<\/span><\/div><p class=\"small muted\">Modelda yuk bir tekis yuqoriga tortiladi; vektorlar sxematik tarzda ko‘rsatilgan.<\/p><\/article>\n <\/div>\n<\/section>\n\n<section class=\"section\" id=\"sim2\">\n <div class=\"section-head\"><div><h2><span class=\"number\">03<\/span>Simulyatsiya 2 — FIKni tajribada aniqlash<\/h2><p>Massa, geometriya va tortuvchi kuchni o‘zgartirib, foydali va to‘liq ishni solishtiring.<\/p><\/div><\/div>\n <div class=\"grid\">\n  <article class=\"card half\"><h3>Tajriba sozlamalari<\/h3><div class=\"controls\">\n   <div class=\"control\"><label for=\"m2\">Massa <output id=\"m2o\">10 kg<\/output><\/label><input id=\"m2\" type=\"range\" min=\"1\" max=\"60\" value=\"10\"><\/div>\n   <div class=\"control\"><label for=\"s2\">Tekislik uzunligi <output id=\"s2o\">5 m<\/output><\/label><input id=\"s2\" type=\"range\" min=\"2\" max=\"12\" step=\".5\" value=\"5\"><\/div>\n   <div class=\"control\"><label for=\"h2\">Balandlik <output id=\"h2o\">1 m<\/output><\/label><input id=\"h2\" type=\"range\" min=\".5\" max=\"5\" step=\".1\" value=\"1\"><\/div>\n   <div class=\"control\"><label for=\"f2\">Tortuvchi kuch <output id=\"f2o\">30 N<\/output><\/label><input id=\"f2\" type=\"range\" min=\"10\" max=\"500\" step=\"5\" value=\"30\"><\/div>\n  <\/div><div id=\"warn2\" class=\"warning\" hidden>Geometriya yoki kuch qiymatini tekshiring: foydali ish to‘liq ishdan katta bo‘lmasligi kerak.<\/div>\n  <div class=\"stats\"><div class=\"stat\"><span>Foydali ish<\/span><strong id=\"af2\">100 J<\/strong><\/div><div class=\"stat\"><span>To‘liq ish<\/span><strong id=\"at2\">150 J<\/strong><\/div><div class=\"stat\"><span>FIK<\/span><strong id=\"eta2\">66.7%<\/strong><\/div><\/div>\n  <div class=\"actions\"><button class=\"secondary\" id=\"addTrial\">＋ Natijani jadvalga qo‘shish<\/button><button class=\"ghost\" id=\"clearTrials\">Jadvalni tozalash<\/button><\/div><\/article>\n  <article class=\"card half\"><h3>Ishlar taqqoslanishi<\/h3><div id=\"bars2\"><\/div><div class=\"formula\" id=\"conclusion2\">FIK — foydali ishning to‘liq ishga nisbati.<\/div><p class=\"small muted\">Ishqalanishsiz ideal holatda η = 100%. Real tajribada energiyaning bir qismi issiqlik va boshqa yo‘qotishlarga ketadi.<\/p><\/article>\n  <article class=\"card\"><h3>Tajriba natijalari jadvali<\/h3><div class=\"tablewrap\"><table><thead><tr><th>#<\/th><th>m (kg)<\/th><th>s (m)<\/th><th>h (m)<\/th><th>F (N)<\/th><th>A<sub>f<\/sub> (J)<\/th><th>A<sub>t<\/sub> (J)<\/th><th>FIK (%)<\/th><\/tr><\/thead><tbody id=\"trialRows\"><tr><td colspan=\"8\" class=\"muted\">Hozircha natija yo‘q. “Natijani jadvalga qo‘shish” tugmasini bosing.<\/td><\/tr><\/tbody><\/table><\/div><\/article>\n <\/div>\n<\/section>\n\n<section class=\"section\" id=\"sim3\">\n <div class=\"section-head\"><div><h2><span class=\"number\">04<\/span>Simulyatsiya 3 — Ishqalanishning ta’siri<\/h2><p>Ideal va ishqalanishli holatdagi kuch, ish va FIKni taqqoslang.<\/p><\/div><\/div>\n <div class=\"grid\">\n  <article class=\"card half\"><h3>Parametrlar<\/h3><div class=\"controls\">\n   <div class=\"control\"><label for=\"m3\">Massa <output id=\"m3o\">50 kg<\/output><\/label><input id=\"m3\" type=\"range\" min=\"1\" max=\"100\" value=\"50\"><\/div>\n   <div class=\"control\"><label for=\"s3\">Uzunlik <output id=\"s3o\">6 m<\/output><\/label><input id=\"s3\" type=\"range\" min=\"2\" max=\"12\" step=\".5\" value=\"6\"><\/div>\n   <div class=\"control\"><label for=\"h3\">Balandlik <output id=\"h3o\">2 m<\/output><\/label><input id=\"h3\" type=\"range\" min=\".5\" max=\"5\" step=\".1\" value=\"2\"><\/div>\n   <div class=\"control\"><label for=\"mu3\">Ishqalanish μ <output id=\"mu3o\">0.20<\/output><\/label><input id=\"mu3\" type=\"range\" min=\"0\" max=\".6\" step=\".01\" value=\".2\"><\/div>\n  <\/div><div class=\"stats\"><div class=\"stat\"><span>Tayanch reaksiya N<\/span><strong id=\"normal3\">471.4 N<\/strong><\/div><div class=\"stat\"><span>Ishqalanish kuchi<\/span><strong id=\"fric3\">94.3 N<\/strong><\/div><div class=\"stat\"><span>Tortuvchi kuch<\/span><strong id=\"pull3\">260.9 N<\/strong><\/div><div class=\"stat\"><span>Foydali ish<\/span><strong id=\"useful3\">1000 J<\/strong><\/div><div class=\"stat\"><span>To‘liq ish<\/span><strong id=\"total3\">1565.7 J<\/strong><\/div><div class=\"stat\"><span>FIK<\/span><strong id=\"eff3\">63.9%<\/strong><\/div><\/div><\/article>\n  <article class=\"card half\"><h3>Kuchlar va energiya<\/h3><div class=\"visual\"><canvas id=\"canvas3\" aria-label=\"Ishqalanish kuchi ko‘rsatilgan qiya tekislik\"><\/canvas><\/div><div id=\"energyBars\"><\/div><p class=\"small muted\">Bir tekis harakatda tortuvchi kuch qiya tekislik bo‘ylab og‘irlik kuchining tarkibiy qismi va ishqalanishni muvozanatlaydi.<\/p><\/article>\n <\/div>\n<\/section>\n\n<section class=\"section\" id=\"masalalar\">\n <div class=\"section-head\"><div><h2><span class=\"number\">05<\/span>Masalalar yechish<\/h2><p>Yechimni oching yoki avval mustaqil urinib ko‘ring.<\/p><\/div><\/div>\n <div class=\"grid\">\n  <article class=\"card\">\n   <h3>1-masala · Sodda<\/h3><p>Massasi 10 kg yuk uzunligi 5 m, balandligi 1 m bo‘lgan ishqalanishsiz qiya tekislik bo‘ylab bir tekis ko‘tariladi. g = 10 N/kg.<\/p>\n   <details class=\"problem\"><summary>Yechimni bosqichma-bosqich ko‘rsatish<\/summary><div class=\"content\"><ol class=\"steps\"><li>Berilgan: m = 10 kg, s = 5 m, h = 1 m, g = 10 N/kg.<\/li><li>Foydali ish: A<sub>f<\/sub> = mgh = 10 · 10 · 1 = <b>100 J<\/b>.<\/li><li>sin α = h/s = 1/5. Tortuvchi kuch: F = mg sin α = 100 · 0.2 = <b>20 N<\/b>.<\/li><li>To‘liq ish: A<sub>t<\/sub> = Fs = 20 · 5 = <b>100 J<\/b>.<\/li><li>FIK: η = 100/100 · 100% = <b>100%<\/b>.<\/li><\/ol><div class=\"answer\">Javob: A<sub>f<\/sub> = 100 J; F = 20 N; A<sub>t<\/sub> = 100 J; η = 100%.<\/div><\/div><\/details>\n  <\/article>\n  <article class=\"card\">\n   <h3>2-masala · O‘rta<\/h3><p>Massasi 20 kg yuk uzunligi 8 m, balandligi 2 m bo‘lgan qiya tekislik bo‘ylab bir tekis ko‘tariladi. Tortuvchi kuch 100 N. g = 10 N/kg.<\/p>\n   <details class=\"problem\"><summary>Yechimni bosqichma-bosqich ko‘rsatish<\/summary><div class=\"content\"><ol class=\"steps\"><li>Foydali ish: A<sub>f<\/sub> = mgh = 20 · 10 · 2 = <b>400 J<\/b>.<\/li><li>To‘liq ish: A<sub>t<\/sub> = Fs = 100 · 8 = <b>800 J<\/b>.<\/li><li>FIK: η = 400/800 · 100% = <b>50%<\/b>.<\/li><li>Ishqalanishsiz zarur kuch F = mgh/s = 400/8 = 50 N bo‘lardi. Berilgan 100 N kuch kattaroq; bir tekis harakat shartida farq ishqalanish yoki boshqa qarshiliklarni ko‘rsatadi.<\/li><\/ol><div class=\"answer\">Javob: A<sub>f<\/sub> = 400 J; A<sub>t<\/sub> = 800 J; η = 50%.<\/div><\/div><\/details>\n  <\/article>\n  <article class=\"card\">\n   <h3>3-masala · Murakkab va amaliy<\/h3><p>Massasi 50 kg quti uzunligi 6 m, balandligi 2 m bo‘lgan qiya tekislik bo‘ylab bir tekis yuqoriga tortiladi. μ = 0,2; g = 10 N/kg.<\/p>\n   <details class=\"problem\"><summary>Yechimni bosqichma-bosqich ko‘rsatish<\/summary><div class=\"content\"><ol class=\"steps\"><li>sin α = h/s = 2/6 = <b>0,333<\/b>; cos α = √(1 − sin²α) ≈ <b>0,943<\/b>.<\/li><li>Tayanch reaksiya: N = mg cos α = 50 · 10 · 0,943 ≈ <b>471,4 N<\/b>.<\/li><li>Ishqalanish kuchi: F<sub>ishq<\/sub> = μN = 0,2 · 471,4 ≈ <b>94,3 N<\/b>.<\/li><li>Tortuvchi kuch: F = mg sin α + F<sub>ishq<\/sub> = 500 · 0,333 + 94,3 ≈ <b>260,9 N<\/b>.<\/li><li>Foydali ish: A<sub>f<\/sub> = mgh = 50 · 10 · 2 = <b>1000 J<\/b>.<\/li><li>To‘liq ish: A<sub>t<\/sub> = Fs = 260,9 · 6 ≈ <b>1565,7 J<\/b>.<\/li><li>Ishqalanishga qarshi ish: A<sub>ishq<\/sub> = F<sub>ishq<\/sub>s = 94,3 · 6 ≈ <b>565,7 J<\/b>.<\/li><li>FIK: η = 1000/1565,7 · 100% ≈ <b>63,9%<\/b>.<\/li><\/ol><div class=\"answer\">Javob: N ≈ 471,4 N; F<sub>ishq<\/sub> ≈ 94,3 N; F ≈ 260,9 N; A<sub>f<\/sub> = 1000 J; A<sub>t<\/sub> ≈ 1565,7 J; η ≈ 63,9%.<\/div><\/div><\/details>\n  <\/article>\n  <article class=\"card\">\n   <h3>4-masala · Mustaqil ishlash<\/h3><p>Massasi 15 kg yuk 4 m uzunlikdagi, 1,2 m balandlikdagi qiya tekislik bo‘ylab ishqalanishsiz ko‘tariladi. g = 10 N/kg. Tortuvchi kuch, foydali ish va FIKni toping.<\/p>\n   <details class=\"problem\"><summary>Tekshirish uchun javob<\/summary><div class=\"content\"><p>F = mgh/s = 15·10·1,2/4 = <b>45 N<\/b>. A<sub>f<\/sub> = mgh = <b>180 J<\/b>. A<sub>t<\/sub> = Fs = 45·4 = <b>180 J<\/b>. η = <b>100%<\/b>.<\/p><\/div><\/details>\n  <\/article>\n  <article class=\"card\">\n   <h3>5-masala · Ishqalanishli<\/h3><p>Massasi 10 kg yuk α = 30° burchakli tekislikda μ = 0,2 bilan bir tekis yuqoriga tortiladi. g = 10 N/kg. Zarur kuchni toping.<\/p>\n   <details class=\"problem\"><summary>Tekshirish uchun javob<\/summary><div class=\"content\"><p>N = mg cos 30° ≈ 86,6 N. F<sub>ishq<\/sub> = 0,2·86,6 ≈ 17,3 N. F = mg sin 30° + F<sub>ishq<\/sub> = 50 + 17,3 = <b>67,3 N<\/b>.<\/p><\/div><\/details>\n  <\/article>\n  <article class=\"card\">\n   <h3>6-masala · Hayotiy vaziyat<\/h3><p>Ishchilar 300 N kuch bilan yukni 4 m uzunlikdagi pandus bo‘ylab ko‘tarib, uni 0,8 m balandlikka olib chiqishdi. Yuk massasi 100 kg. g = 10 N/kg. FIKni aniqlang.<\/p>\n   <details class=\"problem\"><summary>Tekshirish uchun javob<\/summary><div class=\"content\"><p>A<sub>f<\/sub> = 100·10·0,8 = 800 J. A<sub>t<\/sub> = 300·4 = 1200 J. η = 800/1200·100% = <b>66,7%<\/b>.<\/p><\/div><\/details>\n  <\/article>\n <\/div>\n<\/section>\n\n<section class=\"section\" id=\"test\">\n <div class=\"section-head\"><div><h2><span class=\"number\">06<\/span>Bilimlarni tekshirish<\/h2><p>8 ta savol. Har bir savolda bitta to‘g‘ri javob mavjud.<\/p><\/div><\/div>\n <article class=\"card\">\n  <form id=\"quizForm\">\n   <div class=\"quiz-q\" data-answer=\"1\" data-explain=\"Ish kuch bilan siljishning kuch yo‘nalishidagi tarkibiy qismi ko‘paytmasiga teng.\"><p>1. Kuch va siljish orasidagi burchak θ bo‘lsa, mexanik ish formulasi qaysi?<\/p><label class=\"option\"><input type=\"radio\" name=\"q0\" value=\"0\"> A = F/s<\/label><label class=\"option\"><input type=\"radio\" name=\"q0\" value=\"1\"> A = Fs cos θ<\/label><label class=\"option\"><input type=\"radio\" name=\"q0\" value=\"2\"> A = mgh²<\/label><label class=\"option\"><input type=\"radio\" name=\"q0\" value=\"3\"> A = F + s<\/label><div class=\"feedback\"><\/div><\/div>\n   <div class=\"quiz-q\" data-answer=\"2\" data-explain=\"Foydali ish yukning potensial energiyasi ortishiga teng: A_f = mgh.\"><p>2. Yukni h balandlikka ko‘tarishda foydali ish nimaga teng?<\/p><label class=\"option\"><input type=\"radio\" name=\"q1\" value=\"0\"> F/s<\/label><label class=\"option\"><input type=\"radio\" name=\"q1\" value=\"1\"> μN<\/label><label class=\"option\"><input type=\"radio\" name=\"q1\" value=\"2\"> mgh<\/label><label class=\"option\"><input type=\"radio\" name=\"q1\" value=\"3\"> mg/h<\/label><div class=\"feedback\"><\/div><\/div>\n   <div class=\"quiz-q\" data-answer=\"0\" data-explain=\"FIK foydali ishning to‘liq ishga nisbatini foizda ifodalaydi.\"><p>3. FIK qanday aniqlanadi?<\/p><label class=\"option\"><input type=\"radio\" name=\"q2\" value=\"0\"> η = A_f/A_t · 100%<\/label><label class=\"option\"><input type=\"radio\" name=\"q2\" value=\"1\"> η = A_t/A_f<\/label><label class=\"option\"><input type=\"radio\" name=\"q2\" value=\"2\"> η = Fs²<\/label><label class=\"option\"><input type=\"radio\" name=\"q2\" value=\"3\"> η = mg + h<\/label><div class=\"feedback\"><\/div><\/div>\n   <div class=\"quiz-q\" data-answer=\"3\" data-explain=\"Ishqalanish kuchi harakatga yoki harakatga intilishga qarshi yo‘naladi.\"><p>4. Yuk qiya tekislik bo‘ylab yuqoriga harakatlanganda ishqalanish kuchi qaysi tomonga yo‘naladi?<\/p><label class=\"option\"><input type=\"radio\" name=\"q3\" value=\"0\"> Yuqoriga<\/label><label class=\"option\"><input type=\"radio\" name=\"q3\" value=\"1\"> Vertikal yuqoriga<\/label><label class=\"option\"><input type=\"radio\" name=\"q3\" value=\"2\"> Har doim tashqariga<\/label><label class=\"option\"><input type=\"radio\" name=\"q3\" value=\"3\"> Tekislik bo‘ylab pastga<\/label><div class=\"feedback\"><\/div><\/div>\n   <div class=\"quiz-q\" data-answer=\"1\" data-explain=\"N = mg cos α formulasi tekislikka perpendikulyar boshqa kuchlar bo‘lmagan holatda ishlatiladi.\"><p>5. Qiya tekislikda tayanch reaksiya kuchi qaysi formula bilan aniqlanadi?<\/p><label class=\"option\"><input type=\"radio\" name=\"q4\" value=\"0\"> N = mg sin α<\/label><label class=\"option\"><input type=\"radio\" name=\"q4\" value=\"1\"> N = mg cos α<\/label><label class=\"option\"><input type=\"radio\" name=\"q4\" value=\"2\"> N = μmg<\/label><label class=\"option\"><input type=\"radio\" name=\"q4\" value=\"3\"> N = mgh<\/label><div class=\"feedback\"><\/div><\/div>\n   <div class=\"quiz-q\" data-answer=\"0\" data-explain=\"Ishqalanishsiz va boshqa yo‘qotishlarsiz ideal modelda foydali ish to‘liq ishga teng.\"><p>6. Ideal, ishqalanishsiz qiya tekislikning FIKi qancha?<\/p><label class=\"option\"><input type=\"radio\" name=\"q5\" value=\"0\"> 100%<\/label><label class=\"option\"><input type=\"radio\" name=\"q5\" value=\"1\"> 50%<\/label><label class=\"option\"><input type=\"radio\" name=\"q5\" value=\"2\"> 0%<\/label><label class=\"option\"><input type=\"radio\" name=\"q5\" value=\"3\"> 150%<\/label><div class=\"feedback\"><\/div><\/div>\n   <div class=\"quiz-q\" data-answer=\"2\" data-explain=\"Ishqalanish kuchi F_ishq = μN.\"><p>7. Sirpanish ishqalanish kuchi qaysi formula bilan ifodalanadi?<\/p><label class=\"option\"><input type=\"radio\" name=\"q6\" value=\"0\"> F = mgh<\/label><label class=\"option\"><input type=\"radio\" name=\"q6\" value=\"1\"> F = Fs<\/label><label class=\"option\"><input type=\"radio\" name=\"q6\" value=\"2\"> F_ishq = μN<\/label><label class=\"option\"><input type=\"radio\" name=\"q6\" value=\"3\"> F = s/h<\/label><div class=\"feedback\"><\/div><\/div>\n   <div class=\"quiz-q\" data-answer=\"3\" data-explain=\"Ishqalanish mavjud bo‘lganda tashqi kuch bajargan ishning bir qismi issiqlikka aylanadi, shu sababli FIK odatda 100% dan kichik.\"><p>8. Nima sababdan real qiya tekislikda FIK odatda 100% dan kichik?<\/p><label class=\"option\"><input type=\"radio\" name=\"q7\" value=\"0\"> Massa yo‘qoladi<\/label><label class=\"option\"><input type=\"radio\" name=\"q7\" value=\"1\"> Balandlik manfiy bo‘ladi<\/label><label class=\"option\"><input type=\"radio\" name=\"q7\" value=\"2\"> Tortuvchi kuch doim nol<\/label><label class=\"option\"><input type=\"radio\" name=\"q7\" value=\"3\"> Energiyaning bir qismi issiqlik va boshqa yo‘qotishlarga ketadi<\/label><div class=\"feedback\"><\/div><\/div>\n   <div class=\"actions\"><button type=\"submit\" class=\"primary\">Natijani tekshirish<\/button><button type=\"button\" id=\"resetQuiz\" class=\"ghost\">Qayta ishlash<\/button><\/div>\n  <\/form>\n  <div id=\"quizResult\" class=\"answer\" hidden aria-live=\"polite\"><\/div>\n <\/article>\n<\/section>\n<section class=\"section\" id=\"xulosa\">\n <div class=\"section-head\"><div><h2><span class=\"number\">07<\/span>Xulosa va mustahkamlash<\/h2><p>Esda tuting.<\/p><\/div><\/div>\n <div class=\"grid\">\n  <article class=\"card third\"><h3>01 · Kuch va yo‘l<\/h3><p>Qiya tekislik yukni kichikroq kuch bilan ko‘tarishga yordam beradi, biroq yo‘lni uzaytiradi.<\/p><\/article>\n  <article class=\"card third\"><h3>02 · Ishqalanish<\/h3><p>Ishqalanish qo‘shimcha kuch va ish talab qiladi; energiyaning bir qismi issiqlikka aylanadi.<\/p><\/article>\n  <article class=\"card third\"><h3>03 · FIK<\/h3><p>FIK foydali ishning to‘liq ishga nisbatidir. Real qurilmalarda u odatda 100% dan kichik bo‘ladi.<\/p><\/article>\n <\/div>\n<\/section>\n<\/main>\n<footer class=\"footer\">PHYSim · Qiya tekislik, mexanik ish va foydali ish koeffitsiyenti · Bitta HTML faylda ishlaydi<\/footer>\n<script>\nconst $=id=>document.getElementById(id);\nconst num=id=>Number($(id).value);\nconst fmt=(v,d=1)=>Number.isFinite(v)?v.toLocaleString('uz-UZ',{maximumFractionDigits:d,minimumFractionDigits:0}):'—';\nconst g=10;\nfunction geometry(s,h){h=Math.min(h,s*.98);let si=h/s,co=Math.sqrt(Math.max(0,1-si*si));return {h,si,co,ang:Math.asin(si)*180/Math.PI};}\nfunction drawRamp(canvasId, data, moving=false, friction=false){\n const c=$(canvasId),ctx=c.getContext('2d'),dpr=window.devicePixelRatio||1,w=c.clientWidth||500,h=c.clientHeight||290;\n c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);\n ctx.lineCap='round';ctx.lineJoin='round';\n const left=42,base=h-35,topY=35,right=w-35,availW=right-left,availH=base-topY;\n const ratio=Math.min(availW/Math.max(data.s,1),availH/Math.max(data.h,1));\n const dx=data.s*ratio,dy=data.h*ratio,x0=left,y0=base,x1=x0+dx,y1=y0-dy;\n // grid\n ctx.strokeStyle='#e0e6f5';ctx.lineWidth=1;\n for(let x=20;x<w;x+=30){ctx.beginPath();ctx.moveTo(x,10);ctx.lineTo(x,h-20);ctx.stroke()}\n for(let y=20;y<h;y+=30){ctx.beginPath();ctx.moveTo(10,y);ctx.lineTo(w-10,y);ctx.stroke()}\n ctx.fillStyle='#dce5ff';ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.lineTo(x1,y0);ctx.closePath();ctx.fill();\n ctx.strokeStyle='#6679c7';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.stroke();\n ctx.strokeStyle='#93a1c9';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x0,y0+1);ctx.lineTo(x1,y0+1);ctx.stroke();\n // labels\n ctx.fillStyle='#536180';ctx.font='12px system-ui';ctx.fillText('s = '+fmt(data.s,1)+' m',(x0+x1)/2-22,y0+20);ctx.fillText('h = '+fmt(data.h,1)+' m',Math.min(w-72,x1+6),(y0+y1)/2);\n const t=moving?(data.t||0):.62;const bx=x0+dx*t,by=y0-dy*t;\n // block rotated\n const angle=-Math.atan2(dy,dx),bw=32,bh=24;\n ctx.save();ctx.translate(bx,by-12);ctx.rotate(angle);ctx.fillStyle='#3156d9';ctx.strokeStyle='#203b9c';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(-bw/2,-bh/2,bw,bh,5);ctx.fill();ctx.stroke();ctx.restore();\n // vector helper\n function arrow(x,y,ex,ey,color,label){\n   const dx=ex-x,dy=ey-y,L=Math.hypot(dx,dy);if(L<3)return;const ux=dx/L,uy=dy/L,head=7;\n   ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=2.7;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(ex,ey);ctx.stroke();\n   ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ex-ux*head-uy*head*.55,ey-uy*head+ux*head*.55);ctx.lineTo(ex-ux*head+uy*head*.55,ey-uy*head-ux*head*.55);ctx.closePath();ctx.fill();\n   ctx.font='bold 11px system-ui';ctx.fillText(label,ex+4,ey-4);\n }\n const mag=Math.min(70,Math.max(24,data.m*1.1));arrow(bx,by-14,bx+Math.cos(angle)*mag,by-14+Math.sin(angle)*mag,'#3156d9','F');\n arrow(bx,by-4,bx,by+Math.min(64,Math.max(25,data.m*.9)),'#d94c63','mg');\n arrow(bx,by-12,bx+Math.sin(angle)*40,by-12-Math.cos(angle)*40,'#159b72','N');\n if(friction&&data.mu>0)arrow(bx,by+1,bx-Math.cos(angle)*Math.min(58,22+data.mu*55),by+1-Math.sin(angle)*Math.min(58,22+data.mu*55),'#ed9a32','Fᵢ');\n ctx.fillStyle='#596784';ctx.font='11px system-ui';ctx.fillText('Qiya tekislik',left+4,Math.max(15,y1-12));\n}\nfunction update1(){\n let m=num('m1'),s=num('s1'),h=num('h1'),mu=num('mu1');if(h>=s){h=s*.98;$('h1').value=h;$('geomWarning').hidden=false}else $('geomWarning').hidden=true;\n $('m1o').textContent=m+' kg';$('s1o').textContent=fmt(s,1)+' m';$('h1o').textContent=fmt(h,1)+' m';$('mu1o').textContent=mu.toFixed(2);\n const q=geometry(s,h),N=m*g*q.co,fr=mu*N,F=m*g*q.si+fr;\n $('ang1').textContent=fmt(q.ang,1)+'°';$('force1').textContent=fmt(F,1)+' N';\n $('height1').textContent=fmt(animT*h,2)+' m';\n drawRamp('canvas1',{m,s,h,mu,t:animT},true,true);\n}\nlet animT=0,animTimer=null;\nfunction stopAnim(){if(animTimer){clearInterval(animTimer);animTimer=null}}\n$('start1').onclick=()=>{stopAnim();animTimer=setInterval(()=>{animT+=.018;if(animT>1)animT=0;update1()},40)};\n$('pause1').onclick=stopAnim;\n$('reset1').onclick=()=>{stopAnim();animT=0;update1()};\n['m1','s1','h1','mu1'].forEach(id=>$(id).addEventListener('input',update1));\nfunction update2(){\n let m=num('m2'),s=num('s2'),h=num('h2'),F=num('f2');if(h>=s){h=s*.98;$('h2').value=h}\n ['m2','s2','h2','f2'].forEach((id,i)=>$(id+'o').textContent=[m+' kg',fmt(s,1)+' m',fmt(h,1)+' m',F+' N'][i]);\n const af=m*g*h,at=F*s,eta=at>0?af/at*100:0;\n $('af2').textContent=fmt(af)+' J';$('at2').textContent=fmt(at)+' J';$('eta2').textContent=fmt(eta,1)+'%';\n const invalid=af>at+1e-8;$('warn2').hidden=!invalid;\n $('conclusion2').textContent=invalid?'Ogohlantirish: bu qiymatlarda foydali ish to‘liq ishdan katta chiqmoqda. Kuch yoki parametrlarni tekshiring.':eta>=99.95?'Ideal holatga yaqin: FIK ≈ 100%.':'FIK = '+fmt(eta,1)+'%. Yo‘qotishlar ulushi taxminan '+fmt(Math.max(0,100-eta),1)+'%.';\n const max=Math.max(af,at,1);\n $('bars2').innerHTML=`<div class=\"barrow\"><span>Foydali ish<\/span><div class=\"bar\"><i style=\"width:${Math.min(100,af/max*100)}%;background:#3156d9\"><\/i><\/div><b>${fmt(af)} J<\/b><\/div><div class=\"barrow\"><span>To‘liq ish<\/span><div class=\"bar\"><i style=\"width:${Math.min(100,at/max*100)}%;background:#7656e8\"><\/i><\/div><b>${fmt(at)} J<\/b><\/div>`;\n return {m,s,h,F,af,at,eta};\n}\n['m2','s2','h2','f2'].forEach(id=>$(id).addEventListener('input',update2));\nlet trials=[];\n$('addTrial').onclick=()=>{const d=update2();trials.push(d);renderTrials()};\n$('clearTrials').onclick=()=>{trials=[];renderTrials()};\nfunction renderTrials(){\n $('trialRows').innerHTML=trials.length?trials.map((d,i)=>`<tr><td>${i+1}<\/td><td>${d.m}<\/td><td>${fmt(d.s,1)}<\/td><td>${fmt(d.h,1)}<\/td><td>${d.F}<\/td><td>${fmt(d.af)}<\/td><td>${fmt(d.at)}<\/td><td>${fmt(d.eta,1)}%<\/td><\/tr>`).join(''):'<tr><td colspan=\"8\" class=\"muted\">Hozircha natija yo‘q. “Natijani jadvalga qo‘shish” tugmasini bosing.<\/td><\/tr>';\n}\nfunction update3(){\n let m=num('m3'),s=num('s3'),h=num('h3'),mu=num('mu3');if(h>=s){h=s*.98;$('h3').value=h}\n $('m3o').textContent=m+' kg';$('s3o').textContent=fmt(s,1)+' m';$('h3o').textContent=fmt(h,1)+' m';$('mu3o').textContent=mu.toFixed(2);\n const q=geometry(s,h),N=m*g*q.co,fr=mu*N,F=m*g*q.si+fr,af=m*g*h,at=F*s,eta=at?af/at*100:0,fw=fr*s;\n $('normal3').textContent=fmt(N,1)+' N';$('fric3').textContent=fmt(fr,1)+' N';$('pull3').textContent=fmt(F,1)+' N';$('useful3').textContent=fmt(af)+' J';$('total3').textContent=fmt(at,1)+' J';$('eff3').textContent=fmt(eta,1)+'%';\n drawRamp('canvas3',{m,s,h,mu,t:.62},false,true);\n const max=Math.max(af,fw,1);\n $('energyBars').innerHTML=`<div class=\"barrow\"><span>Foydali ish<\/span><div class=\"bar\"><i style=\"width:${af/max*100}%;background:#3156d9\"><\/i><\/div><b>${fmt(af)} J<\/b><\/div><div class=\"barrow\"><span>Ishqalanish<\/span><div class=\"bar\"><i style=\"width:${fw/max*100}%;background:#ed9a32\"><\/i><\/div><b>${fmt(fw)} J<\/b><\/div>`;\n}\n['m3','s3','h3','mu3'].forEach(id=>$(id).addEventListener('input',update3));\nconst quizForm=$('quizForm');\nquizForm.addEventListener('submit',e=>{e.preventDefault();let score=0;document.querySelectorAll('.quiz-q').forEach((q,i)=>{const chosen=q.querySelector('input:checked'),fb=q.querySelector('.feedback'),correct=Number(q.dataset.answer);if(chosen&&Number(chosen.value)===correct){score++;fb.className='feedback correct';fb.textContent='To‘g‘ri! '+q.dataset.explain}else{fb.className='feedback incorrect';fb.textContent=(chosen?'Noto‘g‘ri. ':'Javob tanlanmadi. ')+q.dataset.explain}});const pct=score/8*100;$('quizResult').hidden=false;$('quizResult').innerHTML=`Natija: <b>${score}/8<\/b> ta to‘g‘ri javob (${pct}%). ${score>=7?'A’lo! Mavzuni juda yaxshi o‘zlashtirgansiz.':score>=5?'Yaxshi! Xatolar izohini ko‘rib chiqing.':'Nazariy formulalarni takrorlab, yana urinib ko‘ring.'}`;$('quizResult').scrollIntoView({behavior:'smooth',block:'nearest'})});\n$('resetQuiz').onclick=()=>{quizForm.reset();document.querySelectorAll('.feedback').forEach(x=>{x.textContent='';x.className='feedback'});$('quizResult').hidden=true};\ndocument.querySelectorAll('[data-jump]').forEach(b=>b.addEventListener('click',()=>{document.getElementById(b.dataset.jump).scrollIntoView({behavior:'smooth'});document.querySelectorAll('[data-jump]').forEach(x=>x.classList.toggle('active',x===b))}));\nwindow.addEventListener('scroll',()=>{let max=document.documentElement.scrollHeight-innerHeight;$('scrollProgress').style.width=(max>0?scrollY/max*100:0)+'%'});\nwindow.addEventListener('resize',()=>{update1();update3()});\nupdate1();update2();update3();\n<\/script>\n<\/body>\n<\/html>"}, {"id": "11-mavzu", "n": "11", "t": "Laboratoriya: qiya tekislik FIKi", "d": "Foydali ish koeffitsiyentini tajribada aniqlash", "k": "Laboratoriya", "html": "<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Laboratoriya №11 — Qiya tekislikning FIKini aniqlash<\/title>\n<style>\n:root{--navy:#102044;--blue:#2563eb;--cyan:#38bdf8;--violet:#7c3aed;--ink:#18233b;--muted:#64748b;--paper:#f4f7fc;--line:#dbe4f0;--white:#fff;--green:#059669;--amber:#d97706}\n*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,\"Segoe UI\",sans-serif}\nheader{background:linear-gradient(120deg,#101b3b,#1d4ed8 68%,#7c3aed);color:#fff;padding:18px clamp(16px,4vw,48px);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}\n.brand{font-weight:800;letter-spacing:.08em;font-size:.82rem;text-transform:uppercase;opacity:.9}.header-title{font-size:clamp(1.1rem,2.4vw,1.8rem);font-weight:800;margin-top:4px}.pill{border:1px solid #ffffff65;background:#ffffff18;padding:8px 12px;border-radius:999px;font-size:.85rem}\nmain{max-width:1200px;margin:auto;padding:24px clamp(12px,3vw,32px) 42px}\n.progress{height:6px;background:#dbe5f5;border-radius:9px;overflow:hidden;margin-bottom:20px}.progress>div{height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet));width:7.69%;transition:width .3s}\n.nav{display:flex;gap:8px;overflow:auto;padding:2px 0 16px;margin-bottom:8px}.nav button{white-space:nowrap;border:1px solid var(--line);background:#fff;color:#334155;border-radius:999px;padding:9px 14px;cursor:pointer;font-weight:650}.nav button.active{background:var(--navy);color:white;border-color:var(--navy)}\n.panel{display:none;animation:fade .25s ease}.panel.active{display:block}@keyframes fade{from{opacity:.3;transform:translateY(5px)}to{opacity:1;transform:none}}\nh1,h2,h3{line-height:1.2;color:var(--navy)}h1{font-size:clamp(1.8rem,4vw,3.4rem);margin:10px 0}h2{font-size:clamp(1.35rem,2.7vw,2rem);margin:0 0 14px}h3{font-size:1.05rem;margin:0 0 10px}\np{line-height:1.65}.muted{color:var(--muted)}.eyebrow{color:var(--blue);font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:.75rem}\n.hero{border-radius:24px;background:linear-gradient(135deg,#e4f4ff,#eee8ff);padding:clamp(20px,4vw,44px);display:grid;grid-template-columns:1.1fr .9fr;gap:22px;align-items:center;overflow:hidden}\n.hero-art{min-height:245px;display:flex;align-items:center;justify-content:center}.hero-art svg{width:100%;max-width:470px;filter:drop-shadow(0 12px 18px #10204418)}\n.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}.card,.box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 5px 20px #18345c08}.card{cursor:pointer;transition:.2s}.card:hover{transform:translateY(-3px);border-color:#93c5fd}.card .num{display:grid;place-items:center;width:38px;height:38px;background:#e8efff;color:var(--blue);border-radius:12px;font-weight:850;margin-bottom:12px}\n.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.stack{display:grid;gap:14px}.formula{background:#eef5ff;border:1px solid #d7e6ff;border-radius:14px;padding:15px;margin:10px 0;font-size:1.13rem;font-weight:700;color:#12336a;overflow-wrap:anywhere}.formula small{display:block;color:var(--muted);font-size:.8rem;font-weight:500;margin-top:6px}\n.equipment{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.equip{padding:14px;text-align:center;background:white;border:1px solid var(--line);border-radius:16px;cursor:pointer}.equip .emoji{font-size:2rem;display:block;margin-bottom:6px}.equip small{display:block;color:var(--muted);margin-top:5px}\nbutton{font:inherit}.btn{border:0;border-radius:12px;padding:11px 16px;background:var(--blue);color:white;font-weight:750;cursor:pointer;box-shadow:0 4px 10px #2563eb22}.btn:hover{filter:brightness(1.06)}.btn.secondary{background:#e8efff;color:#1d4ed8;box-shadow:none}.btn.dark{background:var(--navy)}.btn.green{background:var(--green)}.btn:disabled{opacity:.45;cursor:not-allowed}\n.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:14px}.control{background:#fff;border:1px solid var(--line);padding:14px;border-radius:14px}.control label{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:.92rem}.control output{color:var(--blue)}input[type=range]{width:100%;accent-color:var(--blue);margin-top:13px}input[type=number],textarea,select{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:10px;font:inherit;background:white;color:var(--ink)}.labscene{background:linear-gradient(#eaf5ff,#fff 80%);border:1px solid var(--line);border-radius:20px;padding:10px;min-height:320px}.labscene svg{width:100%;height:auto;display:block;max-height:420px}.meter{font-size:1.45rem;font-weight:850;color:var(--blue)}.readings{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.reading{background:#f7faff;border-radius:12px;padding:12px}.reading span{display:block;color:var(--muted);font-size:.8rem}.reading strong{font-size:1.15rem}\ntable{border-collapse:collapse;width:100%;font-size:.9rem;min-width:740px}th,td{padding:10px 9px;border-bottom:1px solid var(--line);text-align:center}th{background:#edf3ff;color:#1e3a8a}tr:last-child td{border-bottom:0}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:white}\n.question{padding:16px;background:white;border:1px solid var(--line);border-radius:15px;margin-bottom:12px}.question label{display:block;padding:8px;border-radius:8px;cursor:pointer}.question label:hover{background:#f1f5ff}.feedback{margin-top:8px;font-weight:700}.step{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}.step:last-child{border:0}.step input{width:20px;height:20px;accent-color:var(--green);margin-top:3px}.step.done span{text-decoration:line-through;color:var(--muted)}\ntextarea{min-height:110px;resize:vertical}.footer-nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}\n.notice{padding:12px 14px;border-radius:12px;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;font-size:.9rem}.success{padding:12px 14px;border-radius:12px;background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}\n.barline{height:12px;border-radius:99px;background:#e2e8f0;overflow:hidden;margin-top:8px}.barline div{height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet));width:0;transition:width .4s}\n.small{font-size:.85rem}.hidden{display:none!important}\n@media(max-width:760px){.hero,.grid2{grid-template-columns:1fr}.hero-art{min-height:180px}.cards{grid-template-columns:1fr}.equipment{grid-template-columns:repeat(2,minmax(0,1fr))}.controls{grid-template-columns:1fr}.readings{grid-template-columns:1fr 1fr}.nav{margin-right:-8px}.footer-nav .btn{padding:10px 12px}}\n@media print{header,.nav,.progress,.footer-nav,.actions,.btn{display:none!important}body{background:white}.panel{display:block!important;page-break-after:always}.box,.card{box-shadow:none}}\n<\/style>\n<\/head>\n<body>\n<header>\n <div><div class=\"brand\">Virtual fizika laboratoriyasi · 10-sinf<\/div><div class=\"header-title\">Qiya tekislikning FIKini aniqlash<\/div><\/div>\n <div class=\"pill\">LABORATORIYA ISHI № 11<\/div>\n<\/header>\n<main>\n<div class=\"progress\"><div id=\"progressFill\"><\/div><\/div>\n<nav class=\"nav\" id=\"nav\"><\/nav>\n\n<section class=\"panel active\" data-title=\"Kirish\">\n <div class=\"hero\">\n  <div><div class=\"eyebrow\">Laboratoriya ishi № 11<\/div><h1>Qiya tekislikning foydali ish koeffitsiyentini aniqlash<\/h1>\n   <p>Virtual tajribani bajaring: yukni qiya tekislik bo‘ylab torting, kuch va masofani o‘lchang, ishlarni hisoblang va FIKni aniqlang.<\/p>\n   <div class=\"actions\"><button class=\"btn\" onclick=\"go(1)\">Laboratoriyani boshlash →<\/button><button class=\"btn secondary\" onclick=\"go(2)\">Nazariyani ko‘rish<\/button><\/div>\n  <\/div>\n  <div class=\"hero-art\">\n   <svg viewBox=\"0 0 480 300\" role=\"img\" aria-label=\"Qiya tekislik va yuk tasviri\">\n    <defs><linearGradient id=\"ramp\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop stop-color=\"#93c5fd\"/><stop offset=\"1\" stop-color=\"#2563eb\"/><\/linearGradient><linearGradient id=\"block\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop stop-color=\"#c4b5fd\"/><stop offset=\"1\" stop-color=\"#7c3aed\"/><\/linearGradient><\/defs>\n    <path d=\"M45 250 L390 250 L390 90 Z\" fill=\"#dbeafe\" stroke=\"#93c5fd\" stroke-width=\"2\"/>\n    <path d=\"M70 240 L380 100 L380 116 L70 256 Z\" fill=\"url(#ramp)\"/>\n    <path d=\"M70 256 L380 116\" stroke=\"#1d4ed8\" stroke-width=\"4\"/>\n    <g transform=\"translate(226 160) rotate(-24)\">\n     <rect x=\"-35\" y=\"-28\" width=\"70\" height=\"52\" rx=\"8\" fill=\"url(#block)\" stroke=\"#5b21b6\" stroke-width=\"2\"/>\n     <path d=\"M-20 -12h40M-20 0h40\" stroke=\"#ede9fe\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n    <\/g>\n    <path d=\"M228 151 L315 111\" stroke=\"#dc2626\" stroke-width=\"4\" stroke-linecap=\"round\"/><path d=\"M315 111l-15 0 7 13\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"4\"/>\n    <text x=\"265\" y=\"92\" fill=\"#b91c1c\" font-size=\"15\" font-weight=\"700\">F<\/text>\n    <path d=\"M72 276H380\" stroke=\"#64748b\" stroke-width=\"2\"/><path d=\"M72 270v12M380 270v12\" stroke=\"#64748b\" stroke-width=\"2\"/><text x=\"220\" y=\"294\" fill=\"#334155\" font-size=\"14\">s — qiya tekislik uzunligi<\/text>\n    <path d=\"M405 250V92\" stroke=\"#059669\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><path d=\"M398 100l7 -8 7 8M398 242l7 8 7 -8\" fill=\"none\" stroke=\"#059669\" stroke-width=\"2\"/><text x=\"414\" y=\"174\" fill=\"#047857\" font-size=\"14\" font-weight=\"700\">h<\/text>\n    <path d=\"M42 250h360\" stroke=\"#475569\" stroke-width=\"3\"/><path d=\"M65 255v20m28 -20v20m-28 0h28\" stroke=\"#64748b\" stroke-width=\"3\"/>\n   <\/svg>\n  <\/div>\n <\/div>\n <div class=\"cards\">\n  <div class=\"card\" onclick=\"go(2)\"><div class=\"num\">01<\/div><h3>Nazariy bilim<\/h3><p class=\"muted small\">Asosiy kattaliklar va formulalarni o‘rganing.<\/p><\/div>\n  <div class=\"card\" onclick=\"go(5)\"><div class=\"num\">02<\/div><h3>Virtual tajriba<\/h3><p class=\"muted small\">Parametrlarni o‘zgartirib, o‘lchovlarni bajaring.<\/p><\/div>\n  <div class=\"card\" onclick=\"go(9)\"><div class=\"num\">03<\/div><h3>Natija va test<\/h3><p class=\"muted small\">Hisoblarni tahlil qiling va bilimni tekshiring.<\/p><\/div>\n <\/div>\n<\/section>\n\n<section class=\"panel\" data-title=\"Reja\">\n <div class=\"eyebrow\">Dars tuzilishi<\/div><h2>Laboratoriya ishining rejasi<\/h2>\n <div class=\"cards\">\n  <div class=\"card\" onclick=\"showPlan(0)\"><div class=\"num\">1<\/div><h3>Maqsad va jihozlar<\/h3><p class=\"muted\">Laboratoriya ishining maqsadi, zarur jihozlar va bajarish tartibini o‘rganish.<\/p><\/div>\n  <div class=\"card\" onclick=\"showPlan(1)\"><div class=\"num\">2<\/div><h3>Tajribani bajarish<\/h3><p class=\"muted\">Kuch va masofani o‘lchab, to‘la hamda foydali ishlarni hisoblash.<\/p><\/div>\n  <div class=\"card\" onclick=\"showPlan(2)\"><div class=\"num\">3<\/div><h3>FIK va xulosa<\/h3><p class=\"muted\">FIKni aniqlash va tajriba natijalari bo‘yicha xulosa chiqarish.<\/p><\/div>\n <\/div>\n <div class=\"box\" style=\"margin-top:16px\"><h3 id=\"planTitle\">1-reja. Maqsad va jihozlar<\/h3><p id=\"planText\">Tajriba orqali qiya tekislikning FIKini aniqlash uchun zarur o‘lchovlar va hisob-kitoblarni o‘rganamiz.<\/p><\/div>\n<\/section>\n\n<section class=\"panel\" data-title=\"Nazariya\">\n <div class=\"eyebrow\">Nazariy ma’lumot<\/div><h2>Qiya tekislik va foydali ish koeffitsiyenti<\/h2>\n <p>Qiya tekislik — yukni ma’lum balandlikka ko‘tarishda kerakli kuchni kamaytirishga yordam beradigan oddiy mexanizm. Bunda ko‘pincha kuch kamayadi, ammo bosib o‘tiladigan masofa ortadi.<\/p>\n <div class=\"grid2\">\n  <div class=\"box\"><h3>Asosiy kattaliklar<\/h3>\n   <p><b>F<\/b> — tortish kuchi, nyuton (N).<\/p><p><b>s<\/b> — qiya tekislik bo‘ylab masofa, metr (m).<\/p><p><b>m<\/b> — yuk massasi, kilogramm (kg).<\/p><p><b>h<\/b> — vertikal balandlik, metr (m).<\/p><p><b>g<\/b> — erkin tushish tezlanishi, 9,8 m/s².<\/p>\n  <\/div>\n  <div class=\"box\"><h3>Asosiy formulalar<\/h3>\n   <div class=\"formula\">A<sub>to‘la<\/sub> = F · s<small>Jismni qiya tekislik bo‘ylab tortishda bajarilgan ish.<\/small><\/div>\n   <div class=\"formula\">A<sub>foydali<\/sub> = m · g · h<small>Yukning potensial energiyasi ortishiga teng foydali ish.<\/small><\/div>\n   <div class=\"formula\">η = (A<sub>foydali<\/sub> / A<sub>to‘la<\/sub>) · 100%<small>Foydali ish koeffitsiyenti (FIK), foizda.<\/small><\/div>\n  <\/div>\n <\/div>\n <div class=\"notice\" style=\"margin-top:16px\">Muhim: A = F·s formulasi kuch doimiy yoki o‘rtacha kuch sifatida o‘lchangan holatda qo‘llanadi. Jism boshlanish va tugashda bir xil kinetik energiyaga ega bo‘lsa, foydali ish mgh ga teng. Ishqalanish mavjud bo‘lsa, to‘la ishning bir qismi issiqlikka sarflanadi.<\/div>\n<\/section>\n\n<section class=\"panel\" data-title=\"Jihozlar\">\n <div class=\"eyebrow\">Tajriba tayyorgarligi<\/div><h2>Zarur laboratoriya jihozlari<\/h2><p class=\"muted\">Jihoz ustiga bosing — uning vazifasi haqida ma’lumot oling.<\/p>\n <div class=\"equipment\" id=\"equipment\"><\/div>\n <div class=\"box\" style=\"margin-top:14px\"><h3 id=\"equipTitle\">Qiya tekislik<\/h3><p id=\"equipDesc\">Yukni ma’lum balandlikka ko‘tarish uchun foydalaniladigan sirt.<\/p><\/div>\n <h3 style=\"margin-top:22px\">Bajarish tartibi<\/h3>\n <div class=\"box\" id=\"steps\"><\/div>\n<\/section>\n\n<section class=\"panel\" data-title=\"Qurilma\">\n <div class=\"eyebrow\">Virtual laboratoriya<\/div><h2>Tajriba qurilmasi<\/h2>\n <p>Slayderlar yordamida yuk massasini, qiya tekislik uzunligini, balandlikni va ishqalanishni o‘zgartiring. Tasvir va hisoblangan ko‘rsatkichlar yangilanadi.<\/p>\n <div class=\"grid2\">\n  <div class=\"labscene\"><svg id=\"scene\" viewBox=\"0 0 600 380\" aria-label=\"Interaktiv qiya tekislik qurilmasi\"><\/svg><\/div>\n  <div class=\"stack\">\n   <div class=\"controls\">\n    <div class=\"control\"><label for=\"mass\">Yuk massasi <output id=\"massOut\">1.0 kg<\/output><\/label><input id=\"mass\" type=\"range\" min=\"0.2\" max=\"2\" step=\"0.1\" value=\"1\"><\/div>\n    <div class=\"control\"><label for=\"length\">Tekislik uzunligi <output id=\"lengthOut\">1.0 m<\/output><\/label><input id=\"length\" type=\"range\" min=\"0.5\" max=\"2\" step=\"0.1\" value=\"1\"><\/div>\n    <div class=\"control\"><label for=\"height\">Balandlik <output id=\"heightOut\">0.4 m<\/output><\/label><input id=\"height\" type=\"range\" min=\"0.1\" max=\"0.9\" step=\"0.1\" value=\"0.4\"><\/div>\n    <div class=\"control\"><label for=\"friction\">Ishqalanish μ <output id=\"frictionOut\">0.20<\/output><\/label><input id=\"friction\" type=\"range\" min=\"0\" max=\"0.5\" step=\"0.05\" value=\"0.2\"><\/div>\n   <\/div>\n   <div class=\"readings\">\n    <div class=\"reading\"><span>Tortish kuchi F<\/span><strong id=\"forceRead\">— N<\/strong><\/div>\n    <div class=\"reading\"><span>To‘la ish<\/span><strong id=\"totalRead\">— J<\/strong><\/div>\n    <div class=\"reading\"><span>Foydali ish<\/span><strong id=\"usefulRead\">— J<\/strong><\/div>\n   <\/div>\n   <div class=\"box\"><span class=\"muted small\">Joriy FIK<\/span><div class=\"meter\" id=\"effRead\">— %<\/div><div class=\"barline\"><div id=\"effBar\"><\/div><\/div><\/div>\n   <div class=\"actions\"><button class=\"btn\" onclick=\"pullLoad()\">▶ Yukni tortish<\/button><button class=\"btn secondary\" onclick=\"measure()\">O‘lchash<\/button><button class=\"btn green\" onclick=\"addTrial()\">Natijani jadvalga kiritish<\/button><\/div>\n   <p id=\"labStatus\" class=\"muted small\">Tajriba parametrlarini tanlang va “Yukni tortish” tugmasini bosing.<\/p>\n  <\/div>\n <\/div>\n<\/section>\n\n<section class=\"panel\" data-title=\"Hisoblash\">\n <div class=\"eyebrow\">Hisob-kitoblar<\/div><h2>Ish va FIKni hisoblash<\/h2>\n <p>Quyidagi hisoblar joriy tajriba parametrlariga bog‘langan. Parametrlarni o‘zgartirsangiz, natijalar avtomatik yangilanadi.<\/p>\n <div class=\"grid2\">\n  <div class=\"box\"><h3>1. To‘la ish<\/h3><div class=\"formula\" id=\"calcTotal\">A<sub>to‘la<\/sub> = F · s<\/div><p id=\"calcTotalSteps\" class=\"muted\"><\/p><\/div>\n  <div class=\"box\"><h3>2. Foydali ish<\/h3><div class=\"formula\" id=\"calcUseful\">A<sub>foydali<\/sub> = m · g · h<\/div><p id=\"calcUsefulSteps\" class=\"muted\"><\/p><\/div>\n <\/div>\n <div class=\"box\" style=\"margin-top:14px\"><h3>3. FIK<\/h3><div class=\"formula\" id=\"calcEff\">η = (A<sub>foydali<\/sub> / A<sub>to‘la<\/sub>) · 100%<\/div><p id=\"calcEffSteps\" class=\"muted\"><\/p><div class=\"success\" id=\"calcInterpret\">Parametrlarni o‘zgartirib natijani kuzating.<\/div><\/div>\n <div class=\"notice\" style=\"margin-top:14px\">Ideal modelda ishqalanish bo‘lmasa, FIK 100% ga yaqinlashadi. Haqiqiy qurilmada qo‘shimcha yo‘qotishlar bo‘lishi mumkin.<\/div>\n<\/section>\n\n<section class=\"panel\" data-title=\"Jadval\">\n <div class=\"eyebrow\">Tajriba natijalari<\/div><h2>O‘lchovlar jadvali<\/h2>\n <p>Kamida uch xil tajriba bajaring. Har bir tajriba uchun parametrlarni o‘zgartirib, yukni torting va “Natijani jadvalga kiritish” tugmasini bosing.<\/p>\n <div class=\"tablewrap\"><table><thead><tr><th>№<\/th><th>m (kg)<\/th><th>F (N)<\/th><th>s (m)<\/th><th>h (m)<\/th><th>A to‘la (J)<\/th><th>A foydali (J)<\/th><th>FIK (%)<\/th><\/tr><\/thead><tbody id=\"resultsBody\"><tr><td colspan=\"8\" class=\"muted\">Hozircha natijalar yo‘q.<\/td><\/tr><\/tbody><\/table><\/div>\n <div class=\"grid2\" style=\"margin-top:14px\"><div class=\"box\"><span class=\"muted small\">Tajribalar soni<\/span><div class=\"meter\" id=\"trialCount\">0<\/div><\/div><div class=\"box\"><span class=\"muted small\">O‘rtacha FIK<\/span><div class=\"meter\" id=\"avgEff\">— %<\/div><\/div><\/div>\n <div class=\"actions\"><button class=\"btn\" onclick=\"downloadCSV()\">Natijalarni CSV sifatida saqlash<\/button><button class=\"btn secondary\" onclick=\"clearTrials()\">Jadvalni tozalash<\/button><button class=\"btn secondary\" onclick=\"window.print()\">Chop etish / PDF<\/button><\/div>\n <p id=\"saveStatus\" class=\"muted small\"><\/p>\n<\/section>\n\n<section class=\"panel\" data-title=\"Tahlil\">\n <div class=\"eyebrow\">Natijalarni tahlil qilish<\/div><h2>Ishqalanish FIKga qanday ta’sir qiladi?<\/h2>\n <div class=\"grid2\">\n  <div class=\"box\"><h3>Ideal qiya tekislik<\/h3><svg viewBox=\"0 0 300 140\" style=\"width:100%\"><path d=\"M20 115L250 115L250 30Z\" fill=\"#dbeafe\" stroke=\"#93c5fd\" stroke-width=\"2\"/><path d=\"M40 108L240 38\" stroke=\"#2563eb\" stroke-width=\"10\" stroke-linecap=\"round\"/><rect x=\"118\" y=\"64\" width=\"36\" height=\"25\" rx=\"5\" fill=\"#8b5cf6\" transform=\"rotate(-19 136 76)\"/><text x=\"20\" y=\"20\" fill=\"#047857\" font-size=\"13\" font-weight=\"700\">μ = 0<\/text><\/svg><p>Yo‘qotishlar e’tiborga olinmasa, to‘la ish foydali ishga teng bo‘ladi.<\/p><div class=\"formula\">η ≈ 100%<\/div><\/div>\n  <div class=\"box\"><h3>Haqiqiy qiya tekislik<\/h3><svg viewBox=\"0 0 300 140\" style=\"width:100%\"><path d=\"M20 115L250 115L250 30Z\" fill=\"#ede9fe\" stroke=\"#c4b5fd\" stroke-width=\"2\"/><path d=\"M40 108L240 38\" stroke=\"#7c3aed\" stroke-width=\"10\" stroke-linecap=\"round\"/><rect x=\"118\" y=\"64\" width=\"36\" height=\"25\" rx=\"5\" fill=\"#64748b\" transform=\"rotate(-19 136 76)\"/><path d=\"M115 88l-12 13m24 -8l-12 13m24 -8l-12 13\" stroke=\"#ea580c\" stroke-width=\"3\"/><text x=\"20\" y=\"20\" fill=\"#c2410c\" font-size=\"13\" font-weight=\"700\">μ &gt; 0<\/text><\/svg><p>Ishqalanish sabab energiyaning bir qismi issiqlikka aylanadi.<\/p><div class=\"formula\">η &lt; 100%<\/div><\/div>\n <\/div>\n <div class=\"box\" style=\"margin-top:14px\"><h3>Joriy parametrlar uchun FIK<\/h3><div id=\"analysisEff\" class=\"meter\">— %<\/div><p id=\"analysisText\">Ishqalanish qiymatini o‘zgartirib, natijani kuzating.<\/p><\/div>\n <div class=\"box\" style=\"margin-top:14px\"><h3>Xulosa savollari<\/h3><p>1. Qiya tekislik qanday vazifani bajaradi?<\/p><textarea id=\"answer1\" placeholder=\"Javobingizni yozing...\"><\/textarea><p>2. To‘la va foydali ish qanday aniqlanadi?<\/p><textarea id=\"answer2\" placeholder=\"Javobingizni yozing...\"><\/textarea><p>3. Ishqalanish ortganda FIK qanday o‘zgaradi va nima uchun?<\/p><textarea id=\"answer3\" placeholder=\"Javobingizni yozing...\"><\/textarea><div class=\"actions\"><button class=\"btn\" onclick=\"checkConclusion()\">Xulosani tekshirish<\/button><button class=\"btn secondary\" onclick=\"fillConclusion()\">Namunaviy xulosani ko‘rish<\/button><\/div><div id=\"conclusionFeedback\" style=\"margin-top:12px\"><\/div><\/div>\n<\/section>\n\n<section class=\"panel\" data-title=\"Test\">\n <div class=\"eyebrow\">Bilimni tekshirish<\/div><h2>Yakuniy test<\/h2><p>Har bir savol uchun bitta javob tanlang, so‘ng “Testni tekshirish” tugmasini bosing.<\/p>\n <div id=\"quiz\"><\/div><div class=\"actions\"><button class=\"btn\" onclick=\"checkQuiz()\">Testni tekshirish<\/button><button class=\"btn secondary\" onclick=\"resetQuiz()\">Qayta ishlash<\/button><\/div><div id=\"quizResult\" style=\"margin-top:14px\"><\/div>\n<\/section>\n\n<section class=\"panel\" data-title=\"Yakun\">\n <div class=\"hero\"><div><div class=\"eyebrow\">Laboratoriya yakuni<\/div><h1>LABORATORIYA ISHI YAKUNLANDI!<\/h1><p>Qiya tekislikning FIKini tajriba orqali aniqladingiz, fizik kattaliklarni o‘lchadingiz, ishlarni hisoblab chiqdingiz va natijalarni tahlil qildingiz.<\/p><div class=\"actions\"><button class=\"btn\" onclick=\"go(5)\">Tajribani qayta bajarish<\/button><button class=\"btn secondary\" onclick=\"go(7)\">Natijalarni ko‘rish<\/button><button class=\"btn secondary\" onclick=\"go(8)\">Yakuniy test<\/button><\/div><\/div><div class=\"hero-art\"><svg viewBox=\"0 0 300 240\"><circle cx=\"150\" cy=\"120\" r=\"86\" fill=\"#dbeafe\"/><circle cx=\"150\" cy=\"120\" r=\"63\" fill=\"#c4b5fd\"/><path d=\"M112 120l25 25 52-58\" fill=\"none\" stroke=\"#fff\" stroke-width=\"13\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M65 205l18-15m134 10l18 15M150 18v-12\" stroke=\"#7c3aed\" stroke-width=\"4\" stroke-linecap=\"round\"/><\/svg><\/div><\/div>\n <div class=\"box\" style=\"margin-top:16px\"><h3>Esda tuting<\/h3><div class=\"formula\">η = (A<sub>foydali<\/sub> / A<sub>to‘la<\/sub>) · 100%<\/div><p class=\"muted\">FIK foydali ishning to‘la ishga nisbatini foizlarda ifodalaydi. Haqiqiy mexanizmlarda energiya yo‘qotishlari sababli FIK odatda 100% dan kichik.<\/p><\/div>\n<\/section>\n\n<div class=\"footer-nav\"><button class=\"btn secondary\" id=\"prevBtn\" onclick=\"go(current-1)\">← Oldingi<\/button><span class=\"muted small\" id=\"pageLabel\">1 / 9<\/span><button class=\"btn\" id=\"nextBtn\" onclick=\"go(current+1)\">Keyingi →<\/button><\/div>\n<\/main>\n<script>\nconst panels=[...document.querySelectorAll('.panel')], nav=document.getElementById('nav');\nlet current=0, measured=false, trials=[], moving=false;\npanels.forEach((p,i)=>{const b=document.createElement('button');b.textContent=(i+1)+'. '+p.dataset.title;b.onclick=()=>go(i);nav.appendChild(b)});\nfunction go(i){i=Math.max(0,Math.min(panels.length-1,i));current=i;panels.forEach((p,j)=>p.classList.toggle('active',j===i));[...nav.children].forEach((b,j)=>b.classList.toggle('active',j===i));document.getElementById('progressFill').style.width=((i+1)/panels.length*100)+'%';document.getElementById('pageLabel').textContent=(i+1)+' / '+panels.length;document.getElementById('prevBtn').disabled=i===0;document.getElementById('nextBtn').disabled=i===panels.length-1;window.scrollTo({top:0,behavior:'smooth'});if(i===5)updateCalc()}\nconst plans=[['1-reja. Maqsad va jihozlar','Jihozlar bilan tanishamiz, massani, uzunlikni va balandlikni o‘lchashni o‘rganamiz.'],['2-reja. Tajribani bajarish','Yukni qiya tekislik bo‘ylab tekis tortib, kuch va masofani o‘lchaymiz hamda bajarilgan ishlarni hisoblaymiz.'],['3-reja. FIK va xulosa','Foydali ishning to‘la ishga nisbatini aniqlab, ishqalanishning ta’sirini tahlil qilamiz.']];\nfunction showPlan(i){document.getElementById('planTitle').textContent=plans[i][0];document.getElementById('planText').textContent=plans[i][1]}\nconst equipment=[['📐','Qiya tekislik','Yuk harakatlanadigan qiya sirt. Uzunligi s va balandligi h o‘lchanadi.'],['🧱','Yuk / brusok','Massasi tarozi bilan aniqlanadi; birlik — kg.'],['🪝','Dinamometr','Yukni tortish kuchini o‘lchaydi; birlik — N.'],['📏','Chizg‘ich','Masofani va tekislik o‘lchamlarini aniqlash uchun.'],['⚖️','Tarozi','Yuk massasini kilogrammda aniqlaydi.'],['↕️','Balandlik o‘lchagich','Vertikal balandlik h ni o‘lchaydi; birlik — m.'],['🧮','Hisoblash vositasi','Ish va FIKni formulalar orqali hisoblash uchun.'],['📋','Natijalar jadvali','O‘lchov va hisob natijalarini yozib borish uchun.']];\nconst eq=document.getElementById('equipment');equipment.forEach((e,i)=>{let d=document.createElement('button');d.className='equip';d.innerHTML=`<span class=\"emoji\">${e[0]}<\/span><b>${e[1]}<\/b><small>Ko‘rish uchun bosing<\/small>`;d.onclick=()=>{document.getElementById('equipTitle').textContent=e[1];document.getElementById('equipDesc').textContent=e[2]};eq.appendChild(d)});\nconst procedure=['Qiya tekislikni tayanchga o‘rnating.','Yukning massasini aniqlang.','Tekislik uzunligi va balandligini o‘lchang.','Yukni dinamometrga ulang.','Yukni tekis harakat bilan yuqoriga torting.','Dinamometr ko‘rsatgan kuchni qayd eting.','Bosib o‘tilgan masofani aniqlang.','To‘la va foydali ishni hisoblang.','FIKni foizlarda aniqlang.','Natijalar asosida xulosa chiqaring.'];\ndocument.getElementById('steps').innerHTML=procedure.map((s,i)=>`<label class=\"step\"><input type=\"checkbox\"><span><b>${i+1}.<\/b> ${s}<\/span><\/label>`).join('');\nconst $=id=>document.getElementById(id), val=id=>Number($(id).value), fmt=(x,n=2)=>Number(x).toFixed(n);\nfunction getData(){let m=val('mass'),s=val('length'),h=val('height'),mu=val('friction');if(h>=s){h=Math.max(.1,s-.1);$('height').value=h;$('heightOut').textContent=fmt(h,1)+' m'}const sin=h/s,cos=Math.sqrt(Math.max(0,1-sin*sin)),F=m*9.8*(sin+mu*cos),At=F*s,Af=m*9.8*h,eta=At>0?Af/At*100:0;return {m,s,h,mu,F,At,Af,eta,sin,cos}}\nfunction updateScene(){const d=getData();$('massOut').textContent=fmt(d.m,1)+' kg';$('lengthOut').textContent=fmt(d.s,1)+' m';$('heightOut').textContent=fmt(d.h,1)+' m';$('frictionOut').textContent=fmt(d.mu,2);let x0=80,y0=300,x1=490,y1=300-d.h/d.s*190;let dx=x1-x0,dy=y1-y0,ang=Math.atan2(dy,dx)*180/Math.PI;let pos=Number($('scene').dataset.pos||.42),bx=x0+dx*pos,by=y0+dy*pos;\n$('scene').innerHTML=`<defs><linearGradient id=\"slope\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop stop-color=\"#93c5fd\"/><stop offset=\"1\" stop-color=\"#2563eb\"/><\/linearGradient><linearGradient id=\"load\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop stop-color=\"#c4b5fd\"/><stop offset=\"1\" stop-color=\"#7c3aed\"/><\/linearGradient><\/defs>\n<path d=\"M45 300H545\" stroke=\"#64748b\" stroke-width=\"4\"/><path d=\"M${x0} ${y0}L${x1} ${y1}L${x1} ${y0}Z\" fill=\"#dbeafe\" stroke=\"#93c5fd\" stroke-width=\"2\"/><path d=\"M${x0} ${y0}L${x1} ${y1}\" stroke=\"url(#slope)\" stroke-width=\"15\" stroke-linecap=\"round\"/>\n<path d=\"M${x1+22} ${y0}V${y1}\" stroke=\"#059669\" stroke-width=\"2\" stroke-dasharray=\"5 5\"/><text x=\"${x1+29}\" y=\"${(y0+y1)/2}\" font-size=\"15\" fill=\"#047857\" font-weight=\"700\">h=${fmt(d.h,1)} m<\/text>\n<path d=\"M${x0} ${y0+24}H${x1}\" stroke=\"#64748b\" stroke-width=\"2\"/><path d=\"M${x0} ${y0+18}v12M${x1} ${y0+18}v12\" stroke=\"#64748b\" stroke-width=\"2\"/><text x=\"${(x0+x1)/2-35}\" y=\"${y0+45}\" f
