ht Weight Position\n            const rightX = (l2 / 10) * maxLeverLength;\n            drawWeight(richagCtx, rightX, 10, f2, '#10b981', `F₂=${f2}N`, `l₂=${l2}m`);\n\n            richagCtx.restore();\n\n            requestAnimationFrame(drawRichagFrame);\n        }\n\n        function drawWeight(ctx, x, y, forceValue, color, labelForce, labelLength) {\n            const size = 24 + (forceValue / 100) * 26; // Dynamic box size based on mass\n\n            // Rope line connecting weight to beam\n            ctx.beginPath();\n            ctx.moveTo(x, y);\n            ctx.lineTo(x, y + 25);\n            ctx.strokeStyle = '#cbd5e1';\n            ctx.lineWidth = 2;\n            ctx.stroke();\n\n            // Weight Box Body\n            ctx.fillStyle = color;\n            ctx.beginPath();\n            ctx.roundRect(x - size / 2, y + 25, size, size, 8);\n            ctx.fill();\n            ctx.strokeStyle = '#ffffff';\n            ctx.lineWidth = 1.5;\n            ctx.stroke();\n\n            // Weight Hook Ring\n            ctx.beginPath();\n            ctx.arc(x, y + 20, 5, 0, Math.PI * 2);\n            ctx.strokeStyle = '#cbd5e1';\n            ctx.lineWidth = 2;\n            ctx.stroke();\n\n            // Labels inside box\n            ctx.fillStyle = '#ffffff';\n            ctx.font = 'bold 11px Inter, sans-serif';\n            ctx.textAlign = 'center';\n            ctx.fillText(`${forceValue}N`, x, y + 25 + size / 2 + 4);\n\n            // Force Arrow (Vector) pointing down\n            ctx.beginPath();\n            ctx.moveTo(x, y + 25 + size + 5);\n            ctx.lineTo(x, y + 25 + size + 35);\n            ctx.strokeStyle = color;\n            ctx.lineWidth = 3;\n            ctx.stroke();\n\n            // Arrow Tip\n            ctx.beginPath();\n            ctx.moveTo(x - 5, y + 25 + size + 28);\n            ctx.lineTo(x, y + 25 + size + 36);\n            ctx.lineTo(x + 5, y + 25 + size + 28);\n            ctx.fillStyle = color;\n            ctx.fill();\n\n            // Distance Label\n            ctx.fillStyle = '#94a3b8';\n            ctx.font = '11px Inter, sans-serif';\n            ctx.fillText(labelLength, x, -18);\n        }\n\n        // =================================================================\n        // 2. BLOKLAR (PULLEYS) SIMULATION ENGINE\n        // =================================================================\n        let fixedCanvas, fixedCtx, movableCanvas, movableCtx;\n        let isAutoPulling = false;\n        let pullAnimDirection = 1;\n\n        function initBloklarCanvases() {\n            fixedCanvas = document.getElementById('canvasFixedPulley');\n            movableCanvas = document.getElementById('canvasMovablePulley');\n            if (!fixedCanvas || !movableCanvas) return;\n\n            const w = fixedCanvas.parentElement.clientWidth;\n            const h = fixedCanvas.parentElement.clientHeight;\n\n            fixedCanvas.width = w;\n            fixedCanvas.height = h;\n            movableCanvas.width = w;\n            movableCanvas.height = h;\n\n            fixedCtx = fixedCanvas.getContext('2d');\n            movableCtx = movableCanvas.getContext('2d');\n\n            updateBloklar();\n        }\n\n        function updateBloklar() {\n            const pMass = parseFloat(document.getElementById('input-p-mass').value);\n            const pullPct = parseFloat(document.getElementById('input-rope-pull').value) / 100;\n\n            document.getElementById('lbl-p-mass').innerText = pMass;\n            document.getElementById('lbl-rope-pull').innerText = Math.round(pullPct * 100);\n\n            // Fixed Pulley Metrics\n            document.getElementById('fixed-f-val').innerText = `${pMass} N`;\n            const fixedH = pullPct * 2.0; // Max 2.0 meters\n            document.getElementById('fixed-h-val').innerText = `${fixedH.toFixed(2)} m`;\n\n            // Movable Pulley Metrics\n            const movableF = pMass / 2;\n            const movableH = pullPct * 1.0; // Half height lift for same rope pulled\n            document.getElementById('movable-f-val').innerText = `${movableF.toFixed(1)} N`;\n            document.getElementById('movable-h-val').innerText = `${movableH.toFixed(2)} m`;\n\n            drawFixedPulley(fixedCtx, fixedCanvas.width, fixedCanvas.height, pMass, pullPct);\n            drawMovablePulley(movableCtx, movableCanvas.width, movableCanvas.height, pMass, pullPct);\n        }\n\n        function toggleRopePullAnimation() {\n            isAutoPulling = !isAutoPulling;\n            const btnLabel = document.getElementById('lbl-anim-play');\n            const btnIcon = document.getElementById('icon-anim-play');\n\n            if (isAutoPulling) {\n                btnLabel.innerText = \"To'xtatish\";\n                btnIcon.className = \"fa-solid fa-pause\";\n                requestAnimationFrame(animateRopeLoop);\n            } else {\n                btnLabel.innerText = \"Avto Tortish\";\n                btnIcon.className = \"fa-solid fa-play\";\n            }\n        }\n\n        function animateRopeLoop() {\n            if (!isAutoPulling) return;\n\n            const slider = document.getElementById('input-rope-pull');\n            let val = parseFloat(slider.value);\n\n            val += pullAnimDirection * 0.8;\n            if (val >= 100) {\n                val = 100;\n                pullAnimDirection = -1;\n            } else if (val <= 0) {\n                val = 0;\n                pullAnimDirection = 1;\n            }\n\n            slider.value = val;\n            updateBloklar();\n\n            requestAnimationFrame(animateRopeLoop);\n        }\n\n        function resetBloklar() {\n            isAutoPulling = false;\n            document.getElementById('lbl-anim-play').innerText = \"Avto Tortish\";\n            document.getElementById('icon-anim-play').className = \"fa-solid fa-play\";\n            document.getElementById('input-p-mass').value = 100;\n            document.getElementById('input-rope-pull').value = 0;\n            updateBloklar();\n        }\n\n        // Draw Fixed Pulley\n        function drawFixedPulley(ctx, w, h, loadN, pullRatio) {\n            ctx.clearRect(0, 0, w, h);\n\n            const cx = w / 2;\n            const topY = 40;\n            const pulleyR = 28;\n\n            // Ceiling mount\n            ctx.fillStyle = '#475569';\n            ctx.fillRect(cx - 40, 0, 80, 15);\n            ctx.beginPath();\n            ctx.moveTo(cx, 15);\n            ctx.lineTo(cx, topY);\n            ctx.strokeStyle = '#94a3b8';\n            ctx.lineWidth = 4;\n            ctx.stroke();\n\n            // Pulley Wheel\n            ctx.beginPath();\n            ctx.arc(cx, topY, pulleyR, 0, Math.PI * 2);\n            ctx.fillStyle = '#3b82f6';\n            ctx.fill();\n            ctx.lineWidth = 3;\n            ctx.strokeStyle = '#60a5fa';\n            ctx.stroke();\n\n            // Inner axle\n            ctx.beginPath();\n            ctx.arc(cx, topY, 6, 0, Math.PI * 2);\n            ctx.fillStyle = '#ffffff';\n            ctx.fill();\n\n            // Calculate Load Position (Left side of pulley)\n            const baseLoadY = h - 70;\n            const maxLift = h - 160;\n            const loadY = baseLoadY - (pullRatio * maxLift);\n\n            // Left Rope (to Load)\n            ctx.beginPath();\n            ctx.moveTo(cx - pulleyR, topY);\n            ctx.lineTo(cx - pulleyR, loadY);\n            ctx.strokeStyle = '#cbd5e1';\n            ctx.lineWidth = 3;\n            ctx.stroke();\n\n            // Right Rope (Hand pull)\n            const handY = topY + 40 + (pullRatio * maxLift);\n            ctx.beginPath();\n            ctx.moveTo(cx + pulleyR, topY);\n            ctx.lineTo(cx + pulleyR, handY);\n            ctx.strokeStyle = '#cbd5e1';\n            ctx.lineWidth = 3;\n            ctx.stroke();\n\n            // Load Box (Left)\n            const boxSize = 38;\n            ctx.fillStyle = '#f59e0b';\n            ctx.fillRect(cx - pulleyR - boxSize / 2, loadY, boxSize, boxSize);\n            ctx.fillStyle = '#ffffff';\n            ctx.font = 'bold 11px Inter';\n            ctx.textAlign = 'center';\n            ctx.fillText(`${loadN}N`, cx - pulleyR, loadY + boxSize / 2 + 4);\n\n            // Hand Pull Vector (Right)\n            ctx.fillStyle = '#60a5fa';\n            ctx.beginPath();\n            ctx.arc(cx + pulleyR, handY, 8, 0, Math.PI * 2);\n            ctx.fill();\n\n            // Pull Direction Arrow Down\n            ctx.beginPath();\n            ctx.moveTo(cx + pulleyR, handY + 8);\n            ctx.lineTo(cx + pulleyR, handY + 32);\n            ctx.strokeStyle = '#3b82f6';\n            ctx.lineWidth = 3;\n            ctx.stroke();\n            ctx.fillStyle = '#3b82f6';\n            ctx.fillText(`F = ${loadN}N`, cx + pulleyR + 35, handY + 22);\n        }\n\n        // Draw Movable Pulley\n        function drawMovablePulley(ctx, w, h, loadN, pullRatio) {\n            ctx.clearRect(0, 0, w, h);\n\n            const cx = w / 2;\n            const pulleyR = 28;\n\n            // Ceiling mount for Fixed rope end (Left)\n            ctx.fillStyle = '#475569';\n            ctx.fillRect(cx - 60, 0, 120, 15);\n\n            // Left rope anchor point\n            const anchorX = cx - pulleyR;\n            ctx.beginPath();\n            ctx.moveTo(anchorX, 15);\n            ctx.lineTo(anchorX, 30);\n            ctx.strokeStyle = '#94a3b8';\n            ctx.lineWidth = 3;\n            ctx.stroke();\n\n            // Movable Pulley Position (moves at half speed of rope pull)\n            const basePulleyY = h - 90;\n            const maxLift = (h - 160) / 2;\n            const pulleyY = basePulleyY - (pullRatio * maxLift);\n\n            // Rope from Left Anchor -> Down to Movable Pulley -> Up to Hand (Right)\n            ctx.beginPath();\n            ctx.moveTo(anchorX, 25);\n            ctx.lineTo(anchorX, pulleyY);\n            ctx.arc(cx, pulleyY, pulleyR, Math.PI, 0, true);\n\n            const handY = Math.max(30, basePulleyY - (pullRatio * maxLift * 2));\n            ctx.lineTo(cx + pulleyR, handY);\n            ctx.strokeStyle = '#cbd5e1';\n            ctx.lineWidth = 3;\n            ctx.stroke();\n\n            // Movable Pulley Wheel Body\n            ctx.beginPath();\n            ctx.arc(cx, pulleyY, pulleyR, 0, Math.PI * 2);\n            ctx.fillStyle = '#10b981';\n            ctx.fill();\n            ctx.lineWidth = 3;\n            ctx.strokeStyle = '#34d399';\n            ctx.stroke();\n\n            // Axle Pin\n            ctx.beginPath();\n            ctx.arc(cx, pulleyY, 6, 0, Math.PI * 2);\n            ctx.fillStyle = '#ffffff';\n            ctx.fill();\n\n            // Load hanging below movable pulley\n            const boxSize = 38;\n            const boxY = pulleyY + pulleyR + 15;\n\n            ctx.beginPath();\n            ctx.moveTo(cx, pulleyY + 6);\n            ctx.lineTo(cx, boxY);\n            ctx.strokeStyle = '#94a3b8';\n            ctx.lineWidth = 2;\n            ctx.stroke();\n\n            ctx.fillStyle = '#f59e0b';\n            ctx.fillRect(cx - boxSize / 2, boxY, boxSize, boxSize);\n            ctx.fillStyle = '#ffffff';\n            ctx.font = 'bold 11px Inter';\n            ctx.textAlign = 'center';\n            ctx.fillText(`${loadN}N`, cx, boxY + boxSize / 2 + 4);\n\n            // Pull Hand Indicator (Right)\n            ctx.fillStyle = '#10b981';\n            ctx.beginPath();\n            ctx.arc(cx + pulleyR, handY, 8, 0, Math.PI * 2);\n            ctx.fill();\n\n            // Force Arrow UP\n            ctx.beginPath();\n            ctx.moveTo(cx + pulleyR, handY - 8);\n            ctx.lineTo(cx + pulleyR, handY - 32);\n            ctx.strokeStyle = '#10b981';\n            ctx.lineWidth = 3;\n            ctx.stroke();\n            ctx.fillStyle = '#10b981';\n            ctx.fillText(`F = ${(loadN/2).toFixed(1)}N`, cx + pulleyR + 40, handY - 16);\n        }\n\n        // =================================================================\n        // 3. CHIG'IRIQ (WHEEL & AXLE) SIMULATION ENGINE\n        // =================================================================\n        let chigiriqCanvas, chigiriqCtx;\n        let chigiriqRotation = 0;\n\n        function initChigiriqCanvas() {\n            chigiriqCanvas = document.getElementById('chigiriqCanvas');\n            if (!chigiriqCanvas) return;\n            const container = chigiriqCanvas.parentElement;\n            chigiriqCanvas.width = container.clientWidth;\n            chigiriqCanvas.height = container.clientHeight;\n            chigiriqCtx = chigiriqCanvas.getContext('2d');\n            updateChigiriq();\n        }\n\n        function updateChigiriq() {\n            const R = parseFloat(document.getElementById('input-chigiriq-R').value);\n            const r = parseFloat(document.getElementById('input-chigiriq-r').value);\n            const P = parseFloat(document.getElementById('input-chigiriq-P').value);\n\n            // Calculations\n            const F = P * (r / R);\n            const gain = R / r;\n\n            document.getElementById('lbl-chigiriq-R').innerText = R;\n            document.getElementById('lbl-chigiriq-r').innerText = r;\n            document.getElementById('lbl-chigiriq-P').innerText = P;\n\n            document.getElementById('calc-chigiriq-F').innerText = `${F.toFixed(1)} N`;\n            document.getElementById('calc-chigiriq-gain').innerText = `${gain.toFixed(1)} marta`;\n            document.getElementById('chigiriq-balance-tag').innerText = `Kuchdan yutish: ${gain.toFixed(1)} marta`;\n\n            drawChigiriqFrame();\n        }\n\n        function drawChigiriqFrame() {\n            if (!chigiriqCtx) return;\n            const w = chigiriqCanvas.width;\n            const h = chigiriqCanvas.height;\n\n            chigiriqCtx.clearRect(0, 0, w, h);\n\n            const R = parseFloat(document.getElementById('input-chigiriq-R').value);\n            const r = parseFloat(document.getElementById('input-chigiriq-r').value);\n            const P = parseFloat(document.getElementById('input-chigiriq-P').value);\n            const F = P * (r / R);\n\n            // Side View Center (Left half)\n            const cx1 = w * 0.3;\n            const cy = h * 0.5;\n\n            // Visual Scale Factors\n            const pxR = R * 2.8;\n            const pxr = r * 2.8;\n\n            // Increment subtle rotation angle for life\n            chigiriqRotation += 0.005;\n\n            // ---------------- DRAW FRONT WHEEL VIEW (LEFT) ----------------\n            // Outer Big Wheel (Radius R)\n            chigiriqCtx.beginPath();\n            chigiriqCtx.arc(cx1, cy, pxR, 0, Math.PI * 2);\n            chigiriqCtx.fillStyle = 'rgba(168, 85, 247, 0.15)';\n            chigiriqCtx.fill();\n            chigiriqCtx.strokeStyle = '#c084fc';\n            chigiriqCtx.lineWidth = 4;\n            chigiriqCtx.stroke();\n\n            // Inner Small Axle (Radius r)\n            chigiriqCtx.beginPath();\n            chigiriqCtx.arc(cx1, cy, pxr, 0, Math.PI * 2);\n            chigiriqCtx.fillStyle = 'rgba(99, 102, 241, 0.3)';\n            chigiriqCtx.fill();\n            chigiriqCtx.strokeStyle = '#818cf8';\n            chigiriqCtx.lineWidth = 3;\n            chigiriqCtx.stroke();\n\n            // Wheel Spokes\n            for (let i = 0; i < 4; i++) {\n                const angle = chigiriqRotation + (i * Math.PI / 2);\n                chigiriqCtx.beginPath();\n                chigiriqCtx.moveTo(cx1, cy);\n                chigiriqCtx.lineTo(cx1 + Math.cos(angle) * pxR, cy + Math.sin(angle) * pxR);\n                chigiriqCtx.strokeStyle = 'rgba(192, 132, 252, 0.4)';\n                chigiriqCtx.lineWidth = 2;\n                chigiriqCtx.stroke();\n            }\n\n            // Rope on Big Wheel (Outer Force F) - Right side of big wheel\n            chigiriqCtx.beginPath();\n            chigiriqCtx.moveTo(cx1 + pxR, cy);\n            chigiriqCtx.lineTo(cx1 + pxR, cy + 100);\n            chigiriqCtx.strokeStyle = '#c084fc';\n            chigiriqCtx.lineWidth = 3;\n            chigiriqCtx.stroke();\n\n            // Force Arrow F\n            chigiriqCtx.fillStyle = '#c084fc';\n            chigiriqCtx.font = 'bold 12px Inter';\n            chigiriqCtx.fillText(`F = ${F.toFixed(1)}N`, cx1 + pxR + 10, cy + 80);\n\n            // Rope on Small Axle (Inner Load P) - Left side of axle\n            chigiriqCtx.beginPath();\n            chigiriqCtx.moveTo(cx1 - pxr, cy);\n            chigiriqCtx.lineTo(cx1 - pxr, cy + 110);\n            chigiriqCtx.strokeStyle = '#f59e0b';\n            chigiriqCtx.lineWidth = 3;\n            chigiriqCtx.stroke();\n\n            // Load Box P\n            chigiriqCtx.fillStyle = '#f59e0b';\n            chigiriqCtx.fillRect(cx1 - pxr - 18, cy + 110, 36, 30);\n            chigiriqCtx.fillStyle = '#ffffff';\n            chigiriqCtx.font = 'bold 11px Inter';\n            chigiriqCtx.textAlign = 'center';\n            chigiriqCtx.fillText(`${P}N`, cx1 - pxr, cy + 128);\n\n            // Center Pin\n            chigiriqCtx.beginPath();\n            chigiriqCtx.arc(cx1, cy, 6, 0, Math.PI * 2);\n            chigiriqCtx.fillStyle = '#ffffff';\n            chigiriqCtx.fill();\n\n            // ---------------- DRAW 3D PROFILE VIEW (RIGHT) ----------------\n            const cx2 = w * 0.75;\n            \n            // Stand Support\n            chigiriqCtx.fillStyle = '#334155';\n            chigiriqCtx.fillRect(cx2 - 70, cy + 80, 140, 12);\n            \n            chigiriqCtx.beginPath();\n            chigiriqCtx.moveTo(cx2 - 40, cy + 80);\n            chigiriqCtx.lineTo(cx2 - 10, cy);\n            chigiriqCtx.lineTo(cx2 + 10, cy);\n            chigiriqCtx.lineTo(cx2 + 40, cy + 80);\n            chigiriqCtx.fillStyle = '#475569';\n            chigiriqCtx.fill();\n\n            // Axle Shaft Cylinder (Horizontal)\n            chigiriqCtx.fillStyle = '#818cf8';\n            chigiriqCtx.fillRect(cx2 - 50, cy - pxr, 100, pxr * 2);\n            chigiriqCtx.strokeStyle = '#6366f1';\n            chigiriqCtx.lineWidth = 2;\n            chigiriqCtx.strokeRect(cx2 - 50, cy - pxr, 100, pxr * 2);\n\n            // Big Wheel Disk (Side view profile)\n            chigiriqCtx.fillStyle = '#c084fc';\n            chigiriqCtx.fillRect(cx2 + 20, cy - pxR, 15, pxR * 2);\n            chigiriqCtx.strokeStyle = '#e9d5ff';\n            chigiriqCtx.strokeRect(cx2 + 20, cy - pxR, 15, pxR * 2);\n\n            // Labels for Radii R and r\n            chigiriqCtx.fillStyle = '#e2e8f0';\n            chigiriqCtx.font = '12px Inter';\n            chigiriqCtx.textAlign = 'center';\n            chigiriqCtx.fillText(`G'ildirak (R = ${R}cm)`, cx1, cy - pxR - 15);\n            chigiriqCtx.fillText(`Val (r = ${r}cm)`, cx1, cy - pxr - 8);\n        }\n\n        // =================================================================\n        // INITIALIZATION ON LOAD\n        // =================================================================\n        window.onload = function() {\n            initRichagCanvas();\n            initBloklarCanvases();\n            initChigiriqCanvas();\n\n            updateRichag();\n            updateBloklar();\n            updateChigiriq();\n\n            // Start main animation frame loop for Richag tilt transition\n            requestAnimationFrame(drawRichagFrame);\n        };\n    <\/script>\n<\/body>\n<\/html>"}, {"id": "14-mavzu", "n": "14", "t": "Masalalar: kuch momenti va mexanizmlar", "d": "Kalkulyator, bosqichma-bosqich yechim, amaliy vaziyatlar", "k": "Masala", "html": "<!DOCTYPE html>\n<html lang=\"uz\" class=\"h-full bg-slate-900 text-slate-100\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>14-mavzu: Masalalar Yechish - Kuch Momenti va Oddiy Mexanizmlar<\/title>\n  <!-- Tailwind CSS CDN -->\n  <script src=\"https://cdn.tailwindcss.com\"><\/script>\n  <!-- FontAwesome Icons -->\n  <link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css\">\n  <!-- Google Fonts: Inter -->\n  <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap\" rel=\"stylesheet\">\n  <style>\n    body {\n      font-family: 'Inter', sans-serif;\n    }\n    /* Custom Scrollbar */\n    ::-webkit-scrollbar {\n      width: 8px;\n      height: 8px;\n    }\n    ::-webkit-scrollbar-track {\n      background: #0f172a;\n    }\n    ::-webkit-scrollbar-thumb {\n      background: #334155;\n      border-radius: 4px;\n    }\n    ::-webkit-scrollbar-thumb:hover {\n      background: #475569;\n    }\n    .tab-btn.active {\n      background-color: #2563eb;\n      color: #ffffff;\n      box-shadow: 0 4px 14px 0 rgba(37, 99, 235, 0.39);\n    }\n  <\/style>\n<\/head>\n<body class=\"h-full flex flex-col justify-between overflow-x-hidden\">\n\n  <!-- TOP HEADER -->\n  <header class=\"bg-slate-800/80 backdrop-blur border-b border-slate-700 sticky top-0 z-50\">\n    <div class=\"max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between\">\n      <div class=\"flex items-center space-x-3\">\n        <div class=\"w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white text-xl font-bold shadow-lg shadow-blue-500/30\">\n          <i class=\"fa-solid fa-scale-balanced\"><\/i>\n        <\/div>\n        <div>\n          <h1 class=\"text-lg font-bold text-white tracking-wide\">14-Mavzu: Masalalar Yechish<\/h1>\n          <p class=\"text-xs text-blue-400\">Kuch momenti, Momentlar qoidasi va Oddiy mexanizmlar<\/p>\n        <\/div>\n      <\/div>\n      <!-- Tab Navigation Buttons -->\n      <nav class=\"flex space-x-1 sm:space-x-2 bg-slate-900/60 p-1.5 rounded-xl border border-slate-700/60\">\n        <button onclick=\"switchTab('formulas')\" id=\"tab-formulas\" class=\"tab-btn active px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-medium transition-all duration-200 flex items-center space-x-2\">\n          <i class=\"fa-solid fa-book-bookmark\"><\/i>\n          <span class=\"hidden md:inline\">Formulalar<\/span>\n        <\/button>\n        <button onclick=\"switchTab('lab')\" id=\"tab-lab\" class=\"tab-btn px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-medium text-slate-300 hover:text-white transition-all duration-200 flex items-center space-x-2\">\n          <i class=\"fa-solid fa-flask\"><\/i>\n          <span>Masala Lab-Simulyatori<\/span>\n        <\/button>\n        <button onclick=\"switchTab('sandbox')\" id=\"tab-sandbox\" class=\"tab-btn px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-medium text-slate-300 hover:text-white transition-all duration-200 flex items-center space-x-2\">\n          <i class=\"fa-solid fa-screwdriver-wrench\"><\/i>\n          <span class=\"hidden md:inline\">Amaliy Sandbox<\/span>\n        <\/button>\n      <\/nav>\n    <\/div>\n  <\/header>\n\n  <!-- MAIN CONTENT CONTAINER -->\n  <main class=\"max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-grow w-full\">\n\n    <!-- ================================================================= -->\n    <!-- SECTION 1: FORMULAS & INTERACTIVE REFERENCE -->\n    <!-- ================================================================= -->\n    <section id=\"section-formulas\" class=\"space-y-6\">\n      <div class=\"bg-slate-800/40 border border-slate-700/60 rounded-2xl p-6\">\n        <h2 class=\"text-xl font-bold text-white mb-2 flex items-center gap-2\">\n          <i class=\"fa-solid fa-graduation-cap text-blue-400\"><\/i>\n          Nazariy Formulalar va Qonuniyatlar Kalkulyatori\n        <\/h2>\n        <p class=\"text-slate-400 text-sm\">\n          Har bir formulaga tegishli kattaliklarni o'zgartirib, natijani real vaqt rejimida hisoblang va qonuniyatni o'rganing.\n        <\/p>\n      <\/div>\n\n      <div class=\"grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6\">\n\n        <!-- Formula 1: Kuch Momenti -->\n        <div class=\"bg-slate-800/80 border border-slate-700 rounded-2xl p-5 hover:border-blue-500/50 transition duration-300 flex flex-col justify-between shadow-xl\">\n          <div>\n            <div class=\"flex justify-between items-start mb-4\">\n              <span class=\"px-2.5 py-1 bg-blue-500/10 text-blue-400 border border-blue-500/20 text-xs font-semibold rounded-lg\">1-Formulalar Vizualizatsiyasi<\/span>\n              <i class=\"fa-solid fa-rotate-right text-slate-500\"><\/i>\n            <\/div>\n            <h3 class=\"text-lg font-bold text-white mb-1\">Kuch Momenti (M)<\/h3>\n            <p class=\"text-xs text-slate-400 mb-4\">Jismni aylantiruvchi kuch va uning elkasi ko'paytmasi.<\/p>\n            \n            <div class=\"bg-slate-900/80 p-3 rounded-xl text-center mb-4 border border-slate-700/50\">\n              <span class=\"text-2xl font-extrabold text-blue-400 tracking-wider\">M = F · l<\/span>\n            <\/div>\n\n            <!-- Interactive Inputs -->\n            <div class=\"space-y-3 text-xs\">\n              <div>\n                <div class=\"flex justify-between text-slate-300 mb-1\">\n                  <span>Kuch ($F$):<\/span>\n                  <span id=\"f1-val\" class=\"font-bold text-blue-400\">10 N<\/span>\n                <\/div>\n                <input type=\"range\" id=\"f1-range\" min=\"1\" max=\"100\" value=\"10\" oninput=\"calcMoment()\" class=\"w-full accent-blue-500 bg-slate-700 h-1.5 rounded-lg\">\n              <\/div>\n              <div>\n                <div class=\"flex justify-between text-slate-300 mb-1\">\n                  <span>Kuch elkasi ($l$):<\/span>\n                  <span id=\"l1-val\" class=\"font-bold text-blue-400\">2.0 m<\/span>\n                <\/div>\n                <input type=\"range\" id=\"l1-range\" min=\"0.1\" max=\"5.0\" step=\"0.1\" value=\"2.0\" oninput=\"calcMoment()\" class=\"w-full accent-blue-500 bg-slate-700 h-1.5 rounded-lg\">\n              <\/div>\n            <\/div>\n          <\/div>\n\n          <div class=\"mt-4 pt-3 border-t border-slate-700/60 bg-blue-950/30 -mx-5 -mb-5 p-4 rounded-b-2xl border-blue-900/30\">\n            <span class=\"text-xs text-slate-400\">Hisoblangan Moment ($M$):<\/span>\n            <div id=\"m1-result\" class=\"text-xl font-black text-emerald-400 mt-0.5\">20 N·m<\/div>\n          <\/div>\n        <\/div>\n\n        <!-- Formula 2: Richag Muvozanat Qoidasi -->\n        <div class=\"bg-slate-800/80 border border-slate-700 rounded-2xl p-5 hover:border-blue-500/50 transition duration-300 flex flex-col justify-between shadow-xl\">\n          <div>\n            <div class=\"flex justify-between items-start mb-4\">\n              <span class=\"px-2.5 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs font-semibold rounded-lg\">2-Richag Qoidasi<\/span>\n              <i class=\"fa-solid fa-balance-scale text-slate-500\"><\/i>\n            <\/div>\n            <h3 class=\"text-lg font-bold text-white mb-1\">Momentlar Qoidasi<\/h3>\n            <p class=\"text-xs text-slate-400 mb-4\">Muvozanat sharti: $F_1 \\cdot l_1 = F_2 \\cdot l_2$<\/p>\n            \n            <div class=\"bg-slate-900/80 p-3 rounded-xl text-center mb-4 border border-slate-700/50\">\n              <span class=\"text-lg font-extrabold text-emerald-400 tracking-wider\">F₁ · l₁ = F₂ · l₂<\/span>\n            <\/div>\n\n            <!-- Interactive Inputs -->\n            <div class=\"space-y-3 text-xs\">\n              <div class=\"grid grid-cols-2 gap-2\">\n                <div>\n                  <label class=\"text-slate-400\">F₁ (N):<\/label>\n                  <input type=\"number\" id=\"f1-richag\" value=\"40\" oninput=\"calcRichag()\" class=\"w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-white\">\n                <\/div>\n                <div>\n                  <label class=\"text-slate-400\">l₁ (m):<\/label>\n                  <input type=\"number\" id=\"l1-richag\" value=\"1.5\" step=\"0.1\" oninput=\"calcRichag()\" class=\"w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-white\">\n                <\/div>\n              <\/div>\n              <div class=\"grid grid-cols-2 gap-2\">\n                <div>\n                  <label class=\"text-slate-400\">l₂ (m):<\/label>\n                  <input type=\"number\" id=\"l2-richag\" value=\"3.0\" step=\"0.1\" oninput=\"calcRichag()\" class=\"w-full bg-slate-900 border border-slate-700 rounded p-1.5 text-white\">\n                <\/div>\n                <div>\n                  <label class=\"text-emerald-400 font-semibold\">Kerak F₂ (N):<\/label>\n                  <div id=\"f2-required\" class=\"w-full bg-slate-900/90 border border-emerald-500/50 rounded p-1.5 font-bold text-emerald-400\">20 N<\/div>\n                <\/div>\n              <\/div>\n            <\/div>\n          <\/div>\n\n          <div class=\"mt-4 pt-3 border-t border-slate-700/60 bg-emerald-950/20 -mx-5 -mb-5 p-4 rounded-b-2xl border-emerald-900/30 text-xs text-slate-300\">\n            <i class=\"fa-solid fa-circle-info text-emerald-400 mr-1\"><\/i>\n            Elka $l_2$ 2 baravar ortsa, talab qilinadigan kuch $F_2$ 2 baravar kamayadi.\n          <\/div>\n        <\/div>\n\n        <!-- Formula 3: Qo'zg'almas va Qo'zg'aluvchan Bloklar -->\n        <div class=\"bg-slate-800/80 border border-slate-700 rounded-2xl p-5 hover:border-blue-500/50 transition duration-300 flex flex-col justify-between shadow-xl\">\n          <div>\n            <div class=\"flex justify-between items-start mb-4\">\n              <span class=\"px-2.5 py-1 bg-amber-500/10 text-amber-400 border border-amber-500/20 text-xs font-semibold rounded-lg\">3-Bloklar Uroqligi<\/span>\n              <i class=\"fa-solid fa-gear text-slate-500\"><\/i>\n            <\/div>\n            <h3 class=\"text-lg font-bold text-white mb-1\">Bloklar Qoidasi<\/h3>\n            <p class=\"text-xs text-slate-400 mb-4\">Qo'zg'almas: kuch berilishi o'zgaradi. Qo'zg'aluvchan: 2 marta kuchdan yutadi.<\/p>\n\n            <div class=\"space-y-3 text-xs\">\n              <div class=\"bg-slate-900/80 p-2.5 rounded-xl border border-slate-700/50\">\n                <div class=\"flex justify-between text-slate-300\">\n                  <span>Qo'zg'almas blok ($F = P$):<\/span>\n                  <span id=\"fixed-block-force\" class=\"font-bold text-amber-400\">100 N<\/span>\n                <\/div>\n              <\/div>\n              <div class=\"bg-slate-900/80 p-2.5 rounded-xl border border-slate-700/50\">\n                <div class=\"flex justify-between text-slate-300\">\n                  <span>Qo'zg'aluvchan blok ($F = P/2$):<\/span>\n                  <span id=\"movable-block-force\" class=\"font-bold text-emerald-400\">50 N<\/span>\n                <\/div>\n              <\/div>\n              <div>\n                <label class=\"text-slate-400\">Yuk og'irligi ($P$, N):<\/label>\n                <input type=\"range\" id=\"block-weight\" min=\"10\" max=\"500\" value=\"100\" step=\"10\" oninput=\"calcBlocks()\" class=\"w-full accent-amber-500 bg-slate-700 h-1.5 rounded-lg mt-1\">\n              <\/div>\n            <\/div>\n          <\/div>\n\n          <div class=\"mt-4 pt-3 border-t border-slate-700/60 bg-amber-950/20 -mx-5 -mb-5 p-4 rounded-b-2xl border-amber-900/30 text-xs text-slate-300\">\n            <span class=\"text-slate-400\">Mexanikaning Oltin Qoidasi:<\/span>\n            <p class=\"font-semibold text-amber-300 mt-0.5\">Kuchdan necha marta yutshak, masofada shuncha marta yutqazamiz ($A_1 = A_2$).<\/p>\n          <\/div>\n        <\/div>\n\n      <\/div>\n    <\/section>\n\n    <!-- ================================================================= -->\n    <!-- SECTION 2: INTERACTIVE PROBLEM SOLVING LAB & SIMULATOR -->\n    <!-- ================================================================= -->\n    <section id=\"section-lab\" class=\"hidden space-y-6\">\n      \n      <!-- Top Control / Task Generator Header -->\n      <div class=\"bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-xl flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4\">\n        <div>\n          <div class=\"flex items-center space-x-2\">\n            <span id=\"problem-badge\" class=\"px-2.5 py-0.5 rounded-full text-xs font-bold bg-blue-500/20 text-blue-400 border border-blue-500/30\">1-Masala<\/span>\n            <h2 class=\"text-lg font-bold text-white\">Richag Muvozanati va Kuch Momenti Masalasi<\/h2>\n          <\/div>\n          <p id=\"problem-statement\" class=\"text-slate-300 text-sm mt-1\">\n            Massa/Kuch $F_1 = 120\\text{ N}$ yuk chap tarafda $l_1 = 1.0\\text{ m}$ masofaga qo'yilgan. Richagni muvozanatlash uchun o'ng tarafda $l_2 = 2.0\\text{ m}$ elkada qancha $F_2$ kuch qo'llash kerak?\n          <\/p>\n        <\/div>\n        <div class=\"flex flex-wrap items-center gap-2 w-full lg:w-auto justify-end\">\n          <button onclick=\"generateRandomProblem()\" class=\"px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-xl text-xs font-semibold transition flex items-center gap-2 border border-slate-600\">\n            <i class=\"fa-solid fa-dice text-amber-400\"><\/i>\n            Yangi Masala\n          <\/button>\n          <button onclick=\"resetLab()\" class=\"px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-xl text-xs font-semibold transition flex items-center gap-2 border border-slate-600\">\n            <i class=\"fa-solid fa-rotate-left\"><\/i>\n            Qayta Tiklash\n          <\/button>\n        <\/div>\n      <\/div>\n\n      <!-- Main Canvas & Control Panel Grid -->\n      <div class=\"grid grid-cols-1 lg:grid-cols-12 gap-6\">\n\n        <!-- Visual Canvas Simulator (8 cols) -->\n        <div class=\"lg:col-span-7 bg-slate-800/90 border border-slate-700 rounded-2xl p-4 flex flex-col justify-between shadow-2xl relative min-h-[380px]\">\n          <div class=\"flex justify-between items-center mb-2\">\n            <span class=\"text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2\">\n              <i class=\"fa-solid fa-eye text-blue-400\"><\/i> Real-Vaqt Vizual Simulyatsiya\n            <\/span>\n            <div id=\"balance-status-badge\" class=\"px-3 py-1 rounded-full text-xs font-extrabold bg-slate-700 text-slate-300 border border-slate-600\">\n              Kutilmoqda...\n            <\/div>\n          <\/div>\n\n          <!-- Canvas Element -->\n          <div class=\"w-full flex-grow bg-slate-900 rounded-xl overflow-hidden border border-slate-700/80 relative flex items-center justify-center p-2\">\n            <canvas id=\"leverCanvas\" class=\"w-full h-full block cursor-crosshair\"><\/canvas>\n          <\/div>\n\n          <!-- Interactive Sliders for Student Input -->\n          <div class=\"mt-4 bg-slate-900/80 p-4 rounded-xl border border-slate-700/60 space-y-3\">\n            <div class=\"flex items-center justify-between\">\n              <span class=\"text-xs font-semibold text-emerald-400\">O'ng taraf kuchi $F_2$ ni sozlang:<\/span>\n              <span id=\"student-f2-display\" class=\"text-sm font-extrabold text-emerald-400 bg-emerald-950/60 border border-emerald-500/30 px-3 py-0.5 rounded-lg\">60 N<\/span>\n            <\/div>\n            <input type=\"range\" id=\"student-f2-input\" min=\"5\" max=\"300\" value=\"60\" step=\"5\" oninput=\"updateLabState()\" class=\"w-full accent-emerald-500 bg-slate-700 h-2 rounded-lg cursor-pointer\">\n\n            <div class=\"flex gap-2 pt-2\">\n              <button onclick=\"checkAnswer()\" class=\"flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm rounded-xl transition shadow-lg shadow-emerald-600/30 flex items-center justify-center gap-2\">\n                <i class=\"fa-solid fa-circle-check\"><\/i>\n                Muvozanatni Tekshirish\n              <\/button>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <!-- Problem Analysis & Step-by-Step Solver (5 cols) -->\n        <div class=\"lg:col-span-5 bg-slate-800/90 border border-slate-700 rounded-2xl p-5 flex flex-col justify-between shadow-2xl\">\n          <div>\n            <h3 class=\"text-md font-bold text-white mb-3 pb-2 border-b border-slate-700 flex items-center gap-2\">\n              <i class=\"fa-solid fa-list-check text-indigo-400\"><\/i>\n              Bosqichma-Bosqich Tahlil & Yechim\n            <\/h3>\n\n            <!-- Result Feedback Alert -->\n            <div id=\"feedback-box\" class=\"hidden mb-4 p-4 rounded-xl border text-xs leading-relaxed transition-all duration-300\">\n              <!-- Dynamic JS content -->\n            <\/div>\n\n            <!-- Given / Formula / Steps Container -->\n            <div class=\"space-y-3 text-xs\">\n              <div class=\"bg-slate-900/60 p-3 rounded-xl border border-slate-700/50\">\n                <span class=\"text-slate-400 font-semibold block mb-1\">1. Berilgan kattaliklar:<\/span>\n                <div class=\"grid grid-cols-2 gap-2 text-slate-200 font-mono\">\n                  <div>$F_1 = <span id=\"given-f1\">120<\/span>\\text{ N}$<\/div>\n                  <div>$l_1 = <span id=\"given-l1\">1.0<\/span>\\text{ m}$<\/div>\n                  <div>$l_2 = <span id=\"given-l2\">2.0<\/span>\\text{ m}$<\/div>\n                  <div>$F_2 = \\text{? (topilishi kerak)}$<\/div>\n                <\/div>\n              <\/div>\n\n              <div class=\"bg-slate-900/60 p-3 rounded-xl border border-slate-700/50\">\n                <span class=\"text-slate-400 font-semibold block mb-1\">2. Asosiy Formula:<\/span>\n                <p class=\"text-indigo-300 font-mono text-center py-1\">F₁ · l₁ = F₂ · l₂  ⇒  F₂ = (F₁ · l₁) / l₂<\/p>\n              <\/div>\n\n              <div class=\"bg-slate-900/60 p-3 rounded-xl border border-slate-700/50\">\n                <span class=\"text-slate-400 font-semibold block mb-1\">3. Hisoblash bosqichi:<\/span>\n                <div id=\"step-calculation\" class=\"text-slate-300 font-mono\">\n                  $F_2 = (120 \\times 1.0) / 2.0 = 60\\text{ N}$\n                <\/div>\n              <\/div>\n            <\/div>\n          <\/div>\n\n          <div class=\"mt-4 pt-3 border-t border-slate-700/60 text-xs text-slate-400 flex justify-between items-center\">\n            <span>To'g'ri javoblar: <strong id=\"score-counter\" class=\"text-emerald-400\">0<\/strong><\/span>\n            <span class=\"text-slate-500\">Momentlar muvozanat qoidasi<\/span>\n          <\/div>\n        <\/div>\n\n      <\/div>\n    <\/section>\n\n    <!-- ================================================================= -->\n    <!-- SECTION 3: REAL LIFE CASES SANDBOX -->\n    <!-- ================================================================= -->\n    <section id=\"section-sandbox\" class=\"hidden space-y-6\">\n      \n      <div class=\"bg-slate-800/40 border border-slate-700/60 rounded-2xl p-6\">\n        <h2 class=\"text-xl font-bold text-white mb-2 flex items-center gap-2\">\n          <i class=\"fa-solid fa-industry text-amber-400\"><\/i>\n          Amaliy Vaziyatlar (Real Life Cases) Interaktiv Sandboksi\n        <\/h2>\n        <p class=\"text-slate-400 text-sm\">\n          Kundalik hayotimiz va texnikadagi oddiy mexanizmlarni simulyatsiya qiling. Kuchdan yutish ko'rsatkichini va masofadan yutqazishni amalda tekshiring.\n        <\/p>\n      <\/div>\n\n      <!-- Case Selection Tabs -->\n      <div class=\"flex space-x-3 border-b border-slate-700 pb-2\">\n        <button onclick=\"selectCase('pliers')\" id=\"case-btn-pliers\" class=\"case-btn px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold transition flex items-center gap-2\">\n          <i class=\"fa-solid fa-scissors\"><\/i> Ombur (Sim Qirqgich)\n        <\/button>\n        <button onclick=\"selectCase('well')\" id=\"case-btn-well\" class=\"case-btn px-4 py-2 bg-slate-800 text-slate-300 hover:text-white rounded-xl text-xs font-bold transition flex items-center gap-2\">\n          <i class=\"fa-solid fa-faucet-drip\"><\/i> Quduq Chig'irig'i\n        <\/button>\n        <button onclick=\"selectCase('crane')\" id=\"case-btn-crane\" class=\"case-btn px-4 py-2 bg-slate-800 text-slate-300 hover:text-white rounded-xl text-xs font-bold transition flex items-center gap-2\">\n          <i class=\"fa-solid fa-truck-pickup\"><\/i> Qurilish Krani Bloklari\n        <\/button>\n      <\/div>\n\n      <!-- Active Case Container -->\n      <div class=\"bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl grid grid-cols-1 md:grid-cols-12 gap-6\">\n        \n        <!-- Interactive Controls (5 cols) -->\n        <div class=\"md:col-span-5 space-y-5\">\n          <div id=\"case-info-header\">\n            <h3 id=\"case-title\" class=\"text-lg font-bold text-white\">Ombur Yordamida Sim Qirqish<\/h3>\n            <p id=\"case-desc\" class=\"text-xs text-slate-400 mt-1\">\n              Omburning dastalari uzunligi va pichoq elkasi nisbati orqali kuchdan qanday yutishimizni kuzating.\n            <\/p>\n          <\/div>\n\n          <!-- Dynamic Controls Box -->\n          <div id=\"case-controls-box\" class=\"space-y-4 bg-slate-900/80 p-4 rounded-xl border border-slate-700\">\n            <!-- Dynamically Rendered Controls via JS -->\n          <\/div>\n\n          <!-- Mechanical Advantage Box -->\n          <div class=\"bg-gradient-to-r from-blue-900/40 to-indigo-900/40 border border-blue-500/30 p-4 rounded-xl space-y-2\">\n            <div class=\"flex justify-between items-center text-xs\">\n              <span class=\"text-slate-300\">Kuchdan Yutish Nisbati ($K$):<\/span>\n              <span id=\"advantage-value\" class=\"text-lg font-black text-emerald-400\">4.0 marta<\/span>\n            <\/div>\n            <div class=\"flex justify-between items-center text-xs\">\n              <span class=\"text-slate-300\">Hosil bo'lgan Yakuniy Kuch ($F_{hosil}$):<\/span>\n              <span id=\"resulting-force-value\" class=\"text-base font-bold text-blue-300\">200 N<\/span>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <!-- Case Visual Display (7 cols) -->\n        <div class=\"md:col-span-7 bg-slate-900 rounded-xl border border-slate-700 p-4 flex flex-col justify-between relative min-h-[300px]\">\n          <div class=\"text-xs font-semibold text-slate-400 mb-2 flex justify-between\">\n            <span><i class=\"fa-solid fa-cubes-stacked text-amber-400 mr-1\"><\/i> Mexanizm Animatsiyasi<\/span>\n            <span id=\"case-status-tag\" class=\"text-emerald-400 font-bold\">Aktiv<\/span>\n          <\/div>\n\n          <!-- Sandbox Canvas -->\n          <div class=\"w-full h-64 bg-slate-950 rounded-lg overflow-hidden border border-slate-800 relative\">\n            <canvas id=\"sandboxCanvas\" class=\"w-full h-full block\"><\/canvas>\n          <\/div>\n\n          <div id=\"case-explanation-footer\" class=\"mt-3 text-xs text-slate-300 bg-slate-800/80 p-3 rounded-lg border border-slate-700/80\">\n            <!-- Dynamic explanation text -->\n          <\/div>\n        <\/div>\n\n      <\/div>\n\n    <\/section>\n\n  <\/main>\n\n  <!-- FOOTER -->\n  <footer class=\"bg-slate-950 border-t border-slate-800 py-4 mt-8\">\n    <div class=\"max-w-7xl mx-auto px-4 text-center text-xs text-slate-500\">\n      14-mavzu Masalalar Yechish Simulyatori &copy; Fizika Fani O'quv-Metodik Interaktiv Trenajyori\n    <\/div>\n  <\/footer>\n\n  <!-- ================================================================= -->\n  <!-- JAVASCRIPT LOGIC & SIMULATION ENGINE -->\n  <!-- ================================================================= -->\n  <script>\n    // GLOBAL STATE & TAB SWITCHING\n    let currentTab = 'formulas';\n\n    function switchTab(tabId) {\n      currentTab = tabId;\n      document.querySelectorAll('section').forEach(sec => sec.classList.add('hidden'));\n      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));\n\n      document.getElementById(`section-${tabId}`).classList.remove('hidden');\n      document.getElementById(`tab-${tabId}`).classList.add('active');\n\n      if (tabId === 'lab') {\n        initLabCanvas();\n        drawLeverSimulator();\n      } else if (tabId === 'sandbox') {\n        initSandboxCanvas();\n        renderSandboxCase();\n      }\n    }\n\n    // ==========================================\n    // SECTION 1: FORMULA CALCULATORS LOGIC\n    // ==========================================\n    function calcMoment() {\n      const F = parseFloat(document.getElementById('f1-range').value);\n      const l = parseFloat(document.getElementById('l1-range').value);\n      const M = F * l;\n\n      document.getElementById('f1-val').innerText = F + ' N';\n      document.getElementById('l1-val').innerText = l.toFixed(1) + ' m';\n      document.getElementById('m1-result').innerText = M.toFixed(1) + ' N·m';\n    }\n\n    function calcRichag() {\n      const F1 = parseFloat(document.getElementById('f1-richag').value) || 0;\n      const l1 = parseFloat(document.getElementById('l1-richag').value) || 0;\n      const l2 = parseFloat(document.getElementById('l2-richag').value) || 1;\n\n      const F2 = (F1 * l1) / (l2 <= 0 ? 1 : l2);\n      document.getElementById('f2-required').innerText = F2.toFixed(1) + ' N';\n    }\n\n    function calcBlocks() {\n      const P = parseFloat(document.getElementById('block-weight').value);\n      document.getElementById('fixed-block-force').innerText = P + ' N';\n      document.getElementById('movable-block-force').innerText = (P / 2).toFixed(1) + ' N';\n    }\n\n    // ==========================================\n    // SECTION 2: PROBLEM SOLVING LAB & CANVAS\n    // ==========================================\n    let currentProblem = {\n      f1: 120,\n      l1: 1.0,\n      l2: 2.0,\n      correctF2: 60,\n      studentF2: 60,\n      isChecked: false,\n      isCorrect: false\n    };\n\n    let score = 0;\n    let labCanvas, labCtx;\n    let currentTiltAngle = 0; // Animation tilt angle for leverage\n\n    function initLabCanvas() {\n      labCanvas = document.getElementById('leverCanvas');\n      labCtx = labCanvas.getContext('2d');\n      resizeCanvas(labCanvas);\n      window.addEventListener('resize', () => {\n        if(currentTab === 'lab') {\n          resizeCanvas(labCanvas);\n          drawLeverSimulator();\n        }\n      });\n    }\n\n    function resizeCanvas(canvas) {\n      if(!canvas || !canvas.parentElement) return;\n      canvas.width = canvas.parentElement.clientWidth;\n      canvas.height = canvas.parentElement.clientHeight || 300;\n    }\n\n    function generateRandomProblem() {\n      const possibleL1 = [0.5, 1.0, 1.5, 2.0];\n      const possibleL2 = [1.0, 1.5, 2.0, 2.5, 3.0];\n      const possibleF1 = [40, 60, 80, 100, 120, 150, 200];\n\n      const f1 = possibleF1[Math.floor(Math.random() * possibleF1.length)];\n      const l1 = possibleL1[Math.floor(Math.random() * possibleL1.length)];\n      let l2 = possibleL2[Math.floor(Math.random() * possibleL2.length)];\n\n      const correctF2 = (f1 * l1) / l2;\n\n      currentProblem = {\n        f1: f1,\n        l1: l1,\n        l2: l2,\n        correctF2: correctF2,\n        studentF2: Math.round(correctF2 * (0.6 + Math.random() * 0.8)),\n        isChecked: false,\n        isCorrect: false\n      };\n\n      // UI Update\n      document.getElementById('problem-statement').innerHTML = \n        `Massa/Kuch $F_1 = ${f1}\\\\text{ N}$ yuk chap tarafda $l_1 = ${l1.toFixed(1)}\\\\text{ m}$ masofaga qo'yilgan. Richagni muvozanatlash uchun o'ng tarafda $l_2 = ${l2.toFixed(1)}\\\\text{ m}$ elkada qancha $F_2$ kuch qo'llash kerak?`;\n\n      document.getElementById('given-f1').innerText = f1;\n      document.getElementById('given-l1').innerText = l1.toFixed(1);\n      document.getElementById('given-l2').innerText = l2.toFixed(1);\n\n      document.getElementById('student-f2-input').value = currentProblem.studentF2;\n      document.getElementById('student-f2-display').innerText = currentProblem.studentF2 + ' N';\n\n      document.getElementById('feedback-box').classList.add('hidden');\n      document.getElementById('balance-status-badge').innerText = 'Kutilmoqda...';\n      document.getElementById('balance-status-badge').className = 'px-3 py-1 rounded-full text-xs font-extrabold bg-slate-700 text-slate-300 border border-slate-600';\n\n      updateLabState();\n    }\n\n    function updateLabState() {\n      const val = parseFloat(document.getElementById('student-f2-input').value);\n      currentProblem.studentF2 = val;\n      document.getElementById('student-f2-display').innerText = val + ' N';\n\n      // Recalculate Tilt Angle based on moment difference\n      const moment1 = currentProblem.f1 * currentProblem.l1;\n      const moment2 = val * currentProblem.l2;\n      const diff = moment1 - moment2; // positive -> left tilts down\n\n      // Target angle clamped between -20 deg and +20 deg\n      currentTiltAngle = Math.max(-0.35, Math.min(0.35, (diff / 100) * 0.15));\n\n      drawLeverSimulator();\n    }\n\n    function checkAnswer() {\n      const moment1 = currentProblem.f1 * currentProblem.l1;\n      const moment2 = currentProblem.studentF2 * currentProblem.l2;\n      const diff = Math.abs(moment1 - moment2);\n\n      const feedbackBox = document.getElementById('feedback-box');\n      const badge = document.getElementById('balance-status-badge');\n      feedbackBox.classList.remove('hidden');\n\n      if (diff < 0.1) {\n        currentProblem.isCorrect = true;\n        score++;\n        document.getElementById('score-counter').innerText = score;\n\n        badge.innerText = 'MUVOZANATDA!';\n        badge.className = 'px-3 py-1 rounded-full text-xs font-extrabold bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 animate-pulse';\n\n        feedbackBox.className = 'mb-4 p-4 rounded-xl border bg-emerald-950/40 border-emerald-500/40 text-emerald-300 text-xs leading-relaxed';\n        feedbackBox.innerHTML = `\n          <div class=\"font-bold text-sm mb-1 flex items-center gap-2\"><i class=\"fa-solid fa-circle-check text-emerald-400\"><\/i> Barchasi To'g'ri!<\/div>\n          Kiritilgan kuch $F_2 = ${currentProblem.studentF2}\\\\text{ N}$ va elka $l_2 = ${currentProblem.l2}\\\\text{ m}$ bergan moment $M_2 = ${moment2.toFixed(1)}\\\\text{ N·m}$ ga teng bo'lib, chap tarafdagi $M_1 = ${moment1.toFixed(1)}\\\\text{ N·m}$ momentni to'liq muvozanatladi.\n        `;\n      } else {\n        currentProblem.isCorrect = false;\n        badge.innerText = 'MUVOZANATSIZ!';\n        badge.className = 'px-3 py-1 rounded-full text-xs font-extrabold bg-rose-500/20 text-rose-400 border border-rose-500/40';\n\n        const direction = moment1 > moment2 ? 'chap tarafga og\\'moqda (kuch yetarli emas)' : 'o\\'ng tarafga og\\'moqda (kuch oshib ketgan)';\n\n        feedbackBox.className = 'mb-4 p-4 rounded-xl border bg-rose-950/40 border-rose-500/40 text-rose-300 text-xs leading-relaxed';\n        feedbackBox.innerHTML = `\n          <div class=\"font-bold text-sm mb-1 flex items-center gap-2\"><i class=\"fa-solid fa-triangle-exclamation text-rose-400\"><\/i> Muvozanat Buzildi!<\/div>\n          Richag hozirda <strong>${direction}<\/strong>.<br>\n          Chap moment $M_1 = ${moment1.toFixed(1)}\\\\text{ N·m}$, O'ng moment $M_2 = ${moment2.toFixed(1)}\\\\text{ N·m}$.<br>\n          To'g'ri javob uchun formula: $F_2 = (${currentProblem.f1} \\\\times ${currentProblem.l1}) / ${currentProblem.l2} = ${currentProblem.correctF2.toFixed(1)}\\\\text{ N}$.\n        `;\n      }\n\n      // Step by step text update\n      document.getElementById('step-calculation').innerHTML = `\n        $F_2 = (${currentProblem.f1} \\\\times ${currentProblem.l1.toFixed(1)}) / ${currentProblem.l2.toFixed(1)} = \\\\mathbf{${currentProblem.correctF2.toFixed(1)}\\\\text{ N}}$\n      `;\n\n      drawLeverSimulator();\n    }\n\n    function resetLab() {\n      updateLabState();\n      document.getElementById('feedback-box').classList.add('hidden');\n    }\n\n    function drawLeverSimulator() {\n      if (!labCtx || !labCanvas) return;\n\n      const w = labCanvas.width;\n      const h = labCanvas.height;\n      const cX = w / 2;\n      const cY = h * 0.65;\n\n      labCtx.clearRect(0, 0, w, h);\n\n      // Draw Pivot Support (Tayanch uchburchagi)\n      labCtx.save();\n      labCtx.fillStyle = '#475569';\n      labCtx.beginPath();\n      labCtx.moveTo(cX, cY);\n      labCtx.lineTo(cX - 25, cY + 50);\n      labCtx.lineTo(cX + 25, cY + 50);\n      labCtx.closePath();\n      labCtx.fill();\n      labCtx.strokeStyle = '#94a3b8';\n      labCtx.lineWidth = 2;\n      labCtx.stroke();\n\n      // Pivot Pin Circle\n      labCtx.fillStyle = '#38bdf8';\n      labCtx.beginPath();\n      labCtx.arc(cX, cY, 6, 0, Math.PI * 2);\n      labCtx.fill();\n      labCtx.restore();\n\n      // Lever Beam (Aylanuvchi to'sin)\n      labCtx.save();\n      labCtx.translate(cX, cY);\n      labCtx.rotate(currentTiltAngle);\n\n      const beamLength = Math.min(w * 0.8, 480);\n      const halfBeam = beamLength / 2;\n\n      // Draw Main Beam\n      labCtx.fillStyle = '#334155';\n      labCtx.strokeStyle = '#64748b';\n      labCtx.lineWidth = 3;\n      labCtx.beginPath();\n      labCtx.roundRect(-halfBeam, -8, beamLength, 16, 6);\n      labCtx.fill();\n      labCtx.stroke();\n\n      // Scale ticks on beam\n      labCtx.fillStyle = '#94a3b8';\n      for (let x = -halfBeam + 20; x <= halfBeam - 20; x += 20) {\n        labCtx.fillRect(x - 1, -6, 2, 12);\n      }\n\n      // Compute Pixel Positions for Forces based on arms\n      // Scale: Max arm 3.0m corresponds to halfBeam - 20px\n      const scale = (halfBeam - 30) / 3.0;\n\n      const leftX = -currentProblem.l1 * scale;\n      const rightX = currentProblem.l2 * scale;\n\n      // Draw Left Load / Force Arrow (F1)\n      drawForceVector(labCtx, leftX, -8, currentProblem.f1, 'F₁ = ' + currentProblem.f1 + 'N', '#38bdf8', true);\n\n      // Draw Right Student Force Arrow (F2)\n      drawForceVector(labCtx, rightX, -8, currentProblem.studentF2, 'F₂ = ' + currentProblem.studentF2 + 'N', '#10b981', true);\n\n      labCtx.restore();\n\n      // Ground Line\n      labCtx.strokeStyle = '#334155';\n      labCtx.lineWidth = 2;\n      labCtx.beginPath();\n      labCtx.moveTo(cX - 120, cY + 50);\n      labCtx.lineTo(cX + 120, cY + 50);\n      labCtx.stroke();\n    }\n\n    function drawForceVector(ctx, x, y, magnitude, label, color, isDownwards = true) {\n      ctx.save();\n      ctx.translate(x, y);\n\n      const arrowLen = Math.min(80, 25 + magnitude * 0.25);\n\n      // Weight Box / Vector Start\n      ctx.fillStyle = color;\n      ctx.strokeStyle = color;\n      ctx.lineWidth = 3;\n\n      // Arrow Shaft\n      ctx.beginPath();\n      ctx.moveTo(0, 0);\n      ctx.lineTo(0, isDownwards ? arrowLen : -arrowLen);\n      ctx.stroke();\n\n      // Arrow Head\n      const headY = isDownwards ? arrowLen : -arrowLen;\n      const headDir = isDownwards ? 1 : -1;\n      ctx.beginPath();\n      ctx.moveTo(0, headY);\n      ctx.lineTo(-6, headY - 10 * headDir);\n      ctx.lineTo(6, headY - 10 * headDir);\n      ctx.closePath();\n      ctx.fill();\n\n      // Label Text\n      ctx.font = 'bold 12px Inter, sans-serif';\n      ctx.fillStyle = '#f8fafc';\n      ctx.textAlign = 'center';\n      ctx.fillText(label, 0, isDownwards ? arrowLen + 18 : -arrowLen - 10);\n\n      ctx.restore();\n    }\n\n    // ==========================================\n    // SECTION 3: REAL LIFE CASES SANDBOX LOGIC\n    // ==========================================\n    let activeCase = 'pliers';\n    let sandboxCanvas, sandboxCtx;\n\n    let caseParams = {\n      pliers: { handleLen: 16, bladeLen: 4, inputForce: 50 },\n      well: { wheelR: 40, axleR: 10, inputForce: 80 },\n      crane: { pulleys: 2, loadWeight: 200 }\n    };\n\n    function initSandboxCanvas() {\n      sandboxCanvas = document.getElementById('sandboxCanvas');\n      sandboxCtx = sandboxCanvas.getContext('2d');\n      resizeCanvas(sandboxCanvas);\n    }\n\n    function selectCase(caseName) {\n      activeCase = caseName;\n      document.querySelectorAll('.case-btn').forEach(b => {\n        b.classList.remove('bg-blue-600', 'text-white');\n        b.classList.add('bg-slate-800', 'text-slate-300');\n      });\n      document.getElementById(`case-btn-${caseName}`).classList.add('bg-blue-600', 'text-white');\n\n      renderSandboxCase();\n    }\n\n    function renderSandboxCase() {\n      const controlsBox = document.getElementById('case-controls-box');\n      const title = document.getElementById('case-title');\n      const desc = document.getElementById('case-desc');\n      const footer = document.getElementById('case-explanation-footer');\n\n      if (activeCase === 'pliers') {\n        title.innerText = \"Ombur Yordamida Sim Qirqish\";\n        desc.innerText = \"Omburning dastalari uzunligi va pichoq elkasi nisbati orqali kuchdan yutish simulyatsiyasi.\";\n\n        const p = caseParams.pliers;\n        controlsBox.innerHTML = `\n          <div>\n            <div class=\"flex justify-between text-xs text-slate-300 mb-1\">\n              <span>Dasta Elka Uzunligi ($L_{dasta}$):<\/span>\n              <span class=\"font-bold text-blue-400\">${p.handleLen} cm<\/span>\n            <\/div>\n            <input type=\"range\" min=\"8\" max=\"24\" value=\"${p.handleLen}\" oninput=\"caseParams.pliers.handleLen = parseFloat(this.value); updateSandboxCalculations();\" class=\"w-full accent-blue-500 bg-slate-700 h-1.5 rounded-lg\">\n          <\/div>\n          <div>\n            <div class=\"flex justify-between text-xs text-slate-300 mb-1\">\n              <span>Pichoq Elka Uzunligi ($L_{pichoq}$):<\/span>\n              <span class=\"font-bold text-blue-400\">${p.bladeLen} cm<\/span>\n            <\/div>\n            <input type=\"range\" min=\"2\" max=\"6\" value=\"${p.bladeLen}\" oninput=\"caseParams.pliers.bladeLen = parseFloat(this.value); updateSandboxCalculations();\" class=\"w-full accent-blue-500 bg-slate-700 h-1.5 rounded-lg\">\n          <\/div>\n          <div>\n            <div class=\"flex justify-between text-xs text-slate-300 mb-1\">\n              <span>Qo'l Bilan Berilgan Kuch ($F_{qo'l}$):<\/span>\n              <span class=\"font-bold text-emerald-400\">${p.inputForce} N<\/span>\n            <\/div>\n            <input type=\"range\" min=\"10\" max=\"150\" value=\"${p.inputForce}\" step=\"5\" oninput=\"caseParams.pliers.inputForce = parseFloat(this.value); updateSandboxCalculations();\" class=\"w-full accent-emerald-500 bg-slate-700 h-1.5 rounded-lg\">\n          <\/div>\n        `;\n\n        footer.innerHTML = `<i class=\"fa-solid fa-lightbulb text-amber-400 mr-1\"><\/i> Ombur dastasiga berilgan kichik kuch pichoq qismida necha marta ko'payib, simni oson kesishini ko'rishingiz mumkin.`;\n\n      } else if (activeCase === 'well') {\n        title.innerText = \"Quduq Chig'irig'i (Chox va G'ildirak)\";\n        desc.innerText = \"G'ildirak radiusi ($R$) va val radiusi ($r$) nisbati bo'yicha chig'iriq muvozanati.\";\n\n        const p = caseParams.well;\n        controlsBox.innerHTML = `\n          <div>\n            <div class=\"flex justify-between text-xs text-slate-300 mb-1\">\n              <span>Chig'iriq Dasta Radiusi ($R$):<\/span>\n              <span class=\"font-bold text-blue-400\">${p.wheelR} cm<\/span>\n            <\/div>\n            <input type=\"range\" min=\"20\" max=\"60\" value=\"${p.wheelR}\" oninput=\"caseParams.well.wheelR = parseFloat(this.value); updateSandboxCalculations();\" class=\"w-full accent-blue-500 bg-slate-700 h-1.5 rounded-lg\">\n          <\/div>\n          <div>\n            <div class=\"flex justify-between text-xs text-slate-300 mb-1\">\n              <span>Baraban Radiusi ($r$):<\/span>\n              <span class=\"font-bold text-blue-400\">${p.axleR} cm<\/span>\n            <\/div>\n            <input type=\"range\" min=\"5\" max=\"15\" value=\"${p.axleR}\" oninput=\"caseParams.well.axleR = parseFloat(this.value); updateSandboxCalculations();\" class=\"w-full accent-blue-500 bg-slate-700 h-1.5 rounded-lg\">\n          <\/div>\n          <div>\n            <div class=\"flex justify-between text-xs text-slate-300 mb-1\">\n              <span>Aylantirish Kuchi ($F$):<\/span>\n              <span class=\"font-bold text-emerald-400\">${p.inputForce} N<\/span>\n            <\/div>\n            <input type=\"range\" min=\"20\" max=\"200\" value=\"${p.inputForce}\" step=\"10\" oninput=\"caseParams.well.inputForce = parseFloat(this.value); updateSandboxCalculations();\" class=\"w-full accent-emerald-500 bg-slate-700 h-1.5 rounded-lg\">\n          <\/div>\n        `;\n\n        footer.innerHTML = `<i class=\"fa-solid fa-lightbulb text-amber-400 mr-1\"><\/i> Chig'iriq dastasini 1 marta to'liq aylantirganda ko'p masofa bosiladi, lekin og'ir suv paqirini juda yengil ko'tarish imkonini beradi.`;\n\n      } else if (activeCase === 'crane') {\n        title.innerText = \"Qurilish Krani Bloklar Tizimi\";\n        desc.innerText = \"Polispast va qo'zg'aluvchan bloklar soni bo'yicha yuk ko'tarish.\";\n\n        const p = caseParams.crane;\n        controlsBox.innerHTML = `\n          <div>\n            <div class=\"flex justify-between text-xs text-slate-300 mb-1\">\n              <span>Qo'zg'aluvchan Bloklar Soni ($n$):<\/span>\n              <span class=\"font-bold text-blue-400\">${p.pulleys} ta<\/span>\n            <\/div>\n            <input type=\"range\" min=\"1\" max=\"4\" value=\"${p.pulleys}\" step=\"1\" oninput=\"caseParams.crane.pulleys = parseInt(this.value); updateSandboxCalculations();\" class=\"w-full accent-blue-500 bg-slate-700 h-1.5 rounded-lg\">\n          <\/div>\n          <div>\n            <div class=\"flex justify-between text-xs text-slate-300 mb-1\">\n              <span>Yuk Og'irligi ($P$):<\/span>\n              <span class=\"font-bold text-amber-400\">${p.loadWeight} N<\/span>\n            <\/div>\n            <input type=\"range\" min=\"100\" max=\"1000\" value=\"${p.loadWeight}\" step=\"50\" oninput=\"caseParams.crane.loadWeight = parseFloat(this.value); updateSandboxCalculations();\" class=\"w-full accent-amber-500 bg-slate-700 h-1.5 rounded-lg\">\n          <\/div>\n        `;\n\n        footer.innerHTML = `<i class=\"fa-solid fa-lightbulb text-amber-400 mr-1\"><\/i> Bloklar soni ortgani sari kranning dvigateli talab qiladigan tortish kuchi $2n$ marta kamayadi.`;\n      }\n\n      updateSandboxCalculations();\n    }\n\n    function updateSandboxCalculations() {\n      let advantage = 1;\n      let resultingForce = 0;\n\n      if (activeCase === 'pliers') {\n        const p = caseParams.pliers;\n        advantage = p.handleLen / p.bladeLen;\n        resultingForce = p.inputForce * advantage;\n      } else if (activeCase === 'well') {\n        const p = caseParams.well;\n        advantage = p.wheelR / p.axleR;\n        resultingForce = p.inputForce * advantage;\n      } else if (activeCase === 'crane') {\n        const p = caseParams.crane;\n        advantage = p.pulleys * 2;\n        resultingForce = p.loadWeight / advantage;\n      }\n\n      document.getElementById('advantage-value').innerText = advantage.toFixed(1) + ' marta';\n      document.getElementById('resulting-force-value').innerText = resultingForce.toFixed(1) + ' N';\n\n      drawSandboxCanvas();\n    }\n\n    function drawSandboxCanvas() {\n      if (!sandboxCtx || !sandboxCanvas) return;\n      const w = sandboxCanvas.width;\n      const h = sandboxCanvas.height;\n      const cX = w / 2;\n      const cY = h / 2;\n\n      sandboxCtx.clearRect(0, 0, w, h);\n\n      if (activeCase === 'pliers') {\n        // Draw Pliers Schematic\n        const p = caseParams.pliers;\n        sandboxCtx.save();\n        sandboxCtx.translate(cX, cY);\n\n        // Pivot point\n        sandboxCtx.fillStyle = '#f59e0b';\n        sandboxCtx.beginPath();\n        sandboxCtx.arc(0, 0, 8, 0, Math.PI * 2);\n        sandboxCtx.fill();\n\n        // Handle\n        const handlePixel = p.handleLen * 6;\n        const bladePixel = p.bladeLen * 12;\n\n        // Top Handle / Lower Blade\n        sandboxCtx.strokeStyle = '#38bdf8';\n        sandboxCtx.lineWidth = 8;\n        sandboxCtx.beginPath();\n        sandboxCtx.moveTo(-handlePixel, -25);\n        sandboxCtx.lineTo(0, 0);\n        sandboxCtx.lineTo(bladePixel, -10);\n        sandboxCtx.stroke();\n\n        // Bottom Handle / Upper Blade\n        sandboxCtx.strokeStyle = '#38bdf8';\n        sandboxCtx.beginPath();\n        sandboxCtx.moveTo(-handlePixel, 25);\n        sandboxCtx.lineTo(0, 0);\n        sandboxCtx.lineTo(bladePixel, 10);\n        sandboxCtx.stroke();\n\n        // Wire object being cut\n        sandboxCtx.fillStyle = '#ef4444';\n        sandboxCtx.beginPath();\n        sandboxCtx.arc(bladePixel - 5, 0, 7, 0, Math.PI * 2);\n        sandboxCtx.fill();\n\n        sandboxCtx.restore();\n\n      } else if (activeCase === 'well') {\n        // Draw Well Wheel Schematic\n        const p = caseParams.well;\n        sandboxCtx.save();\n        sandboxCtx.translate(cX, cY);\n\n        // Outer Wheel\n        sandboxCtx.strokeStyle = '#38bdf8';\n        sandboxCtx.lineWidth = 4;\n        sandboxCtx.beginPath();\n        sandboxCtx.arc(0, 0, p.wheelR * 1.8, 0, Math.PI * 2);\n        sandboxCtx.stroke();\n\n        // Inner Axle\n        sandboxCtx.fillStyle = '#64748b';\n        sandboxCtx.beginPath();\n        sandboxCtx.arc(0, 0, p.axleR * 2.2, 0, Math.PI * 2);\n        sandboxCtx.fill();\n\n        // Handle Arm\n        sandboxCtx.strokeStyle = '#10b981';\n        sandboxCtx.lineWidth = 5;\n        sandboxCtx.beginPath();\n        sandboxCtx.moveTo(0, 0);\n        sandboxCtx.lineTo(0, -p.wheelR * 1.8);\n        sandboxCtx.stroke();\n\n        sandboxCtx.restore();\n\n      } else if (activeCase === 'crane') {\n        // Draw Crane Pulley schematic\n        const p = caseParams.crane;\n        sandboxCtx.save();\n        sandboxCtx.translate(cX, 40);\n\n        // Beam Support\n        sandboxCtx.fillStyle = '#475569';\n        sandboxCtx.fillRect(-60, 0, 120, 10);\n\n        // Pulleys\n        for (let i = 0; i < p.pulleys; i++) {\n          const px = -20 + i * 25;\n          sandboxCtx.strokeStyle = '#38bdf8';\n          sandboxCtx.lineWidth = 3;\n          sandboxCtx.beginPath();\n          sandboxCtx.arc(px, 30, 12, 0, Math.PI * 2);\n          sandboxCtx.stroke();\n\n          // Rope lines\n          sandboxCtx.strokeStyle = '#94a3b8';\n          sandboxCtx.lineWidth = 1.5;\n          sandboxCtx.beginPath();\n          sandboxCtx.moveTo(px - 12, 10);\n          sandboxCtx.lineTo(px - 12, 90);\n          sandboxCtx.stroke();\n        }\n\n        // Hanging Load\n        sandboxCtx.fillStyle = '#f59e0b';\n        sandboxCtx.fillRect(-25, 90, 50, 40);\n        sandboxCtx.fillStyle = '#0f172a';\n        sandboxCtx.font = 'bold 10px Inter';\n        sandboxCtx.textAlign = 'center';\n        sandboxCtx.fillText(p.loadWeight + ' N', 0, 114);\n\n        sandboxCtx.restore();\n      }\n    }\n\n    // INITIALIZATION ON LOAD\n    window.onload = function () {\n      calcMoment();\n      calcRichag();\n      calcBlocks();\n\n      initLabCanvas();\n      generateRandomProblem();\n\n      initSandboxCanvas();\n      renderSandboxCase();\n    };\n  <\/script>\n<\/body>\n<\/html>"}, {"id": "Loyiha_Ishi", "n": "★", "t": "Loyiha ishi", "d": "Oddiy mexanizmlarni yasash va tadqiq etish (STEM)", "k": "Loyiha", "html": "<!DOCTYPE html>\n<html lang=\"uz\" class=\"dark\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Loyiha Ishi: Oddiy Mexanizmlarni Yasash va Tadqiq Etish<\/title>\n    <!-- Tailwind CSS -->\n    <script src=\"https://cdn.tailwindcss.com\"><\/script>\n    <!-- FontAwesome Icons -->\n    <link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css\">\n    <!-- Chart.js for dynamic graphs -->\n    <script src=\"https://cdn.jsdelivr.net/npm/chart.js\"><\/script>\n    <script>\n        tailwind.config = {\n            darkMode: 'class',\n            theme: {\n                extend: {\n                    colors: {\n                        stem: {\n                            50: '#f0f9ff',\n                            100: '#e0f2fe',\n                            500: '#0284c7',\n                            600: '#0369a1',\n                            700: '#035485',\n                            800: '#075985',\n                            900: '#0c4a6e',\n                            accent: '#f59e0b'\n                        }\n                    }\n                }\n            }\n        }\n    <\/script>\n    <style>\n        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');\n        body {\n            font-family: 'Inter', sans-serif;\n        }\n        .canvas-container {\n            position: relative;\n            width: 100%;\n            height: 420px;\n            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);\n        }\n        /* Custom Scrollbar */\n        ::-webkit-scrollbar {\n            width: 6px;\n            height: 6px;\n        }\n        ::-webkit-scrollbar-track {\n            background: #1e293b;\n        }\n        ::-webkit-scrollbar-thumb {\n            background: #334155;\n            border-radius: 3px;\n        }\n        ::-webkit-scrollbar-thumb:hover {\n            background: #475569;\n        }\n        @media print {\n            body * {\n                visibility: hidden;\n            }\n            #printable-report, #printable-report * {\n                visibility: visible;\n            }\n            #printable-report {\n                position: absolute;\n                left: 0;\n                top: 0;\n                width: 100%;\n                color: #000 !important;\n                background: #fff !important;\n            }\n            .no-print {\n                display: none !important;\n            }\n        }\n    <\/style>\n<\/head>\n<body class=\"bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-amber-500 selection:text-slate-900\">\n\n    <!-- Header / Navigation -->\n    <header class=\"border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-40\">\n        <div class=\"max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between\">\n            <div class=\"flex items-center space-x-3\">\n                <div class=\"w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-sky-500 flex items-center justify-center text-slate-950 font-bold text-xl shadow-lg shadow-amber-500/20\">\n                    <i class=\"fa-solid fa-gears\"><\/i>\n                <\/div>\n                <div>\n                    <h1 class=\"text-lg font-bold text-white leading-tight\">STEM Laboratoriyasi<\/h1>\n                    <p class=\"text-xs text-slate-400\">Oddiy mexanizmlarni yasash va tadqiq etish<\/p>\n                <\/div>\n            <\/div>\n\n            <!-- Tab Navigation Buttons -->\n            <nav class=\"flex items-center space-x-1 sm:space-x-2 bg-slate-950 p-1 rounded-xl border border-slate-800\">\n                <button onclick=\"switchTab('theory')\" id=\"tab-btn-theory\" class=\"tab-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition flex items-center space-x-2 bg-sky-600 text-white shadow\">\n                    <i class=\"fa-solid fa-book-open\"><\/i>\n                    <span class=\"hidden sm:inline\">1. Nazariya va Tahlil<\/span>\n                    <span class=\"sm:hidden\">Nazariya<\/span>\n                <\/button>\n                <button onclick=\"switchTab('builder')\" id=\"tab-btn-builder\" class=\"tab-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition flex items-center space-x-2 text-slate-400 hover:text-white hover:bg-slate-800\">\n                    <i class=\"fa-solid fa-hammer\"><\/i>\n                    <span class=\"hidden sm:inline\">2. Konstruktor va Yasash<\/span>\n                    <span class=\"sm:hidden\">Yasash<\/span>\n                <\/button>\n                <button onclick=\"switchTab('lab')\" id=\"tab-btn-lab\" class=\"tab-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition flex items-center space-x-2 text-slate-400 hover:text-white hover:bg-slate-800\">\n                    <i class=\"fa-solid fa-flask-vial\"><\/i>\n                    <span class=\"hidden sm:inline\">3. Sinov va Taqdimot<\/span>\n                    <span class=\"sm:hidden\">Sinov<\/span>\n                <\/button>\n            <\/nav>\n        <\/div>\n    <\/header>\n\n    <!-- Main Content Container -->\n    <main class=\"flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6\">\n\n        <!-- ================= TAB 1: NAZARIYA VA TUZILISHI ================= -->\n        <section id=\"tab-theory\" class=\"tab-content space-y-6\">\n            <!-- Intro Banner -->\n            <div class=\"bg-gradient-to-r from-sky-900/40 via-slate-900 to-amber-950/30 border border-slate-800 rounded-2xl p-6 relative overflow-hidden\">\n                <div class=\"max-w-3xl\">\n                    <span class=\"inline-block px-3 py-1 bg-amber-500/10 text-amber-400 border border-amber-500/20 text-xs font-semibold rounded-full mb-3\">Loyiha Rejasi - 1-Bosqich<\/span>\n                    <h2 class=\"text-2xl sm:text-3xl font-extrabold text-white tracking-tight\">Oddiy Mexanizmlarning Tuzilishi va Ishlash Prinsiplari<\/h2>\n                    <p class=\"mt-2 text-slate-300 text-sm sm:text-base leading-relaxed\">\n                        Oddiy mexanizmlar — bu kuch yo'nalishini yoki kattaligini o'zgartirish orqali og'ir ishlarni kamroq kuch sarflab bajarishga imkon beruvchi muhandislik vositalaridir. Barcha mexanizmlar <strong>\"Mexanikaning oltin qoidasi\"<\/strong>ga bo'ysunadi: <em>\"Kuchdan necha marta yutsak, masofadan shuncha marta yutqazamiz\"<\/em> (Bajarilgan ish o'zgarmaydi).\n                    <\/p>\n                <\/div>\n            <\/div>\n\n            <!-- Interactive Mechanism Cards -->\n            <div class=\"grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4\">\n                \n                <!-- Mechanism 1: Richag -->\n                <div class=\"bg-slate-900 border border-slate-800 rounded-2xl p-5 hover:border-sky-500/50 transition duration-300 flex flex-col justify-between group\">\n                    <div>\n                        <div class=\"w-12 h-12 rounded-xl bg-sky-500/10 border border-sky-500/20 text-sky-400 flex items-center justify-center text-2xl mb-4 group-hover:scale-110 transition\">\n                            <i class=\"fa-solid fa-scale-balanced\"><\/i>\n                        <\/div>\n                        <h3 class=\"text-lg font-bold text-white mb-1\">Richag (Lever)<\/h3>\n                        <p class=\"text-xs text-sky-400 mb-3 font-mono\">F₁ · L₁ = F₂ · L₂<\/p>\n                        <p class=\"text-xs text-slate-400 leading-relaxed mb-4\">\n                            Tayanch nuqtasi atrofida aylana oladigan qattiq jism. Yelkalari nisbati ($L_1 / L_2$) hisobiga kuchdan karrali yutish imkonini beradi.\n                        <\/p>\n                    <\/div>\n                    <div class=\"border-t border-slate-800/80 pt-3 text-xs text-slate-300 space-y-1 bg-slate-950/50 p-3 rounded-lg\">\n                        <div class=\"flex justify-between\"><span class=\"text-slate-500\">Kuchdan yutish:<\/span> <span class=\"font-semibold text-emerald-400\">L₁ / L₂ barobar<\/span><\/div>\n                        <div class=\"flex justify-between\"><span class=\"text-slate-500\">Qo'llanilishi:<\/span> <span>Kran, qaychi, manjanik<\/span><\/div>\n                    <\/div>\n                <\/div>\n\n                <!-- Mechanism 2: Bloklar -->\n                <div class=\"bg-slate-900 border border-slate-800 rounded-2xl p-5 hover:border-sky-500/50 transition duration-300 flex flex-col justify-between group\">\n                    <div>\n                        <div class=\"w-12 h-12 rounded-xl bg-amber-500/10 border border-amber-500/20 text-amber-400 flex items-center justify-center text-2xl mb-4 group-hover:scale-110 transition\">\n                            <i class=\"fa-solid fa-circle-notch\"><\/i>\n                        <\/div>\n                        <h3 class=\"text-lg font-bold text-white mb-1\">Bloklar Tizimi<\/h3>\n                        <p class=\"text-xs text-amber-400 mb-3 font-mono\">F = P / (2n)<\/p>\n                        <p class=\"text-xs text-slate-400 leading-relaxed mb-4\">\n                            Qo'zg'almas blok faqat kuch yo'nalishini o'zgartiradi. Qo'zg'aluvchan blok esa kuchdan 2 marta yutish beradi. Ularning birikmasi — Polispast deyiladi.\n                        <\/p>\n                    <\/div>\n                    <div class=\"border-t border-slate-800/80 pt-3 text-xs text-slate-300 space-y-1 bg-slate-950/50 p-3 rounded-lg\">\n                        <div class=\"flex justify-between\"><span class=\"text-slate-500\">Kuchdan yutish:<\/span> <span class=\"font-semibold text-emerald-400\">2ⁿ (n - harakatli blok)<\/span><\/div>\n                        <div class=\"flex justify-between\"><span class=\"text-slate-500\">Qo'llanilishi:<\/span> <span>Qurilish kranlari, liftlar<\/span><\/div>\n                    <\/div>\n                <\/div>\n\n                <!-- Mechanism 3: Chig'iriq -->\n                <div class=\"bg-slate-900 border border-slate-800 rounded-2xl p-5 hover:border-sky-500/50 transition duration-300 flex flex-col justify-between group\">\n                    <div>\n                        <div class=\"w-12 h-12 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-center text-2xl mb-4 group-hover:scale-110 transition\">\n                            <i class=\"fa-solid fa-compact-disc\"><\/i>\n                        <\/div>\n                        <h3 class=\"text-lg font-bold text-white mb-1\">Chig'iriq (Winch)<\/h3>\n                        <p class=\"text-xs text-emerald-400 mb-3 font-mono\">F = P · (r / R)<\/p>\n                        <p class=\"text-xs text-slate-400 leading-relaxed mb-4\">\n                            Bir o'qqa mahkamlangan turli radiusli g'altak va dasta (baraban). Dasta radiusi (R) val radiusidan (r) qancha katta bo'lsa, yutuq shuncha yuqori.\n                        <\/p>\n                    <\/div>\n                    <div class=\"border-t border-slate-800/80 pt-3 text-xs text-slate-300 space-y-1 bg-slate-950/50 p-3 rounded-lg\">\n                        <div class=\"flex justify-between\"><span class=\"text-slate-500\">Kuchdan yutish:<\/span> <span class=\"font-semibold text-emerald-400\">R / r barobar<\/span><\/div>\n                        <div class=\"flex justify-between\"><span class=\"text-slate-500\">Qo'llanilishi:<\/span> <span>Kuduk chig'irig'i, lebyodka<\/span><\/div>\n                    <\/div>\n                <\/div>\n\n                <!-- Mechanism 4: Qiya Tekislik -->\n                <div class=\"bg-slate-900 border border-slate-800 rounded-2xl p-5 hover:border-sky-500/50 transition duration-300 flex flex-col justify-between group\">\n                    <div>\n                        <div class=\"w-12 h-12 rounded-xl bg-purple-500/10 border border-purple-500/20 text-purple-400 flex items-center justify-center text-2xl mb-4 group-hover:scale-110 transition\">\n                            <i class=\"fa-solid fa-play -rotate-90\"><\/i>\n                        <\/div>\n                        <h3 class=\"text-lg font-bold text-white mb-1\">Qiya Tekislik<\/h3>\n                        <p class=\"text-xs text-purple-400 mb-3 font-mono\">F = P · sin(α) + F_ishk<\/p>\n                        <p class=\"text-xs text-slate-400 leading-relaxed mb-4\">\n                            Gorizontga nisbatan burc
