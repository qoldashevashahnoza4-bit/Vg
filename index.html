ill=\"#334155\" font-size=\"15\">s=${fmt(d.s,1)} m<\/text>\n<g transform=\"translate(${bx} ${by-5}) rotate(${ang})\"><rect x=\"-27\" y=\"-34\" width=\"54\" height=\"34\" rx=\"6\" fill=\"url(#load)\" stroke=\"#5b21b6\" stroke-width=\"2\"/><path d=\"M-16 -23h32M-16 -13h32\" stroke=\"#ede9fe\" stroke-width=\"2.5\" stroke-linecap=\"round\"/><\/g>\n<path d=\"M${bx+12} ${by-48}l70 -27\" stroke=\"#dc2626\" stroke-width=\"3\" stroke-linecap=\"round\"/><path d=\"M${bx+82} ${by-75}l-13 -1 6 12\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"3\"/><text x=\"${bx+82}\" y=\"${by-84}\" fill=\"#b91c1c\" font-weight=\"700\" font-size=\"15\">F=${fmt(d.F,2)} N<\/text>\n<path d=\"M${bx-15} ${by-4}l-48 18\" stroke=\"#059669\" stroke-width=\"3\"/><path d=\"M${bx-63} ${by+14}l5 -12 7 9\" fill=\"none\" stroke=\"#059669\" stroke-width=\"3\"/><text x=\"18\" y=\"32\" fill=\"#334155\" font-size=\"15\" font-weight=\"700\">m=${fmt(d.m,1)} kg<\/text><text x=\"18\" y=\"53\" fill=\"#64748b\" font-size=\"13\">μ=${fmt(d.mu,2)}<\/text>\n<rect x=\"18\" y=\"66\" width=\"145\" height=\"44\" rx=\"9\" fill=\"#fff\" stroke=\"#cbd5e1\"/><text x=\"29\" y=\"84\" fill=\"#64748b\" font-size=\"11\">DINAMOMETR<\/text><text x=\"29\" y=\"101\" fill=\"#1d4ed8\" font-size=\"16\" font-weight=\"800\">${fmt(d.F,2)} N<\/text>`;\n$('forceRead').textContent=fmt(d.F,2)+' N';$('totalRead').textContent=fmt(d.At,2)+' J';$('usefulRead').textContent=fmt(d.Af,2)+' J';$('effRead').textContent=fmt(d.eta,1)+'%';$('effBar').style.width=Math.max(0,Math.min(100,d.eta))+'%';$('analysisEff').textContent=fmt(d.eta,1)+'%';$('analysisText').textContent=`μ = ${fmt(d.mu,2)} bo‘lganda tortish kuchi ${fmt(d.F,2)} N, to‘la ish ${fmt(d.At,2)} J. Ishqalanish oshishi bilan, boshqa shartlar o‘zgarmasa, FIK kamayadi.`;updateCalc()}\n['mass','length','height','friction'].forEach(id=>$(id).addEventListener('input',()=>{measured=false;updateScene()}));\nfunction updateCalc(){if(!$('calcTotal'))return;const d=getData();$('calcTotal').innerHTML=`A<sub>to‘la<\/sub> = F · s = ${fmt(d.F,2)} · ${fmt(d.s,2)} = ${fmt(d.At,2)} J`;$('calcTotalSteps').textContent='Tortish kuchi qiya tekislik bo‘ylab bosib o‘tilgan masofaga ko‘paytiriladi.';$('calcUseful').innerHTML=`A<sub>foydali<\/sub> = m · g · h = ${fmt(d.m,2)} · 9,8 · ${fmt(d.h,2)} = ${fmt(d.Af,2)} J`;$('calcUsefulSteps').textContent='Yukning potensial energiyasi ortishi hisoblanadi.';$('calcEff').innerHTML=`η = (${fmt(d.Af,2)} / ${fmt(d.At,2)}) · 100% = ${fmt(d.eta,1)}%`;$('calcEffSteps').textContent='Foydali ish to‘la ishga bo‘linadi va 100% ga ko‘paytiriladi.';$('calcInterpret').textContent=d.mu===0?'Ideal, ishqalanishsiz model: FIK 100% ga teng (yaxlitlash farqi bo‘lishi mumkin).':`Ishqalanish mavjud: energiyaning bir qismi issiqlikka sarflanadi. Hisoblangan FIK ${fmt(d.eta,1)}%.`}\nfunction pullLoad(){if(moving)return;moving=true;$('labStatus').textContent='Yuk qiya tekislik bo‘ylab tortilmoqda…';let start=performance.now(),duration=1300;function frame(t){let p=Math.min(1,(t-start)/duration);$('scene').dataset.pos=.12+.76*p;updateScene();if(p<1)requestAnimationFrame(frame);else{moving=false;measured=true;$('labStatus').textContent='Yuk yuqoriga yetkazildi. Endi kuch va masofani o‘lchashingiz mumkin.'}}requestAnimationFrame(frame)}\nfunction measure(){const d=getData();measured=true;$('labStatus').textContent=`O‘lchovlar: F = ${fmt(d.F,2)} N, s = ${fmt(d.s,2)} m, h = ${fmt(d.h,2)} m. Natijani jadvalga kiritishingiz mumkin.`}\nfunction addTrial(){if(!measured){$('labStatus').textContent='Avval “Yukni tortish” yoki “O‘lchash” tugmasini bosing.';return}let d=getData();trials.push(d);renderTrials();$('labStatus').textContent='Natija jadvalga qo‘shildi.';$('saveStatus').textContent='Oxirgi natija jadvalga qo‘shildi.'}\nfunction renderTrials(){const body=$('resultsBody');if(!trials.length)body.innerHTML='<tr><td colspan=\"8\" class=\"muted\">Hozircha natijalar yo‘q.<\/td><\/tr>';else body.innerHTML=trials.map((d,i)=>`<tr><td>${i+1}<\/td><td>${fmt(d.m,2)}<\/td><td>${fmt(d.F,2)}<\/td><td>${fmt(d.s,2)}<\/td><td>${fmt(d.h,2)}<\/td><td>${fmt(d.At,2)}<\/td><td>${fmt(d.Af,2)}<\/td><td>${fmt(d.eta,1)}<\/td><\/tr>`).join('');$('trialCount').textContent=trials.length;$('avgEff').textContent=trials.length?fmt(trials.reduce((a,b)=>a+b.eta,0)/trials.length,1)+'%':'— %'}\nfunction clearTrials(){trials=[];renderTrials();$('saveStatus').textContent='Jadval tozalandi.'}\nfunction downloadCSV(){if(!trials.length){$('saveStatus').textContent='Avval kamida bitta tajriba natijasini jadvalga kiriting.';return}let rows=[['№','m (kg)','F (N)','s (m)','h (m)','A tola (J)','A foydali (J)','FIK (%)'],...trials.map((d,i)=>[i+1,d.m,d.F,d.s,d.h,d.At,d.Af,d.eta])];let csv='\\uFEFF'+rows.map(r=>r.join(';')).join('\\r\\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='qiya_tekislik_FIK_natijalari.csv';a.click();URL.revokeObjectURL(url);$('saveStatus').textContent='CSV fayli tayyorlandi.'}\nfunction checkConclusion(){let a=[$('answer1').value,$('answer2').value,$('answer3').value],count=a.filter(x=>x.trim().length>12).length;$('conclusionFeedback').innerHTML=count===3?'<div class=\"success\">Barcha savollarga javob yozildi. Javoblaringizni tajriba natijalari va formulalar bilan solishtirib tekshiring.<\/div>':`<div class=\"notice\">${count}/3 javob to‘ldirilgan. Har bir savolga batafsil javob yozing.<\/div>`}\nfunction fillConclusion(){$('answer1').value='Qiya tekislik yukni kamroq kuch bilan balandlikka ko‘tarishga yordam beradi, lekin bosib o‘tiladigan masofa ortadi.';$('answer2').value='To‘la ish A = F·s, foydali ish esa A = mgh formulalari bilan hisoblanadi.';$('answer3').value='Ishqalanish ortsa, ko‘proq ish energiyaning issiqlikka aylanishiga sarflanadi. Shu sababli FIK kamayadi.';checkConclusion()}\nconst questions=[\n{q:'Qiya tekislik bo‘ylab bajarilgan to‘la ish qanday hisoblanadi?',a:['A = F / s','A = F · s','A = m / h','A = F + m'],correct:1,why:'Doimiy yoki o‘rtacha kuch uchun ish kuch va masofa ko‘paytmasiga teng.'},\n{q:'Foydali ish qaysi formula orqali topiladi?',a:['A = mgh','A = F / s','A = mg / s','A = Fh / s'],correct:0,why:'Yuk h balandlikka ko‘tarilganda potensial energiyasi mgh ga ortadi.'},\n{q:'FIK qanday aniqlanadi?',a:['To‘la ishning foydali ishga nisbati','Foydali ishning to‘la ishga nisbati × 100%','Kuchning masofaga nisbati','Massaning balandlikka nisbati'],correct:1,why:'FIK foydali ishning to‘la ishga nisbatini foizlarda ifodalaydi.'},\n{q:'Ishqalanish kuchi ortsa, boshqa shartlar bir xil bo‘lganda FIK odatda qanday o‘zgaradi?',a:['Ortadi','Kamayadi','O‘zgarmaydi','Har doim 100% bo‘ladi'],correct:1,why:'Ishqalanish sabab to‘la ish ortadi, foydali ish esa o‘zgarmasa FIK kamayadi.'},\n{q:'Haqiqiy qiya tekislikning FIKi nima sababdan 100% dan kichik bo‘ladi?',a:['Massa yo‘qoladi','Masofa nol bo‘ladi','Energiya bir qismi ishqalanish va boshqa yo‘qotishlarga sarflanadi','Balandlik doim o‘zgaradi'],correct:2,why:'Haqiqiy mexanizmlarda energiyaning bir qismi foydali ishga aylanmaydi.'}\n];\nfunction renderQuiz(){$('quiz').innerHTML=questions.map((q,i)=>`<div class=\"question\" id=\"q${i}\"><b>${i+1}. ${q.q}<\/b>${q.a.map((a,j)=>`<label><input type=\"radio\" name=\"quiz${i}\" value=\"${j}\"> ${String.fromCharCode(65+j)}) ${a}<\/label>`).join('')}<div class=\"feedback\" id=\"fb${i}\"><\/div><\/div>`).join('')}\nfunction checkQuiz(){let score=0;questions.forEach((q,i)=>{let selected=document.querySelector(`input[name=\"quiz${i}\"]:checked`),fb=$('fb'+i);if(selected&&Number(selected.value)===q.correct){score++;fb.style.color='#047857';fb.textContent='To‘g‘ri! '+q.why}else{fb.style.color='#b91c1c';fb.textContent='To‘g‘ri javob: '+String.fromCharCode(65+q.correct)+'. '+q.why}});$('quizResult').innerHTML=`<div class=\"${score>=4?'success':'notice'}\"><b>Natija: ${score}/5 (${score*20}%)<\/b><br>${score===5?'A’lo! Mavzuni juda yaxshi o‘zlashtirdingiz.':score>=3?'Yaxshi. Xato javoblarni ko‘rib chiqing.':'Formulalarni qayta o‘rganib, testni yana bajaring.'}<\/div>`}\nfunction resetQuiz(){$$('input[type=radio]').forEach(x=>x.checked=false);questions.forEach((q,i)=>$('fb'+i).textContent='');$('quizResult').innerHTML=''}\nfunction $$(sel){return [...document.querySelectorAll(sel)]}\nrenderQuiz();updateScene();go(0);\n<\/script>\n<\/body>\n<\/html>"}, {"id": "12-mavzu", "n": "12", "t": "Massa markazi, muvozanat, kuch momenti", "d": "Massa markazi, muvozanat turlari, kuch momenti", "k": "Dars", "html": "<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>12-mavzu — Massa markazi, muvozanat va kuch momenti<\/title>\n<style>\n:root{--navy:#18234b;--blue:#4263eb;--purple:#7654d6;--cyan:#13b8c9;--bg:#f4f6ff;--ink:#202747;--muted:#66708e;--card:#fff;--line:#e1e6f5;--green:#15966b;--orange:#ef8c35}\n*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,\"Segoe UI\",sans-serif;background:linear-gradient(135deg,#f5f7ff,#eef1ff);color:var(--ink);line-height:1.55}\nheader{background:linear-gradient(120deg,#17234d,#4737a2 65%,#7654d6);color:white;padding:26px 18px 22px}\n.wrap{max-width:1150px;margin:auto}header h1{margin:5px 0 8px;font-size:clamp(1.55rem,4vw,2.6rem);line-height:1.15}header p{margin:0;color:#e3e7ff;max-width:780px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:.76rem;font-weight:800;color:#b9c7ff}\nnav{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}button,.navbtn{border:0;border-radius:12px;padding:10px 14px;background:#e9edff;color:#29345e;font-weight:750;cursor:pointer;transition:.18s}button:hover,.navbtn:hover{transform:translateY(-1px);filter:brightness(.98)}button.primary{background:var(--blue);color:white}button.dark{background:var(--navy);color:white}button.ghost{background:#fff;border:1px solid var(--line)}button:focus-visible,input:focus-visible{outline:3px solid #8cb4ff;outline-offset:2px}\nmain{max-width:1150px;margin:22px auto;padding:0 16px 42px}.tabs{display:flex;gap:8px;overflow:auto;padding:3px 0 15px}.tabs button{white-space:nowrap}.tabs button.active{background:var(--navy);color:white}\n.section{display:none}.section.active{display:block;animation:fade .25s ease}@keyframes fade{from{opacity:.3;transform:translateY(5px)}to{opacity:1;transform:none}}\n.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 25px #263b7710;min-width:0}.card h2,.card h3{margin:0 0 10px;line-height:1.25}.card h2{font-size:1.25rem}.card h3{font-size:1.05rem}.muted{color:var(--muted)}.formula{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#f0f3ff;border:1px solid #dfe5ff;border-radius:10px;padding:10px 12px;display:inline-block;margin:5px 0;font-size:1.02rem;overflow-wrap:anywhere}.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.control{background:#f8f9ff;border:1px solid #e8ebfa;border-radius:12px;padding:10px}.control label{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;font-weight:700}.control output{color:var(--blue);font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:var(--blue);margin:10px 0 2px}canvas{display:block;width:100%;height:250px;border-radius:14px;background:linear-gradient(#fbfcff,#f0f4ff);border:1px solid var(--line);touch-action:pan-y}.canvas-tall{height:310px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.stat{padding:11px;border-radius:12px;background:#f6f7ff;border:1px solid var(--line);flex:1;min-width:120px}.stat strong{display:block;font-size:1.12rem;color:var(--blue)}.note{border-left:4px solid var(--cyan);padding:10px 13px;background:#effcff;border-radius:0 10px 10px 0;margin:10px 0}.warning{border-left-color:var(--orange);background:#fff8ef}.good{color:var(--green);font-weight:800}.bad{color:#c23d50;font-weight:800}.small{font-size:.88rem}.list{padding-left:20px}.list li{margin:6px 0}.pill{display:inline-block;border-radius:999px;padding:4px 9px;background:#eeeaff;color:#5944a5;font-size:.78rem;font-weight:800}.separator{height:1px;background:var(--line);margin:15px 0}.result{min-height:28px;margin-top:10px;font-weight:700}.quiz-option{display:block;width:100%;text-align:left;margin:7px 0;background:#f7f8ff;border:1px solid var(--line);font-weight:600}.quiz-option.selected{border-color:var(--blue);background:#edf1ff}.quiz-option.correct{border-color:#15966b;background:#eafaf3}.quiz-option.wrong{border-color:#d84c60;background:#fff0f2}.progress{height:8px;background:#e6e9f7;border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));width:0%}\nfooter{text-align:center;color:var(--muted);padding:12px 16px 28px}.symbol{font-size:1.5rem;margin-right:5px}\n@media(max-width:760px){.grid,.grid3{grid-template-columns:1fr}.controls{grid-template-columns:1fr 1fr}.card{padding:14px}canvas{height:220px}.canvas-tall{height:260px}header{padding-top:20px}}\n@media(max-width:400px){.controls{grid-template-columns:1fr}.tabs button{padding:9px 11px;font-size:.85rem}}\n<\/style>\n<\/head>\n<body>\n<header><div class=\"wrap\">\n<div class=\"eyebrow\">Virtual fizika laboratoriyasi · 8–10-sinflar<\/div>\n<h1>12-mavzu. Massa markazi, muvozanat turlari va kuch momenti<\/h1>\n<p>Parametrlarni o‘zgartiring, tajribalarni bajaring va fizik qonuniyatlarni kuzating.<\/p>\n<nav><button class=\"primary\" onclick=\"go('home')\">⌂ Bosh sahifa<\/button><button onclick=\"go('mass')\">1. Massa markazi<\/button><button onclick=\"go('balance')\">2. Muvozanat<\/button><button onclick=\"go('moment')\">3. Kuch momenti<\/button><button onclick=\"go('quiz')\">Test va masalalar<\/button><\/nav>\n<\/div><\/header>\n<main>\n<div class=\"tabs\" id=\"tabs\">\n<button class=\"active\" data-page=\"home\" onclick=\"go('home')\">Kirish<\/button>\n<button data-page=\"mass\" onclick=\"go('mass')\">Massa markazi<\/button>\n<button data-page=\"balance\" onclick=\"go('balance')\">Muvozanat<\/button>\n<button data-page=\"moment\" onclick=\"go('moment')\">Kuch momenti<\/button>\n<button data-page=\"quiz\" onclick=\"go('quiz')\">Mustahkamlash<\/button>\n<\/div>\n<section class=\"section active\" id=\"home\">\n<div class=\"grid\">\n<div class=\"card\"><span class=\"pill\">DARS REJASI<\/span><h2>Bugungi mavzu<\/h2>\n<ol class=\"list\"><li>Jismning massa markazi va uni aniqlash usullari.<\/li><li>Barqaror, beqaror va farqsiz muvozanat.<\/li><li>Kuch momenti, momentlar qoidasi va oddiy mexanizmlar.<\/li><\/ol>\n<div class=\"note\">Maslahat: har bir simulyatsiyada slayderlarni siljiting va natija qanday o‘zgarishini oldindan taxmin qiling.<\/div>\n<button class=\"primary\" onclick=\"go('mass')\">Darsni boshlash →<\/button><\/div>\n<div class=\"card\"><h2>Asosiy formulalar<\/h2>\n<div class=\"formula\">x<sub>cm<\/sub> = Σ(mᵢxᵢ) / Σmᵢ<\/div><br>\n<div class=\"formula\">ΣF⃗ = 0 &nbsp; va &nbsp; ΣM = 0<\/div><br>\n<div class=\"formula\">M = F · l<\/div><br>\n<div class=\"formula\">F₁l₁ = F₂l₂<\/div>\n<p class=\"muted small\">Bu yerda <b>l<\/b> — kuch yelkasi, ya’ni aylanish o‘qidan kuchning ta’sir chizig‘igacha bo‘lgan perpendikulyar masofa.<\/p><\/div>\n<\/div>\n<div class=\"grid3\" style=\"margin-top:16px\">\n<div class=\"card\"><h3><span class=\"symbol\">🎯<\/span>Maqsad<\/h3><p class=\"muted\">Massa markazini topish, muvozanatni farqlash va kuch momentini hisoblash.<\/p><\/div>\n<div class=\"card\"><h3><span class=\"symbol\">🧪<\/span>Tajriba<\/h3><p class=\"muted\">Jismlar massasi, joylashuvi, kuch va yelkani o‘zgartirib ko‘ring.<\/p><\/div>\n<div class=\"card\"><h3><span class=\"symbol\">✓<\/span>Natija<\/h3><p class=\"muted\">Testlar va masalalar yordamida tushunchalarni tekshiring.<\/p><\/div>\n<\/div>\n<\/section>\n\n<section class=\"section\" id=\"mass\">\n<div class=\"grid\">\n<div class=\"card\"><h2>1. Massa markazi nima?<\/h2>\n<p><b>Massa markazi<\/b> — jism yoki jismlar sistemasining massasini hisoblashda uning taqsimlanishini ifodalovchi nuqta. Bir jinsli, simmetrik tayoqning massa markazi o‘rtasida bo‘ladi. Massa markazi ba’zan jism materiali joylashmagan nuqtada ham bo‘lishi mumkin, masalan, halqaning markazida.<\/p>\n<p>Yer sirtiga yaqin, gravitatsiya maydoni bir xil deb qaralganda, og‘irlik markazi massa markazi bilan mos tushadi.<\/p>\n<div class=\"formula\">x<sub>cm<\/sub> = (m₁x₁ + m₂x₂)/(m₁ + m₂)<\/div>\n<p class=\"small muted\">m — massa (kg), x — koordinata (m). Ikki o‘lchamda y koordinatasi ham xuddi shu usulda hisoblanadi.<\/p>\n<div class=\"note\"><b>Simmetriya:<\/b> bir jinsli doira va halqaning massa markazi geometrik markazda bo‘ladi. Halqada bu nuqta materialning tashqarisida joylashgan.<\/div>\n<\/div>\n<div class=\"card\"><h2>Simulyatsiya 1 · Ikki jism<\/h2><canvas id=\"massCanvas\" aria-label=\"Ikki jism va massa markazi tasviri\"><\/canvas>\n<div class=\"controls\">\n<div class=\"control\"><label>1-jism massasi <output id=\"m1v\">3 kg<\/output><\/label><input id=\"m1\" type=\"range\" min=\"1\" max=\"10\" value=\"3\"><\/div>\n<div class=\"control\"><label>2-jism massasi <output id=\"m2v\">7 kg<\/output><\/label><input id=\"m2\" type=\"range\" min=\"1\" max=\"10\" value=\"7\"><\/div>\n<div class=\"control\"><label>1-jism koordinatasi <output id=\"x1v\">−3 m<\/output><\/label><input id=\"x1\" type=\"range\" min=\"-5\" max=\"5\" value=\"-3\"><\/div>\n<div class=\"control\"><label>2-jism koordinatasi <output id=\"x2v\">4 m<\/output><\/label><input id=\"x2\" type=\"range\" min=\"-5\" max=\"5\" value=\"4\"><\/div>\n<\/div>\n<div class=\"row\" style=\"margin-top:10px\"><button class=\"ghost\" onclick=\"equalMass()\">Massalarni tenglashtirish<\/button><button class=\"ghost\" onclick=\"resetMass()\">Boshlang‘ich holat<\/button><\/div>\n<div class=\"row\" style=\"margin-top:10px\"><div class=\"stat\">Massa markazi<strong id=\"cmOut\">1.9 m<\/strong><\/div><div class=\"stat\">Jami massa<strong id=\"sumM\">10 kg<\/strong><\/div><\/div>\n<div class=\"formula\" id=\"cmFormula\">xcm = ...<\/div>\n<\/div>\n<\/div>\n<div class=\"grid\" style=\"margin-top:16px\">\n<div class=\"card\"><h2>Simulyatsiya 2 · Osib aniqlash<\/h2>\n<p>Notekis plastinkani turli nuqtalardan osib, shovun yo‘nalishlarini belgilang. Ikki vertikal chiziq kesishgan nuqta massa markazini ko‘rsatadi.<\/p>\n<canvas id=\"hangCanvas\" class=\"canvas-tall\" aria-label=\"Osilgan plastinka va shovun chiziqlari\"><\/canvas>\n<div class=\"row\"><button onclick=\"hang(1)\">1-nuqtadan osish<\/button><button onclick=\"hang(2)\">2-nuqtadan osish<\/button><button class=\"primary\" onclick=\"findHang()\">Massa markazini topish<\/button><button class=\"ghost\" onclick=\"resetHang()\">Qayta boshlash<\/button><\/div>\n<div class=\"result\" id=\"hangResult\">Tajriba boshlash uchun osish nuqtasini tanlang.<\/div>\n<\/div>\n<div class=\"card\"><h2>Massa markazi qayerda?<\/h2>\n<div class=\"grid3\">\n<div><svg viewBox=\"0 0 100 75\" width=\"100%\"><rect x=\"8\" y=\"30\" width=\"84\" height=\"14\" rx=\"5\" fill=\"#91a9ff\"/><circle cx=\"50\" cy=\"37\" r=\"5\" fill=\"#f04d79\"/><path d=\"M50 10V27\" stroke=\"#7654d6\" stroke-width=\"2\"/><path d=\"M45 22L50 28L55 22\" fill=\"none\" stroke=\"#7654d6\" stroke-width=\"2\"/><\/svg><b>Tayoq<\/b><p class=\"muted small\">Bir jinsli tayoqning o‘rtasi.<\/p><\/div>\n<div><svg viewBox=\"0 0 100 75\" width=\"100%\"><circle cx=\"50\" cy=\"37\" r=\"25\" fill=\"none\" stroke=\"#91a9ff\" stroke-width=\"12\"/><circle cx=\"50\" cy=\"37\" r=\"4\" fill=\"#f04d79\"/><path d=\"M50 7V27M20 37H42\" stroke=\"#7654d6\" stroke-dasharray=\"3 3\"/><\/svg><b>Halqa<\/b><p class=\"muted small\">Markaz bo‘shliqda bo‘lishi mumkin.<\/p><\/div>\n<div><svg viewBox=\"0 0 100 75\"><circle cx=\"50\" cy=\"37\" r=\"25\" fill=\"#91a9ff\"/><circle cx=\"50\" cy=\"37\" r=\"4\" fill=\"#f04d79\"/><path d=\"M50 5V27M20 37H42\" stroke=\"#7654d6\" stroke-dasharray=\"3 3\"/><\/svg><b>Doira<\/b><p class=\"muted small\">Bir jinsli doiraning markazi.<\/p><\/div>\n<\/div>\n<div class=\"note\">Osib aniqlash usulida jism tinch turganda massa markazi shovun chizig‘i bo‘ylab, osish nuqtasining tagida yotadi.<\/div>\n<\/div>\n<\/div>\n<\/section>\n\n<section class=\"section\" id=\"balance\">\n<div class=\"card\"><h2>2. Muvozanat turlari<\/h2><p>Jism tinch turishi uchun natijaviy kuch nol bo‘lishi, aylanma muvozanatda esa natijaviy kuch momenti ham nol bo‘lishi kerak.<\/p><div class=\"formula\">ΣF⃗ = 0 &nbsp;&nbsp; ΣM = 0<\/div>\n<div class=\"grid3\" style=\"margin-top:12px\">\n<div class=\"card\"><span class=\"pill\">BARQAROR<\/span><h3>Botiq sirt<\/h3><p class=\"small\">Ozroq siljitib qo‘yib yuborilganda jism muvozanat holatiga qaytishga intiladi. Potensial energiya shu holatda minimum.<\/p><\/div>\n<div class=\"card\"><span class=\"pill\">BEQAROR<\/span><h3>Qavariq sirt<\/h3><p class=\"small\">Ozroq siljitilganda jism muvozanat holatidan uzoqlashadi. Tepada potensial energiya maksimum bo‘ladi.<\/p><\/div>\n<div class=\"card\"><span class=\"pill\">FARQSIZ<\/span><h3>Gorizontal sirt<\/h3><p class=\"small\">Ideal gorizontal sirt bo‘ylab siljitilganda balandlik va potensial energiya o‘zgarmaydi; yangi holatda qoladi.<\/p><\/div>\n<\/div><\/div>\n<div class=\"card\" style=\"margin-top:16px\"><h2>Simulyatsiya 3 · Sharni siljiting<\/h2>\n<p class=\"muted small\">Har bir tajribada “Siljitish” tugmasini bosing, so‘ng “Qo‘yib yuborish”ni tanlang. Bu soddalashtirilgan modelda ishqalanish va so‘nish sifat jihatdan ko‘rsatiladi.<\/p>\n<div class=\"grid3\">\n<div class=\"card\"><h3>Barqaror muvozanat<\/h3><canvas id=\"stableCanvas\" aria-label=\"Botiq sirt ichidagi shar\"><\/canvas><div class=\"row\"><button onclick=\"shiftBall('stable',-1)\">← Siljitish<\/button><button onclick=\"shiftBall('stable',1)\">Siljitish →<\/button><button class=\"primary\" onclick=\"releaseBall('stable')\">Qo‘yib yuborish<\/button><\/div><div class=\"result\" id=\"stableText\">Shar muvozanat holatida.<\/div><\/div>\n<div class=\"card\"><h3>Beqaror muvozanat<\/h3><canvas id=\"unstableCanvas\" aria-label=\"Qavariq sirt ustidagi shar\"><\/canvas><div class=\"row\"><button onclick=\"shiftBall('unstable',-1)\">← Siljitish<\/button><button onclick=\"shiftBall('unstable',1)\">Siljitish →<\/button><button class=\"primary\" onclick=\"releaseBall('unstable')\">Qo‘yib yuborish<\/button><\/div><div class=\"result\" id=\"unstableText\">Shar qavariq sirt tepasida.<\/div><\/div>\n<div class=\"card\"><h3>Farqsiz muvozanat<\/h3><canvas id=\"neutralCanvas\" aria-label=\"Gorizontal sirt ustidagi shar\"><\/canvas><div class=\"row\"><button onclick=\"shiftBall('neutral',-1)\">← Siljitish<\/button><button onclick=\"shiftBall('neutral',1)\">Siljitish →<\/button><button class=\"primary\" onclick=\"releaseBall('neutral')\">Qo‘yib yuborish<\/button><\/div><div class=\"result\" id=\"neutralText\">Shar yangi joyida qoladi.<\/div><\/div>\n<\/div><\/div>\n<\/section>\n\n<section class=\"section\" id=\"moment\">\n<div class=\"grid\">\n<div class=\"card\"><h2>3. Kuch momenti<\/h2>\n<p>Kuch momenti jismni aylantirish ta’sirini ifodalaydi. Kuch kattaroq yoki yelka uzunroq bo‘lsa, aylantiruvchi ta’sir ortadi.<\/p>\n<div class=\"formula\">M = F · l<\/div>\n<ul class=\"list\"><li><b>M<\/b> — kuch momenti (N·m).<\/li><li><b>F<\/b> — kuch (N).<\/li><li><b>l<\/b> — kuch yelkasi (m), perpendikulyar masofa.<\/li><\/ul>\n<div class=\"formula\">F₁l₁ = F₂l₂<\/div>\n<p>Ideal richag muvozanatida qarama-qarshi momentlar kattalik jihatdan teng bo‘ladi. Masalan, qisqa yelkadagi katta kuchni uzun yelkadagi kichik kuch muvozanatlashi mumkin.<\/p>\n<div class=\"note\">Richagning aylanish yo‘nalishini faqat yuk massasi emas, balki massa (yoki kuch) va yelka ko‘paytmasi belgilaydi.<\/div>\n<\/div>\n<div class=\"card\"><h2>Simulyatsiya 4 · Interaktiv richag<\/h2><canvas id=\"leverCanvas\" class=\"canvas-tall\" aria-label=\"Yuklari o‘zgaradigan richag\"><\/canvas>\n<div class=\"controls\">\n<div class=\"control\"><label>Chap massa <output id=\"lm1v\">8 kg<\/output><\/label><input id=\"lm1\" type=\"range\" min=\"1\" max=\"20\" value=\"8\"><\/div>\n<div class=\"control\"><label>O‘ng massa <output id=\"lm2v\">4 kg<\/output><\/label><input id=\"lm2\" type=\"range\" min=\"1\" max=\"20\" value=\"4\"><\/div>\n<div class=\"control\"><label>Chap yelka <output id=\"ll1v\">1.0 m<\/output><\/label><input id=\"ll1\" type=\"range\" min=\"0.2\" max=\"2\" step=\"0.1\" value=\"1\"><\/div>\n<div class=\"control\"><label>O‘ng yelka <output id=\"ll2v\">2.0 m<\/output><\/label><input id=\"ll2\" type=\"range\" min=\"0.2\" max=\"2\" step=\"0.1\" value=\"2\"><\/div>\n<\/div>\n<div class=\"row\" style=\"margin-top:10px\"><button class=\"primary\" onclick=\"balanceLever()\">Muvozanatni topish<\/button><button class=\"ghost\" onclick=\"resetLever()\">Qayta boshlash<\/button><\/div>\n<div class=\"row\" style=\"margin-top:10px\"><div class=\"stat\">Chap moment<strong id=\"mom1\">78.48 N·m<\/strong><\/div><div class=\"stat\">O‘ng moment<strong id=\"mom2\">78.48 N·m<\/strong><\/div><\/div>\n<div class=\"result\" id=\"leverResult\">Momentlar teng: richag muvozanatda.<\/div>\n<\/div>\n<\/div>\n<div class=\"grid\" style=\"margin-top:16px\">\n<div class=\"card\"><h2>Simulyatsiya 5 · Kuch va yelka<\/h2><canvas id=\"wrenchCanvas\" aria-label=\"Gayka kaliti kuch momenti\"><\/canvas>\n<div class=\"controls\">\n<div class=\"control\"><label>Kuch <output id=\"forceV\">30 N<\/output><\/label><input id=\"force\" type=\"range\" min=\"5\" max=\"100\" value=\"30\"><\/div>\n<div class=\"control\"><label>Kuch yelkasi <output id=\"armV\">0.30 m<\/output><\/label><input id=\"arm\" type=\"range\" min=\"0.05\" max=\"1\" step=\"0.05\" value=\"0.3\"><\/div>\n<\/div>\n<div class=\"row\" style=\"margin-top:8px\"><div class=\"stat\">Kuch momenti<strong id=\"wrenchM\">9 N·m<\/strong><\/div><button onclick=\"doubleForce()\">Kuchni 2 baravar<\/button><button onclick=\"doubleArm()\">Yelkani 2 baravar<\/button><\/div>\n<p class=\"muted small\">Yelka yoki kuch ikki baravar oshsa, boshqa kattalik o‘zgarmaganda moment ham ikki baravar oshadi.<\/p>\n<\/div>\n<div class=\"card\"><h2>Simulyatsiya 6 · Hayotdagi mexanizmlar<\/h2>\n<div class=\"grid3\">\n<button class=\"ghost\" onclick=\"mechanism('seesaw')\">⚖️ Arg‘imchoq<\/button>\n<button class=\"ghost\" onclick=\"mechanism('door')\">🚪 Eshik<\/button>\n<button class=\"ghost\" onclick=\"mechanism('wrench')\">🔧 Kalit<\/button>\n<button class=\"ghost\" onclick=\"mechanism('scale')\">⚖️ Tarozi<\/button>\n<button class=\"ghost\" onclick=\"mechanism('scissors')\">✂️ Qaychi<\/button>\n<button class=\"ghost\" onclick=\"mechanism('pliers')\">🗜️ Ombur<\/button>\n<\/div>\n<div class=\"separator\"><\/div><h3 id=\"mechTitle\">Arg‘imchoq<\/h3><p id=\"mechText\">Tayanchdan uzoqroq o‘tirgan yengilroq kishi, yaqinroq o‘tirgan og‘irroq kishini muvozanatlashi mumkin.<\/p><div class=\"formula\" id=\"mechFormula\">m₁gl₁ = m₂gl₂<\/div>\n<canvas id=\"mechCanvas\" aria-label=\"Tanlangan oddiy mexanizm\"><\/canvas>\n<\/div>\n<\/div>\n<\/section>\n\n<section class=\"section\" id=\"quiz\">\n<div class=\"grid\">\n<div class=\"card\"><h2>Bilimni tekshirish · 10 test<\/h2><div class=\"progress\"><span id=\"quizProgress\"><\/span><\/div><p id=\"quizCount\" class=\"muted small\">1 / 10-savol<\/p><h3 id=\"question\"><\/h3><div id=\"options\"><\/div><div class=\"result\" id=\"feedback\"><\/div><div class=\"row\"><button class=\"primary\" id=\"nextQ\" onclick=\"nextQuestion()\" disabled>Keyingi savol →<\/button><button class=\"ghost\" onclick=\"restartQuiz()\">Qayta boshlash<\/button><\/div><div id=\"scoreBox\" class=\"note\" style=\"display:none\"><\/div><\/div>\n<div class=\"card\"><h2>Fizik masalalar<\/h2>\n<details open><summary><b>1-masala. Massa markazi<\/b><\/summary><p>2 kg jism x = 0 m da, 6 kg jism x = 4 m da. Massa markazini toping.<\/p><button onclick=\"showSolution(1)\">Yechimni ko‘rsatish<\/button><p id=\"sol1\" class=\"result\"><\/p><\/details><div class=\"separator\"><\/div>\n<details><summary><b>2-masala. Kuch momenti<\/b><\/summary><p>40 N kuch 0,25 m yelkaga perpendikulyar ta’sir qiladi. Momentni toping.<\/p><button onclick=\"showSolution(2)\">Yechimni ko‘rsatish<\/button><p id=\"sol2\" class=\"result\"><\/p><\/details><div class=\"separator\"><\/div>\n<details><summary><b>3-masala. Richag<\/b><\/summary><p>20 N kuch 0,8 m yelkada. Ikkinchi kuch 0,4 m yelkada muvozanat hosil qilishi uchun qancha bo‘lishi kerak?<\/p><button onclick=\"showSolution(3)\">Yechimni ko‘rsatish<\/button><p id=\"sol3\" class=\"result\"><\/p><\/details><div class=\"separator\"><\/div>\n<details><summary><b>4-masala. Massa markazi<\/b><\/summary><p>3 kg jism x = −2 m da, 3 kg jism x = 4 m da. Massa markazini toping.<\/p><button onclick=\"showSolution(4)\">Yechimni ko‘rsatish<\/button><p id=\"sol4\" class=\"result\"><\/p><\/details><div class=\"separator\"><\/div>\n<details><summary><b>5-masala. Kuch yelkasi<\/b><\/summary><p>Moment 15 N·m, kuch 50 N. Kuch yelkasini toping.<\/p><button onclick=\"showSolution(5)\">Yechimni ko‘rsatish<\/button><p id=\"sol5\" class=\"result\"><\/p><\/details>\n<\/div>\n<\/div>\n<div class=\"card\" style=\"margin-top:16px\"><h2>Dars yakuni<\/h2><ul class=\"list\"><li>Massa markazi massalarning fazoda qanday taqsimlanganini ifodalaydi.<\/li><li>Barqaror, beqaror va farqsiz muvozanat jismning kichik siljishga javobi bilan farqlanadi.<\/li><li>Kuch momenti kuch va yelka ko‘paytmasiga teng (kuch yelkaga perpendikulyar bo‘lganda).<\/li><li>Richag muvozanatida qarama-qarshi momentlar tenglashadi.<\/li><\/ul><p><b>Uyga vazifa:<\/b> kundalik hayotdan kuch momentiga oid uchta misol toping va ularda aylanish o‘qi, kuch hamda yelkani aniqlang.<\/p><label for=\"reflection\"><b>O‘z xulosangizni yozing:<\/b><\/label><textarea id=\"reflection\" rows=\"3\" style=\"width:100%;margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:10px\" placeholder=\"Bugun men ... ni o‘rgandim\"><\/textarea><\/div>\n<\/section>\n<div class=\"row\" style=\"justify-content:space-between;margin-top:20px\"><button class=\"ghost\" onclick=\"stepPage(-1)\">← Oldingi<\/button><span class=\"muted small\" id=\"pageLabel\">Kirish<\/span><button class=\"primary\" onclick=\"stepPage(1)\">Keyingi →<\/button><\/div>\n<\/main>\n<footer>Virtual fizika laboratoriyasi · Massa markazi · Muvozanat · Kuch momenti<\/footer>\n<script>\nconst pages=['home','mass','balance','moment','quiz'];let current='home';\nfunction go(id){current=id;document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id===id));document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.page===id));document.getElementById('pageLabel').textContent=({home:'Kirish',mass:'Massa markazi',balance:'Muvozanat',moment:'Kuch momenti',quiz:'Mustahkamlash'})[id];setTimeout(drawAll,40);window.scrollTo({top:0,behavior:'smooth'})}\nfunction stepPage(d){go(pages[Math.max(0,Math.min(pages.length-1,pages.indexOf(current)+d))])}\nfunction canvasCtx(id){let c=document.getElementById(id);if(!c)return null;let r=c.getBoundingClientRect();if(r.width<2)return null;let dpr=window.devicePixelRatio||1;c.width=Math.round(r.width*dpr);c.height=Math.round(r.height*dpr);let x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);return {c,x,w:r.width,h:r.height}}\nfunction line(x,a,b,c,d,color='#8794b7',width=2){x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.strokeStyle=color;x.lineWidth=width;x.stroke()}\nfunction circle(x,a,b,r,fill,stroke){x.beginPath();x.arc(a,b,r,0,Math.PI*2);x.fillStyle=fill;x.fill();if(stroke){x.strokeStyle=stroke;x.lineWidth=2;x.stroke()}}\nfunction text(x,t,a,b,color='#344064',font='12px system-ui'){x.fillStyle=color;x.font=font;x.textAlign='center';x.fillText(t,a,b)}\nfunction roundRect(x,a,b,w,h,r,fill){x.beginPath();x.roundRect(a,b,w,h,r);x.fillStyle=fill;x.fill()}\nfunction val(id){return +document.getElementById(id).value}\nfunction fmt(n,d=2){return Number(n).toFixed(d).replace('.',',')}\nfunction drawMass(){let z=canvasCtx('massCanvas');if(!z)return;let{x,w,h}=z.x?{x:z.x,w:z.w,h:z.h}:{};let m1=val('m1'),m2=val('m2'),x1=val('x1'),x2=val('x2'),cm=(m1*x1+m2*x2)/(m1+m2);let px=v=>w/2+v*(w*.43/5),y=h*.55;line(x,18,y,w-18,y,'#9aa6c4',2);for(let i=-5;i<=5;i++){let xx=px(i);line(x,xx,y-5,xx,y+5,'#8b97b7');text(x,String(i),xx,y+20,'#66708e','10px system-ui')}line(x,px(x1),y,px(x1),y-35,'#4263eb',2);line(x,px(x2),y,px(x2),y-35,'#13a7b8',2);circle(x,px(x1),y-42,Math.min(23,9+m1*1.3),'#7392ff','#3658d4');circle(x,px(x2),y-42,Math.min(23,9+m2*1.3),'#4dd0d7','#148c9a');text(x,'m₁='+m1+' kg',px(x1),y-73,'#3658d4','bold 11px system-ui');text(x,'m₂='+m2+' kg',px(x2),y-73,'#148c9a','bold 11px system-ui');line(x,px(cm),y+28,px(cm),y-10,'#ed4775',3);circle(x,px(cm),y-12,5,'#ed4775');text(x,'Massa markazi',px(cm),y+46,'#c52d5a','bold 11px system-ui');document.getElementById('m1v').textContent=m1+' kg';document.getElementById('m2v').textContent=m2+' kg';document.getElementById('x1v').textContent=x1+' m';document.getElementById('x2v').textContent=x2+' m';document.getElementById('cmOut').textContent=fmt(cm)+' m';document.getElementById('sumM').textContent=(m1+m2)+' kg';document.getElementById('cmFormula').textContent='xcm = ('+m1+'×('+x1+') + '+m2+'×('+x2+')) / '+(m1+m2)+' = '+fmt(cm)+' m'}\n['m1','m2','x1','x2'].forEach(id=>document.getElementById(id).addEventListener('input',drawMass));\nfunction equalMass(){document.getElementById('m2').value=val('m1');drawMass()}function resetMass(){[['m1',3],['m2',7],['x1',-3],['x2',4]].forEach(a=>document.getElementById(a[0]).value=a[1]);drawMass()}\nlet hangState={one:false,two:false,found:false};\nfunction drawHang(){let z=canvasCtx('hangCanvas');if(!z)return;let{x,w,h}=z;let cx=w*.5,cy=h*.47; // stylized irregular plate\nx.beginPath();x.moveTo(cx-80,cy-70);x.lineTo(cx+35,cy-90);x.lineTo(cx+88,cy-25);x.lineTo(cx+62,cy+65);x.lineTo(cx-25,cy+84);x.lineTo(cx-90,cy+25);x.closePath();x.fillStyle='#9bb0ff';x.fill();x.strokeStyle='#4567d8';x.lineWidth=2;x.stroke();\nlet mx=cx-5,my=cy+8;circle(x,mx,my,5,'#e94575');if(hangState.one){circle(x,cx-65,cy-45,5,'#7654d6');line(x,cx-65,cy-45,cx-65,h-12,'#7654d6',2);text(x,'1',cx-65,cy-55,'#7654d6','bold 12px system-ui')}if(hangState.two){circle(x,cx+60,cy-50,5,'#13a7b8');line(x,cx+60,cy-50,cx+60,h-12,'#13a7b8',2);text(x,'2',cx+60,cy-60,'#148c9a','bold 12px system-ui')}if(hangState.found){circle(x,mx,my,9,'#e94575');text(x,'Massa markazi',mx+42,my+18,'#c52d5a','bold 11px system-ui')}text(x,'Notekis plastinka',cx,h-10,'#66708e','12px system-ui')}\nfunction hang(n){if(n===1)hangState.one=true;else hangState.two=true;hangState.found=false;document.getElementById('hangResult').textContent='Shovun chizig‘i chizildi. Endi boshqa nuqtadan osib ko‘ring.';drawHang()}function findHang(){if(!hangState.one||!hangState.two){document.getElementById('hangResult').textContent='Avval plastinkani ikkala nuqtadan ham osing.';return}hangState.found=true;drawHang();document.getElementById('hangResult').textContent='Xulosa: shovun chiziqlari kesishgan nuqta massa markazini beradi.'}function resetHang(){hangState={one:false,two:false,found:false};drawHang();document.getElementById('hangResult').textContent='Tajriba boshlash uchun osish nuqtasini tanlang.'}\nlet balls={stable:0,unstable:0,neutral:0},released={stable:false,unstable:false,neutral:false};\nfunction drawBall(type){let z=canvasCtx(type+'Canvas');if(!z)return;let{x,w,h}=z;let cx=w/2,base=h*.72,amp=Math.min(w*.34,110),off=balls[type]*amp/2;line(x,10,base,w-10,base,'#b7c1dd',1);x.beginPath();if(type==='stable'){x.moveTo(12,base-4);x.quadraticCurveTo(cx,base+80,w-12,base-4);x.strokeStyle='#7388c7';x.lineWidth=3;x.stroke();let bx=Math.max(22,Math.min(w-22,cx+off));let by=base+80*(1-Math.pow((bx-cx)/amp,2))-14;circle(x,bx,by,13,'#6d8cff','#3658d4');text(x,'Botiq sirt',cx,base+27,'#66708e')}else if(type==='unstable'){x.moveTo(12,base+55);x.quadraticCurveTo(cx,base-95,w-12,base+55);x.strokeStyle='#7388c7';x.lineWidth=3;x.stroke();let bx=Math.max(22,Math.min(w-22,cx+off));let by=base+55-150*(1-Math.pow((bx-cx)/amp,2))-14;circle(x,bx,by,13,'#ffb65c','#d17a23');text(x,'Qavariq sirt',cx,base+70,'#66708e')}else{line(x,12,base+10,w-12,base+10,'#7388c7',3);let bx=Math.max(22,Math.min(w-22,cx+off));circle(x,bx,base-4,13,'#43c7c8','#148c9a');text(x,'Gorizontal sirt',cx,base+34,'#66708e')} }\nfunction shiftBall(type,dir){balls[type]=Math.max(-1,Math.min(1,balls[type]+dir*.38));released[type]=false;drawBall(type);document.getElementById(type+'Text').textContent='Shar muvozanatdan '+(dir<0?'chapga':'o‘ngga')+' siljitildi.'}\nfunction releaseBall(type){if(type==='stable'){balls[type]*=.12;document.getElementById(type+'Text').textContent='Barqaror: shar muvozanat tomon qaytadi.'}else if(type==='unstable'){balls[type]=balls[type]===0?.7:Math.sign(balls[type]);document.getElementById(type+'Text').textContent='Beqaror: shar tepadan chetga siljiydi.'}else{document.getElementById(type+'Text').textContent='Farqsiz: ideal sirt bo‘ylab yangi joyida qoladi.'}drawBall(type)}\nfunction drawLever(){let z=canvasCtx('leverCanvas');if(!z)return;let{x,w,h}=z,m1=val('lm1'),m2=val('lm2'),l1=val('ll1'),l2=val('ll2'),M1=m1*9.81*l1,M2=m2*9.81*l2,d=M1-M2;let cx=w/2,scale=Math.min(w*.38/Math.max(l1,l2),85),ang=Math.max(-.32,Math.min(.32,d*.003));let leftX=cx-l1*scale,rightX=cx+l2*scale,cy=h*.53;line(x,leftX,cy+Math.tan(ang)*(leftX-cx),rightX,cy+Math.tan(ang)*(rightX-cx),'#4963c5',7);x.beginPath();x.moveTo(cx-18,h*.86);x.lineTo(cx+18,h*.86);x.lineTo(cx,h*.61);x.closePath();x.fillStyle='#7654d6';x.fill();let ly=cy+Math.tan(ang)*(leftX-cx),ry=cy+Math.tan(ang)*(rightX-cx);roundRect(x,leftX-15,ly-34,30,30,5,'#7190ff');roundRect(x,rightX-15,ry-34,30,30,5,'#44c7cb');line(x,leftX,ly-5,leftX,ly-25,'#3153bf',2);line(x,rightX,ry-5,rightX,ry-25,'#148c9a',2);text(x,m1+' kg',leftX,ly-43,'#3153bf','bold 11px system-ui');text(x,m2+' kg',rightX,ry-43,'#148c9a','bold 11px system-ui');text(x,'l₁='+l1.toFixed(1)+' m',leftX,cy+45);text(x,'l₂='+l2.toFixed(1)+' m',rightX,cy+45);document.getElementById('lm1v').textContent=m1+' kg';document.getElementById('lm2v').textContent=m2+' kg';document.getElementById('ll1v').textContent=l1.toFixed(1)+' m';document.getElementById('ll2v').textContent=l2.toFixed(1)+' m';document.getElementById('mom1').textContent=fmt(M1)+' N·m';document.getElementById('mom2').textContent=fmt(M2)+' N·m';let delta=M1-M2;document.getElementById('leverResult').textContent=Math.abs(delta)<.5?'Momentlar teng: richag muvozanatda.':(delta>0?'Chap moment kattaroq: chap tomon pastga intiladi.':'O‘ng moment kattaroq: o‘ng tomon pastga intiladi.')+' (ΔM = '+fmt(delta)+' N·m)'}\n['lm1','lm2','ll1','ll2'].forEach(id=>document.getElementById(id).addEventListener('input',drawLever));\nfunction balanceLever(){let m1=val('lm1'),m2=val('lm2'),l1=val('ll1');document.getElementById('ll2').value=Math.max(.2,Math.min(2,Math.round((m1*l1/m2)*10)/10));drawLever()}\nfunction resetLever(){[['lm1',8],['lm2',4],['ll1',1],['ll2',2]].forEach(a=>document.getElementById(a[0]).value=a[1]);drawLever()}\nfunction drawWrench(){let z=canvasCtx('wrenchCanvas');if(!z)return;let{x,w,h}=z,F=val('force'),l=val('arm'),cx=w*.18,cy=h*.65,ex=Math.min(w*.85,cx+l*w*.68);line(x,cx,cy,ex,cy,'#6579ca',12);circle(x,cx,cy,10,'#7654d6');line(x,ex,cy-8,ex,cy-45,'#ef8c35',3);line(x,ex,cy-45,ex-7,cy-34,'#ef8c35',3);line(x,ex,cy-45,ex+7,cy-34,'#ef8c35',3);text(x,'F = '+F+' N',ex,cy-58,'#bd6a20','bold 12px system-ui');text(x,'l = '+l.toFixed(2)+' m',(cx+ex)/2,cy+28,'#344064','bold 12px system-ui');document.getElementById('forceV').textContent=F+' N';document.getElementById('armV').textContent=l.toFixed(2)+' m';document.getElementById('wrenchM').textContent=fmt(F*l)+' N·m'}\n['force','arm'].forEach(id=>document.getElementById(id).addEventListener('input',drawWrench));function doubleForce(){document.getElementById('force').value=Math.min(100,val('force')*2);drawWrench()}function doubleArm(){document.getElementById('arm').value=Math.min(1,Math.round(val('arm')*2*100)/100);drawWrench()}\nconst mechs={seesaw:['Arg‘imchoq','Tayanchdan uzoqroq joylashgan kichik kuch ham katta moment hosil qilishi mumkin.','m₁gl₁ = m₂gl₂'],door:['Eshik tutqichi','Tutqich aylanish o‘qidan uzoqda joylashadi. Shu sababli bir xil kuch kattaroq moment hosil qiladi.','M = F·l'],wrench:['Gayka kaliti','Uzun kalitning yelkasi katta, shuning uchun bir xil kuch bilan kattaroq moment hosil qilinadi.','M = F·l'],scale:['Ikki pallali tarozi','Teng yelkali tarozida teng massalar teng moment hosil qilib muvozanat beradi.','m₁gl = m₂gl'],scissors:['Qaychi','Qaychining markaziy birikmasi aylanish o‘qi vazifasini bajaradi. Dastakdagi kuch pichoqlarda kuch momentini yuzaga keltiradi.','M = F·l'],pliers:['Ombur','Ombur dastaklari uzun yelka, jag‘lari esa qisqaroq yelka hosil qiladi; bu kuchni oshirishga yordam beradi.','F₁l₁ ≈ F₂l₂']};\nfunction mechanism(k){let a=mechs[k];document.getElementById('mechTitle').textContent=a[0];document.getElementById('mechText').textContent=a[1];document.getElementById('mechFormula').textContent=a[2];drawMechanism(k)}\nfunction drawMechanism(k='seesaw'){let z=canvasCtx('mechCanvas');if(!z)return;let{x,w,h}=z,cx=w/2,cy=h*.55; if(k==='door'){roundRect(x,w*.22,h*.15,w*.42,h*.68,5,'#d2ddff');line(x,w*.22,h*.15,w*.22,h*.83,'#526bc4',3);circle(x,w*.59,cy,5,'#ef8c35');line(x,w*.59,cy,w*.59,cy-35,'#ef8c35',3);text(x,'Aylanish o‘qi',w*.15,h*.92)}else if(k==='wrench'){line(x,w*.2,cy,w*.78,cy,'#6579ca',14);circle(x,w*.2,cy,10,'#7654d6');line(x,w*.78,cy,w*.78,cy-45,'#ef8c35',3);text(x,'Uzun yelka',w*.52,cy+30)}else if(k==='scissors'||k==='pliers'){let dx=k==='scissors'?55:45;line(x,cx,cy,cx-dx,h*.2,'#6579ca',7);line(x,cx,cy,cx+dx,h*.2,'#6579ca',7);line(x,cx,cy,cx-dx,h*.9,'#13a7b8',7);line(x,cx,cy,cx+dx,h*.9,'#13a7b8',7);circle(x,cx,cy,8,'#ef8c35');text(x,'Aylanish o‘qi',cx,cy-15)}else{line(x,w*.15,cy,w*.85,cy,'#6579ca',7);x.beginPath();x.moveTo(cx-24,h*.87);x.lineTo(cx+24,h*.87);x.lineTo(cx,h*.58);x.closePath();x.fillStyle='#7654d6';x.fill();circle(x,w*.25,cy-18,18,'#7190ff');circle(x,w*.75,cy-18,18,'#44c7cb');line(x,w*.25,cy,w*.25,cy-18,'#3658d4',2);line(x,w*.75,cy,w*.75,cy-18,'#148c9a',2);text(x,'l₁',w*.25,cy+27);text(x,'l₂',w*.75,cy+27)}}\nconst questions=[\n['Ikki moddiy nuqtaning massa markazi qaysi kattaliklarga bog‘liq?',['Faqat koordinatalariga','Faqat massalariga','Massalari va koordinatalariga','Faqat shakliga'],2,'Massa markazi massalar va ularning koordinatalari bilan aniqlanadi.'],\n['Bir jinsli tayoqning massa markazi qayerda?',['Bir uchida','O‘rtasida','Har doim tashqarida','Tayoq uzunligiga bog‘liq emas'],1,'Simmetrik, bir jinsli tayoqning massa markazi uning o‘rtasida.'],\n['Botiq idish ichidagi shar qanday muvozanatda bo‘ladi?',['Barqaror','Beqaror','Farqsiz','Muvozanat bo‘lmaydi'],0,'Shar biroz siljitilganda pastki holatga qaytishga intiladi.'],\n['Qavariq sirt tepasidagi shar qanday muvozanatda?',['Barqaror','Beqaror','Farqsiz','Faqat ishqalanishda barqaror'],1,'Ozgina siljish sharni tepadan uzoqlashtiradi.'],\n['Ideal gorizontal tekislikdagi shar uchun qaysi holat mos?',['Barqaror','Beqaror','Farqsiz','Aylanma muvozanat mumkin emas'],2,'Balandlik va potensial energiya o‘zgarmaydi.'],\n['Kuch momenti formulasi qaysi?',['M=F/l','M=F·l','M=m/v','M=F+l'],1,'Kuch yelkaga perpendikulyar bo‘lganda M=F·l.'],\n['Kuch yelkasi nima?',['Richag uzunligining hammasi','Kuchning kattaligi','O‘qdan kuch ta’sir chizig‘igacha perpendikulyar masofa','Jism massasi'],2,'Yelka — aylanish o‘qidan kuch ta’sir chizig‘igacha bo‘lgan eng qisqa masofa.'],\n['20 N kuch 0,5 m yelkada qanday moment hosil qiladi?',['10 N·m','40 N·m','20,5 N·m','0,025 N·m'],0,'M=20×0,5=10 N·m.'],\n['Ideal richag muvozanatida nima teng?',['Faqat massalar','Yelkalar','Qarama-qarshi kuch momentlari','Kuchlar yo‘nalishi'],2,'Muvozanatda qarama-qarshi yo‘nalgan momentlar kattalik jihatdan teng.'],\n['Eshik tutqichi nega chetroqda joylashadi?',['Eshikni bezash uchun','Kuch yelkasini oshirib, ochishni osonlashtirish uchun','Eshik massasini kamaytirish uchun','Ishqalanishni yo‘qotish uchun'],1,'Aylanish o‘qidan uzoqroq nuqtada yelka va moment kattaroq bo‘ladi.']\n];let qi=0,answers=Array(questions.length).fill(null);\nfunction renderQ(){let q=questions[qi];document.getElementById('quizCount').textContent=(qi+1)+' / '+questions.length+'-savol';document.getElementById('quizProgress').style.width=(qi/questions.length*100)+'%';document.getElementById('question').textContent=q[0];let o=document.getElementById('options');o.innerHTML='';q[1].forEach((s,i)=>{let b=document.createElement('button');b.className='quiz-option';b.textContent=String.fromCharCode(65+i)+'. '+s;if(answers[qi]!==null){if(i===q[2])b.classList.add('correct');else if(i===answers[qi])b.classList.add('wrong')}b.onclick=()=>answerQ(i);o.appendChild(b)});document.getElementById('feedback').textContent=answers[qi]===null?'':q[3];document.getElementById('nextQ').disabled=answers[qi]===null;document.getElementById('nextQ').textContent=qi===questions.length-1?'Natijani ko‘rish':'Keyingi savol →';document.getElementById('scoreBox').style.display='none'}\nfunction answerQ(i){if(answers[qi]!==null)return;answers[qi]=i;renderQ();document.getElementById('feedback').textContent=(i===questions[qi][2]?'To‘g‘ri! ':'Noto‘g‘ri. ')+questions[qi][3];document.getElementById('nextQ').disabled=false}\nfunction nextQuestion(){if(qi<questions.length-1){qi++;renderQ()}else{let score=answers.reduce((s,a,i)=>s+(a===questions[i][2]?1:0),0);let b=document.getElementById('scoreBox');b.style.display='block';b.textContent='Natija: '+score+'/10 ('+score*10+'%). '+(score>=8?'Ajoyib! Mavzuni yaxshi o‘zlashtirgansiz.':score>=5?'Yaxshi urinish. Xato javoblarni takrorlang.':'Formulalar va simulyatsiyalarni yana bir bor ko‘rib chiqing.');document.getElementById('quizProgress').style.width='100%';document.getElementById('nextQ').disabled=true}}\nfunction restartQuiz(){qi=0;answers=Array(questions.length).fill(null);renderQ()}\nfunction showSolution(n){let a={1:'Berilgan: m₁=2 kg, x₁=0 m; m₂=6 kg, x₂=4 m. xcm=(2×0+6×4)/(2+6)=24/8=3 m.',2:'M=F·l=40×0,25=10 N·m.',3:'F₁l₁=F₂l₂. F₂=(20×0,8)/0,4=40 N.',4:'xcm=(3×(−2)+3×4)/(3+3)=(−6+12)/6=1 m.',5:'l=M/F=15/50=0,30 m.'};document.getElementById('sol'+n).textContent=a[n]}\nfunction drawAll(){drawMass();drawHang();['stable','unstable','neutral'].forEach(drawBall);drawLever();drawWrench();drawMechanism()}\nwindow.addEventListener('resize',()=>{clearTimeout(window._resizeT);window._resizeT=setTimeout(drawAll,120)});\nrenderQ();mechanism('seesaw');drawAll();\n<\/script>\n<\/body>\n<\/html>"}, {"id": "13-mavzu", "n": "13", "t": "Oddiy mexanizmlar va momentlar qoidasi", "d": "Richag, bloklar, chig‘iriq simulyatsiyasi", "k": "Dars", "html": "<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Oddiy Mexanizmlar va Momentlar Qoidasi - Interaktiv Simulyatsiya<\/title>\n    <!-- Tailwind CSS CDN -->\n    <script src=\"https://cdn.tailwindcss.com\"><\/script>\n    <!-- FontAwesome Icons -->\n    <link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css\">\n    <!-- Google Fonts Inter -->\n    <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap\" rel=\"stylesheet\">\n    <style>\n        body {\n            font-family: 'Inter', sans-serif;\n        }\n        canvas {\n            touch-action: none;\n        }\n        /* Custom styled range sliders */\n        input[type=range] {\n            accent-color: #3b82f6;\n        }\n    <\/style>\n<\/head>\n<body class=\"bg-slate-900 text-slate-100 min-h-screen flex flex-col\">\n\n    <!-- Navbar Header -->\n    <header class=\"bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-lg\">\n        <div class=\"max-w-7xl mx-auto px-4 py-3 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-3\">\n            <div class=\"flex items-center space-x-3\">\n                <div class=\"p-2.5 bg-blue-600 rounded-xl shadow-md shadow-blue-500/20\">\n                    <i class=\"fa-solid me-0 fa-atom text-2xl text-white\"><\/i>\n                <\/div>\n                <div>\n                    <h1 class=\"text-xl font-bold text-white tracking-tight\">Oddiy Mexanizmlar<\/h1>\n                    <p class=\"text-xs text-slate-400\">13-mavzu. Momentlar qoidasiga asoslangan simulyator<\/p>\n                <\/div>\n            <\/div>\n\n            <!-- Tab Navigation Buttons -->\n            <nav class=\"flex bg-slate-900/80 p-1.5 rounded-xl border border-slate-700/80 w-full sm:w-auto overflow-x-auto\">\n                <button id=\"tab-richag\" onclick=\"switchTab('richag')\" class=\"flex-1 sm:flex-initial px-4 py-2 rounded-lg font-medium text-sm transition-all duration-200 flex items-center justify-center gap-2 bg-blue-600 text-white shadow-sm\">\n                    <i class=\"fa-solid fa-scale-balanced\"><\/i> <span>Richag<\/span>\n                <\/button>\n                <button id=\"tab-bloklar\" onclick=\"switchTab('bloklar')\" class=\"flex-1 sm:flex-initial px-4 py-2 rounded-lg font-medium text-sm transition-all duration-200 flex items-center justify-center gap-2 text-slate-400 hover:text-slate-200\">\n                    <i class=\"fa-solid fa-arrows-up-down\"><\/i> <span>Bloklar<\/span>\n                <\/button>\n                <button id=\"tab-chigiriq\" onclick=\"switchTab('chigiriq')\" class=\"flex-1 sm:flex-initial px-4 py-2 rounded-lg font-medium text-sm transition-all duration-200 flex items-center justify-center gap-2 text-slate-400 hover:text-slate-200\">\n                    <i class=\"fa-solid fa-compact-disc\"><\/i> <span>Chig'iriq<\/span>\n                <\/button>\n            <\/nav>\n        <\/div>\n    <\/header>\n\n    <!-- Main Content Container -->\n    <main class=\"flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8\">\n\n        <!-- ================= TAB 1: RICHAG SIMULYATORI ================= -->\n        <section id=\"section-richag\" class=\"space-y-6\">\n            <!-- Information Banner -->\n            <div class=\"bg-slate-800/80 border border-slate-700 rounded-2xl p-4 sm:p-5 flex flex-col md:flex-row justify-between items-start md:items-center gap-4\">\n                <div>\n                    <h2 class=\"text-lg font-bold text-white flex items-center gap-2\">\n                        <span class=\"text-blue-400\"><i class=\"fa-solid fa-circle-info\"><\/i><\/span>\n                        Richag Muvozanat Sharti\n                    <\/h2>\n                    <p class=\"text-sm text-slate-300 mt-1\">\n                        Richag muvozanatda bo'lishi uchun soat mili bo'yicha va unga qarshi yo'nalgan kuch momentlari teng bo'lishi kerak: \n                        <span class=\"inline-block bg-slate-900 px-2 py-0.5 rounded text-blue-400 font-mono font-semibold ml-1\">M₁ = M₂<\/span> \n                        ya'ni <span class=\"inline-block bg-slate-900 px-2 py-0.5 rounded text-emerald-400 font-mono font-semibold\">F₁ · l₁ = F₂ · l₂<\/span>\n                    <\/p>\n                <\/div>\n                <div id=\"richag-status-badge\" class=\"px-4 py-2 rounded-xl text-sm font-bold bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 flex items-center gap-2 whitespace-nowrap\">\n                    <i class=\"fa-solid fa-circle-check\"><\/i> <span>Muvozanatda<\/span>\n                <\/div>\n            <\/div>\n\n            <!-- Simulation Canvas Card -->\n            <div class=\"bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-xl\">\n                <div class=\"p-4 bg-slate-800/50 border-b border-slate-700/60 flex items-center justify-between\">\n                    <span class=\"text-xs font-semibold uppercase tracking-wider text-slate-400\"><i class=\"fa-solid fa-display mr-1\"><\/i> Interaktiv Canvas Visualizatsiyasi<\/span>\n                    <button onclick=\"resetRichag()\" class=\"text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-lg transition border border-slate-600 flex items-center gap-1.5\">\n                        <i class=\"fa-solid fa-rotate-left\"><\/i> Qayta o'rnatish\n                    <\/button>\n                <\/div>\n                <div class=\"relative w-full h-[320px] sm:h-[380px] bg-slate-950/80 flex items-center justify-center p-2\">\n                    <canvas id=\"richagCanvas\" class=\"w-full h-full block rounded-lg\"><\/canvas>\n                <\/div>\n            <\/div>\n\n            <!-- Realtime Controls and Metrics Grid -->\n            <div class=\"grid grid-cols-1 lg:grid-cols-2 gap-6\">\n                <!-- Left Side Controls (F1, L1) -->\n                <div class=\"bg-slate-800 border border-slate-700 rounded-2xl p-5 space-y-4 relative overflow-hidden\">\n                    <div class=\"absolute top-0 left-0 w-2 h-full bg-blue-500\"><\/div>\n                    <div class=\"flex justify-between items-center pb-2 border-b border-slate-700\">\n                        <h3 class=\"font-bold text-blue-400 flex items-center gap-2\">\n                            <i class=\"fa-solid fa-weight-hanging\"><\/i> Chap Taraf (Kuch F₁)\n                        <\/h3>\n                        <span class=\"bg-blue-500/10 border border-blue-500/30 text-blue-400 font-mono text-sm px-2.5 py-1 rounded-lg font-bold\" id=\"val-m1\">\n                            M₁ = 100.0 N·m\n                        <\/span>\n                    <\/div>\n\n                    <div class=\"space-y-3\">\n                        <div>\n                            <div class=\"flex justify-between text-sm mb-1\">\n                                <label class=\"text-slate-300 font-medium\">Chap Yuk Massasi (m₁ / F₁):<\/label>\n                                <span class=\"font-mono text-blue-400 font-bold\"><span id=\"lbl-f1\">20<\/span> N (<span id=\"lbl-m1-kg\">2<\/span> kg)<\/span>\n                            <\/div>\n                            <input type=\"range\" id=\"input-f1\" min=\"5\" max=\"100\" step=\"5\" value=\"20\" oninput=\"updateRichag()\" class=\"w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer\">\n                        <\/div>\n\n                        <div>\n                            <div class=\"flex justify-between text-sm mb-1\">\n                                <label class=\"text-slate-300 font-medium\">Chap Elka Masofasi (l₁):<\/label>\n                                <span class=\"font-mono text-blue-400 font-bold\"><span id=\"lbl-l1\">5.0<\/span> m<\/span>\n                            <\/div>\n                            <input type=\"range\" id=\"input-l1\" min=\"1\" max=\"10\" step=\"0.5\" value=\"5\" oninput=\"updateRichag()\" class=\"w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer\">\n                        <\/div>\n                    <\/div>\n                <\/div>\n\n                <!-- Right Side Controls (F2, L2) -->\n                <div class=\"bg-slate-800 border border-slate-700 rounded-2xl p-5 space-y-4 relative overflow-hidden\">\n                    <div class=\"absolute top-0 left-0 w-2 h-full bg-emerald-500\"><\/div>\n                    <div class=\"flex justify-between items-center pb-2 border-b border-slate-700\">\n                        <h3 class=\"font-bold text-emerald-400 flex items-center gap-2\">\n                            <i class=\"fa-solid fa-weight-hanging\"><\/i> O'ng Taraf (Kuch F₂)\n                        <\/h3>\n                        <span class=\"bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 font-mono text-sm px-2.5 py-1 rounded-lg font-bold\" id=\"val-m2\">\n                            M₂ = 100.0 N·m\n                        <\/span>\n                    <\/div>\n\n                    <div class=\"space-y-3\">\n                        <div>\n                            <div class=\"flex justify-between text-sm mb-1\">\n                                <label class=\"text-slate-300 font-medium\">O'ng Yuk Massasi (m₂ / F₂):<\/label>\n                                <span class=\"font-mono text-emerald-400 font-bold\"><span id=\"lbl-f2\">40<\/span> N (<span id=\"lbl-m2-kg\">4<\/span> kg)<\/span>\n                            <\/div>\n                            <input type=\"range\" id=\"input-f2\" min=\"5\" max=\"100\" step=\"5\" value=\"40\" oninput=\"updateRichag()\" class=\"w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer\">\n                        <\/div>\n\n                        <div>\n                            <div class=\"flex justify-between text-sm mb-1\">\n                                <label class=\"text-slate-300 font-medium\">O'ng Elka Masofasi (l₂):<\/label>\n                                <span class=\"font-mono text-emerald-400 font-bold\"><span id=\"lbl-l2\">2.5<\/span> m<\/span>\n                            <\/div>\n                            <input type=\"range\" id=\"input-l2\" min=\"1\" max=\"10\" step=\"0.5\" value=\"2.5\" oninput=\"updateRichag()\" class=\"w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer\">\n                        <\/div>\n                    <\/div>\n                <\/div>\n            <\/div>\n\n            <!-- Formula Explanation Box -->\n            <div class=\"bg-slate-800/50 border border-slate-700/60 rounded-2xl p-4 sm:p-5 grid grid-cols-1 md:grid-cols-3 gap-4 text-center\">\n                <div class=\"p-3 bg-slate-900/60 rounded-xl border border-slate-800\">\n                    <p class=\"text-xs text-slate-400 mb-1\">Chap Kuch Momenti (M₁)<\/p>\n                    <p class=\"font-mono font-bold text-blue-400 text-lg\"><span id=\"calc-m1-formula\">20 N × 5.0 m<\/span> = <span id=\"calc-m1-res\">100 N·m<\/span><\/p>\n                <\/div>\n                <div class=\"p-3 bg-slate-900/60 rounded-xl border border-slate-800\">\n                    <p class=\"text-xs text-slate-400 mb-1\">Kuchdan Yutish (l₁ / l₂)<\/p>\n                    <p class=\"font-mono font-bold text-purple-400 text-lg\" id=\"calc-richag-gain\">2.0 marta<\/p>\n                <\/div>\n                <div class=\"p-3 bg-slate-900/60 rounded-xl border border-slate-800\">\n                    <p class=\"text-xs text-slate-400 mb-1\">O'ng Kuch Momenti (M₂)<\/p>\n                    <p class=\"font-mono font-bold text-emerald-400 text-lg\"><span id=\"calc-m2-formula\">40 N × 2.5 m<\/span> = <span id=\"calc-m2-res\">100 N·m<\/span><\/p>\n                <\/div>\n            <\/div>\n        <\/section>\n\n        <!-- ================= TAB 2: BLOKLAR SIMULYATORI ================= -->\n        <section id=\"section-bloklar\" class=\"space-y-6 hidden\">\n            <!-- Header Description -->\n            <div class=\"bg-slate-800/80 border border-slate-700 rounded-2xl p-5\">\n                <h2 class=\"text-lg font-bold text-white flex items-center gap-2 mb-2\">\n                    <i class=\"fa-solid fa-arrows-up-down text-blue-400\"><\/i> Qo'zg'almas va Qo'zg'aluvchan Bloklar\n                <\/h2>\n                <p class=\"text-sm text-slate-300\">\n                    <b>Qo'zg'almas blok:<\/b> Faqat kuch yo'nalishini o'zgartiradi, kuchdan yutish bermaydi ($F = P$). <br>\n                    <b>Qo'zg'aluvchan blok:<\/b> Kuchdan <b>2 marta yutish<\/b> beradi ($F = P / 2$), ammo masofadan 2 marta yutqaziladi ($s = 2h$).\n                <\/p>\n            <\/div>\n\n            <!-- Controls Panel -->\n            <div class=\"bg-slate-800 border border-slate-700 rounded-2xl p-5 grid grid-cols-1 md:grid-cols-3 gap-6 items-center\">\n                <div>\n                    <label class=\"text-sm font-medium text-slate-300 block mb-1\">Yuk Og'irligi (P / mg):<\/label>\n                    <div class=\"flex items-center gap-3\">\n                        <input type=\"range\" id=\"input-p-mass\" min=\"20\" max=\"200\" step=\"10\" value=\"100\" oninput=\"updateBloklar()\" class=\"w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer\">\n                        <span class=\"font-mono text-amber-400 font-bold whitespace-nowrap\"><span id=\"lbl-p-mass\">100<\/span> N<\/span>\n                    <\/div>\n                <\/div>\n\n                <div>\n                    <label class=\"text-sm font-medium text-slate-300 block mb-1\">Ipni Tortish Masofasi (s):<\/label>\n                    <div class=\"flex items-center gap-3\">\n                        <input type=\"range\" id=\"input-rope-pull\" min=\"0\" max=\"100\" value=\"0\" oninput=\"updateBloklar()\" class=\"w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer\">\n                        <span class=\"font-mono text-blue-400 font-bold whitespace-nowrap\"><span id=\"lbl-rope-pull\">0<\/span> %<\/span>\n                    <\/div>\n                <\/div>\n\n                <div class=\"flex gap-2\">\n                    <button id=\"btn-pull-anim\" onclick=\"toggleRopePullAnimation()\" class=\"flex-1 bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2 px-4 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-blue-600/20\">\n                        <i class=\"fa-solid fa-play\" id=\"icon-anim-play\"><\/i> <span id=\"lbl-anim-play\">Avto Tortish<\/span>\n                    <\/button>\n                    <button onclick=\"resetBloklar()\" class=\"bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium py-2 px-3 rounded-xl transition border border-slate-600\">\n                        <i class=\"fa-solid fa-rotate-left\"><\/i>\n                    <\/button>\n                <\/div>\n            <\/div>\n\n            <!-- Canvas Comparison View -->\n            <div class=\"grid grid-cols-1 md:grid-cols-2 gap-6\">\n                <!-- Fixed Pulley Box -->\n                <div class=\"bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-xl flex flex-col\">\n                    <div class=\"p-3.5 bg-slate-800/80 border-b border-slate-700 flex justify-between items-center\">\n                        <h3 class=\"font-bold text-white text-sm flex items-center gap-2\">\n                            <span class=\"w-2.5 h-2.5 rounded-full bg-blue-500\"><\/span> Qo'zg'almas Blok\n                        <\/h3>\n                        <span class=\"text-xs bg-blue-500/10 border border-blue-500/30 text-blue-400 px-2 py-0.5 rounded font-mono font-semibold\">Yutish: 1x (Yo'q)<\/span>\n                    <\/div>\n                    <div class=\"h-[340px] bg-slate-950/80 relative flex-grow\">\n                        <canvas id=\"canvasFixedPulley\" class=\"w-full h-full block\"><\/canvas>\n                    <\/div>\n                    <div class=\"p-4 bg-slate-900/80 border-t border-slate-700/60 grid grid-cols-2 gap-2 text-xs font-mono\">\n                        <div class=\"bg-slate-800 p-2 rounded-lg border border-slate-700/50\">\n                            <span class=\"text-slate-400 block\">Kerakli Kuch (F):<\/span>\n                            <span class=\"text-blue-400 font-bold text-sm\" id=\"fixed-f-val\">100 N<\/span>\n                        <\/div>\n                        <div class=\"bg-slate-800 p-2 rounded-lg border border-slate-700/50\">\n                            <span class=\"text-slate-400 block\">Ko'tarilish (h):<\/span>\n                            <span class=\"text-emerald-400 font-bold text-sm\" id=\"fixed-h-val\">0.0 m<\/span>\n                        <\/div>\n                    <\/div>\n                <\/div>\n\n                <!-- Movable Pulley Box -->\n                <div class=\"bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-xl flex flex-col\">\n                    <div class=\"p-3.5 bg-slate-800/80 border-b border-slate-700 flex justify-between items-center\">\n                        <h3 class=\"font-bold text-white text-sm flex items-center gap-2\">\n                            <span class=\"w-2.5 h-2.5 rounded-full bg-emerald-500\"><\/span> Qo'zg'aluvchan Blok\n                        <\/h3>\n                        <span class=\"text-xs bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 px-2 py-0.5 rounded font-mono font-semibold\">Yutish: 2x (Kuchdan)<\/span>\n                    <\/div>\n                    <div class=\"h-[340px] bg-slate-950/80 relative flex-grow\">\n                        <canvas id=\"canvasMovablePulley\" class=\"w-full h-full block\"><\/canvas>\n                    <\/div>\n                    <div class=\"p-4 bg-slate-900/80 border-t border-slate-700/60 grid grid-cols-2 gap-2 text-xs font-mono\">\n                        <div class=\"bg-slate-800 p-2 rounded-lg border border-slate-700/50\">\n                            <span class=\"text-slate-400 block\">Kerakli Kuch (F = P/2):<\/span>\n                            <span class=\"text-emerald-400 font-bold text-sm\" id=\"movable-f-val\">50 N<\/span>\n                        <\/div>\n                        <div class=\"bg-slate-800 p-2 rounded-lg border border-slate-700/50\">\n                            <span class=\"text-slate-400 block\">Ko'tarilish (h = s/2):<\/span>\n                            <span class=\"text-emerald-400 font-bold text-sm\" id=\"movable-h-val\">0.0 m<\/span>\n                        <\/div>\n                    <\/div>\n                <\/div>\n            <\/div>\n        <\/section>\n\n        <!-- ================= TAB 3: CHIG'IRIQ SIMULYATORI ================= -->\n        <section id=\"section-chigiriq\" class=\"space-y-6 hidden\">\n            <!-- Top Explanation Header -->\n            <div class=\"bg-slate-800/80 border border-slate-700 rounded-2xl p-5\">\n                <h2 class=\"text-lg font-bold text-white flex items-center gap-2 mb-2\">\n                    <i class=\"fa-solid fa-compact-disc text-purple-400\"><\/i> Chig'iriq (Wheel and Axle) Mexanizmi\n                <\/h2>\n                <p class=\"text-sm text-slate-300\">\n                    Chig'iriq bir xil o'qda joylashgan ikki xil radiusli g'altak va valdan iborat. Katta radiusli g'ildirakka ($R$) qo'llanilgan kuch ($F$) kichik radiusli valga ($r$) osilgan og'ir yukni ($P$) ko'taradi:\n                    <span class=\"inline-block bg-slate-900 px-2 py-0.5 rounded text-purple-400 font-mono font-bold ml-1\">F · R = P · r<\/span>\n                <\/p>\n            <\/div>\n\n            <!-- Main Interactive Canvas and Dynamic Controls -->\n            <div class=\"grid grid-cols-1 lg:grid-cols-3 gap-6\">\n                <!-- Visual Canvas Display -->\n                <div class=\"lg:col-span-2 bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-xl flex flex-col\">\n                    <div class=\"p-3.5 bg-slate-800/80 border-b border-slate-700 flex justify-between items-center\">\n                        <span class=\"text-xs font-semibold uppercase tracking-wider text-slate-400\"><i class=\"fa-solid fa-eye mr-1\"><\/i> Chig'iriq Ko'rinishi (Yon va Frontal)<\/span>\n                        <span id=\"chigiriq-balance-tag\" class=\"text-xs px-2.5 py-1 rounded-lg font-mono font-bold bg-purple-500/10 border border-purple-500/30 text-purple-300\">\n                            Yutish: 3.0 marta\n                        <\/span>\n                    <\/div>\n                    <div class=\"h-[360px] bg-slate-950/80 relative\">\n                        <canvas id=\"chigiriqCanvas\" class=\"w-full h-full block\"><\/canvas>\n                    <\/div>\n                <\/div>\n\n                <!-- Interactive Settings Column -->\n                <div class=\"bg-slate-800 border border-slate-700 rounded-2xl p-5 space-y-5 flex flex-col justify-between\">\n                    <div class=\"space-y-4\">\n                        <h3 class=\"font-bold text-white border-b border-slate-700 pb-2 flex items-center gap-2\">\n                            <i class=\"fa-solid fa-sliders text-purple-400\"><\/i> Parametrlarni Sozlash\n                        <\/h3>\n\n                        <!-- Radius R (Large Wheel) -->\n                        <div>\n                            <div class=\"flex justify-between text-sm mb-1\">\n                                <label class=\"text-slate-300 font-medium\">G'ildirak Radiusi (R):<\/label>\n                                <span class=\"font-mono text-purple-400 font-bold\"><span id=\"lbl-chigiriq-R\">30<\/span> cm<\/span>\n                            <\/div>\n                            <input type=\"range\" id=\"input-chigiriq-R\" min=\"15\" max=\"50\" step=\"5\" value=\"30\" oninput=\"updateChigiriq()\" class=\"w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer\">\n                        <\/div>\n\n                        <!-- Radius r (Small Axle) -->\n                        <div>\n                            <div class=\"flex justify-between text-sm mb-1\">\n                                <label class=\"text-slate-300 font-medium\">Val Radiusi (r):<\/label>\n                                <span class=\"font-mono text-indigo-400 font-bold\"><span id=\"lbl-chigiriq-r\">10<\/span> cm<\/span>\n                            <\/div>\n                            <input type=\"range\" id=\"input-chigiriq-r\" min=\"5\" max=\"20\" step=\"1\" value=\"10\" oninput=\"updateChigiriq()\" class=\"w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer\">\n                        <\/div>\n\n                        <!-- Load P -->\n                        <div>\n                            <div class=\"flex justify-between text-sm mb-1\">\n                                <label class=\"text-slate-300 font-medium\">Yuk Og'irligi (P):<\/label>\n                                <span class=\"font-mono text-amber-400 font-bold\"><span id=\"lbl-chigiriq-P\">150<\/span> N<\/span>\n                            <\/div>\n                            <input type=\"range\" id=\"input-chigiriq-P\" min=\"30\" max=\"300\" step=\"15\" value=\"150\" oninput=\"updateChigiriq()\" class=\"w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer\">\n                        <\/div>\n                    <\/div>\n\n                    <!-- Calculated Force Card -->\n                    <div class=\"bg-slate-900/90 border border-purple-500/30 rounded-xl p-4 space-y-2\">\n                        <div class=\"text-xs text-slate-400\">Kerakli Qo'l Kuchi (F):<\/div>\n                        <div class=\"text-2xl font-mono font-extrabold text-purple-400 flex items-baseline justify-between\">\n                            <span id=\"calc-chigiriq-F\">50.0 N<\/span>\n                            <span class=\"text-xs text-slate-400 font-normal\">F = P · (r / R)<\/span>\n                        <\/div>\n                        <div class=\"text-xs text-slate-400 pt-1 border-t border-slate-800 flex justify-between\">\n                            <span>Kuchdan yutish:<\/span>\n                            <span class=\"font-bold text-emerald-400\" id=\"calc-chigiriq-gain\">3.0 marta<\/span>\n                        <\/div>\n                    <\/div>\n                <\/div>\n            <\/div>\n        <\/section>\n\n    <\/main>\n\n    <!-- Footer -->\n    <footer class=\"bg-slate-800 border-t border-slate-700/80 py-4 mt-8 text-center text-xs text-slate-400\">\n        <div class=\"max-w-7xl mx-auto px-4\">\n            <p>Fizika fanidan interaktiv ko'rgazmali simulyator kodi. Momentlar qoidasi va oddiy mexanizmlar darsi uchun.<\/p>\n        <\/div>\n    <\/footer>\n\n    <!-- INTERACTIVE JAVASCRIPT LOGIC -->\n    <script>\n        // Global Tab Switcher\n        function switchTab(tabName) {\n            ['richag', 'bloklar', 'chigiriq'].forEach(tab => {\n                const sec = document.getElementById(`section-${tab}`);\n                const btn = document.getElementById(`tab-${tab}`);\n                if (tab === tabName) {\n                    sec.classList.remove('hidden');\n                    btn.className = \"flex-1 sm:flex-initial px-4 py-2 rounded-lg font-medium text-sm transition-all duration-200 flex items-center justify-center gap-2 bg-blue-600 text-white shadow-sm\";\n                } else {\n                    sec.classList.add('hidden');\n                    btn.className = \"flex-1 sm:flex-initial px-4 py-2 rounded-lg font-medium text-sm transition-all duration-200 flex items-center justify-center gap-2 text-slate-400 hover:text-slate-200\";\n                }\n            });\n            // Resize Canvas contexts on tab change\n            setTimeout(resizeAllCanvases, 50);\n        }\n\n        // Window Resize Handling\n        window.addEventListener('resize', resizeAllCanvases);\n\n        function resizeAllCanvases() {\n            initRichagCanvas();\n            initBloklarCanvases();\n            initChigiriqCanvas();\n        }\n\n        // =================================================================\n        // 1. RICHAG (LEVER) SIMULATION ENGINE\n        // =================================================================\n        let richagCanvas, richagCtx;\n        let currentAngle = 0; // Current tilt angle in radians\n        let targetAngle = 0;  // Target tilt angle based on torque net\n\n        function initRichagCanvas() {\n            richagCanvas = document.getElementById('richagCanvas');\n            if (!richagCanvas) return;\n            const container = richagCanvas.parentElement;\n            richagCanvas.width = container.clientWidth;\n            richagCanvas.height = container.clientHeight;\n            richagCtx = richagCanvas.getContext('2d');\n        }\n\n        function updateRichag() {\n            const f1 = parseFloat(document.getElementById('input-f1').value);\n            const l1 = parseFloat(document.getElementById('input-l1').value);\n            const f2 = parseFloat(document.getElementById('input-f2').value);\n            const l2 = parseFloat(document.getElementById('input-l2').value);\n\n            // Calculate torques\n            const m1 = f1 * l1;\n            const m2 = f2 * l2;\n\n            // Update DOM labels\n            document.getElementById('lbl-f1').innerText = f1;\n            document.getElementById('lbl-m1-kg').innerText = (f1 / 10).toFixed(1);\n            document.getElementById('lbl-l1').innerText = l1.toFixed(1);\n            document.getElementById('val-m1').innerText = `M₁ = ${m1.toFixed(1)} N·m`;\n\n            document.getElementById('lbl-f2').innerText = f2;\n            document.getElementById('lbl-m2-kg').innerText = (f2 / 10).toFixed(1);\n            document.getElementById('lbl-l2').innerText = l2.toFixed(1);\n            document.getElementById('val-m2').innerText = `M₂ = ${m2.toFixed(1)} N·m`;\n\n            // Formulas box\n            document.getElementById('calc-m1-formula').innerText = `${f1} N × ${l1.toFixed(1)} m`;\n            document.getElementById('calc-m1-res').innerText = `${m1.toFixed(0)} N·m`;\n            document.getElementById('calc-m2-formula').innerText = `${f2} N × ${l2.toFixed(1)} m`;\n            document.getElementById('calc-m2-res').innerText = `${m2.toFixed(0)} N·m`;\n\n            const gain = (l1 / l2).toFixed(2);\n            document.getElementById('calc-richag-gain').innerText = `${gain} marta`;\n\n            // Status Badge & Target Angle Calculation\n            const badge = document.getElementById('richag-status-badge');\n            const diff = m1 - m2;\n\n            if (Math.abs(diff) < 0.1) {\n                targetAngle = 0;\n                badge.className = \"px-4 py-2 rounded-xl text-sm font-bold bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 flex items-center gap-2 whitespace-nowrap\";\n                badge.innerHTML = `<i class=\"fa-solid fa-circle-check\"><\/i> <span>Muvozanatda (M₁ = M₂)<\/span>`;\n            } else if (diff > 0) {\n                // Left heavier -> tilts counter-clockwise (negative angle)\n                targetAngle = -Math.min(Math.PI / 10, (diff / 200) * (Math.PI / 8));\n                badge.className = \"px-4 py-2 rounded-xl text-sm font-bold bg-blue-500/10 border border-blue-500/30 text-blue-400 flex items-center gap-2 whitespace-nowrap\";\n                badge.innerHTML = `<i class=\"fa-solid fa-arrow-left font-bold\"><\/i> <span>Chapga og'gan (M₁ > M₂)<\/span>`;\n            } else {\n                // Right heavier -> tilts clockwise (positive angle)\n                targetAngle = Math.min(Math.PI / 10, (Math.abs(diff) / 200) * (Math.PI / 8));\n                badge.className = \"px-4 py-2 rounded-xl text-sm font-bold bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 flex items-center gap-2 whitespace-nowrap\";\n                badge.innerHTML = `<i class=\"fa-solid fa-arrow-right font-bold\"><\/i> <span>O'ngga og'gan (M₂ > M₁)<\/span>`;\n            }\n        }\n\n        function resetRichag() {\n            document.getElementById('input-f1').value = 20;\n            document.getElementById('input-l1').value = 5;\n            document.getElementById('input-f2').value = 40;\n            document.getElementById('input-l2').value = 2.5;\n            updateRichag();\n        }\n\n        function drawRichagFrame() {\n            if (!richagCtx) return;\n            const w = richagCanvas.width;\n            const h = richagCanvas.height;\n\n            richagCtx.clearRect(0, 0, w, h);\n\n            // Pivot point coordinates (Center)\n            const cx = w / 2;\n            const cy = h * 0.65;\n            const maxLeverLength = Math.min(w * 0.42, 350); // Max half-lever length in pixels\n\n            // Smooth angle transition (easing)\n            currentAngle += (targetAngle - currentAngle) * 0.1;\n\n            // Draw Ground Stand / Fulcrum\n            richagCtx.fillStyle = '#334155';\n            richagCtx.fillRect(cx - 80, cy + 60, 160, 15); // Stand base\n\n            richagCtx.beginPath();\n            richagCtx.moveTo(cx, cy);\n            richagCtx.lineTo(cx - 35, cy + 60);\n            richagCtx.lineTo(cx + 35, cy + 60);\n            richagCtx.closePath();\n            richagCtx.fillStyle = '#64748b';\n            richagCtx.fill();\n            richagCtx.strokeStyle = '#94a3b8';\n            richagCtx.lineWidth = 2;\n            richagCtx.stroke();\n\n            // Center Pin Pivot Circle\n            richagCtx.beginPath();\n            richagCtx.arc(cx, cy, 7, 0, Math.PI * 2);\n            richagCtx.fillStyle = '#f8fafc';\n            richagCtx.fill();\n\n            // Save state for rotating lever beam\n            richagCtx.save();\n            richagCtx.translate(cx, cy);\n            richagCtx.rotate(currentAngle);\n\n            // Draw Lever Wooden Beam\n            richagCtx.fillStyle = '#f59e0b';\n            richagCtx.fillRect(-maxLeverLength, -10, maxLeverLength * 2, 20);\n            richagCtx.lineWidth = 2;\n            richagCtx.strokeStyle = '#d97706';\n            richagCtx.strokeRect(-maxLeverLength, -10, maxLeverLength * 2, 20);\n\n            // Draw Ruler Marks along the beam\n            richagCtx.fillStyle = '#78350f';\n            for (let i = -10; i <= 10; i++) {\n                if (i === 0) continue;\n                const markX = (i / 10) * maxLeverLength;\n                const markHeight = (i % 5 === 0) ? 12 : 6;\n                richagCtx.fillRect(markX - 1, -10, 2, markHeight);\n            }\n\n            // Get current inputs for rendering weights\n            const f1 = parseFloat(document.getElementById('input-f1').value);\n            const l1 = parseFloat(document.getElementById('input-l1').value);\n            const f2 = parseFloat(document.getElementById('input-f2').value);\n            const l2 = parseFloat(document.getElementById('input-l2').value);\n\n            // Left Weight Position\n            const leftX = -(l1 / 10) * maxLeverLength;\n            drawWeight(richagCtx, leftX, 10, f1, '#3b82f6', `F₁=${f1}N`, `l₁=${l1}m`);\n\n            // Rig
