ng=\"uz\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Jism og‘irligining harakat turiga bog‘liqligi<\/title>\n<style>\n:root{--bg:#eef4fb;--card:#fff;--ink:#14233b;--blue:#2463eb;--cyan:#06b6d4;--orange:#f59e0b;--green:#15966b;--muted:#5c6b82}\n*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#e9f2ff,#f6f9ff);color:var(--ink);line-height:1.55}\nheader{padding:30px 18px 26px;background:linear-gradient(120deg,#123b82,#2563eb 60%,#06b6d4);color:#fff;text-align:center}\nheader h1{max-width:900px;margin:0 auto 8px;font-size:clamp(1.55rem,4vw,2.5rem)}header p{margin:0 auto;max-width:760px;color:#eaf5ff}\nmain{max-width:1050px;margin:22px auto;padding:0 14px 35px}.plan{background:var(--card);border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 8px 25px #1e3a5f12;border:1px solid #dce7f5}\nh2{font-size:1.35rem;margin:0 0 10px;color:#1749a5}h3{font-size:1.05rem;margin:12px 0 6px}p{margin:8px 0}.muted{color:var(--muted)}.formula{background:#edf5ff;border-left:4px solid var(--blue);padding:12px 15px;border-radius:8px;font-size:1.06rem;font-weight:bold;margin:12px 0}\n.sim{background:#f7faff;border:1px solid #d8e5f7;border-radius:14px;padding:16px;margin-top:15px}\n.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:12px 0}.controls label{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.controls input[type=range]{width:150px;accent-color:var(--blue)}select,button{font:inherit;border:1px solid #c8d6ea;border-radius:9px;padding:9px 12px;background:#fff;color:var(--ink)}button{background:var(--blue);color:white;border:0;cursor:pointer;font-weight:bold}button.secondary{background:#e3edff;color:#1647a0}button:hover{filter:brightness(.96)}\n.scene{height:230px;position:relative;overflow:hidden;border-radius:12px;background:linear-gradient(#dff4ff,#f7fbff 75%);border:1px solid #d4e5f5}\n.floor{position:absolute;bottom:0;left:0;right:0;height:17px;background:repeating-linear-gradient(135deg,#9bb4d0 0 8px,#c5d5e7 8px 16px);border-top:3px solid #6884a6}\n.lift{position:absolute;bottom:17px;left:50%;transform:translateX(-50%);width:150px;height:190px;border:5px solid #59718e;border-bottom:0;border-radius:9px 9px 0 0;background:#ffffff8c}\n.lift:before{content:\"\";position:absolute;left:50%;top:0;bottom:0;border-left:3px solid #9aacc1}\n.person{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:34px;height:70px;transition:bottom .5s}\n.head{width:22px;height:22px;border-radius:50%;background:#f2bf91;margin:auto;border:2px solid #925b35}.bodyshape{width:28px;height:32px;background:#2563eb;border-radius:7px 7px 3px 3px;margin:1px auto}.legs{display:flex;justify-content:center;gap:5px}.legs span{height:16px;width:8px;background:#334155;border-radius:0 0 3px 3px}\n.gauge{position:absolute;bottom:30px;left:calc(50% + 95px);width:75px;text-align:center;font-size:12px;color:#334155}.gauge .dial{height:65px;border:4px solid #7b8fa8;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:16px}\n.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}.stat{padding:12px;background:#fff;border:1px solid #dce7f5;border-radius:10px}.stat small{display:block;color:var(--muted)}.stat strong{font-size:1.2rem}\ncanvas{width:100%;max-width:100%;height:220px;display:block;background:#fff;border-radius:10px;border:1px solid #dce7f5}\n.quiz{background:#f2fbf7;border:1px solid #bde8d4;border-radius:12px;padding:15px;margin-top:14px}.quiz label{display:block;margin:7px 0}.feedback{font-weight:bold;margin-top:8px}\nfooter{text-align:center;color:var(--muted);padding:10px 15px 28px;font-size:.9rem}\n@media(max-width:560px){.plan{padding:16px}.scene{height:210px}.lift{width:130px}.gauge{left:calc(50% + 78px);width:67px}.controls{align-items:flex-start;flex-direction:column}.controls input[type=range]{width:180px}}\n<\/style>\n<\/head>\n<body>\n<header>\n<h1>Jism og‘irligining harakat turiga bog‘liqligi<\/h1>\n<p>Fizika darsi uchun interaktiv HTML5 material • tushuntirish, simulyatsiya, animatsiya va masalalar<\/p>\n<\/header>\n<main>\n<section class=\"plan\">\n<h2>1-reja. Jism og‘irligi va unga ta’sir etuvchi omillar<\/h2>\n<p><b>Jism og‘irligi<\/b> — jismning tayanchga yoki osmaga ta’sir etadigan kuchi. Tinch holatda yoki vertikal tezlanishsiz harakatda, havo qarshiligi hisobga olinmasa, jism og‘irligi odatda og‘irlik kuchiga teng bo‘ladi.<\/p>\n<div class=\"formula\">Og‘irlik kuchi: F<sub>g<\/sub> = mg<\/div>\n<p>Bu yerda <b>m<\/b> — massa (kg), <b>g<\/b> — erkin tushish tezlanishi (Yer yuzida taxminan 9,8 m/s²). Massa kilogrammda, kuch esa nyutonda (N) o‘lchanadi.<\/p>\n<p class=\"muted\">Farq: og‘irlik kuchi Yerning jismga ta’siri; jism og‘irligi esa jismning tayanch yoki osmaga ta’sir kuchidir.<\/p>\n<div class=\"sim\">\n<h3>Simulyatsiya 1: massani o‘zgartiring<\/h3>\n<div class=\"controls\"><label>Massa: <b id=\"massVal\">5 kg<\/b><input id=\"mass\" type=\"range\" min=\"1\" max=\"20\" value=\"5\"><\/label><label>Erkin tushish tezlanishi: <select id=\"gravity\"><option value=\"9.8\">Yer — 9,8 m/s²<\/option><option value=\"1.62\">Oy — 1,62 m/s²<\/option><option value=\"3.71\">Mars — 3,71 m/s²<\/option><\/select><\/label><\/div>\n<div class=\"statrow\"><div class=\"stat\"><small>Massa<\/small><strong id=\"massStat\">5 kg<\/strong><\/div><div class=\"stat\"><small>Og‘irlik kuchi mg<\/small><strong id=\"forceStat\">49 N<\/strong><\/div><div class=\"stat\"><small>Og‘irlik (tinch holat)<\/small><strong id=\"weightStat\">49 N<\/strong><\/div><\/div>\n<p id=\"gravityExplain\" class=\"muted\">Yerda 5 kg massali jismning og‘irlik kuchi taxminan 49 N.<\/p>\n<\/div>\n<\/section>\n\n<section class=\"plan\">\n<h2>2-reja. Turli harakatlarda jism og‘irligining o‘zgarishi<\/h2>\n<p>Vertikal yo‘nalishda tezlanish bo‘lsa, tayanchning jismga ta’sir kuchi o‘zgaradi. Lift misolida bu kuch tarozi ko‘rsatishiga mos keladi.<\/p>\n<div class=\"formula\">Yuqoriga tezlanishda: P = m(g + a) &nbsp; | &nbsp; Pastga tezlanishda: P = m(g − a)<\/div>\n<p>Bu formulalarda <b>P<\/b> — tarozi ko‘rsatadigan ko‘rinma og‘irlik, <b>a<\/b> — lift tezlanishining moduli. Erkin tushishda a = g bo‘lib, P = 0: jism tayanchga bosim bermaydi va vaznsizlik kuzatiladi.<\/p>\n<div class=\"sim\">\n<h3>Simulyatsiya 2: lift harakati<\/h3>\n<div class=\"controls\">\n<label>Harakat turi: <select id=\"motion\"><option value=\"rest\">Tinch yoki tekis harakat<\/option><option value=\"up\">Yuqoriga tezlanish<\/option><option value=\"down\">Pastga tezlanish<\/option><option value=\"free\">Erkin tushish (vaznsizlik)<\/option><\/select><\/label>\n<label>Massa: <b id=\"liftMassVal\">60 kg<\/b><input id=\"liftMass\" type=\"range\" min=\"20\" max=\"120\" value=\"60\" step=\"5\"><\/label>\n<label>Tezlanish: <b id=\"accVal\">2 m/s²<\/b><input id=\"acc\" type=\"range\" min=\"0\" max=\"9.8\" value=\"2\" step=\"0.2\"><\/label>\n<\/div>\n<div class=\"scene\" id=\"scene\"><div class=\"lift\"><div class=\"person\" id=\"person\"><div class=\"head\"><\/div><div class=\"bodyshape\"><\/div><div class=\"legs\"><span><\/span><span><\/span><\/div><\/div><\/div><div class=\"gauge\"><div class=\"dial\" id=\"dial\">588 N<\/div><div>Tarozi<\/div><\/div><div class=\"floor\"><\/div><\/div>\n<div class=\"statrow\"><div class=\"stat\"><small>Haqiqiy og‘irlik kuchi mg<\/small><strong id=\"trueForce\">588 N<\/strong><\/div><div class=\"stat\"><small>Tarozi ko‘rsatishi P<\/small><strong id=\"apparent\">588 N<\/strong><\/div><div class=\"stat\"><small>Holat<\/small><strong id=\"stateText\">Oddiy og‘irlik<\/strong><\/div><\/div>\n<p class=\"muted\" id=\"motionExplain\">Tinch yoki tekis harakatda tarozi ko‘rsatishi mg ga teng.<\/p>\n<\/div>\n<\/section>\n\n<section class=\"plan\">\n<h2>3-reja. Tajriba, grafik va masalalar orqali o‘rganish<\/h2>\n<p>Lift yoki dinamometr yordamida tarozi ko‘rsatishidagi o‘zgarishni kuzatish mumkin. Tezlanish yuqoriga yo‘nalganida ko‘rinma og‘irlik ortadi; pastga yo‘nalganida kamayadi.<\/p>\n<div class=\"sim\">\n<h3>Grafik: tezlanish va ko‘rinma og‘irlik<\/h3>\n<p class=\"muted\">Massa 60 kg deb olingan. Harakat turini tanlab, tarozi ko‘rsatishining qanday o‘zgarishini ko‘ring.<\/p>\n<div class=\"controls\"><label>Grafik holati: <select id=\"graphMotion\"><option value=\"up\">Yuqoriga tezlanish<\/option><option value=\"down\">Pastga tezlanish<\/option><\/select><\/label><\/div>\n<canvas id=\"graph\" width=\"850\" height=\"250\" aria-label=\"Tezlanish va ko‘rinma og‘irlik grafigi\"><\/canvas>\n<\/div>\n<div class=\"sim\">\n<h3>Masala namunasi<\/h3>\n<p><b>Masala:<\/b> massasi 50 kg bo‘lgan yo‘lovchi liftda yuqoriga 1,5 m/s² tezlanish bilan harakatlanmoqda. Tarozi ko‘rsatishini toping. g = 9,8 m/s².<\/p>\n<div class=\"formula\">P = m(g + a) = 50 × (9,8 + 1,5) = 565 N<\/div>\n<p><b>Javob:<\/b> 565 N. Tinch holatdagi 490 N bilan solishtirganda ko‘rinma og‘irlik ortgan.<\/p>\n<\/div>\n<div class=\"quiz\">\n<h3>O‘zingizni sinab ko‘ring<\/h3>\n<p>Massasi 40 kg bo‘lgan bola liftda pastga 2 m/s² tezlanish bilan harakatlanmoqda. g = 9,8 m/s². Tarozi ko‘rsatishi qancha?<\/p>\n{@body const [answer,setAnswer] = DIL.useState(\"\")}\n{@body const [checked,setChecked] = DIL.useState(false)}\n<label><input type=\"radio\" name=\"quiz\" value=\"392\" /> 392 N<\/label>\n<label><input type=\"radio\" name=\"quiz\" value=\"312\" /> 312 N<\/label>\n<label><input type=\"radio\" name=\"quiz\" value=\"472\" /> 472 N<\/label>\n<button type=\"button\" id=\"checkAnswer\">Javobni tekshirish<\/button>\n<div class=\"feedback\" id=\"feedback\" aria-live=\"polite\"><\/div>\n<\/div>\n<\/section>\n<section class=\"plan\">\n<h2>Xulosa<\/h2>\n<ul>\n<li>Tinch holatda yoki tekis vertikal harakatda: P = mg.<\/li>\n<li>Yuqoriga tezlanishda ko‘rinma og‘irlik ortadi: P = m(g + a).<\/li>\n<li>Pastga tezlanishda ko‘rinma og‘irlik kamayadi: P = m(g − a).<\/li>\n<li>Erkin tushishda ko‘rinma og‘irlik nolga teng bo‘ladi — vaznsizlik.<\/li>\n<\/ul>\n<\/section>\n<\/main>\n<footer>Interaktiv dars materiali • HTML5, CSS va JavaScript asosida tayyorlandi<\/footer>\n<script>\nconst $=id=>document.getElementById(id);\nfunction updateMass(){\n const m=+$('mass').value,g=+$('gravity').value,w=m*g;\n $('massVal').textContent=m+' kg';$('massStat').textContent=m+' kg';$('forceStat').textContent=w.toFixed(1)+' N';$('weightStat').textContent=w.toFixed(1)+' N';\n const planet=$('gravity').selectedOptions[0].text.split(' — ')[0];\n $('gravityExplain').textContent=planet+'da '+m+' kg massali jism uchun mg = '+w.toFixed(1)+' N. Massa o‘zgarmaydi, lekin g o‘zgarsa og‘irlik kuchi o‘zgaradi.';\n}\n$('mass').addEventListener('input',updateMass);$('gravity').addEventListener('change',updateMass);\nfunction updateLift(){\n const m=+$('liftMass').value,a=+$('acc').value,g=9.8,mode=$('motion').value;\n let p=m*g,state='Oddiy og‘irlik',desc='Tinch yoki tekis harakatda tarozi ko‘rsatishi mg ga teng.',offset=0;\n if(mode==='up'){p=m*(g+a);state='Og‘irlik ortadi';desc='Lift yuqoriga tezlanmoqda: P = m(g + a). Tarozi ko‘rsatishi odatdagidan katta.';offset=10;}\n if(mode==='down'){p=m*Math.max(0,g-a);state='Og‘irlik kamayadi';desc='Lift pastga tezlanmoqda: P = m(g − a). Tezlanish ortgan sari tarozi ko‘rsatishi kamayadi.';offset=-8;}\n if(mode==='free'){p=0;state='Vaznsizlik';desc='Erkin tushishda a = g, shuning uchun tayanch kuchi P = 0. Bu vaznsizlik holati.';offset=-20;}\n $('liftMassVal').textContent=m+' kg';$('accVal').textContent=a.toFixed(1)+' m/s²';$('trueForce').textContent=(m*g).toFixed(1)+' N';$('apparent').textContent=p.toFixed(1)+' N';$('dial').textContent=p.toFixed(0)+' N';$('stateText').textContent=state;$('motionExplain').textContent=desc;\n $('person').style.bottom=(Math.max(0,Math.min(32,offset+18)))+'px';\n $('person').style.transform='translateX(-50%) '+(mode==='free'?'rotate(7deg)':'rotate(0deg)');\n drawGraph();\n}\n['motion','liftMass','acc'].forEach(id=>$(id).addEventListener('input',updateLift));\n$('graphMotion').addEventListener('change',drawGraph);\nfunction drawGraph(){\n const c=$('graph'),ctx=c.getContext('2d'),w=c.width,h=c.height,m=60,g=9.8,mode=$('graphMotion').value;\n ctx.clearRect(0,0,w,h);ctx.font='14px Arial';ctx.fillStyle='#14233b';ctx.strokeStyle='#cbd8e8';ctx.lineWidth=1;\n const L=65,R=20,T=18,B=42,gw=w-L-R,gh=h-T-B,max=1200;\n for(let i=0;i<=5;i++){let y=T+gh*i/5;ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(w-R,y);ctx.stroke();ctx.fillStyle='#52647c';ctx.fillText(Math.round(max*(1-i/5))+' N',8,y+4);}\n for(let i=0;i<=5;i++){let x=L+gw*i/5;ctx.beginPath();ctx.moveTo(x,T);ctx.lineTo(x,T+gh);ctx.stroke();ctx.fillStyle='#52647c';ctx.fillText((9.8*i/5).toFixed(1),x-10,h-18);}\n ctx.fillStyle='#14233b';ctx.fillText('Tezlanish a (m/s²)',w/2-65,h-2);\n ctx.strokeStyle='#2563eb';ctx.lineWidth=3;ctx.beginPath();\n for(let i=0;i<=100;i++){let a=9.8*i/100,p=mode==='up'?m*(g+a):m*(g-a),x=L+gw*a/9.8,y=T+gh*(1-p/max);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.stroke();\n ctx.fillStyle='#2563eb';ctx.fillText(mode==='up'?'P = m(g + a)':'P = m(g − a)',L+12,T+18);\n}\n$('checkAnswer').addEventListener('click',()=>{\n const chosen=document.querySelector('input[name=\"quiz\"]:checked');\n $('feedback').textContent=!chosen?'Iltimos, javob variantini tanlang.':chosen.value==='312'?'To‘g‘ri! P = m(g − a) = 40 × (9,8 − 2) = 312 N.':'Qayta urinib ko‘ring. Pastga tezlanishda P = m(g − a) formulasidan foydalaning.';\n $('feedback').style.color=chosen&&chosen.value==='312'?'#087443':'#b45309';\n});\nupdateMass();updateLift();\n<\/script>\n<\/body>\n<\/html>"}, {"id": "6-mavzu", "n": "6", "t": "Bir nechta kuch ta’siridagi harakat", "d": "Teng ta’sir etuvchi va Nyuton qonunlari", "k": "Dars", "html": "<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>6-mavzu: Jismning bir nechta kuch ta’siridagi harakati<\/title>\n<style>\n:root{--bg:#f3f7fc;--card:#fff;--ink:#17243a;--muted:#5d6b82;--blue:#2463eb;--teal:#0d9488;--orange:#ea580c;--line:#dbe4f0}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.55}\nheader{background:linear-gradient(125deg,#123b82,#2876e8);color:white;padding:30px 18px 34px;text-align:center}\nheader .tag{display:inline-block;background:#ffffff24;border:1px solid #ffffff55;border-radius:30px;padding:5px 12px;font-size:13px}\nh1{font-size:clamp(25px,4vw,38px);line-height:1.2;margin:15px auto 10px;max-width:950px}\nheader p{margin:0 auto;max-width:800px;color:#e8f0ff}\nmain{max-width:1100px;margin:22px auto;padding:0 15px 40px}\nnav{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}\nnav a{background:white;border:1px solid var(--line);padding:9px 13px;border-radius:10px;text-decoration:none;color:#1747a3;font-weight:bold;font-size:14px}\nsection,.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:0 0 18px;box-shadow:0 5px 18px #17345b0a}\nh2{font-size:23px;margin:0 0 8px;color:#1747a3}h3{font-size:18px;margin:18px 0 8px}\n.lead{color:var(--muted);margin-top:0}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}\n.formula{background:#eef5ff;border-left:4px solid var(--blue);padding:12px 14px;border-radius:8px;font-size:18px;font-weight:bold}\n.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:13px;margin:12px 0}\nlabel{display:block;font-weight:bold;font-size:14px;margin-bottom:5px}\ninput[type=range]{width:100%;accent-color:var(--blue)}\noutput,.value{font-weight:bold;color:var(--blue)}\ncanvas{width:100%;height:280px;display:block;background:linear-gradient(#fbfdff,#f1f6ff);border:1px solid var(--line);border-radius:12px}\n.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px}\n.stat{background:#f6f9ff;border:1px solid var(--line);border-radius:10px;padding:11px}\n.stat small{display:block;color:var(--muted)}.stat strong{font-size:20px}\nbutton{background:var(--blue);color:white;border:0;border-radius:9px;padding:10px 15px;font-weight:bold;cursor:pointer;margin:4px 4px 4px 0}\nbutton.secondary{background:#e8efff;color:#1747a3}button:hover{filter:brightness(.96)}\n.note{background:#fff7ed;border-left:4px solid var(--orange);padding:11px 13px;border-radius:8px}\n.good{background:#ecfdf5;border-left:4px solid var(--teal);padding:11px 13px;border-radius:8px}\ntable{width:100%;border-collapse:collapse;margin:10px 0}th,td{padding:10px;border:1px solid var(--line);text-align:left}th{background:#eef5ff}\n.quiz-q{padding:12px 0;border-bottom:1px solid var(--line)}.quiz-q label{font-weight:normal;margin:7px 0}\nfooter{text-align:center;color:var(--muted);font-size:13px;padding:8px}\n@media(max-width:600px){section,.panel{padding:15px}canvas{height:240px}nav a{font-size:12px}}\n<\/style>\n<\/head>\n<body>\n<header>\n  <span class=\"tag\">FIZIKA • INTERAKTIV DARS<\/span>\n  <h1>6-mavzu: Jismning bir nechta kuch ta’siridagi harakati<\/h1>\n  <p>Uchta reja asosida nazariya, formulalar, jonli simulyatsiyalar, animatsiyalar va bilimni tekshirish.<\/p>\n<\/header>\n<main>\n<nav>\n  <a href=\"#reja1\">1. Kuchlar va teng ta’sir etuvchi<\/a>\n  <a href=\"#reja2\">2. Harakat qonunlari<\/a>\n  <a href=\"#reja3\">3. Masalalar va amaliyot<\/a>\n  <a href=\"#test\">Bilimni tekshirish<\/a>\n<\/nav>\n\n<section id=\"reja1\">\n<h2>1-reja. Jismga ta’sir etuvchi kuchlar va ularning teng ta’sir etuvchisi<\/h2>\n<p class=\"lead\">Jismga bir vaqtning o‘zida bir nechta kuch ta’sir qilishi mumkin. Ularning umumiy ta’siri vektor yig‘indi — <b>teng ta’sir etuvchi kuch<\/b> bilan aniqlanadi.<\/p>\n<div class=\"grid\">\n <div><div class=\"formula\">F⃗<sub>teng<\/sub> = F⃗<sub>1<\/sub> + F⃗<sub>2<\/sub> + ...<\/div>\n <p>Kuchlar bir yo‘nalishda bo‘lsa, modullari qo‘shiladi. Qarama-qarshi yo‘nalishda bo‘lsa, kattasidan kichigi ayriladi. Natijaviy kuch nol bo‘lsa, kuchlar muvozanatlashgan bo‘ladi.<\/p>\n <div class=\"note\"><b>Eslab qoling:<\/b> kuch — vektor kattalik; uning moduli ham, yo‘nalishi ham muhim.<\/div><\/div>\n <div><h3>Misol<\/h3><p>Jismni o‘ngga 12 N, chapga 5 N kuch tortmoqda. Natijaviy kuch:<\/p><div class=\"formula\">F<sub>teng<\/sub> = 12 − 5 = 7 N →<\/div><p>Demak, jism tezlanishi o‘ng tomonga yo‘naladi.<\/p><\/div>\n<\/div>\n<h3>Simulyatsiya 1 — kuchlar vektorini o‘zgartiring<\/h3>\n<p>Slayderlarni suring. O‘ngga va chapga yo‘nalgan kuchlar hamda natijaviy kuch strelkalari o‘zgarishini kuzating.<\/p>\n<div class=\"controls\">\n <div><label for=\"rightF\">O‘ngga kuch: <output id=\"rightVal\">12 N<\/output><\/label><input id=\"rightF\" type=\"range\" min=\"0\" max=\"20\" value=\"12\"><\/div>\n <div><label for=\"leftF\">Chapga kuch: <output id=\"leftVal\">5 N<\/output><\/label><input id=\"leftF\" type=\"range\" min=\"0\" max=\"20\" value=\"5\"><\/div>\n<\/div>\n<canvas id=\"forceCanvas\" aria-label=\"Kuchlar vektori simulyatsiyasi\"><\/canvas>\n<div class=\"stats\">\n <div class=\"stat\"><small>Teng ta’sir etuvchi<\/small><strong id=\"netF\">7 N →<\/strong><\/div>\n <div class=\"stat\"><small>Kuchlar holati<\/small><strong id=\"balance\">Muvozanatlashmagan<\/strong><\/div>\n<\/div>\n<\/section>\n\n<section id=\"reja2\">\n<h2>2-reja. Bir nechta kuch ta’sirida jismning harakat qonunlari va Nyuton qonunlari<\/h2>\n<p class=\"lead\">Nyutonning ikkinchi qonuniga ko‘ra, jismning tezlanishi natijaviy kuchga to‘g‘ri, massa­ga teskari proporsional.<\/p>\n<div class=\"grid\">\n <div class=\"formula\">F<sub>teng<\/sub> = ma &nbsp; → &nbsp; a = F<sub>teng<\/sub>/m<\/div>\n <div><b>Birliklar:<\/b> kuch — nyuton (N), massa — kilogramm (kg), tezlanish — m/s².<\/div>\n<\/div>\n<ul>\n<li><b>Nyutonning I qonuni:<\/b> natijaviy kuch nol bo‘lsa, jism tinch turadi yoki tekis to‘g‘ri chiziqli harakatini davom ettiradi.<\/li>\n<li><b>Nyutonning II qonuni:<\/b> natijaviy kuch jismga tezlanish beradi.<\/li>\n<li><b>Nyutonning III qonuni:<\/b> jismlar o‘zaro teng modulli, qarama-qarshi yo‘nalgan kuchlar bilan ta’sirlashadi. Bu kuchlar turli jismlarga ta’sir qiladi.<\/li>\n<\/ul>\n<h3>Simulyatsiya 2 — aravachaning tezlanishi<\/h3>\n<p>Kuch va massani o‘zgartiring, so‘ng “Harakatni boshlash” tugmasini bosing. Aravachaning tezligi natijaviy kuchga qarab o‘zgaradi.<\/p>\n<div class=\"controls\">\n <div><label for=\"pushF\">Oldinga kuch: <output id=\"pushVal\">15 N<\/output><\/label><input id=\"pushF\" type=\"range\" min=\"0\" max=\"30\" value=\"15\"><\/div>\n <div><label for=\"frictionF\">Ishqalanish kuchi: <output id=\"frictionVal\">5 N<\/output><\/label><input id=\"frictionF\" type=\"range\" min=\"0\" max=\"20\" value=\"5\"><\/div>\n <div><label for=\"mass\">Jism massasi: <output id=\"massVal\">2 kg<\/output><\/label><input id=\"mass\" type=\"range\" min=\"1\" max=\"10\" value=\"2\"><\/div>\n<\/div>\n<canvas id=\"motionCanvas\" aria-label=\"Aravacha harakati animatsiyasi\"><\/canvas>\n<div class=\"stats\">\n <div class=\"stat\"><small>Natijaviy kuch<\/small><strong id=\"netMotion\">10 N<\/strong><\/div>\n <div class=\"stat\"><small>Tezlanish<\/small><strong id=\"accel\">5 m/s²<\/strong><\/div>\n <div class=\"stat\"><small>Tezlik<\/small><strong id=\"speed\">0 m/s<\/strong><\/div>\n <div class=\"stat\"><small>Vaqt<\/small><strong id=\"elapsed\">0.0 s<\/strong><\/div>\n<\/div>\n<button id=\"startMotion\">▶ Harakatni boshlash<\/button><button class=\"secondary\" id=\"pauseMotion\">Ⅱ Pauza<\/button><button class=\"secondary\" id=\"resetMotion\">↺ Qayta boshlash<\/button>\n<div class=\"note\">Model soddalashtirilgan: natijaviy kuch musbat bo‘lsa, aravacha o‘ngga tezlanadi. Real vaziyatlarda ishqalanish tezlikka va sirtga ham bog‘liq bo‘lishi mumkin.<\/div>\n<\/section>\n\n<section id=\"reja3\">\n<h2>3-reja. Bir nechta kuch ta’siridagi harakatga doir masalalar va amaliy misollar<\/h2>\n<p class=\"lead\">Masala yechish algoritmi: 1) jismga ta’sir etuvchi kuchlarni aniqlash; 2) yo‘nalishlarni belgilash; 3) natijaviy kuchni topish; 4) Nyutonning II qonunini qo‘llash; 5) birlik va javobni tekshirish.<\/p>\n<h3>Animatsiyali masala<\/h3>\n<p>3 kg massali aravachaga o‘ngga 18 N, chapga 6 N kuch ta’sir qilmoqda. Ishqalanish hisobga olinmasa, tezlanishni toping.<\/p>\n<button id=\"solveBtn\">Yechim bosqichlarini ko‘rsatish<\/button>\n<div id=\"solution\" hidden>\n <p><b>1-bosqich.<\/b> Natijaviy kuchni topamiz: F = 18 − 6 = 12 N.<\/p>\n <p><b>2-bosqich.<\/b> Nyutonning II qonuni: a = F/m.<\/p>\n <p><b>3-bosqich.<\/b> a = 12/3 = <b>4 m/s²<\/b>. Tezlanish o‘ngga yo‘nalgan.<\/p>\n <canvas id=\"problemCanvas\" aria-label=\"Masala yechimi kuchlar animatsiyasi\"><\/canvas>\n<\/div>\n<h3>Mustaqil ishlash uchun<\/h3>\n<table>\n<thead><tr><th>№<\/th><th>Shart<\/th><th>Toping<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>1<\/td><td>Jismga o‘ngga 20 N, chapga 8 N kuch ta’sir qiladi. Massa 4 kg.<\/td><td>Natijaviy kuch va tezlanish<\/td><\/tr>\n<tr><td>2<\/td><td>10 kg massali jismga 30 N tortish kuchi va 10 N ishqalanish kuchi ta’sir qiladi.<\/td><td>Tezlanish<\/td><\/tr>\n<tr><td>3<\/td><td>Natijaviy kuch 0 N bo‘lgan jism 3 m/s tezlik bilan harakatlanmoqda.<\/td><td>Jism harakati qanday davom etadi?<\/td><\/tr>\n<\/tbody><\/table>\n<details><summary><b>Mustaqil masalalar javoblari<\/b><\/summary>\n<p>1) F = 20 − 8 = 12 N; a = 12/4 = 3 m/s², o‘ngga.<\/p>\n<p>2) F = 30 − 10 = 20 N; a = 20/10 = 2 m/s².<\/p>\n<p>3) Jismga boshqa kuchlar ta’sir qilmasa va natijaviy kuch nol bo‘lib qolsa, u 3 m/s tezlik bilan tekis to‘g‘ri chiziqli harakatini davom ettiradi.<\/p>\n<\/details>\n<\/section>\n\n<section id=\"test\">\n<h2>Bilimni tekshirish<\/h2>\n<p>Har bir savolda bitta javobni tanlang va “Natijani tekshirish” tugmasini bosing.<\/p>\n<form id=\"quiz\">\n <div class=\"quiz-q\"><b>1. Jismga 10 N o‘ngga va 10 N chapga kuch ta’sir qilsa, natijaviy kuch qancha?<\/b>\n <label><input type=\"radio\" name=\"q1\" value=\"a\"> 20 N<\/label><label><input type=\"radio\" name=\"q1\" value=\"b\"> 0 N<\/label><label><input type=\"radio\" name=\"q1\" value=\"c\"> 10 N<\/label><\/div>\n <div class=\"quiz-q\"><b>2. Natijaviy kuch 12 N, massa 3 kg. Tezlanish qancha?<\/b>\n <label><input type=\"radio\" name=\"q2\" value=\"a\"> 4 m/s²<\/label><label><input type=\"radio\" name=\"q2\" value=\"b\"> 36 m/s²<\/label><label><input type=\"radio\" name=\"q2\" value=\"c\"> 9 m/s²<\/label><\/div>\n <div class=\"quiz-q\"><b>3. Natijaviy kuch nol bo‘lsa, jism qanday harakat qilishi mumkin?<\/b>\n <label><input type=\"radio\" name=\"q3\" value=\"a\"> Faqat tezlanadi<\/label><label><input type=\"radio\" name=\"q3\" value=\"b\"> Faqat to‘xtaydi<\/label><label><input type=\"radio\" name=\"q3\" value=\"c\"> Tinch turadi yoki tekis to‘g‘ri chiziqli harakat qiladi<\/label><\/div>\n <button type=\"button\" id=\"checkQuiz\">Natijani tekshirish<\/button><button type=\"reset\" class=\"secondary\" id=\"clearQuiz\">Qayta ishlash<\/button>\n<\/form>\n<div id=\"quizResult\" class=\"good\" hidden aria-live=\"polite\"><\/div>\n<\/section>\n<footer>6-mavzu • Interaktiv HTML5 o‘quv materiali • Telefon va kompyuterda ishlaydi<\/footer>\n<\/main>\n<script>\nconst $=id=>document.getElementById(id);\nfunction arrow(ctx,x1,y1,x2,y2,color,width=4){\n ctx.save();ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=width;ctx.lineCap='round';\n ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();\n const a=Math.atan2(y2-y1,x2-x1),h=11;\n ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-h*Math.cos(a-Math.PI/6),y2-h*Math.sin(a-Math.PI/6));ctx.lineTo(x2-h*Math.cos(a+Math.PI/6),y2-h*Math.sin(a+Math.PI/6));ctx.closePath();ctx.fill();ctx.restore();\n}\nfunction setupCanvas(c){const dpr=window.devicePixelRatio||1, r=c.getBoundingClientRect();c.width=Math.max(300,r.width*dpr);c.height=Math.max(200,r.height*dpr);const ctx=c.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);return {ctx,w:r.width,h:r.height};}\nfunction drawForces(){\n const {ctx,w,h}=setupCanvas($('forceCanvas')),r=+$('rightF').value,l=+$('leftF').value,net=r-l,y=h*.56,cx=w*.5;\n ctx.clearRect(0,0,w,h);ctx.fillStyle='#52647d';ctx.font='13px Arial';ctx.fillText('Kuchlar masshtabi: uzunlik kuch moduliga mutanosib',14,22);\n ctx.fillStyle='#a8b8cc';ctx.fillRect(25,y-2,w-50,4);\n ctx.fillStyle='#dce8f8';ctx.fillRect(cx-25,y-18,50,36);ctx.strokeStyle='#7794bd';ctx.strokeRect(cx-25,y-18,50,36);\n ctx.fillStyle='#18365f';ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.fillText('JISM',cx,y+5);ctx.textAlign='left';\n const scale=Math.min((w*.36)/20,9);\n if(r) {arrow(ctx,cx+26,y-7,cx+26+r*scale,y-7,'#16835e',4);ctx.fillStyle='#16835e';ctx.fillText(r+' N →',cx+30,y-19);}\n if(l) {arrow(ctx,cx-26,y+8,cx-26-l*scale,y+8,'#db5b22',4);ctx.fillStyle='#db5b22';ctx.fillText('← '+l+' N',Math.max(8,cx-30-l*scale),y+29);}\n const start=net>=0?cx+26:cx-26, end=cx+26+net*scale;\n if(Math.abs(net)>.01)arrow(ctx,start,y+65,end,y+65,'#245fe5',5);\n else {ctx.fillStyle='#245fe5';ctx.fillText('F teng = 0 N',cx-40,y+72);}\n ctx.fillStyle='#245fe5';ctx.font='bold 14px Arial';ctx.fillText('Natijaviy kuch: '+net+' N',14,h-18);\n $('rightVal').textContent=r+' N';$('leftVal').textContent=l+' N';$('netF').textContent=Math.abs(net)+' N '+(net>0?'→':net<0?'←':'');\n $('balance').textContent=net===0?'Muvozanatlashgan':'Muvozanatlashmagan';\n}\n['rightF','leftF'].forEach(id=>$(id).addEventListener('input',drawForces));\nlet running=false,vel=0,pos=.16,t=0,last=0,raf=0;\nfunction params(){return {f:+$('pushF').value,fr:+$('frictionF').value,m:+$('mass').value};}\nfunction drawMotion(){\n const {ctx,w,h}=setupCanvas($('motionCanvas')),p=params(),net=p.f-p.fr,a=net/p.m;\n ctx.clearRect(0,0,w,h);ctx.fillStyle='#d4e2f4';ctx.fillRect(0,h*.72,w,5);\n ctx.fillStyle='#6f829d';ctx.font='13px Arial';ctx.fillText('Harakat yo‘nalishi →',12,22);\n const x=40+pos*Math.max(1,w-115),y=h*.72-35;\n ctx.fillStyle='#e3a33c';ctx.fillRect(x,y,65,30);ctx.fillStyle='#724916';ctx.fillRect(x+8,y+7,49,10);\n ctx.fillStyle='#2d405a';ctx.beginPath();ctx.arc(x+14,y+32,7,0,Math.PI*2);ctx.arc(x+51,y+32,7,0,Math.PI*2);ctx.fill();\n if(p.f>0)arrow(ctx,x+30,y-10,x+30+Math.min(80,p.f*2.5),y-10,'#16835e',4);\n if(p.fr>0)arrow(ctx,x+30,y+10,x+30-Math.min(70,p.fr*2.5),y+10,'#db5b22',4);\n ctx.fillStyle='#16835e';ctx.fillText('F = '+p.f+' N',12,48);ctx.fillStyle='#db5b22';ctx.fillText('Ishqalanish = '+p.fr+' N',12,68);\n $('pushVal').textContent=p.f+' N';$('frictionVal').textContent=p.fr+' N';$('massVal').textContent=p.m+' kg';\n $('netMotion').textContent=net+' N';$('accel').textContent=a.toFixed(2)+' m/s²';$('speed').textContent=vel.toFixed(2)+' m/s';$('elapsed').textContent=t.toFixed(1)+' s';\n}\nfunction tick(now){if(!running)return;if(!last)last=now;let dt=Math.min((now-last)/1000,.04);last=now;const p=params();vel=Math.max(0,vel+(p.f-p.fr)/p.m*dt);t+=dt;pos+=vel*dt/90;if(pos>.88)pos=.02;drawMotion();raf=requestAnimationFrame(tick);}\n$('startMotion').onclick=()=>{if(!running){running=true;last=0;raf=requestAnimationFrame(tick);}};\n$('pauseMotion').onclick=()=>{running=false;cancelAnimationFrame(raf);last=0;};\n$('resetMotion').onclick=()=>{running=false;cancelAnimationFrame(raf);vel=0;pos=.16;t=0;last=0;drawMotion();};\n['pushF','frictionF','mass'].forEach(id=>$(id).addEventListener('input',drawMotion));\n$('solveBtn').onclick=()=>{const s=$('solution');s.hidden=!s.hidden;$('solveBtn').textContent=s.hidden?'Yechim bosqichlarini ko‘rsatish':'Yechimni yashirish';if(!s.hidden)drawProblem();};\nfunction drawProblem(){const {ctx,w,h}=setupCanvas($('problemCanvas'));ctx.clearRect(0,0,w,h);const x=w*.5,y=h*.5;ctx.fillStyle='#dce8f8';ctx.fillRect(x-25,y-17,50,34);ctx.strokeStyle='#7794bd';ctx.strokeRect(x-25,y-17,50,34);ctx.fillStyle='#18365f';ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.fillText('3 kg',x,y+4);arrow(ctx,x+28,y-6,x+28+Math.min(100,w*.28),y-6,'#16835e',4);arrow(ctx,x-28,y+7,x-28-Math.min(45,w*.14),y+7,'#db5b22',4);ctx.textAlign='left';ctx.fillStyle='#16835e';ctx.fillText('18 N',x+35,y-18);ctx.fillStyle='#db5b22';ctx.fillText('6 N',Math.max(8,x-80),y+30);ctx.fillStyle='#245fe5';ctx.font='bold 15px Arial';ctx.fillText('F teng = 12 N →     a = 4 m/s²',12,h-20);}\n$('checkQuiz').onclick=()=>{const answers={q1:'b',q2:'a',q3:'c'};let score=0;for(const [q,a] of Object.entries(answers)){const chosen=document.querySelector('input[name=\"'+q+'\"]:checked');if(chosen&&chosen.value===a)score++;}const r=$('quizResult');r.hidden=false;r.textContent='Natija: '+score+'/3 ta to‘g‘ri. '+(score===3?'A’lo! Mavzuni yaxshi tushunibsiz.':score===2?'Yaxshi! Xatolarni ko‘rib, formulalarni takrorlang.':'Formulalarni qayta ko‘rib chiqing va yana urinib ko‘ring.');};\n$('clearQuiz').onclick=()=>{$('quizResult').hidden=true;};\nwindow.addEventListener('resize',()=>{drawForces();drawMotion();if(!$('solution').hidden)drawProblem();});\ndrawForces();drawMotion();\n<\/script>\n<\/body>\n<\/html>"}, {"id": "7-mavzu", "n": "7", "t": "Masalalar yechish (1–6-mavzular)", "d": "Formulalar eslatmasi va umumlashtiruvchi masalalar", "k": "Masala", "html": "<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Yuqoridagi mavzular bo‘yicha masalalar yechish<\/title>\n<style>\n:root{--blue:#245fe5;--navy:#173b7a;--bg:#f3f7fc;--ink:#17243a;--muted:#5b6b82;--line:#dce5f1;--green:#0d8b68;--orange:#d96a22}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Arial,Helvetica,sans-serif}\nheader{background:linear-gradient(130deg,#153776,#2879ed);color:#fff;text-align:center;padding:32px 18px}\nheader .tag{border:1px solid #ffffff66;background:#ffffff20;padding:5px 12px;border-radius:30px;font-size:13px}\nh1{font-size:clamp(25px,4vw,39px);line-height:1.2;max-width:950px;margin:16px auto 10px}header p{max-width:850px;margin:auto;color:#eaf1ff}\nmain{max-width:1100px;margin:22px auto;padding:0 15px 40px}\nnav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}nav a{background:white;color:#1747a3;border:1px solid var(--line);border-radius:9px;padding:8px 12px;text-decoration:none;font-weight:bold;font-size:14px}\nsection,.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 5px 18px #18355d09}\nh2{margin:0 0 8px;color:#1747a3;font-size:23px}h3{margin:18px 0 8px;font-size:18px}.muted{color:var(--muted);margin-top:0}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:13px}.formula{background:#eef5ff;border-left:4px solid var(--blue);padding:12px 14px;border-radius:8px;font-size:18px;font-weight:bold}\nlabel{font-weight:bold;display:block;font-size:14px;margin:8px 0 4px}input,select,textarea{font:inherit}input[type=range]{width:100%;accent-color:var(--blue)}input[type=number]{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px}\nbutton{border:0;background:var(--blue);color:white;padding:10px 15px;border-radius:9px;font-weight:bold;cursor:pointer;margin:5px 4px 4px 0}button.secondary{background:#e8efff;color:#1747a3}button:hover{filter:brightness(.96)}\ncanvas{width:100%;height:245px;display:block;background:linear-gradient(#fcfdff,#f0f6ff);border:1px solid var(--line);border-radius:12px}\n.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:9px;margin:12px 0}.stat{background:#f5f8ff;border:1px solid var(--line);border-radius:10px;padding:10px}.stat small{display:block;color:var(--muted)}.stat strong{font-size:19px}\n.step{padding:10px 12px;border-bottom:1px solid var(--line)}.step:last-child{border-bottom:0}.callout{background:#fff7ed;border-left:4px solid var(--orange);padding:11px 13px;border-radius:8px}.success{background:#ecfdf5;border-left:4px solid var(--green);padding:11px 13px;border-radius:8px}\n.problem{border:1px solid var(--line);padding:14px;border-radius:12px;margin:12px 0}.problem h3{margin-top:0}.answer{display:none;background:#effcf5;border-radius:8px;padding:12px;margin-top:10px}.answer.show{display:block}\n.quiz label{font-weight:normal}.quiz-q{padding:12px 0;border-bottom:1px solid var(--line)}.prompt{white-space:pre-wrap;background:#f7f9fd;border:1px solid var(--line);border-radius:10px;padding:14px;font-size:14px}\nfooter{text-align:center;color:var(--muted);font-size:13px;padding:10px}\n@media(max-width:600px){section,.card{padding:15px}canvas{height:220px}}\n<\/style>\n<\/head>\n<body>\n<header>\n<span class=\"tag\">10-SINF FIZIKA • INTERAKTIV MASHG‘ULOT<\/span>\n<h1>Yuqoridagi mavzular bo‘yicha masalalar yechish<\/h1>\n<p>Markazga intilma kuch, gravitatsiya maydonidagi harakat, jism og‘irligining harakat turiga bog‘liqligi va bir nechta kuch ta’siridagi harakat bo‘yicha formulalar, simulyatsiyalar va mashqlar.<\/p>\n<\/header>\n<main>\n<nav>\n<a href=\"#formulalar\">Formulalar<\/a><a href=\"#centripetal\">1. Markazga intilma kuch<\/a><a href=\"#gravity\">2. Gravitatsiya<\/a><a href=\"#weight\">3. Jism og‘irligi<\/a><a href=\"#forces\">4. Bir nechta kuch<\/a><a href=\"#practice\">Mustaqil masalalar<\/a><a href=\"#quiz\">Test<\/a><a href=\"#prompt\">Mukammal prompt<\/a>\n<\/nav>\n\n<section id=\"formulalar\">\n<h2>Asosiy formulalar eslatmasi<\/h2>\n<div class=\"grid\">\n<div class=\"formula\">Markazga intilma kuch: F = mv²/r<\/div>\n<div class=\"formula\">Gravitatsion kuch: F = GmM/r²<\/div>\n<div class=\"formula\">Erkin tushish: g = GM/R²<\/div>\n<div class=\"formula\">Jism og‘irligi: P = m(g ± a)<\/div>\n<div class=\"formula\">Nyutonning II qonuni: F<sub>teng<\/sub> = ma<\/div>\n<div class=\"formula\">Tezlik: v = v₀ + at<\/div>\n<\/div>\n<p class=\"muted\">Belgilar: m — jism massasi, v — tezlik, r — aylana radiusi, G — gravitatsion doimiy, M — markaziy jism massasi, g — erkin tushish tezlanishi, a — tezlanish. Yer yaqinida hisoblashda g ≈ 9,8 m/s² (maktab masalalarida 10 m/s² deb olinishi mumkin).<\/p>\n<\/section>\n\n<section id=\"centripetal\">\n<h2>1. Markazga intilma kuch<\/h2>\n<p class=\"muted\">Aylana bo‘ylab harakatda tezlik yo‘nalishi uzluksiz o‘zgaradi. Markazga yo‘nalgan natijaviy kuch jismni egri chiziqli trayektoriyada ushlab turadi.<\/p>\n<div class=\"grid\">\n<div><p><b>Namuna:<\/b> massasi 2 kg bo‘lgan jism radiusi 4 m aylana bo‘ylab 6 m/s tezlik bilan harakatlanadi.<\/p>\n<div class=\"formula\">F = mv²/r = 2 × 6² / 4 = 18 N<\/div>\n<p>Javob: markazga intilma kuch 18 N.<\/p><\/div>\n<div><canvas id=\"orbitCanvas\" aria-label=\"Aylana bo‘ylab harakat animatsiyasi\"><\/canvas><button id=\"orbitToggle\">Ⅱ Animatsiyani pauza qilish<\/button><\/div>\n<\/div>\n<h3>Interaktiv hisoblagich<\/h3>\n<div class=\"grid\">\n<div><label for=\"cmass\">Massa: <span id=\"cmassV\">2<\/span> kg<\/label><input id=\"cmass\" type=\"range\" min=\"1\" max=\"10\" value=\"2\"><\/div>\n<div><label for=\"cvel\">Tezlik: <span id=\"cvelV\">6<\/span> m/s<\/label><input id=\"cvel\" type=\"range\" min=\"1\" max=\"15\" value=\"6\"><\/div>\n<div><label for=\"crad\">Radius: <span id=\"cradV\">4<\/span> m<\/label><input id=\"crad\" type=\"range\" min=\"1\" max=\"12\" value=\"4\"><\/div>\n<\/div>\n<div class=\"stats\"><div class=\"stat\"><small>Markazga intilma kuch<\/small><strong id=\"cforce\">18 N<\/strong><\/div><div class=\"stat\"><small>Tezlanish<\/small><strong id=\"cacc\">9 m/s²<\/strong><\/div><\/div>\n<\/section>\n\n<section id=\"gravity\">\n<h2>2. Gravitatsiya maydonidagi harakat<\/h2>\n<p class=\"muted\">Gravitatsion kuch jismlarni o‘zaro tortadi. Yer yaqinida, havo qarshiligi e’tiborga olinmasa, jismlar bir xil g tezlanish bilan erkin tushadi.<\/p>\n<div class=\"grid\">\n<div><b>Namuna:<\/b> 2 kg jism Yer sirtiga yaqin joyda erkin tushmoqda. g = 9,8 m/s².<\/div>\n<div class=\"formula\">F = mg = 2 × 9,8 = 19,6 N<\/div>\n<\/div>\n<h3>Simulyatsiya — tushish vaqti va masofa<\/h3>\n<div class=\"grid\">\n<div><label for=\"height\">Boshlang‘ich balandlik: <span id=\"heightV\">20<\/span> m<\/label><input id=\"height\" type=\"range\" min=\"5\" max=\"100\" value=\"20\"><\/div>\n<div><label for=\"gravG\">Erkin tushish tezlanishi: <span id=\"gravGV\">9,8<\/span> m/s²<\/label><input id=\"gravG\" type=\"range\" min=\"1\" max=\"20\" step=\".1\" value=\"9.8\"><\/div>\n<\/div>\n<canvas id=\"fallCanvas\" aria-label=\"Erkin tushish simulyatsiyasi\"><\/canvas>\n<div class=\"stats\"><div class=\"stat\"><small>Tushish vaqti (taxminiy)<\/small><strong id=\"fallTime\">2,02 s<\/strong><\/div><div class=\"stat\"><small>Yerga urilish tezligi<\/small><strong id=\"fallSpeed\">19,80 m/s<\/strong><\/div><div class=\"stat\"><small>Joriy tushish masofasi<\/small><strong id=\"fallDistance\">0,0 m<\/strong><\/div><\/div>\n<button id=\"fallStart\">▶ Tushirish<\/button><button class=\"secondary\" id=\"fallReset\">↺ Qayta boshlash<\/button>\n<p class=\"callout\">Model havo qarshiligini hisobga olmaydi. Formulalar: h = gt²/2 va v = gt (boshlang‘ich tezlik nol bo‘lganda).<\/p>\n<\/section>\n\n<section id=\"weight\">\n<h2>3. Jism og‘irligining harakat turiga bog‘liqligi<\/h2>\n<p class=\"muted\">Jismning tayanchga yoki osmaga ta’sir kuchi og‘irlik deyiladi. Lift yuqoriga tezlanganda ko‘rinma og‘irlik ortadi; pastga tezlanganda kamayadi. Erkin tushishda tayanchga bosim nolga teng bo‘ladi.<\/p>\n<div class=\"grid\">\n<div><label for=\"wmass\">Jism massasi: <span id=\"wmassV\">60<\/span> kg<\/label><input id=\"wmass\" type=\"range\" min=\"10\" max=\"120\" value=\"60\"><\/div>\n<div><label for=\"wacc\">Lift tezlanishi: <span id=\"waccV\">0<\/span> m/s²<\/label><input id=\"wacc\" type=\"range\" min=\"-9.8\" max=\"9.8\" step=\".2\" value=\"0\"><\/div>\n<\/div>\n<canvas id=\"liftCanvas\" aria-label=\"Lift harakati va og‘irlik animatsiyasi\"><\/canvas>\n<div class=\"stats\"><div class=\"stat\"><small>Tinch holatdagi og‘irlik mg<\/small><strong id=\"normalP\">588 N<\/strong><\/div><div class=\"stat\"><small>Ko‘rinma og‘irlik P<\/small><strong id=\"apparentP\">588 N<\/strong><\/div><div class=\"stat\"><small>Holat<\/small><strong id=\"weightState\">Tinch yoki tekis harakat<\/strong><\/div><\/div>\n<div class=\"callout\">Musbat tezlanish — yuqoriga; manfiy tezlanish — pastga deb qabul qilingan. P = m(g + a) formulasi shu belgilash uchun amal qiladi. Erkin tushishda a = −g, demak P = 0.<\/div>\n<\/section>\n\n<section id=\"forces\">\n<h2>4. Jismning bir nechta kuch ta’siridagi harakati<\/h2>\n<p class=\"muted\">Bir nechta kuchning umumiy ta’siri ularning vektor yig‘indisi bilan topiladi. So‘ng F<sub>teng<\/sub> = ma formulasi ishlatiladi.<\/p>\n<div class=\"grid\">\n<div><label for=\"fRight\">O‘ngga kuch: <span id=\"fRightV\">18<\/span> N<\/label><input id=\"fRight\" type=\"range\" min=\"0\" max=\"40\" value=\"18\"><\/div>\n<div><label for=\"fLeft\">Chapga kuch: <span id=\"fLeftV\">6<\/span> N<\/label><input id=\"fLeft\" type=\"range\" min=\"0\" max=\"40\" value=\"6\"><\/div>\n<div><label for=\"fMass\">Massa: <span id=\"fMassV\">3<\/span> kg<\/label><input id=\"fMass\" type=\"range\" min=\"1\" max=\"15\" value=\"3\"><\/div>\n<\/div>\n<canvas id=\"netCanvas\" aria-label=\"Teng ta’sir etuvchi kuchlar animatsiyasi\"><\/canvas>\n<div class=\"stats\"><div class=\"stat\"><small>Teng ta’sir etuvchi kuch<\/small><strong id=\"netResult\">12 N →<\/strong><\/div><div class=\"stat\"><small>Tezlanish<\/small><strong id=\"netAccel\">4 m/s²<\/strong><\/div><\/div>\n<\/section>\n\n<section id=\"practice\">\n<h2>Mustaqil masalalar<\/h2>\n<p class=\"muted\">Avval o‘zingiz yechib ko‘ring, keyin javobni oching.<\/p>\n<div class=\"problem\"><h3>1-masala. Markazga intilma kuch<\/h3><p>Massasi 3 kg jism radiusi 6 m aylana bo‘ylab 4 m/s tezlik bilan harakatlanmoqda. Markazga intilma kuchni toping.<\/p><button class=\"secondary\" onclick=\"toggleAnswer('a1')\">Yechimni ko‘rish<\/button><div class=\"answer\" id=\"a1\">F = mv²/r = 3 × 16 / 6 = <b>8 N<\/b>.<\/div><\/div>\n<div class=\"problem\"><h3>2-masala. Gravitatsiya<\/h3><p>Massasi 5 kg jism Yer sirtiga yaqin turibdi. g = 10 m/s² deb oling. Jismga ta’sir etuvchi og‘irlik kuchini toping.<\/p><button class=\"secondary\" onclick=\"toggleAnswer('a2')\">Yechimni ko‘rish<\/button><div class=\"answer\" id=\"a2\">F = mg = 5 × 10 = <b>50 N<\/b>.<\/div><\/div>\n<div class=\"problem\"><h3>3-masala. Erkin tushish<\/h3><p>Jism tinch holatdan 3 s davomida erkin tushdi. g = 10 m/s². Tushgan masofasi va oxirgi tezligini toping.<\/p><button class=\"secondary\" onclick=\"toggleAnswer('a3')\">Yechimni ko‘rish<\/button><div class=\"answer\" id=\"a3\">h = gt²/2 = 10 × 9 / 2 = <b>45 m<\/b>. v = gt = 10 × 3 = <b>30 m/s<\/b>.<\/div><\/div>\n<div class=\"problem\"><h3>4-masala. Jism og‘irligi<\/h3><p>Massasi 50 kg bo‘lgan yo‘lovchi lift bilan yuqoriga 2 m/s² tezlanishda harakatlanmoqda. g = 10 m/s². Ko‘rinma og‘irlikni toping.<\/p><button class=\"secondary\" onclick=\"toggleAnswer('a4')\">Yechimni ko‘rish<\/button><div class=\"answer\" id=\"a4\">P = m(g + a) = 50 × (10 + 2) = <b>600 N<\/b>.<\/div><\/div>\n<div class=\"problem\"><h3>5-masala. Bir nechta kuch<\/h3><p>Massasi 4 kg jismga o‘ngga 28 N va chapga 12 N kuch ta’sir qiladi. Natijaviy kuch va tezlanishni toping.<\/p><button class=\"secondary\" onclick=\"toggleAnswer('a5')\">Yechimni ko‘rish<\/button><div class=\"answer\" id=\"a5\">F = 28 − 12 = 16 N. a = F/m = 16/4 = <b>4 m/s² o‘ngga<\/b>.<\/div><\/div>\n<\/section>\n\n<section id=\"quiz\" class=\"quiz\">\n<h2>Bilimni tekshirish testi<\/h2>\n<div class=\"quiz-q\"><b>1. m = 2 kg, v = 5 m/s, r = 10 m. Markazga intilma kuch qancha?<\/b><label><input type=\"radio\" name=\"q1\" value=\"a\"> 5 N<\/label><label><input type=\"radio\" name=\"q1\" value=\"b\"> 10 N<\/label><label><input type=\"radio\" name=\"q1\" value=\"c\"> 25 N<\/label><\/div>\n<div class=\"quiz-q\"><b>2. Jism 2 s erkin tushdi, g = 10 m/s². Tushish masofasi qancha?<\/b><label><input type=\"radio\" name=\"q2\" value=\"a\"> 10 m<\/label><label><input type=\"radio\" name=\"q2\" value=\"b\"> 20 m<\/label><label><input type=\"radio\" name=\"q2\" value=\"c\"> 40 m<\/label><\/div>\n<div class=\"quiz-q\"><b>3. Lift pastga tezlanganda yo‘lovchining ko‘rinma og‘irligi odatda qanday o‘zgaradi?<\/b><label><input type=\"radio\" name=\"q3\" value=\"a\"> Ortadi<\/label><label><input type=\"radio\" name=\"q3\" value=\"b\"> Kamayadi<\/label><label><input type=\"radio\" name=\"q3\" value=\"c\"> Har doim nol bo‘ladi<\/label><\/div>\n<div class=\"quiz-q\"><b>4. 20 N o‘ngga va 8 N chapga kuchlar ta’sir qilsa, natijaviy kuch?<\/b><label><input type=\"radio\" name=\"q4\" value=\"a\"> 12 N o‘ngga<\/label><label><input type=\"radio\" name=\"q4\" value=\"b\"> 28 N chapga<\/label><label><input type=\"radio\" name=\"q4\" value=\"c\"> 0 N<\/label><\/div>\n<button type=\"button\" id=\"checkQuiz\">Natijani tekshirish<\/button><button type=\"button\" class=\"secondary\" id=\"resetQuiz\">Qayta ishlash<\/button><div id=\"quizResult\" class=\"success\" hidden><\/div>\n<\/section>\n\n<section id=\"prompt\">\n<h2>ChatGPT uchun mukammal prompt<\/h2>\n<p class=\"muted\">Quyidagi matnni nusxalab, ChatGPT’ga berib, shu darsning boshqa variantini ham tayyorlatishingiz mumkin.<\/p>\n<div class=\"prompt\" id=\"promptText\">Sen 10-sinf fizika o‘qituvchisi, metodist va HTML5 dasturchisisan. “Yuqoridagi mavzular bo‘yicha masalalar yechish” nomli interaktiv o‘quv darsini o‘zbek tilida yarat.\n\nQuyidagi mavzularni qamrab ol:\n1. Markazga intilma kuch: F = mv²/r.\n2. Gravitatsiya maydonidagi harakat: F = GmM/r², Yer yaqinida F = mg, erkin tushish h = gt²/2 va v = gt.\n3. Jism og‘irligining harakat turiga bog‘liqligi: P = m(g + a) belgilangan yo‘nalish konvensiyasi bilan tushuntirilsin; yuqoriga tezlanish, pastga tezlanish va erkin tushish holatlari taqqoslansin.\n4. Jismning bir nechta kuch ta’siridagi harakati: kuchlarning vektor yig‘indisi va Nyutonning II qonuni F_teng = ma.\n\nHar bir bo‘limda nazariya, formulalar, o‘lchov birliklari, kamida bitta bosqichma-bosqich yechilgan masala, kundalik hayotdan misol va interaktiv simulyatsiya bo‘lsin. Simulyatsiyalarda slayderlar qiymatlarni o‘zgartirsin, natijalar avtomatik qayta hisoblansin, strelkalar va jism animatsiyasi ko‘rsatilsin. Alohida mustaqil masalalar, javoblarni ochish tugmalari va avtomatik baholanadigan test qo‘sh.\n\nDizayn zamonaviy, tushunarli, mobil telefon va kompyuterga mos bo‘lsin. HTML, CSS va JavaScript bitta HTML5 fayl ichida bo‘lsin; tashqi kutubxona va internetga bog‘liqlik bo‘lmasin. Barcha tugmalar ishlasin. Formulalar, hisob-kitoblar va birliklarni tekshir; noto‘g‘ri yoki bir-biriga zid natija chiqmasin. Fayl nomi “Yuqoridagi mavzular bo‘yicha masalalar yechish.html” bo‘lsin.<\/div>\n<button id=\"copyPrompt\">Promptni nusxalash<\/button><span id=\"copyStatus\" aria-live=\"polite\"><\/span>\n<\/section>\n<footer>Interaktiv fizika mashg‘uloti • HTML5, CSS va JavaScript • Offline foydalanish mumkin<\/footer>\n<\/main>\n<script>\nconst $=id=>document.getElementById(id);\nfunction num(n,d=2){return Number(n).toLocaleString('uz-UZ',{maximumFractionDigits:d,minimumFractionDigits:0});}\nfunction setup(id){const c=$(id),r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;c.width=Math.max(300,r.width*d);c.height=Math.max(200,r.height*d);let x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return {x,w:r.width,h:r.height};}\nfunction arrow(c,x1,y1,x2,y2,color,width=4){c.strokeStyle=color;c.fillStyle=color;c.lineWidth=width;c.lineCap='round';c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();let a=Math.atan2(y2-y1,x2-x1),s=10;c.beginPath();c.moveTo(x2,y2);c.lineTo(x2-s*Math.cos(a-.5),y2-s*Math.sin(a-.5));c.lineTo(x2-s*Math.cos(a+.5),y2-s*Math.sin(a+.5));c.closePath();c.fill();}\nfunction calcC(){let m=+$('cmass').value,v=+$('cvel').value,r=+$('crad').value; $('cmassV').textContent=m;$('cvelV').textContent=v;$('cradV').textContent=r;$('cforce').textContent=num(m*v*v/r)+' N';$('cacc').textContent=num(v*v/r)+' m/s²';}\n['cmass','cvel','crad'].forEach(id=>$(id).addEventListener('input',calcC));\nlet orbitAngle=0,orbitOn=true,fallRunning=false,fallT=0,fallRAF=0,lastTime=0;\nfunction drawOrbit(){let {x:c,w,h}=setup('orbitCanvas');c.clearRect(0,0,w,h);let cx=w/2,cy=h/2,r=Math.min(w,h)*.29;c.strokeStyle='#9db6d8';c.lineWidth=2;c.beginPath();c.arc(cx,cy,r,0,Math.PI*2);c.stroke();c.fillStyle='#e7a83b';c.beginPath();c.arc(cx,cy,15,0,Math.PI*2);c.fill();let px=cx+r*Math.cos(orbitAngle),py=cy+r*Math.sin(orbitAngle);c.fillStyle='#2563eb';c.beginPath();c.arc(px,py,9,0,Math.PI*2);c.fill();arrow(c,px,py,px+(cx-px)*.25,py+(cy-py)*.25,'#db5b22',3);c.fillStyle='#4a5e7a';c.font='12px Arial';c.fillText('Markazga yo‘nalgan kuch',10,18);}\nfunction orbitLoop(){if(orbitOn){orbitAngle+=.018;drawOrbit();}requestAnimationFrame(orbitLoop);}\n$('orbitToggle').onclick=()=>{orbitOn=!orbitOn;$('orbitToggle').textContent=orbitOn?'Ⅱ Animatsiyani pauza qilish':'▶ Animatsiyani davom ettirish';};\nfunction drawFall(){let {x:c,w,h}=setup('fallCanvas');c.clearRect(0,0,w,h);let H=+$('height').value,g=+$('gravG').value,ground=h-25,top=25,range=ground-top,elapsed=Math.min(fallT,Math.sqrt(2*H/g)),d=Math.min(H,g*elapsed*elapsed/2),y=top+range*d/H;c.strokeStyle='#a9bad0';c.lineWidth=3;c.beginPath();c.moveTo(w*.65,top);c.lineTo(w*.65,ground);c.stroke();c.fillStyle='#a7b8ce';c.fillRect(10,ground,w-20,5);c.fillStyle='#e6a33c';c.beginPath();c.arc(w*.65,y,10,0,Math.PI*2);c.fill();arrow(c,w*.65+25,y,w*.65+25,Math.min(ground-12,y+35),'#db5b22',3);c.fillStyle='#415570';c.font='13px Arial';c.fillText('h = '+num(H)+' m',12,24);c.fillText('g = '+num(g)+' m/s²',12,44);$('heightV').textContent=H;$('gravGV').textContent=num(g,1);$('fallTime').textContent=num(Math.sqrt(2*H/g))+' s';$('fallSpeed').textContent=num(Math.sqrt(2*g*H))+' m/s';$('fallDistance').textContent=num(d)+' m';}\nfunction fallTick(now){if(!fallRunning)return;if(!lastTime)lastTime=now;fallT+=Math.min((now-lastTime)/1000,.04);lastTime=now;let H=+$('height').value,g=+$('gravG').value;if(fallT>=Math.sqrt(2*H/g)){fallT=Math.sqrt(2*H/g);fallRunning=false;}drawFall();if(fallRunning)fallRAF=requestAnimationFrame(fallTick);}\n$('fallStart').onclick=()=>{if(!fallRunning){if(fallT>=Math.sqrt(2*(+$('height').value)/(+$('gravG').value)))fallT=0;fallRunning=true;lastTime=0;fallRAF=requestAnimationFrame(fallTick);}};\n$('fallReset').onclick=()=>{fallRunning=false;cancelAnimationFrame(fallRAF);fallT=0;lastTime=0;drawFall();};\n['height','gravG'].forEach(id=>$(id).addEventListener('input',()=>{fallRunning=false;fallT=0;drawFall();}));\nfunction drawLift(){let {x:c,w,h}=setup('liftCanvas'),m=+$('wmass').value,a=+$('wacc').value,g=9.8,P=Math.max(0,m*(g+a));c.clearRect(0,0,w,h);let liftX=w*.34,liftY=28,liftW=w*.32,liftH=h-58;c.strokeStyle='#9aadc6';c.lineWidth=3;c.strokeRect(liftX,liftY,liftW,liftH);c.fillStyle='#dce8f8';c.fillRect(liftX+8,liftY+8,liftW-16,liftH-16);let bx=w*.5,by=h*.55;c.fillStyle='#e7a83b';c.fillRect(bx-20,by-20,40,40);c.fillStyle='#684919';c.font='bold 12px Arial';c.textAlign='center';c.fillText(m+' kg',bx,by+5);if(a>0.01)arrow(c,bx+40,by+5,bx+40,by-35,'#16835e',4);else if(a<-.01)arrow(c,bx+40,by-30,bx+40,by+10,'#db5b22',4);c.textAlign='left';c.fillStyle='#4b5d77';c.fillText('Lift',12,20);$('wmassV').textContent=m;$('waccV').textContent=num(a,1);$('normalP').textContent=num(m*g)+' N';$('apparentP').textContent=num(P)+' N';$('weightState').textContent=Math.abs(a)<.11?'Tinch yoki tekis harakat':a<-.11&&a<=-9.7?'Erkin tushishga yaqin':a>0?'Yuqoriga tezlanmoqda':'Pastga tezlanmoqda';}\n['wmass','wacc'].forEach(id=>$(id).addEventListener('input',drawLift));\nfunction drawNet(){let {x:c,w,h}=setup('netCanvas'),r=+$('fRight').value,l=+$('fLeft').value,m=+$('fMass').value,n=r-l,y=h*.5,cx=w*.5;c.clearRect(0,0,w,h);c.fillStyle='#cbd9eb';c.fillRect(20,y-2,w-40,4);c.fillStyle='#dce8f8';c.fillRect(cx-24,y-17,48,34);c.strokeStyle='#7895bb';c.strokeRect(cx-24,y-17,48,34);c.fillStyle='#1c3d69';c.font='bold 12px Arial';c.textAlign='center';c.fillText(m+' kg',cx,y+4);let s=Math.min((w*.32)/40,5);if(r)arrow(c,cx+27,y-6,cx+27+r*s,y-6,'#16835e',4);if(l)arrow(c,cx-27,y+7,cx-27-l*s,y+7,'#db5b22',4);if(Math.abs(n)>.01)arrow(c,cx,y+62,cx+n*s,y+62,'#245fe5',5);c.textAlign='left';c.fillStyle='#16835e';c.fillText('O‘ngga: '+r+' N',10,20);c.fillStyle='#db5b22';c.fillText('Chapga: '+l+' N',10,40);$('fRightV').textContent=r;$('fLeftV').textContent=l;$('fMassV').textContent=m;$('netResult').textContent=num(Math.abs(n))+' N '+(n>0?'→':n<0?'←':'');$('netAccel').textContent=num(n/m)+' m/s²';}\n['fRight','fLeft','fMass'].forEach(id=>$(id).addEventListener('input',drawNet));\nfunction toggleAnswer(id){$(id).classList.toggle('show');}\n$('checkQuiz').onclick=()=>{let ans={q1:'a',q2:'b',q3:'b',q4:'a'},score=0;for(let q in ans){let e=document.querySelector('input[name=\"'+q+'\"]:checked');if(e&&e.value===ans[q])score++;}let r=$('quizResult');r.hidden=false;r.textContent='Natija: '+score+'/4. '+(score===4?'A’lo! Barcha savollarga to‘g‘ri javob berdingiz.':score>=2?'Yaxshi urinish. Formulalarni qayta ko‘rib, yana urinib ko‘ring.':'Formulalar bo‘limini takrorlab, testni qayta ishlang.');};\n$('resetQuiz').onclick=()=>{document.querySelectorAll('#quiz input[type=radio]').forEach(e=>e.checked=false);$('quizResult').hidden=true;};\n$('copyPrompt').onclick=async()=>{let t=$('promptText').innerText;try{await navigator.clipboard.writeText(t);$('copyStatus').textContent=' Nusxalandi!';}catch(e){let range=document.createRange();range.selectNodeContents($('promptText'));let sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);$('copyStatus').textContent=' Matn belgilanadi — nusxalash uchun Copy buyrug‘idan foydalaning.';}};\nfunction resizeAll(){drawOrbit();drawFall();drawLift();drawNet();calcC();}\nwindow.addEventListener('resize',resizeAll);calcC();drawOrbit();orbitLoop();drawFall();drawLift();drawNet();\n<\/script>\n<\/body>\n<\/html>"}, {"id": "8-mavzu", "n": "8", "t": "Jismning qiya tekislikdagi harakati", "d": "Og‘irlik tashkil etuvchilari va ishqalanish kuchi", "k": "Dars", "html": "<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Jismning qiya tekislikdagi harakati<\/title>\n<style>\n:root{--bg:#eef3f7;--card:#fff;--ink:#16232e;--mute:#556472;--line:#c7d3dd;--slope:#c9d8e6;--acc:#1f5f8b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#10181f;--card:#17232d;--ink:#e6edf3;--mute:#93a4b3;--line:#2b3b48;--slope:#26394a;--acc:#6db3e3}}\n:root[data-theme=\"dark\"]{--bg:#10181f;--card:#17232d;--ink:#e6edf3;--mute:#93a4b3;--line:#2b3b48;--slope:#26394a;--acc:#6db3e3}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif}\nmain{max-width:760px;margin:0 auto;padding:16px}\nh1{font-size:1.5rem;line-height:1.2;margin:8px 0 4px}\nh2{font-size:1.2rem;margin:0 0 8px}\np{margin:6px 0}.sub{color:var(--mute);margin:0 0 12px}\nnav{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}\nnav button{flex:1 0 auto;padding:10px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font:inherit;font-size:.9rem;cursor:pointer}\nnav button[aria-selected=\"true\"]{background:var(--acc);color:#fff;border-color:var(--acc)}\nbutton:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}\nsection{display:none}section.on{display:block}\n.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}\n.f{font-family:Georgia,serif;font-size:1.05rem;background:var(--bg);padding:6px 10px;border-radius:6px;margin:6px 0;overflow-x:auto;white-space:nowrap}\ncanvas{width:100%;height:auto;display:block;background:var(--card);border:1px solid var(--line);border-radius:8px}\n.ctl{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:10px 0}\n.ctl label{display:block;font-size:.9rem}\n.ctl input[type=range]{width:100%}\n.ctl select{width:100%;padding:6px;font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px}\n.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}\n.row button{padding:10px 16px;border-radius:8px;border:0;font:inherit;font-weight:600;color:#fff;cursor:pointer}\n.go{background:#2f8f4e}.stop{background:#c77b12}.rs{background:#7a5cc4}\n.vals{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;font-size:.92rem}\n.vals span{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 8px}\n.k1{color:#d33}.k2{color:#2a9d4a}.k3{color:#2b6fd6}.k4{color:#d9821a}.k5{color:#8a4bd0}\n.graphs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}\ntable{width:100%;border-collapse:collapse;margin-top:8px}td,th{border:1px solid var(--line);padding:6px 8px;text-align:left}\n.msg{font-weight:600;color:#c77b12;min-height:1.5em}\n@media(max-width:520px){.ctl,.graphs{grid-template-columns:1fr}}\n<\/style>\n<\/head>\n<body>\n<main>\n<h1>Jismning qiya tekislikdagi harakati<\/h1>\n<p class=\"sub\">10-sinf fizika · g = 9,8 m/s²<\/p>\n<nav role=\"tablist\">\n<button role=\"tab\" aria-selected=\"true\" data-t=\"s1\">1. Og'irlik kuchi tashkil etuvchilari<\/button>\n<button role=\"tab\" aria-selected=\"false\" data-t=\"s2\">2. Ishqalanish kuchi<\/button>\n<button role=\"tab\" aria-selected=\"false\" data-t=\"s3\">3. Pastga harakat<\/button>\n<\/nav>\n\n<section id=\"s1\" class=\"on\">\n<div class=\"box\">\n<h2>Og'irlik kuchini ikkiga ajratamiz<\/h2>\n<p>Qiya tekislikda mg kuchi vertikal pastga yo'nalgan. Uni tekislikka parallel va perpendikulyar ikki tashkil etuvchiga ajratamiz. Mg va tekislikka perpendikulyar orasidagi burchak tekislik burchagi α ga teng (tomonlari o'zaro perpendikulyar burchaklar).<\/p>\n<div class=\"f\">F∥ = mg·sinα &nbsp; (jismni pastga tortadi)<\/div>\n<div class=\"f\">F⊥ = mg·cosα &nbsp; (tekislikka bosadi), N = mg·cosα<\/div>\n<p><b>Misol.<\/b> m = 5 kg, α = 30°. mg = 49 N, F∥ = 49·0,5 = 24,5 N, F⊥ = 49·0,866 ≈ 42,4 N.<\/p>\n<\/div>\n<canvas id=\"c1\" width=\"640\" height=\"340\"><\/canvas>\n<div class=\"ctl\">\n<label>Burchak α: <b id=\"o1a\">30<\/b>°<input type=\"range\" id=\"a1\" min=\"0\" max=\"90\" value=\"30\"><\/label>\n<label>Massa m: <b id=\"o1m\">5<\/b> kg<input type=\"range\" id=\"m1\" min=\"1\" max=\"20\" value=\"5\"><\/label>\n<\/div>\n<div class=\"vals\" id=\"v1\"><\/div>\n<\/section>\n\n<section id=\"s2\">\n<div class=\"box\">\n<h2>Qiya tekislikda ishqalanish kuchi<\/h2>\n<p>Ishqalanish kuchi jism harakatiga (yoki harakat tomon intilishiga) qarama-qarshi, tekislik bo'ylab yuqoriga yo'naladi. U bosim kuchi N ga bog'liq.<\/p>\n<div class=\"f\">N = mg·cosα<\/div>\n<div class=\"f\">F_ish = μ·N = μ·mg·cosα<\/div>\n<p>α oshsa, cosα kamayadi, demak ishqalanish kuchi ham kamayadi. Jism qachon tinch turadi?<\/p>\n<div class=\"f\">mg·sinα ≤ μ·mg·cosα &nbsp;⇒&nbsp; tgα ≤ μ<\/div>\n<p>Bu holda ishqalanish kuchi mg·sinα ga teng bo'lib, jism sirpanmaydi. tgα &gt; μ bo'lsa jism pastga sirpanadi va F_ish = μ·mg·cosα.<\/p>\n<p><b>Misol.<\/b> m = 2 kg, α = 30°, μ = 0,3. N = 2·9,8·0,866 ≈ 17 N; F_ish = 0,3·17 ≈ 5,1 N. mg·sinα = 9,8 N &gt; 5,1 N, demak jism sirpanadi. (tg30° ≈ 0,58 &gt; 0,3 — mos.)<\/p>\n<p><b>Mustaqil masala.<\/b> μ = 0,5 bo'lsa, qanday α da jism sirpana boshlaydi? (Javob: α ≈ 26,6°)<\/p>\n<\/div>\n<\/section>\n\n<section id=\"s3\">\n<div class=\"box\">\n<h2>Jismning tekislik bo'ylab pastga harakati<\/h2>\n<p>Harakat yo'nalishidagi teng ta'sir etuvchi kuch: F = mg·sinα − μ·mg·cosα. Nyutonning II qonuniga ko'ra:<\/p>\n<div class=\"f\">a = g(sinα − μ·cosα)<\/div>\n<div class=\"f\">v = a·t &nbsp;&nbsp; s = a·t²/2<\/div>\n<p><b>Misol.<\/b> α = 30°, μ = 0,2, L = 4 m. a = 9,8(0,5 − 0,2·0,866) ≈ 3,2 m/s²; t = √(2L/a) ≈ 1,58 s; v = a·t ≈ 5,06 m/s.<\/p>\n<\/div>\n<canvas id=\"c2\" width=\"640\" height=\"340\"><\/canvas>\n<div class=\"ctl\">\n<label>Burchak α: <b id=\"o2a\">30<\/b>°<input type=\"range\" id=\"a2\" min=\"1\" max=\"90\" value=\"30\"><\/label>\n<label>Massa m: <b id=\"o2m\">5<\/b> kg<input type=\"range\" id=\"m2\" min=\"1\" max=\"20\" value=\"5\"><\/label>\n<label>Ishqalanish μ: <b id=\"o2u\">0.20<\/b><input type=\"range\" id=\"u2\" min=\"0\" max=\"1\" step=\"0.01\" value=\"0.2\"><\/label>\n<label>Uzunlik L: <b id=\"o2l\">4<\/b> m<input type=\"range\" id=\"l2\" min=\"1\" max=\"10\" step=\"0.5\" value=\"4\"><\/label>\n<label>Tezlik ko'rsatish<select id=\"sp\"><option value=\"0.25\">×0,25 (sekin)<\/option><option value=\"0.5\" selected>×0,5<\/option><option value=\"1\">×1 (real)<\/option><\/select><\/label>\n<\/div>\n<div class=\"row\"><button class=\"go\" id=\"go\">Start<\/button><button class=\"stop\" id=\"st\">To'xtat<\/button><button class=\"rs\" id=\"rs\">Qayta boshlash<\/button><\/div>\n<div class=\"msg\" id=\"msg\"><\/div>\n<div class=\"vals\" id=\"v2\"><\/div>\n<div class=\"graphs\"><canvas id=\"gv\" width=\"320\" height=\"220\"><\/canvas><canvas id=\"gs\" width=\"320\" height=\"220\"><\/canvas><\/div>\n<div id=\"res\"><\/div>\n<\/section>\n<\/main>\n\n<script>\nconst g=9.8,$=id=>document.getElementById(id);\nconst css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();\nconst D=Math.PI/180;\n\n// Tablar\ndocument.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{\n  document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',x===b));\n  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===b.dataset.t));\n});\n\n// Strelka (vektor) chizish\nfunction arrow(c,x,y,dx,dy,col,txt,ox,oy){\n  const l=Math.hypot(dx,dy); if(l<3)return;\n  c.strokeStyle=c.fillStyle=col;c.lineWidth=3;\n  c.beginPath();c.moveTo(x,y);c.lineTo(x+dx,y+dy);c.stroke();\n  const a=Math.atan2(dy,dx),X=x+dx,Y=y+dy;\n  c.beginPath();c.moveTo(X,Y);c.lineTo(X-11*Math.cos(a-.4),Y-11*Math.sin(a-.4));c.lineTo(X-11*Math.cos(a+.4),Y-11*Math.sin(a+.4));c.closePath();c.fill();\n  c.font='600 14px system-ui';c.fillText(txt,X+(ox||0),Y+(oy||0));\n}\n// Tekislik va blok: dist = blokning pastki chekkadan masofasi (px)\nfunction scene(c,W,H,al,dist,Lpx){\n  const bx=W-40,by=H-30,tx=bx-Lpx*Math.cos(al),ty=by-Lpx*Math.sin(al);\n  c.clearRect(0,0,W,H);\n  c.fillStyle=css('--slope');c.beginPath();c.moveTo(bx,by);c.lineTo(tx,ty);c.lineTo(tx,by);c.closePath();c.fill();\n  c.strokeStyle=css('--ink');c.lineWidth=2;c.beginPath();c.moveTo(10,by);c.lineTo(W-10,by);c.moveTo(tx,ty);c.lineTo(bx,by);c.stroke();\n  const px=bx-dist*Math.cos(al),py=by-dist*Math.sin(al);\n  c.save();c.translate(px,py);c.rotate(al);\n  c.fillStyle='#e0a030';c.strokeStyle=css('--ink');c.fillRect(-25,-50,50,50);c.strokeRect(-25,-50,50,50);c.restore();\n  return {cx:px+25*Math.sin(al),cy:py-25*Math.cos(al),bx,by};\n}\nfunction arc(c,x,y,r,a0,a1,txt,tx,ty){\n  c.strokeStyle=css('--ink');c.lineWidth=1.5;c.beginPath();c.arc(x,y,r,a0,a1);c.stroke();\n  c.fillStyle=css('--ink');c.font='italic 15px Georgia,serif';c.fillText(txt,tx,ty);\n}\n\n// ---------- 1-simulyatsiya ----------\nfunction draw1(){\n  const al=$('a1').value*D,m=+$('m1').value,W=640,H=340,c=$('c1').getContext('2d');\n  $('o1a').textContent=$('a1').value;$('o1m').textContent=m;\n  const s=Math.sin(al),co=Math.cos(al),mg=m*g,k=110/mg;\n  const S=scene(c,W,H,al,230,380),x=S.cx,y=S.cy;\n  arrow(c,x,y,0,110,'#d33','mg',6,14);\n  arrow(c,x,y,co*110*s,s*110*s,'#2a9d4a','F∥',6,14);\n  arrow(c,x,y,-s*110*co,co*110*co,'#2b6fd6','F⊥',-30,14);\n  arrow(c,x,y,s*110*co,-co*110*co,'#d9821a','N',6,-6);\n  // burchak tengligi\n  arc(c,S.bx,S.by,45,Math.PI,Math.PI+al,'α',S.bx-70,S.by-10);\n  arc(c,x,y,32,Math.PI/2,Math.PI/2+al,'α',x-30,y+55);\n  c.setLineDash([4,4]);c.strokeStyle='#888';c.lineWidth=1;\n  c.beginPath();c.moveTo(x+co*110*s,y+s*110*s);c.lineTo(x,y+110);c.lineTo(x-s*110*co,y+co*110*co);c.stroke();c.setLineDash([]);\n  $('v1').innerHTML=`<span class=\"k1\">mg = ${mg.toFixed(1)} N<\/span><span class=\"k2\">F∥ = mg·sinα = ${(mg*s).toFixed(1)} N<\/span><span class=\"k3\">F⊥ = mg·cosα = ${(mg*co).toFixed(1)} N<\/span><span class=\"k4\">N = ${(mg*co).toFixed(1)} N<\/span>`;\n}\n['a1','m1'].forEach(i=>$(i).oninput=draw1);\n\n// ---------- 2-simulyatsiya ----------\nlet st={t:0,s:0,run:false,pts:[],last:0,done:false},raf=0;\nfunction par(){\n  const al=$('a2').value*D,m=+$('m2').value,u=+$('u2').value,L=+$('l2').value;\n  const moves=Math.tan(al)>u+1e-9||$('a2').value==90;\n  const a=moves?g*(Math.sin(al)-u*Math.cos(al)):0;\n  return {al,m,u,L,a,moves};\n}\nfunction draw2(){\n  const p=par(),c=$('c2').getContext('2d'),W=640,H=340;\n  $('o2a').textContent=$('a2').value;$('o2m').textContent=p.m;$('o2u').textContent=p.u.toFixed(2);$('o2l').textContent=p.L;\n  const s=Math.sin(p.al),co=Math.cos(p.al),Lpx=Math.min(420,250/Math.max(s,.01));\n  const dist=Math.max(0,Lpx*(1-st.s/p.L)),S=scene(c,W,H,p.al,dist,Lpx),x=S.cx,y=S.cy;\n  const mg=p.m*g,k=85/mg,N=mg*co;\n  const fr=p.moves?p.u*N:Math.min(p.u*N,mg*s),net=p.m*p.a;\n  arrow(c,x,y,0,mg*k,'#d33','mg',6,14);\n  arrow(c,x,y,s*N*k,-co*N*k,'#d9821a','N',6,-6);\n  arrow(c,x,y,-co*fr*k,-s*fr*k,'#2b6fd6','F_ish',-52,-6);\n  arrow(c,x,y,co*net*k,s*net*k,'#8a4bd0','F',8,14);\n  const v=p.a*st.t;\n  $('v2').innerHTML=`<span>t = ${st.t.toFixed(2)} s<\/span><span>a = ${p.a.toFixed(2)} m/s²<\/span><span>v = ${v.toFixed(2)} m/s<\/span><span>s = ${st.s.toFixed(2)} m<\/span><span class=\"k3\">F_ish = ${fr.toFixed(1)} N<\/span><span class=\"k5\">F (teng ta'sir) = ${net.toFixed(1)} N<\/span>`;\n  $('msg').textContent=p.moves?'':`Jism tinch holatda: tgα = ${Math.tan(p.al).toFixed(2)} ≤ μ = ${p.u.toFixed(2)}`;\n  graphs(p);\n}\nfunction graphs(p){\n  const T=p.moves?Math.sqrt(2*p.L/p.a):1,Vm=p.moves?p.a*T:1;\n  gr($('gv'),'v–t grafik (v, m/s)',T,Vm,st.pts.map(q=>[q[0],q[1]]),'#2b6fd6');\n  gr($('gs'),'s–t grafik (s, m)',T,p.L,st.pts.map(q=>[q[0],q[2]]),'#2a9d4a');\n}\nfunction gr(cv,title,T,Y,pts,col){\n  const c=cv.getContext('2d'),W=cv.width,H=cv.height,l=38,b=28;\n  c.clearRect(0,0,W,H);c.fillStyle=css('--ink');c.font='13px system-ui';c.fillText(title,l,14);\n  c.strokeStyle=css('--mute');c.lineWidth=1;c.beginPath();c.moveTo(l,22);c.lineTo(l,H-b);c.lineTo(W-8,H-b);c.stroke();\n  c.fillText(Y.toFixed(1),2,32);c.fillText(T.toFixed(1)+' s',W-44,H-10);c.fillText('0',l-10,H-b+14);\n  c.strokeStyle=col;c.lineWidth=2.5;c.beginPath();\n  pts.forEach((q,i)=>{const X=l+(q[0]/T)*(W-l-8),Yp=H-b-(q[1]/Y)*(H-b-24);i?c.lineTo(X,Yp):c.moveTo(X,Yp)});c.stroke();\n}\nfunction reset(){cancelAnimationFrame(raf);st={t:0,s:0,run:false,pts:[[0,0,0]],last:0,done:false};$('res').innerHTML='';draw2();}\nfunction tick(now){\n  if(!st.run)return;\n  const p=par(),dt=Math.min(.05,(now-st.last)/1000)*$('sp').value;st.last=now;\n  st.t+=dt;st.s=.5*p.a*st.t*st.t;\n  if(st.s>=p.L){st.s=p.L;st.t=Math.sqrt(2*p.L/p.a);st.run=false;st.done=true;}\n  st.pts.push([st.t,p.a*st.t,st.s]);draw2();\n  if(st.done){$('res').innerHTML=`<table><tr><th>Natija<\/th><th>Qiymat<\/th><\/tr><tr><td>Tezlanish a<\/td><td>${p.a.toFixed(2)} m/s²<\/td><\/tr><tr><td>Yo'l s<\/td><td>${p.L} m<\/td><\/tr><tr><td>Vaqt t<\/td><td>${st.t.toFixed(2)} s<\/td><\/tr><tr><td>Oxirgi tezlik v<\/td><td>${(p.a*st.t).toFixed(2)} m/s<\/td><\/tr><\/table>`;return;}\n  raf=requestAnimationFrame(tick);\n}\n$('go').onclick=()=>{\n  const p=par();if(!p.moves){draw2();return;}\n  if(st.done)reset();\n  if(st.run)return;st.run=true;st.last=performance.now();raf=requestAnimationFrame(tick);\n};\n$('st').onclick=()=>{st.run=false;};\n$('rs').onclick=reset;\n['a2','m2','u2','l2'].forEach(i=>$(i).oninput=reset);\ndraw1();reset();\nmatchMedia('(prefers-color-scheme: dark)').onchange=()=>{draw1();draw2();};\n<\/script>\n<\/body>\n<\/html>\n"}, {"id": "9-mavzu", "n": "9", "t": "Qiya tekislik va FIK", "d": "Qiya tekislik bo‘ylab bajarilgan ish, interaktiv taqdimot", "k": "Dars", "html": "<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Qiya tekislik va FIK — interaktiv taqdimot<\/title>\n<style>\n:root{--navy:#121b3d;--blue:#2d5dbe;--purple:#6f4cc4;--cyan:#37bed2;--orange:#f49d42;--green:#2aa475;--red:#da5360;--ink:#232b42;--muted:#687389;--pale:#f1f5ff;--white:#fff}\n*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#e9edfa;color:var(--ink)}\n.deck{width:min(1100px,100%);margin:auto;padding:14px}\n.slide{display:none;min-height:min(690px,calc(100vh - 105px));background:var(--pale);border-radius:20px;overflow:hidden;position:relative;padding:clamp(22px,4vw,52px);box-shadow:0 12px 35px #1b285018}\n.slide.active{display:block}.slide:before{content:\"\";position:absolute;top:0;left:0;right:0;height:8px;background:linear-gradient(90deg,var(--purple),var(--cyan))}\nh1,h2,h3,p{margin-top:0} h1{font-size:clamp(30px,5vw,56px);line-height:1.1;color:white} h2{font-size:clamp(24px,3.5vw,36px);color:var(--navy);margin-bottom:22px} h3{color:var(--purple);margin-bottom:10px}\np,li{font-size:clamp(16px,2vw,20px);line-height:1.45} ul,ol{padding-left:1.25em} li{margin:.45em 0}\n.kicker{font-size:12px;font-weight:bold;letter-spacing:1.7px;color:var(--purple);text-transform:uppercase;margin-bottom:10px}\n.cover{background:radial-gradient(circle at 85% 20%,#7659cb 0,transparent 25%),linear-gradient(135deg,#121b3d,#202c63 70%,#3d3887);display:flex;flex-direction:column;justify-content:center}\n.cover h1{max-width:850px}.cover .sub{font-size:clamp(19px,2.7vw,28px);color:#6ce0ee;max-width:750px}.cover .small{color:#dce5ff;font-size:14px;margin-top:26px}\n.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}\n.card{background:white;border:1px solid #d8e4ff;border-radius:16px;padding:20px;box-shadow:0 5px 16px #1b285008}\n.card.dark{background:var(--navy);color:white;border-color:var(--navy)}.card.dark h3{color:var(--cyan)}\n.formula{font-size:clamp(22px,3vw,32px);font-weight:bold;color:var(--purple);text-align:center;padding:12px 4px}.formula.blue{color:var(--blue)}.formula.green{color:var(--green)}\n.note{font-size:14px;color:var(--muted)}.callout{border-left:5px solid var(--cyan);padding:12px 16px;background:#e4f8fc;border-radius:8px;font-size:16px;line-height:1.45}\n.diagram{width:100%;height:auto;max-height:390px;background:#fff;border-radius:14px;border:1px solid #d8e4ff}\n.controls{display:flex;gap:10px;align-items:center;justify-content:center;padding:12px;flex-wrap:wrap}\nbutton{border:0;background:var(--purple);color:white;border-radius:999px;padding:12px 20px;font-weight:bold;font-size:15px;cursor:pointer}\nbutton.secondary{background:white;color:var(--navy);border:1px solid #cbd5ee}button:disabled{opacity:.4;cursor:not-allowed}\n.progress{height:5px;background:#d8def0;border-radius:10px;overflow:hidden;margin:0 12px}.progress span{display:block;height:100%;width:6.25%;background:linear-gradient(90deg,var(--purple),var(--cyan));transition:width .2s}\n.slide-num{color:var(--muted);font-size:13px;min-width:70px;text-align:center}\nlabel{display:block;font-weight:bold;font-size:14px;margin:12px 0 6px}input[type=range]{width:100%;accent-color:var(--purple)}input[type=number]{width:100%;padding:10px;border:1px solid #cbd5ee;border-radius:8px;font-size:16px}\n.metric{background:#f3f6ff;border-radius:12px;padding:12px;text-align:center}.metric strong{display:block;font-size:clamp(20px,3vw,28px);color:var(--purple);margin-top:4px}\ntable{border-collapse:collapse;width:100%;background:white;border-radius:10px;overflow:hidden;font-size:14px}th,td{padding:10px;border:1px solid #dbe3f5;text-align:center}th{background:var(--navy);color:white}\n.footer{font-size:12px;color:var(--muted);position:absolute;bottom:14px;left:clamp(22px,4vw,52px)}\n@media(max-width:700px){.grid2,.grid3{grid-template-columns:1fr}.slide{min-height:calc(100vh - 120px);padding:25px 20px 45px}.footer{left:20px}.hide-mobile{display:none}.controls button{padding:10px 15px}}\n@media print{body{background:white}.deck{width:100%;padding:0}.slide{display:block!important;page-break-after:always;min-height:95vh;border-radius:0;box-shadow:none}.controls,.progress{display:none}}\n<\/style>\n<\/head>\n<body>\n<div class=\"deck\">\n<section class=\"slide cover active\">\n<div class=\"kicker\" style=\"color:#6ce0ee\">FIZIKA • INTERAKTIV TAQDIMOT<\/div>\n<h1>JISMNI QIYA TEKISLIK BO‘YLAB KO‘CHIRISHDA BAJARILGAN ISH<\/h1>\n<div class=\"sub\">Qiya tekislikning foydali ish koeffitsiyenti (FIK)<\/div>\n<svg viewBox=\"0 0 800 260\" class=\"diagram\" style=\"background:#ffffff12;border:0;margin-top:25px;max-width:700px\">\n<line x1=\"70\" y1=\"220\" x2=\"730\" y2=\"220\" stroke=\"#cbd5ee\" stroke-width=\"3\"/>\n<line x1=\"100\" y1=\"220\" x2=\"650\" y2=\"65\" stroke=\"#6ce0ee\" stroke-width=\"8\" stroke-linecap=\"round\"/>\n<rect x=\"330\" y=\"143\" width=\"76\" height=\"48\" rx=\"8\" fill=\"#f49d42\" transform=\"rotate(-15.7 368 167)\"/>\n<path d=\"M370 158 L455 134\" stroke=\"#55d7a2\" stroke-width=\"5\" stroke-linecap=\"round\"/><path d=\"M455 134 l-16 -10 l4 18\" fill=\"#55d7a2\"/>\n<path d=\"M367 170 L367 224\" stroke=\"#da5360\" stroke-width=\"4\"/><path d=\"M367 224 l-8 -13 h16z\" fill=\"#da5360\"/>\n<text x=\"468\" y=\"130\" fill=\"#55d7a2\" font-size=\"22\" font-weight=\"bold\">F<\/text><text x=\"379\" y=\"210\" fill=\"#da5360\" font-size=\"20\" font-weight=\"bold\">mg<\/text>\n<text x=\"550\" y=\"160\" fill=\"#dce5ff\" font-size=\"18\">h<\/text><text x=\"290\" y=\"244\" fill=\"#dce5ff\" font-size=\"18\">l — tekislik uzunligi<\/text>\n<\/svg>\n<div class=\"small\">Mexanik ish • FIK • Ishqalanish • Virtual laboratoriya<\/div>\n<div class=\"footer\" style=\"color:#cbd5ee\">01 / 16<\/div>\n<\/section>\n\n<section class=\"slide\">\n<div class=\"kicker\">Darsga kirish<\/div><h2>Dars maqsadi va kutilayotgan natijalar<\/h2>\n<div class=\"grid2\">\n<div class=\"card\"><h3>Dars maqsadi<\/h3><ul><li>Qiya tekislikning ishlash prinsipini tushunish.<\/li><li>Mexanik ishni formulalar bilan hisoblash.<\/li><li>FIKni aniqlash va natijani izohlash.<\/li><li>Ishqalanishning energiya sarfiga ta’sirini tahlil qilish.<\/li><\/ul><\/div>\n<div class=\"card dark\"><h3>O‘quvchi dars oxirida…<\/h3><ul><li><b>m, h, l, F<\/b> kattaliklarini ajratadi.<\/li><li><b>A = Fl<\/b> va <b>A<sub>foydali<\/sub> = mgh<\/b> formulalarini qo‘llaydi.<\/li><li>FIKni foizda hisoblaydi.<\/li><li>Kundalik hayotdagi rampalarni tushuntiradi.<\/li><\/ul><\/div>\n<\/div><div class=\"footer\">02 / 16<\/div>\n<\/section>\n\n<section class=\"slide\">\n<div class=\"kicker\">Asosiy tushuncha<\/div><h2>Qiya tekislik nima?<\/h2>\n<div class=\"grid2\">\n<div class=\"card\"><p><b>Qiya tekislik<\/b> — yukni balandlikka ko‘tarishda kerakli kuchni kamaytirishga yordam beradigan oddiy mexanizm.<\/p><ul><li>Kuch kamayishi evaziga yo‘l uzayadi.<\/li><li>Ideal holatda ish yutug‘i bo‘lmaydi.<\/li><li>Misollar: pandus, yuk rampasi, tog‘ yo‘li.<\/li><\/ul><div class=\"callout\">Savol: nega yukni uzunroq yo‘l bo‘ylab ko‘tarish qulayroq bo‘lishi mumkin?<\/div><\/div>\n<svg viewBox=\"0 0 500 350\" class=\"diagram\"><line x1=\"35\" y1=\"300\" x2=\"465\" y2=\"300\" stroke=\"#687389\" stroke-width=\"3\"/><line x1=\"70\" y1=\"300\" x2=\"400\" y2=\"90\" stroke=\"#2d5dbe\" stroke-width=\"7\"/><line x1=\"400\" y1=\"90\" x2=\"400\" y2=\"300\" stroke=\"#37bed2\" stroke-width=\"3\" stroke-dasharray=\"7 6\"/><rect x=\"215\" y=\"190\" width=\"64\" height=\"42\" rx=\"6\" fill=\"#f49d42\" transform=\"rotate(-32.5 247 211)\"/><path d=\"M250 202 L300 170\" stroke=\"#2aa475\" stroke-width=\"5\"/><path d=\"M300 170 l-15 1 l8 12\" fill=\"#2aa475\"/><text x=\"310\" y=\"164\" font-size=\"20\" fill=\"#2aa475\" font-weight=\"bold\">F<\/text><text x=\"410\" y=\"190\" font-size=\"20\" fill=\"#37bed2\" font-weight=\"bold\">h<\/text><text x=\"170\" y=\"330\" font-size=\"18\" fill=\"#2d5dbe\">l — yo‘l uzunligi<\/text><\/svg>\n<\/div><p class=\"note\">O‘qituvchi izohi: qiya tekislik kuch va yo‘l o‘rtasidagi almashinuvni ko‘rsatadi.<\/p><div class=\"footer\">03 / 16<\/div>\n<\/section>\n\n<section class=\"slide\">\n<div class=\"kicker\">Model va kuchlar<\/div><h2>Qiya tekislikning fizik modeli<\/h2>\n<div class=\"grid2\">\n<div class=\"card\"><h3>Belgilar<\/h3><ul><li><b>m<\/b> — jism massasi (kg)<\/li><li><b>h<\/b> — vertikal balandlik (m)<\/li><li><b>l<\/b> — qiya sirt uzunligi (m)<\/li><li><b>α<\/b> — qiyalik burchagi<\/li><li><b>mg<\/b> — og‘irlik kuchi (N)<\/li><li><b>F<sub>ishq<\/sub><\/b> — ishqalanish kuchi<\/li><\/ul><\/div>\n<svg viewBox=\"0 0 520 380\" class=\"diagram\"><line x1=\"30\" y1=\"320\" x2=\"485\" y2=\"320\" stroke=\"#687389\" stroke-width=\"3\"/><line x1=\"60\" y1=\"320\" x2=\"435\" y2=\"100\" stroke=\"#2d5dbe\" stroke-width=\"7\"/><line x1=\"435\" y1=\"100\" x2=\"435\" y2=\"320\" stroke=\"#37bed2\" stroke-width=\"3\" stroke-dasharray=\"7 6\"/><rect x=\"225\" y=\"205\" width=\"70\" height=\"46\" rx=\"5\" fill=\"#f49d42\" transform=\"rotate(-30.4 260 228)\"/><path d=\"M260 220 L325 182\" stroke=\"#2aa475\" stroke-width=\"5\"/><path d=\"M325 182 l-15 0 l8 13\" fill=\"#2aa475\"/><text x=\"332\" y=\"179\" font-size=\"19\" fill=\"#2aa475\" font-weight=\"bold\">F<\/text><path d=\"M255 235 L255 295\" stroke=\"#da5360\" stroke-width=\"4\"/><path d=\"M255 295 l-8 -13 h16z\" fill=\"#da5360\"/><text x=\"265\" y=\"280\" font-size=\"18\" fill=\"#da5360\" font-weight=\"bold\">mg<\/text><path d=\"M245 220 L190 252\" stroke=\"#6f4cc4\" stroke-width=\"4\"/><path d=\"M190 252 l8 -14 l8 13z\" fill=\"#6f4cc4\"/><text x=\"125\" y=\"264\" font-size=\"17\" fill=\"#6f4cc4\">Fᵢshq<\/text><text x=\"445\" y=\"210\" font-size=\"20\" fill=\"#37bed2\" font-weight=\"bold\">h<\/text><text x=\"165\" y=\"350\" font-size=\"18\" fill=\"#2d5dbe\">l<\/text><\/svg>\n<\/div><div class=\"callout\">Kuchlarni chizmada ko‘rsatishda tortish kuchi harakat bo‘ylab yuqoriga, ishqalanish esa harakatga qarshi yo‘naladi.<\/div><div class=\"footer\">04 / 16<\/div>\n<\/section>\n\n<section class=\"slide\">\n<div class=\"kicker\">1-reja<\/div><h2>Jismni qiya tekislikda ko‘chirishda bajarilgan ish<\/h2>\n<div class=\"grid3\">\n<div class=\"card\"><h3>Umumiy formula<\/h3><div class=\"formula\">A = Fs cos φ<\/div><p class=\"note\">Kuch va siljish orasidagi burchak hisobga olinadi.<\/p><\/div>\n<div class=\"card\"><h3>Kuch yo‘nalishi bo‘ylab<\/h3><div class=\"formula blue\">A = Fl<\/div><p class=\"note\">Kuch va siljish bir yo‘nalishda bo‘lsa.<\/p><\/div>\n<div class=\"card\"><h3>Ideal qiya tekislik<\/h3><div class=\"formula green\">Fl = mgh<\/div><p class=\"note\">Ishqalanish bo‘lmaganda va jism bir tekis ko‘tarilganda.<\/p><\/div>\n<\/div>\n<div class=\"callout\" style=\"margin-top:20px\"><b>Natija:<\/b> F = mgh/l. Bir xil balandlik uchun qiya tekislik uzaygan sari talab qilinadigan kuch kamayadi.<\/div>\n<p class=\"note\" style=\"margin-top:15px\">Ishning SI birligi — joul (J); 1 J = 1 N·m.<\/p><div class=\"footer\">05 / 16<\/div>\n<\/section>\n\n<section class=\"slide\">\n<div class=\"kicker\">Simulyatsiya 1<\/div><h2>Tik ko‘tarish va qiya tekislikni taqqoslash<\/h2>\n<div class=\"grid2\">\n<div class=\"card\"><h3>Parametrlarni o‘zgartiring<\/h3>\n<label for=\"mass1\">Massa: <span id=\"massLabel\">10<\/span> kg<\/label><input id=\"mass1\" type=\"range\" min=\"2\" max=\"20\" value=\"10\" oninput=\"updateSim1()\">\n<label for=\"height1\">Balandlik: <span id=\"heightLabel\">2.0<\/span> m<\/label><input id=\"height1\" type=\"range\" min=\"0.5\" max=\"3\" step=\"0.5\" value=\"2\" oninput=\"updateSim1()\">\n<label for=\"length1\">Tekislik uzunligi: <span id=\"lengthLabel\">5.0<\/span> m<\/label><input id=\"length1\" type=\"range\" min=\"2\" max=\"8\" step=\"0.5\" value=\"5\" oninput=\"updateSim1()\">\n<div class=\"callout\">Model: ishqalanish yo‘q, g = 10 m/s².<\/div><\/div>\n<div class=\"card dark\"><h3>Hisoblangan natijalar<\/h3><div class=\"grid2\">\n<div class=\"metric\"><span>Tik ko‘tarish kuchi<\/span><strong id=\"verticalF\">100 N<\/strong><\/div>\n<div class=\"metric\"><span>Qiya tekislik kuchi<\/span><strong id=
